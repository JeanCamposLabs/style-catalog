<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spinning Prism</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "prism-triangular-spin",
    "title": "Spinning Prism",
    "summary": "A triangular prism rotating on its axis.",
    "description": "A triangular prism rotating on its axis.",
    "theme": "3d-transforms",
    "categories": ["3d", "transform"],
    "tags": ["3d", "transform", "prism", "triangular", "3d", "rotate"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "advanced",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "3D motion is a common trigger for vestibular discomfort — keep rotations small and stop them under prefers-reduced-motion.",
    "customization": [
      { "name": "--dur", "description": "Spin period", "default": "8s" }
    ],
    "variations": ["Retune through the custom properties", "Add a reduced-motion static variant"],
    "ai_usage": "Geometric branding. Three faces at 0/120/240° with translateZ of (width / 2) / tan(60°) form a closed prism; get the radius wrong and the edges gap."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .scene { perspective: 800px; width: 120px; height: 150px; }
    .pr { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; animation: spin 8s linear infinite; }
    .pr .f { position: absolute; inset: 0; border: 2px solid #2dd4bf; background: rgba(45,212,191,.14);
      transform: rotateY(var(--a)) translateZ(35px); }
    @keyframes spin { to { transform: rotateY(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="scene"><div class="pr"><span class="f" style="--a:0deg"></span><span class="f" style="--a:120deg"></span>
  <span class="f" style="--a:240deg"></span></div></div>
</body>
</html>
