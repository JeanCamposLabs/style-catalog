<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Book Page Flip</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "book-page-flip",
    "title": "Book Page Flip",
    "summary": "A page turning around the spine.",
    "description": "A page turning around the spine.",
    "theme": "3d-transforms",
    "categories": ["3d", "transform"],
    "tags": ["3d", "transform", "book", "page", "flip", "spine"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "advanced",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "3D motion is a common trigger for vestibular discomfort — keep rotations small and stop them under prefers-reduced-motion.",
    "customization": [
      { "name": "--dur", "description": "Flip period", "default": "4s" }
    ],
    "variations": ["Retune through the custom properties", "Add a reduced-motion static variant"],
    "ai_usage": "Reading and portfolio UIs. transform-origin at the spine plus a slight gradient across the page sells the curl; without the gradient it looks like a flat card flip."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .book { position: relative; width: 220px; height: 150px; perspective: 900px; display: flex; }
    .pg { flex: 1; background: #f8f5ee; border: 1px solid #d6cfc0; }
    .pg.right { transform-origin: left center; animation: flip 4s ease-in-out infinite; transform-style: preserve-3d;
      background: linear-gradient(90deg, #efe9dc, #f8f5ee); }
    @keyframes flip { 0%, 20% { transform: rotateY(0); } 60%, 100% { transform: rotateY(-165deg); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="book"><div class="pg"></div><div class="pg right"></div></div>
</body>
</html>
