<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opening Doors</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "door-open-reveal",
    "title": "Opening Doors",
    "summary": "Two panels swinging open to reveal content.",
    "description": "Two panels swinging open to reveal content.",
    "theme": "3d-transforms",
    "categories": ["3d", "transform"],
    "tags": ["3d", "transform", "doors", "reveal", "hover", "open"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "advanced",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "3D motion is a common trigger for vestibular discomfort — keep rotations small and stop them under prefers-reduced-motion.",
    "customization": [
      { "name": "--dur", "description": "Open duration", "default": "0.6s" }
    ],
    "variations": ["Retune through the custom properties", "Add a reduced-motion static variant"],
    "ai_usage": "Reveal interactions. Each panel hinges on its outer edge; a shared origin makes the doors slide rather than swing."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 250px; height: 160px; perspective: 800px; border-radius: 14px; overflow: hidden;
      background: linear-gradient(150deg, #7c5cff, #2dd4bf); display: grid; place-items: center; color: #0b0d12; font-weight: 900; }
    .fx .dr { position: absolute; top: 0; bottom: 0; width: 50%; background: #1c2437; border: 1px solid #2b3450;
      transition: transform .6s cubic-bezier(.7,0,.2,1); }
    .fx .l { left: 0; transform-origin: left; }
    .fx .r { right: 0; transform-origin: right; }
    .fx:hover .l { transform: rotateY(-115deg); }
    .fx:hover .r { transform: rotateY(115deg); }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx"><span>REVEALED</span><span class="dr l"></span><span class="dr r"></span></div>
</body>
</html>
