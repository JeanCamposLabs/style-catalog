<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flip Clock</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "flip-clock-digits",
    "title": "Flip Clock",
    "summary": "Split-flap digits that fold over.",
    "description": "Split-flap digits that fold over.",
    "theme": "3d-transforms",
    "categories": ["3d", "transform"],
    "tags": ["3d", "transform", "flip-clock", "split-flap", "digits", "time"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "advanced",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "3D motion is a common trigger for vestibular discomfort — keep rotations small and stop them under prefers-reduced-motion.",
    "customization": [
      { "name": "--dur", "description": "Flip period", "default": "2s" }
    ],
    "variations": ["Retune through the custom properties", "Add a reduced-motion static variant"],
    "ai_usage": "Countdowns and clocks. The top half folds down around the centre line; the illusion only works with overflow hidden on both halves and a hairline seam between them."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: flex; gap: 8px; }
    .d { position: relative; width: 54px; height: 74px; border-radius: 8px; background: #151b2a; perspective: 300px;
      display: grid; place-items: center; font-size: 2rem; font-weight: 900; color: #e7ebf3; overflow: hidden; }
    .d::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #0b0d12; }
    .d .top { position: absolute; inset: 0 0 50% 0; background: #1c2437; display: grid; place-items: end center;
      transform-origin: bottom; animation: fold 2s ease-in infinite; overflow: hidden; }
    .d .top span { transform: translateY(50%); }
    @keyframes fold { 0%, 60% { transform: rotateX(0); } 80%, 100% { transform: rotateX(-90deg); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx"><div class="d">1<span class="top"><span>1</span></span></div>
  <div class="d">8<span class="top"><span>8</span></span></div>
  <div class="d">1<span class="top"><span>1</span></span></div></div>
</body>
</html>
