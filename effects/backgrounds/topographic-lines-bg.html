<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Topographic Contours</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "topographic-lines-bg",
    "title": "Topographic Contours",
    "summary": "Contour rings ripple across the surface like a survey map.",
    "description": "Concentric repeating-radial-gradients at two offsets overlap into irregular contour bands.",
    "theme": "backgrounds",
    "categories": ["background", "pattern"],
    "tags": ["topographic", "contour", "map", "rings", "outdoors"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative surface — keep contrast with foreground text above 4.5:1 and disable drift under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Contour color", "default": "rgba(45,212,191,.18)" },
      { "name": "--s", "description": "Contour spacing", "default": "26px" }
    ],
    "variations": ["Animate one layer for slow morphing", "Warmer earth tones", "Mask to a shape for a badge"],
    "ai_usage": "Outdoor, mapping, and data products. Overlap at least two radial layers with different centres — one layer alone is obviously a bullseye."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .bg { position: fixed; inset: 0; }
    :root { --c: rgba(45,212,191,.18); --s: 26px; }
    .bg { background-color: #0b0d12;
      background-image: repeating-radial-gradient(circle at 20% 30%, transparent 0 calc(var(--s) - 1px), var(--c) calc(var(--s) - 1px) var(--s)),
        repeating-radial-gradient(circle at 78% 72%, transparent 0 calc(var(--s) - 1px), var(--c) calc(var(--s) - 1px) var(--s)); }
  </style>
</head>
<body>
  <div class="bg"></div>
</body>
</html>
