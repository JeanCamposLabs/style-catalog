<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lava Lamp</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "lava-lamp-bg",
    "title": "Lava Lamp",
    "summary": "Two blurred blobs rise, merge, and separate behind a warm gradient.",
    "description": "Heavy blur on overlapping shapes makes them fuse when they touch, reproducing the lava-lamp merge without a goo filter.",
    "theme": "backgrounds",
    "categories": ["background", "ambient"],
    "tags": ["lava-lamp", "blobs", "blur", "retro", "ambient"],
    "tech": ["css"],
    "era": "2000s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative surface — keep contrast with foreground text above 4.5:1 and disable drift under prefers-reduced-motion.",
    "customization": [
      { "name": "--a", "description": "Blob A", "default": "#f97316" },
      { "name": "--b", "description": "Blob B", "default": "#ef4444" },
      { "name": "--dur", "description": "Rise period", "default": "14s" }
    ],
    "variations": ["Cool blue-green lamp", "Add a third blob at a different speed", "Slow it right down for an idle screen"],
    "ai_usage": "Ambient, retro, and chill-out interfaces. The merge illusion needs blur radius greater than the gap between blobs; if they never appear to fuse, increase blur rather than moving them closer."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .bg { position: fixed; inset: 0; }
    :root { --a: #f97316; --b: #ef4444; --dur: 14s; }
    .bg { background: radial-gradient(circle at 50% 120%, #2a1206, #0b0d12 70%); overflow: hidden; filter: blur(0); }
    .bg i { position: absolute; left: 50%; width: 180px; height: 220px; border-radius: 50%; filter: blur(30px); opacity: .85; }
    .bg i:nth-child(1) { background: var(--a); margin-left: -140px; animation: rise var(--dur) ease-in-out infinite alternate; }
    .bg i:nth-child(2) { background: var(--b); margin-left: -20px; animation: rise calc(var(--dur) * 1.4) ease-in-out infinite alternate-reverse; }
    @keyframes rise { from { transform: translateY(40%) scale(1); } to { transform: translateY(-40%) scale(1.3); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="bg"><i></i><i></i></div>
</body>
</html>
