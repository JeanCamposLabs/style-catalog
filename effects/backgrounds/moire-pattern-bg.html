<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moiré Interference</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "moire-pattern-bg",
    "title": "Moiré Interference",
    "summary": "Two fine line grids at a slight angle produce shimmering interference.",
    "description": "Rotating one identical grid by a couple of degrees generates the moiré; animating that angle makes the pattern breathe.",
    "theme": "backgrounds",
    "categories": ["background", "pattern"],
    "tags": ["moire", "interference", "lines", "optical", "kinetic"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "High-frequency interference can be uncomfortable — keep contrast low and honour prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Line color", "default": "rgba(124,92,255,.35)" },
      { "name": "--s", "description": "Line pitch", "default": "6px" },
      { "name": "--dur", "description": "Rotation period", "default": "20s" }
    ],
    "variations": ["Radial grids instead of linear", "Stronger angle for coarser bands", "Static version with no animation"],
    "ai_usage": "Optical-art and experimental sections. The moiré only appears when both layers use the same pitch and differ by a small angle (1–4°) — larger angles just look like a crosshatch."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .bg { position: fixed; inset: 0; }
    :root { --c: rgba(124,92,255,.35); --s: 6px; --dur: 20s; }
    .bg { background: #0b0d12; overflow: hidden; }
    .bg i { position: absolute; inset: -30%;
      background-image: repeating-linear-gradient(0deg, var(--c) 0 1px, transparent 1px var(--s)); }
    .bg i:nth-child(2) { animation: turn var(--dur) linear infinite; }
    @keyframes turn { from { transform: rotate(1deg); } to { transform: rotate(5deg); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="bg"><i></i><i></i></div>
</body>
</html>
