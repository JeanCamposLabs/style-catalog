<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Diagonal Stripes</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "diagonal-stripes-bg",
    "title": "Diagonal Stripes",
    "summary": "Repeating 45° stripes that drift slowly sideways.",
    "description": "repeating-linear-gradient supplies the stripes; the drift is a background-position animation matched exactly to the stripe period.",
    "theme": "backgrounds",
    "categories": ["background", "pattern"],
    "tags": ["stripes", "repeating-gradient", "diagonal", "drift", "pattern"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative surface — keep contrast with foreground text above 4.5:1 and disable drift under prefers-reduced-motion.",
    "customization": [
      { "name": "--a", "description": "Stripe A", "default": "#0f1420" },
      { "name": "--b", "description": "Stripe B", "default": "#141b2b" },
      { "name": "--w", "description": "Stripe width", "default": "18px" }
    ],
    "variations": ["Higher contrast for a barber pole", "Vertical or horizontal stripes", "Freeze the drift for a static texture"],
    "ai_usage": "Section backgrounds and empty states. Animate background-position by exactly 2× the stripe width (the gradient period) or the loop visibly jumps."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .bg { position: fixed; inset: 0; }
    :root { --a: #0f1420; --b: #141b2b; --w: 18px; }
    .bg { background: repeating-linear-gradient(45deg, var(--a) 0 var(--w), var(--b) var(--w) calc(var(--w) * 2));
      animation: drift 6s linear infinite; }
    @keyframes drift { to { background-position: calc(var(--w) * 2.83) 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="bg"></div>
</body>
</html>
