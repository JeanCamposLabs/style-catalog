<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bokeh Lights</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "bokeh-lights-bg",
    "title": "Bokeh Lights",
    "summary": "Out-of-focus light circles drift at different depths.",
    "description": "Blur and opacity scale with each circle's size, so the smaller, sharper lights read as nearer than the large soft ones.",
    "theme": "backgrounds",
    "categories": ["background", "ambient"],
    "tags": ["bokeh", "blur", "lights", "depth", "ambient"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative surface — keep contrast with foreground text above 4.5:1 and disable drift under prefers-reduced-motion.",
    "customization": [
      { "name": "--a", "description": "Light A", "default": "#7c5cff" },
      { "name": "--b", "description": "Light B", "default": "#2dd4bf" },
      { "name": "--dur", "description": "Drift period", "default": "18s" }
    ],
    "variations": ["Warm party palette", "Faster drift for energy", "Mask to the hero area only"],
    "ai_usage": "Warm, premium hero backdrops. Vary blur, size, and speed together — uniform blur across all circles flattens the depth illusion instantly."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .bg { position: fixed; inset: 0; }
    :root { --a: #7c5cff; --b: #2dd4bf; --dur: 18s; }
    .bg { background: radial-gradient(circle at 30% 20%, #171029, #0b0d12 60%); overflow: hidden; }
    .bg i { position: absolute; border-radius: 50%; filter: blur(var(--bl)); opacity: .5;
      animation: float var(--dur) ease-in-out infinite alternate; animation-delay: var(--d); }
    @keyframes float { from { transform: translate(0, 0) scale(1); } to { transform: translate(40px, -30px) scale(1.15); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="bg">
    <i style="left:10%;top:20%;width:180px;height:180px;background:#7c5cff;--bl:40px;--d:0s"></i>
    <i style="left:60%;top:12%;width:110px;height:110px;background:#2dd4bf;--bl:22px;--d:-4s"></i>
    <i style="left:74%;top:58%;width:220px;height:220px;background:#f472b6;--bl:56px;--d:-9s"></i>
    <i style="left:24%;top:66%;width:80px;height:80px;background:#38bdf8;--bl:14px;--d:-13s"></i>
  </div>
</body>
</html>
