<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Halftone Gradient</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "halftone-dots-bg",
    "title": "Halftone Gradient",
    "summary": "Print-style halftone dots that grow toward one corner.",
    "description": "A dot grid masked by a linear gradient makes the dot density fall off, imitating a printed halftone ramp.",
    "theme": "backgrounds",
    "categories": ["background", "print"],
    "tags": ["halftone", "print", "dots", "mask", "comic"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative surface — keep contrast with foreground text above 4.5:1 and disable drift under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Dot color", "default": "#7c5cff" },
      { "name": "--s", "description": "Dot pitch", "default": "14px" }
    ],
    "variations": ["Two-color CMYK halftone", "Radial falloff instead of linear", "Animate the mask for a wipe"],
    "ai_usage": "Comic, pop-art, and print-inspired designs. The ramp comes from a mask-image gradient over the dot layer — scaling the dots themselves requires per-dot markup and is not worth it."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .bg { position: fixed; inset: 0; }
    :root { --c: #7c5cff; --s: 14px; }
    .bg { background: #0b0d12; }
    .bg::after { content: ""; position: absolute; inset: 0;
      background-image: radial-gradient(var(--c) 30%, transparent 31%); background-size: var(--s) var(--s);
      -webkit-mask-image: linear-gradient(135deg, #000, transparent 70%); mask-image: linear-gradient(135deg, #000, transparent 70%); }
  </style>
</head>
<body>
  <div class="bg"></div>
</body>
</html>
