<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plasma Field</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "plasma-gradient-bg",
    "title": "Plasma Field",
    "summary": "Four coloured light sources drift and blend into a shifting plasma.",
    "description": "Overlapping radial gradients on independently animated layers create colour combinations no single gradient could hold.",
    "theme": "backgrounds",
    "categories": ["background", "gradient"],
    "tags": ["plasma", "gradient", "blend", "ambient", "color"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative surface — keep contrast with foreground text above 4.5:1 and disable drift under prefers-reduced-motion.",
    "customization": [
      { "name": "--dur", "description": "Drift period", "default": "20s" }
    ],
    "variations": ["Two-color scheme for restraint", "Faster drift for energy", "Add grain on top to reduce banding"],
    "ai_usage": "Ambient hero backgrounds. Animate each colour layer separately with different durations and directions; a single animated multi-stop gradient always reads as a sliding stripe instead of a field."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .bg { position: fixed; inset: 0; }
    :root { --dur: 20s; }
    .bg { background: #0b0d12; overflow: hidden; }
    .bg i { position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; filter: blur(70px); opacity: .55;
      animation: drift var(--d) ease-in-out infinite alternate; }
    @keyframes drift {
      from { transform: translate(-10%, -10%) scale(1); }
      to { transform: translate(20%, 15%) scale(1.25); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="bg">
    <i style="background:#7c5cff;top:-20%;left:-15%;--d:17s"></i>
    <i style="background:#2dd4bf;top:10%;right:-20%;--d:23s"></i>
    <i style="background:#f472b6;bottom:-25%;left:20%;--d:19s"></i>
    <i style="background:#38bdf8;bottom:-10%;right:5%;--d:27s"></i>
  </div>
</body>
</html>
