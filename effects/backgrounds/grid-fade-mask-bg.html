<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fading Grid</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "grid-fade-mask-bg",
    "title": "Fading Grid",
    "summary": "A technical grid that dissolves toward the edges.",
    "description": "A radial mask over the grid keeps the centre crisp and the periphery clean, so foreground text stays readable.",
    "theme": "backgrounds",
    "categories": ["background", "grid"],
    "tags": ["grid", "mask", "fade", "technical", "saas"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative surface — keep contrast with foreground text above 4.5:1 and disable drift under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Grid color", "default": "rgba(148,163,184,.14)" },
      { "name": "--s", "description": "Cell size", "default": "44px" }
    ],
    "variations": ["Fade from the top only", "Animate the grid drifting upward", "Dot grid instead of lines"],
    "ai_usage": "The default SaaS hero backdrop. The mask is what makes it usable: radial-gradient(ellipse at center, #000 40%, transparent 75%) prevents the grid from fighting with content at the edges."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .bg { position: fixed; inset: 0; }
    :root { --c: rgba(148,163,184,.14); --s: 44px; }
    .bg { background-color: #0b0d12;
      background-image: linear-gradient(var(--c) 1px, transparent 1px), linear-gradient(90deg, var(--c) 1px, transparent 1px);
      background-size: var(--s) var(--s);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 35%, transparent 72%);
      mask-image: radial-gradient(ellipse at center, #000 35%, transparent 72%); }
  </style>
</head>
<body>
  <div class="bg"></div>
</body>
</html>
