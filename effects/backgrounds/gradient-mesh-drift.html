<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drifting Mesh</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "gradient-mesh-drift",
    "title": "Drifting Mesh",
    "summary": "Soft colour nodes drift behind a heavy blur, never repeating exactly.",
    "description": "Four blurred nodes on coprime durations mean the composition takes minutes to repeat, unlike a looping gradient.",
    "theme": "backgrounds",
    "categories": ["background", "gradient"],
    "tags": ["mesh", "gradient", "drift", "blur", "organic"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative surface — keep contrast with foreground text above 4.5:1 and disable drift under prefers-reduced-motion.",
    "customization": [
      { "name": "--dur", "description": "Base period", "default": "24s" }
    ],
    "variations": ["Light-mode palette", "Reduce blur for defined blobs", "Freeze at a pleasing frame for a static export"],
    "ai_usage": "Premium marketing backgrounds. Use durations that are not multiples of each other (17s, 23s, 29s) so the loop point is imperceptible; add a grain overlay to hide gradient banding on wide screens."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .bg { position: fixed; inset: 0; }
    .bg { background: #0b0d12; overflow: hidden; }
    .bg i { position: absolute; width: 60vmax; height: 60vmax; border-radius: 45%; filter: blur(60px); opacity: .5;
      animation: wander var(--d) ease-in-out infinite alternate; }
    @keyframes wander {
      from { transform: translate(0, 0) rotate(0deg) scale(1); }
      to { transform: translate(12vw, -10vh) rotate(60deg) scale(1.2); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="bg">
    <i style="background:#7c5cff;top:-10%;left:-10%;--d:17s"></i>
    <i style="background:#2dd4bf;top:20%;right:-15%;--d:23s"></i>
    <i style="background:#f472b6;bottom:-20%;left:15%;--d:29s"></i>
  </div>
</body>
</html>
