<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Animated Static</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "animated-noise-bg",
    "title": "Animated Static",
    "summary": "Pure white noise regenerated every few frames on a canvas.",
    "description": "Writing random bytes into ImageData produces genuine per-pixel static that no CSS texture can match.",
    "theme": "backgrounds",
    "categories": ["background", "texture"],
    "tags": ["static", "noise", "canvas", "tv", "analog"],
    "tech": ["js", "canvas"],
    "era": "1990s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Regenerating ImageData is the expensive part — render at a quarter resolution and scale up, and throttle to ~12fps.",
    "accessibility_notes": "Decorative surface — keep contrast with foreground text above 4.5:1 and disable drift under prefers-reduced-motion.",
    "customization": [
      { "name": "--o", "description": "Overlay opacity", "default": "0.5" }
    ],
    "variations": ["Colour static instead of monochrome", "Slower refresh for film grain", "Blend over content with mix-blend-mode"],
    "ai_usage": "No-signal screens, error states, and analog aesthetics. Draw into a small offscreen canvas (e.g. 160×90) and let CSS scale it — full-resolution noise wastes an enormous amount of fill rate for no visual gain."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .bg { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; opacity: var(--o, .5); image-rendering: pixelated; }
    :root { --o: .5; }
  </style>
</head>
<body>
  <div class="bg"><canvas id="n" width="160" height="90"></canvas></div>
  <script>
    (function () {
      var c = document.getElementById("n"), x = c.getContext("2d");
      var img = x.createImageData(c.width, c.height);
      var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      function draw() {
        var d = img.data;
        for (var i = 0; i < d.length; i += 4) {
          var v = Math.random() * 255;
          d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255;
        }
        x.putImageData(img, 0, 0);
      }
      draw();
      if (!reduce) setInterval(draw, 80);
    })();
  </script>
</body>
</html>
