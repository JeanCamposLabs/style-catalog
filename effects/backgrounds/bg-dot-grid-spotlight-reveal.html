<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Revealed Grid</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "bg-dot-grid-spotlight-reveal",
    "title": "Revealed Grid",
    "summary": "A dot grid visible only near the pointer.",
    "description": "A dot grid visible only near the pointer.",
    "theme": "backgrounds",
    "categories": ["background", "surface"],
    "tags": ["background", "grid", "mask", "pointer", "reveal"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative surface — keep text contrast above 4.5:1 and stop drift under prefers-reduced-motion.",
    "customization": [
      { "name": "--r", "description": "Reveal radius", "default": "260px" }
    ],
    "variations": ["Retune through the custom properties", "Adapt for a light theme"],
    "ai_usage": "Interactive dark heroes. Masking the pattern rather than fading a full-strength grid keeps the resting page completely clean."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .bg { position: fixed; inset: 0; }
    .bg { background: #0b0d12; }
    .bg::after { content: ""; position: absolute; inset: 0;
      background-image: radial-gradient(rgba(124,92,255,.7) 1.4px, transparent 1.5px); background-size: 22px 22px;
      -webkit-mask-image: radial-gradient(260px circle at var(--x, 50%) var(--y, 50%), #000 10%, transparent 70%);
      mask-image: radial-gradient(260px circle at var(--x, 50%) var(--y, 50%), #000 10%, transparent 70%); }
  </style>
</head>
<body>
  <div class="bg" id="dg"></div>
  <script>
    (function () {
      var el = document.getElementById("dg");
      addEventListener("pointermove", function (e) {
        el.style.setProperty("--x", e.clientX + "px");
        el.style.setProperty("--y", e.clientY + "px");
      });
    })();
  </script>
</body>
</html>
