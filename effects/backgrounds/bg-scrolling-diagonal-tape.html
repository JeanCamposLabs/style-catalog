<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scrolling Tape</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "bg-scrolling-diagonal-tape",
    "title": "Scrolling Tape",
    "summary": "Diagonal warning tape drifting continuously.",
    "description": "Diagonal warning tape drifting continuously.",
    "theme": "backgrounds",
    "categories": ["background", "surface"],
    "tags": ["background", "tape", "hazard", "diagonal", "scroll"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative surface — keep text contrast above 4.5:1 and stop drift under prefers-reduced-motion.",
    "customization": [
      { "name": "--dur", "description": "Drift period", "default": "3s" }
    ],
    "variations": ["Retune through the custom properties", "Adapt for a light theme"],
    "ai_usage": "Maintenance and staging environments. Animate background-position by one full stripe period so the tape appears to travel without ever restarting visibly."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .bg { position: fixed; inset: 0; }
    .bg { background: #0b0d12; overflow: hidden; }
    .bg i { position: absolute; left: -20%; right: -20%; height: 60px; transform: rotate(-8deg);
      background: repeating-linear-gradient(45deg, #c2891a 0 20px, #0b0d12 20px 40px); opacity: .5;
      animation: slide 3s linear infinite; }
    @keyframes slide { to { background-position: 56px 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="bg"><i style="top:22%"></i><i style="top:62%"></i></div>
</body>
</html>
