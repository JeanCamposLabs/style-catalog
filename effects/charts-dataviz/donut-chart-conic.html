<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Donut Chart</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "donut-chart-conic",
    "title": "Donut Chart",
    "summary": "A part-to-whole donut with a centred total.",
    "description": "A part-to-whole donut with a centred total.",
    "theme": "charts-dataviz",
    "categories": ["chart", "dataviz"],
    "tags": ["chart", "data", "donut", "pie", "composition", "conic"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Identity is never colour-alone: every multi-series chart ships a legend, direct labels where they fit, and an equivalent table or accessible summary. Grid lines and axes stay recessive; values wear text colours, not series colours.",
    "customization": [
      { "name": "--c1", "description": "Slice one", "default": "#7c5cff" },
      { "name": "--c2", "description": "Slice two", "default": "#10a894" },
      { "name": "--c3", "description": "Slice three", "default": "#c2891a" }
    ],
    "variations": ["Swap in your own brand ramp and re-run the palette validator", "Add a table view of the same data"],
    "ai_usage": "Part-to-whole with four or fewer slices. Insert a 0.6% surface-coloured gap between segments so the boundaries read without strokes. Beyond four slices a bar chart is easier to compare — angle is the hardest channel to judge."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { --c1: #7c5cff; --c2: #10a894; --c3: #c2891a; --c4: #d1478c; --c5: #2f7cc9;
      --ink: #e7ebf3; --ink-2: #8b93a7; --grid: rgba(139,147,167,.22); --surface: #0b0d12; display: flex; align-items: center; gap: 1.2rem; }
    .fx .ring { position: relative; width: 130px; aspect-ratio: 1; border-radius: 50%;
      background: conic-gradient(var(--c1) 0 48%, var(--surface) 0 48.6%, var(--c2) 0 74%, var(--surface) 0 74.6%, var(--c3) 0 90%, var(--surface) 0 90.6%, var(--c5) 0);
      -webkit-mask: radial-gradient(farthest-side, transparent 62%, #000 63%); mask: radial-gradient(farthest-side, transparent 62%, #000 63%); }
    .fx .wrap { position: relative; display: grid; place-items: center; }
    .fx .tot { position: absolute; text-align: center; }
    .fx .tot b { display: block; font-size: 1.3rem; font-weight: 900; color: var(--ink); }
    .fx .tot span { font-size: .68rem; color: var(--ink-2); }
    .fx .legend { display: grid; gap: .4rem; font-size: .78rem; color: var(--ink-2); }
    .fx .legend span { display: flex; align-items: center; gap: .45rem; }
    .fx .legend i { width: 10px; height: 10px; border-radius: 3px; }
    .fx .legend b { color: var(--ink); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <figure class="fx" style="margin:0"><div class="wrap"><div class="ring" role="img" aria-label="Donut chart: CSS 48 percent, SVG 26 percent, JS 16 percent, other 10 percent"></div>
  <div class="tot"><b>1,181</b><span>specimens</span></div></div>
  <div class="legend"><span><i style="background:var(--c1)"></i>CSS <b>48%</b></span><span><i style="background:var(--c2)"></i>SVG <b>26%</b></span>
  <span><i style="background:var(--c3)"></i>JS <b>16%</b></span><span><i style="background:var(--c5)"></i>Other <b>10%</b></span></div></figure>
</body>
</html>
