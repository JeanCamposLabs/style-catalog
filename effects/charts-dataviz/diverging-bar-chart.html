<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Diverging Bars</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "diverging-bar-chart",
    "title": "Diverging Bars",
    "summary": "Positive and negative change around a zero baseline.",
    "description": "Positive and negative change around a zero baseline.",
    "theme": "charts-dataviz",
    "categories": ["chart", "dataviz"],
    "tags": ["chart", "data", "diverging", "change", "positive-negative", "baseline"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Identity is never colour-alone: every multi-series chart ships a legend, direct labels where they fit, and an equivalent table or accessible summary. Grid lines and axes stay recessive; values wear text colours, not series colours.",
    "customization": [
      { "name": "--c5", "description": "Positive colour", "default": "#2f7cc9" },
      { "name": "--c4", "description": "Negative colour", "default": "#d1478c" }
    ],
    "variations": ["Swap in your own brand ramp and re-run the palette validator", "Add a table view of the same data"],
    "ai_usage": "Change that can go either way. A diverging scale is two hues plus a neutral midpoint — never a hue at zero. Anchor both directions to one centred baseline so the lengths stay comparable."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { --c1: #7c5cff; --c2: #10a894; --c3: #c2891a; --c4: #d1478c; --c5: #2f7cc9;
      --ink: #e7ebf3; --ink-2: #8b93a7; --grid: rgba(139,147,167,.22); --surface: #0b0d12; width: 300px; }
    .fx h4 { margin: 0 0 .9rem; font-size: .95rem; color: var(--ink); }
    .fx .row { display: grid; grid-template-columns: 70px 1fr; align-items: center; gap: .6rem; margin-bottom: .45rem;
      font-size: .78rem; color: var(--ink-2); }
    .fx .track { position: relative; height: 16px; }
    .fx .track::before { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--grid); }
    .fx .track i { position: absolute; top: 0; height: 100%; border-radius: 3px; }
    .fx .pos { left: 50%; width: calc(var(--v) * 1%); background: var(--c5); border-radius: 2px 4px 4px 2px; }
    .fx .neg { right: 50%; width: calc(var(--v) * 1%); background: var(--c4); border-radius: 4px 2px 2px 4px; }
    .fx .val { position: absolute; top: 0; line-height: 16px; font-size: .7rem; color: var(--ink); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <figure class="fx" style="margin:0"><h4>Week-over-week change</h4>
  <div class="row"><span>Gallery</span><span class="track"><i class="pos" style="--v:34"></i><span class="val" style="left:calc(50% + 36%)">+34%</span></span></div>
  <div class="row"><span>API</span><span class="track"><i class="pos" style="--v:12"></i><span class="val" style="left:calc(50% + 14%)">+12%</span></span></div>
  <div class="row"><span>Docs</span><span class="track"><i class="neg" style="--v:22"></i><span class="val" style="right:calc(50% + 24%)">−22%</span></span></div>
  <div class="row"><span>MCP</span><span class="track"><i class="neg" style="--v:8"></i><span class="val" style="right:calc(50% + 10%)">−8%</span></span></div></figure>
</body>
</html>
