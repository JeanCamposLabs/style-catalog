<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Radial Comparison</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "radial-progress-multi",
    "title": "Radial Comparison",
    "summary": "Three metrics as concentric arcs with a legend.",
    "description": "Three metrics as concentric arcs with a legend.",
    "theme": "charts-dataviz",
    "categories": ["chart", "dataviz"],
    "tags": ["chart", "data", "radial", "rings", "activity", "comparison"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Identity is never colour-alone: every multi-series chart ships a legend, direct labels where they fit, and an equivalent table or accessible summary. Grid lines and axes stay recessive; values wear text colours, not series colours.",
    "customization": [
      { "name": "--a", "description": "Outer percent", "default": "78" },
      { "name": "--b", "description": "Middle percent", "default": "54" },
      { "name": "--c", "description": "Inner percent", "default": "32" }
    ],
    "variations": ["Swap in your own brand ramp and re-run the palette validator", "Add a table view of the same data"],
    "ai_usage": "Three bounded percentages at a glance. Concentric arcs of different radii are not length-comparable, so always print the numbers beside them — the rings are an index, not the measurement."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { --c1: #7c5cff; --c2: #10a894; --c3: #c2891a; --c4: #d1478c; --c5: #2f7cc9;
      --ink: #e7ebf3; --ink-2: #8b93a7; --grid: rgba(139,147,167,.22); --surface: #0b0d12; display: flex; align-items: center; gap: 1.2rem; }
    .fx .rings { position: relative; width: 140px; aspect-ratio: 1; }
    .fx .r { position: absolute; border-radius: 50%; }
    .fx .r1 { inset: 0; background: conic-gradient(var(--c1) calc(var(--a) * 1%), #1b2231 0);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 13px), #000 0); mask: radial-gradient(farthest-side, transparent calc(100% - 13px), #000 0); }
    .fx .r2 { inset: 19px; background: conic-gradient(var(--c2) calc(var(--b) * 1%), #1b2231 0);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 13px), #000 0); mask: radial-gradient(farthest-side, transparent calc(100% - 13px), #000 0); }
    .fx .r3 { inset: 38px; background: conic-gradient(var(--c3) calc(var(--c) * 1%), #1b2231 0);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 13px), #000 0); mask: radial-gradient(farthest-side, transparent calc(100% - 13px), #000 0); }
    .fx .legend { display: grid; gap: .5rem; font-size: .78rem; color: var(--ink-2); }
    .fx .legend span { display: flex; align-items: center; gap: .45rem; }
    .fx .legend i { width: 10px; height: 10px; border-radius: 3px; }
    .fx .legend b { color: var(--ink); font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <figure class="fx" style="margin:0"><div class="rings" style="--a:78;--b:54;--c:32" role="img" aria-label="Coverage 78 percent, posters 54 percent, docs 32 percent">
    <div class="r r1"></div><div class="r r2"></div><div class="r r3"></div></div>
  <div class="legend"><span><i style="background:var(--c1)"></i>Coverage <b>78%</b></span>
  <span><i style="background:var(--c2)"></i>Posters <b>54%</b></span><span><i style="background:var(--c3)"></i>Docs <b>32%</b></span></div></figure>
</body>
</html>
