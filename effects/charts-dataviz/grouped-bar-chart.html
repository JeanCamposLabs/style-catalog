<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grouped Bars</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "grouped-bar-chart",
    "title": "Grouped Bars",
    "summary": "Two series compared side by side with a legend.",
    "description": "Two series compared side by side with a legend.",
    "theme": "charts-dataviz",
    "categories": ["chart", "dataviz"],
    "tags": ["chart", "data", "grouped", "comparison", "two-series", "legend"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Identity is never colour-alone: every multi-series chart ships a legend, direct labels where they fit, and an equivalent table or accessible summary. Grid lines and axes stay recessive; values wear text colours, not series colours.",
    "customization": [
      { "name": "--c1", "description": "Series one", "default": "#7c5cff" },
      { "name": "--c2", "description": "Series two", "default": "#10a894" }
    ],
    "variations": ["Swap in your own brand ramp and re-run the palette validator", "Add a table view of the same data"],
    "ai_usage": "Comparing two measures across categories. Keep a 2px surface gap between the paired bars, assign hues in the fixed categorical order (never by rank), and never split them onto two y-axes — one scale or two charts."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { --c1: #7c5cff; --c2: #10a894; --c3: #c2891a; --c4: #d1478c; --c5: #2f7cc9;
      --ink: #e7ebf3; --ink-2: #8b93a7; --grid: rgba(139,147,167,.22); --surface: #0b0d12; width: 310px; }
    .fx h4 { margin: 0 0 .8rem; font-size: .95rem; color: var(--ink); }
    .fx .legend { display: flex; gap: 1rem; margin-bottom: .8rem; font-size: .76rem; color: var(--ink-2); }
    .fx .legend span { display: inline-flex; align-items: center; gap: .35rem; }
    .fx .legend i { width: 10px; height: 10px; border-radius: 3px; }
    .fx .plot { display: flex; align-items: flex-end; gap: 12px; height: 130px;
      background: repeating-linear-gradient(0deg, var(--grid) 0 1px, transparent 1px 32.5px); }
    .fx .grp { flex: 1; display: flex; align-items: flex-end; gap: 2px; height: 100%; }
    .fx .grp i { flex: 1; border-radius: 4px 4px 0 0; height: calc(var(--v) * 1%); }
    .fx .axis { display: flex; gap: 12px; margin-top: .4rem; }
    .fx .axis span { flex: 1; text-align: center; font-size: .7rem; color: var(--ink-2); }
  </style>
</head>
<body>
  <figure class="fx" style="margin:0"><h4>Added vs revised</h4>
  <div class="legend"><span><i style="background:var(--c1)"></i>Added</span><span><i style="background:var(--c2)"></i>Revised</span></div>
  <div class="plot" role="img" aria-label="Grouped bars comparing added and revised counts across four weeks">
    <div class="grp"><i style="--v:46;background:var(--c1)"></i><i style="--v:28;background:var(--c2)"></i></div>
    <div class="grp"><i style="--v:75;background:var(--c1)"></i><i style="--v:40;background:var(--c2)"></i></div>
    <div class="grp"><i style="--v:60;background:var(--c1)"></i><i style="--v:52;background:var(--c2)"></i></div>
    <div class="grp"><i style="--v:100;background:var(--c1)"></i><i style="--v:34;background:var(--c2)"></i></div></div>
  <div class="axis"><span>W1</span><span>W2</span><span>W3</span><span>W4</span></div></figure>
</body>
</html>
