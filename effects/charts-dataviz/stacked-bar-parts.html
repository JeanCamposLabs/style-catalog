<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stacked Bars</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "stacked-bar-parts",
    "title": "Stacked Bars",
    "summary": "Part-to-whole composition per category.",
    "description": "Part-to-whole composition per category.",
    "theme": "charts-dataviz",
    "categories": ["chart", "dataviz"],
    "tags": ["chart", "data", "stacked", "composition", "part-to-whole", "segments"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Identity is never colour-alone: every multi-series chart ships a legend, direct labels where they fit, and an equivalent table or accessible summary. Grid lines and axes stay recessive; values wear text colours, not series colours.",
    "customization": [
      { "name": "--c1", "description": "Segment one", "default": "#7c5cff" },
      { "name": "--c2", "description": "Segment two", "default": "#10a894" },
      { "name": "--c3", "description": "Segment three", "default": "#c2891a" }
    ],
    "variations": ["Swap in your own brand ramp and re-run the palette validator", "Add a table view of the same data"],
    "ai_usage": "Showing composition when the total also matters. A 2px surface-coloured gap between segments keeps them legible without borders. Only the bottom segment is easy to compare across bars — if every part needs comparing, use grouped bars instead."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { --c1: #7c5cff; --c2: #10a894; --c3: #c2891a; --c4: #d1478c; --c5: #2f7cc9;
      --ink: #e7ebf3; --ink-2: #8b93a7; --grid: rgba(139,147,167,.22); --surface: #0b0d12; width: 300px; }
    .fx h4 { margin: 0 0 .8rem; font-size: .95rem; color: var(--ink); }
    .fx .legend { display: flex; gap: 1rem; margin-bottom: .8rem; font-size: .76rem; color: var(--ink-2); }
    .fx .legend span { display: inline-flex; align-items: center; gap: .35rem; }
    .fx .legend i { width: 10px; height: 10px; border-radius: 3px; }
    .fx .plot { display: flex; align-items: flex-end; gap: 14px; height: 140px; }
    .fx .st { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; height: 100%; }
    .fx .st i { border-radius: 2px; height: calc(var(--v) * 1%); }
    .fx .st i:first-child { border-radius: 4px 4px 2px 2px; }
    .fx .axis { display: flex; gap: 14px; margin-top: .4rem; }
    .fx .axis span { flex: 1; text-align: center; font-size: .7rem; color: var(--ink-2); }
  </style>
</head>
<body>
  <figure class="fx" style="margin:0"><h4>Effects by tech</h4>
  <div class="legend"><span><i style="background:var(--c1)"></i>CSS</span><span><i style="background:var(--c2)"></i>SVG</span><span><i style="background:var(--c3)"></i>JS</span></div>
  <div class="plot" role="img" aria-label="Stacked bars of CSS, SVG and JS counts across three quarters">
    <div class="st"><i style="--v:20;background:var(--c3)"></i><i style="--v:22;background:var(--c2)"></i><i style="--v:44;background:var(--c1)"></i></div>
    <div class="st"><i style="--v:16;background:var(--c3)"></i><i style="--v:26;background:var(--c2)"></i><i style="--v:52;background:var(--c1)"></i></div>
    <div class="st"><i style="--v:14;background:var(--c3)"></i><i style="--v:20;background:var(--c2)"></i><i style="--v:66;background:var(--c1)"></i></div></div>
  <div class="axis"><span>Q1</span><span>Q2</span><span>Q3</span></div></figure>
</body>
</html>
