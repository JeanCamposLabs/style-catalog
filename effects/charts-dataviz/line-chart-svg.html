<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Line Chart</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "line-chart-svg",
    "title": "Line Chart",
    "summary": "A two-series line chart with markers and a recessive grid.",
    "description": "A two-series line chart with markers and a recessive grid.",
    "theme": "charts-dataviz",
    "categories": ["chart", "dataviz"],
    "tags": ["chart", "data", "line", "trend", "time-series", "two-series"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Identity is never colour-alone: every multi-series chart ships a legend, direct labels where they fit, and an equivalent table or accessible summary. Grid lines and axes stay recessive; values wear text colours, not series colours.",
    "customization": [
      { "name": "--c1", "description": "Series one", "default": "#7c5cff" },
      { "name": "--c2", "description": "Series two", "default": "#10a894" }
    ],
    "variations": ["Swap in your own brand ramp and re-run the palette validator", "Add a table view of the same data"],
    "ai_usage": "Change over time. Use 2px strokes, markers of at least 8px diameter with a 2px surface ring where lines overlap, and direct-label the series ends when there is room. In production add a crosshair tooltip — an HTML chart should be interactive by default."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { --c1: #7c5cff; --c2: #10a894; --c3: #c2891a; --c4: #d1478c; --c5: #2f7cc9;
      --ink: #e7ebf3; --ink-2: #8b93a7; --grid: rgba(139,147,167,.22); --surface: #0b0d12; width: 310px; }
    .fx h4 { margin: 0 0 .8rem; font-size: .95rem; color: var(--ink); }
    .fx .legend { display: flex; gap: 1rem; margin-bottom: .6rem; font-size: .76rem; color: var(--ink-2); }
    .fx .legend span { display: inline-flex; align-items: center; gap: .35rem; }
    .fx .legend i { width: 14px; height: 2px; border-radius: 2px; }
    .fx svg { width: 100%; display: block; }
    .fx .grid line { stroke: var(--grid); stroke-width: 1; }
    .fx path { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .fx circle { r: 4; stroke: var(--surface); stroke-width: 2; }
    .fx .axis { display: flex; justify-content: space-between; margin-top: .3rem; font-size: .7rem; color: var(--ink-2); }
  </style>
</head>
<body>
  <figure class="fx" style="margin:0"><h4>Weekly page views</h4>
  <div class="legend"><span><i style="background:var(--c1)"></i>Gallery</span><span><i style="background:var(--c2)"></i>API</span></div>
  <svg viewBox="0 0 300 130" role="img" aria-label="Line chart: gallery views rise from 40 to 105; API views rise from 20 to 62">
    <g class="grid"><line x1="0" y1="20" x2="300" y2="20"/><line x1="0" y1="55" x2="300" y2="55"/><line x1="0" y1="90" x2="300" y2="90"/><line x1="0" y1="125" x2="300" y2="125"/></g>
    <path d="M10 100 L82 78 L154 62 L226 40 L290 22" stroke="#7c5cff"/>
    <path d="M10 118 L82 108 L154 96 L226 88 L290 70" stroke="#10a894"/>
    <circle cx="10" cy="100" fill="#7c5cff"/><circle cx="82" cy="78" fill="#7c5cff"/><circle cx="154" cy="62" fill="#7c5cff"/><circle cx="226" cy="40" fill="#7c5cff"/><circle cx="290" cy="22" fill="#7c5cff"/>
    <circle cx="10" cy="118" fill="#10a894"/><circle cx="82" cy="108" fill="#10a894"/><circle cx="154" cy="96" fill="#10a894"/><circle cx="226" cy="88" fill="#10a894"/><circle cx="290" cy="70" fill="#10a894"/>
  </svg>
  <div class="axis"><span>Aug 8</span><span>Aug 29</span><span>Sep 10</span></div></figure>
</body>
</html>
