<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shake In</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "shake-in",
    "title": "Shake In",
    "summary": "The element arrives with a quick side-to-side settle.",
    "description": "The element arrives with a quick side-to-side settle. Applied once on load with animation-fill-mode: both so the element holds its final state.",
    "theme": "transitions-animations",
    "categories": ["animation", "entrance"],
    "tags": ["entrance", "reveal", "shake", "settle", "attention"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Entrance animations must not hide content if they never run — the resting state under prefers-reduced-motion is the finished state.",
    "customization": [
      { "name": "--dur", "description": "Animation duration", "default": ".6s" },
      { "name": "--ease", "description": "Timing function", "default": "ease-out" }
    ],
    "variations": ["Stagger across a list with animation-delay", "Play on scroll with IntersectionObserver"],
    "ai_usage": "Signals arrival with urgency — good for error banners. Do not reuse the same shake for success states or the meaning blurs."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    :root { --dur: .6s; --ease: ease-out; }
    .card { width: 230px; padding: 1.5rem; border-radius: 16px; background: #151b2a; border: 1px solid #263149;
      animation: shake-in var(--dur) var(--ease) both infinite alternate; }
    .card h3 { margin: 0 0 .3rem; font-size: 1.05rem; }
    .card p { margin: 0; color: #8b93a7; font-size: .88rem; }
    @keyframes shake-in {
      0% { opacity: 0; transform: translateX(-24px); }
      40% { opacity: 1; transform: translateX(12px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(3px); }
      100% { transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
    }
  </style>
</head>
<body>
  <div class="card"><h3>Shake In</h3><p>The element arrives with a quick side-to-side settle.</p></div>
</body>
</html>
