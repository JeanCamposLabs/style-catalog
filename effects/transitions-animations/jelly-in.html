<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jelly In</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "jelly-in",
    "title": "Jelly In",
    "summary": "The element wobbles on both axes as it appears.",
    "description": "The element wobbles on both axes as it appears. Applied once on load with animation-fill-mode: both so the element holds its final state.",
    "theme": "transitions-animations",
    "categories": ["animation", "entrance"],
    "tags": ["entrance", "reveal", "jelly", "elastic", "wobble"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Entrance animations must not hide content if they never run — the resting state under prefers-reduced-motion is the finished state.",
    "customization": [
      { "name": "--dur", "description": "Animation duration", "default": ".9s" },
      { "name": "--ease", "description": "Timing function", "default": "ease-out" }
    ],
    "variations": ["Stagger across a list with animation-delay", "Play on scroll with IntersectionObserver"],
    "ai_usage": "Reserve for playful moments — the alternating axis squash is loud. Never apply to more than one element on screen at a time."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    :root { --dur: .9s; --ease: ease-out; }
    .card { width: 230px; padding: 1.5rem; border-radius: 16px; background: #151b2a; border: 1px solid #263149;
      animation: jelly-in var(--dur) var(--ease) both infinite alternate; }
    .card h3 { margin: 0 0 .3rem; font-size: 1.05rem; }
    .card p { margin: 0; color: #8b93a7; font-size: .88rem; }
    @keyframes jelly-in {
      0% { opacity: 0; transform: scale(0, 0); }
      40% { opacity: 1; transform: scale(1.15, .85); }
      60% { transform: scale(.9, 1.1); }
      80% { transform: scale(1.05, .95); }
      100% { transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
    }
  </style>
</head>
<body>
  <div class="card"><h3>Jelly In</h3><p>The element wobbles on both axes as it appears.</p></div>
</body>
</html>
