<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rubber Band In</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "rubber-band-in",
    "title": "Rubber Band In",
    "summary": "The element stretches horizontally then snaps back.",
    "description": "The element stretches horizontally then snaps back. Applied once on load with animation-fill-mode: both so the element holds its final state.",
    "theme": "transitions-animations",
    "categories": ["animation", "entrance"],
    "tags": ["entrance", "reveal", "rubber", "stretch", "elastic"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Entrance animations must not hide content if they never run — the resting state under prefers-reduced-motion is the finished state.",
    "customization": [
      { "name": "--dur", "description": "Animation duration", "default": ".7s" },
      { "name": "--ease", "description": "Timing function", "default": "cubic-bezier(.2,.8,.3,1)" }
    ],
    "variations": ["Stagger across a list with animation-delay", "Play on scroll with IntersectionObserver"],
    "ai_usage": "Attention-grabbing for pills and badges. Because only X scales, text inside distorts — use it on elements without long labels."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    :root { --dur: .7s; --ease: cubic-bezier(.2,.8,.3,1); }
    .card { width: 230px; padding: 1.5rem; border-radius: 16px; background: #151b2a; border: 1px solid #263149;
      animation: rubber-band-in var(--dur) var(--ease) both infinite alternate; }
    .card h3 { margin: 0 0 .3rem; font-size: 1.05rem; }
    .card p { margin: 0; color: #8b93a7; font-size: .88rem; }
    @keyframes rubber-band-in {
      0% { opacity: 0; transform: scaleX(.5); }
      50% { opacity: 1; transform: scaleX(1.2); }
      75% { transform: scaleX(.92); }
      100% { transform: scaleX(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
    }
  </style>
</head>
<body>
  <div class="card"><h3>Rubber Band In</h3><p>The element stretches horizontally then snaps back.</p></div>
</body>
</html>
