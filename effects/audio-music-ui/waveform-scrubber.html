<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Waveform Scrubber</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "waveform-scrubber",
    "title": "Waveform Scrubber",
    "summary": "A waveform where the played portion is highlighted.",
    "description": "A waveform where the played portion is highlighted.",
    "theme": "audio-music-ui",
    "categories": ["audio", "music"],
    "tags": ["audio", "player", "waveform", "scrubber", "seek", "player"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Audio controls need real button semantics and state labels; a play/pause icon swap must also swap the accessible name.",
    "customization": [
      { "name": "--c", "description": "Played colour", "default": "#2dd4bf" }
    ],
    "variations": ["Retheme through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Podcast and audio editors. Render the peaks once into fixed heights; recomputing the waveform on every seek is the usual cause of jank."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: flex; align-items: center; gap: 2px; height: 60px; width: 290px; cursor: pointer; }
    .fx i { flex: 1; border-radius: 2px; background: #2b3450; height: var(--h); }
    .fx i.on { background: #2dd4bf; }
  </style>
</head>
<body>
  <div class="fx" role="slider" aria-label="Seek" aria-valuenow="42" aria-valuemin="0" aria-valuemax="100">
    <i class="on" style="--h:30%"></i><i class="on" style="--h:62%"></i><i class="on" style="--h:44%"></i><i class="on" style="--h:88%"></i>
    <i class="on" style="--h:52%"></i><i class="on" style="--h:70%"></i><i style="--h:36%"></i><i style="--h:92%"></i>
    <i style="--h:48%"></i><i style="--h:64%"></i><i style="--h:28%"></i><i style="--h:76%"></i><i style="--h:40%"></i>
    <i style="--h:58%"></i><i style="--h:34%"></i></div>
</body>
</html>
