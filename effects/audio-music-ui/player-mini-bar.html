<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini Player</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "player-mini-bar",
    "title": "Mini Player",
    "summary": "A compact player with artwork, title, and transport controls.",
    "description": "A compact player with artwork, title, and transport controls.",
    "theme": "audio-music-ui",
    "categories": ["audio", "music"],
    "tags": ["audio", "player", "player", "mini", "transport", "controls"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Audio controls need real button semantics and state labels; a play/pause icon swap must also swap the accessible name.",
    "customization": [
      { "name": "--c", "description": "Accent", "default": "#7c5cff" }
    ],
    "variations": ["Retheme through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Persistent playback bars. min-width:0 on the metadata column is required or long track titles will push the controls off screen."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: flex; align-items: center; gap: .8rem; width: 300px; padding: .7rem .9rem; border-radius: 14px;
      background: #151b2a; border: 1px solid #263149; }
    .fx .art { width: 44px; height: 44px; border-radius: 9px; background: conic-gradient(from 40deg, #7c5cff, #2dd4bf, #f472b6); flex: none; }
    .fx .meta { flex: 1; min-width: 0; }
    .fx .meta b { display: block; font-size: .88rem; }
    .fx .meta span { font-size: .76rem; color: #8b93a7; }
    .fx button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: #7c5cff; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <div class="fx"><div class="art"></div><div class="meta"><b>Nightcall</b><span>Kavinsky</span></div>
  <button type="button" aria-label="Pause">❚❚</button></div>
</body>
</html>
