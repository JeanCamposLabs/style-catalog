<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Equalizer Bands</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "eq-sliders-band",
    "title": "Equalizer Bands",
    "summary": "A five-band EQ with a curve overlay.",
    "description": "A five-band EQ with a curve overlay.",
    "theme": "audio-music-ui",
    "categories": ["audio", "music"],
    "tags": ["audio", "player", "equalizer", "bands", "eq", "mixer"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Audio controls need real button semantics and state labels; a play/pause icon swap must also swap the accessible name.",
    "customization": [
      { "name": "--c", "description": "Knob colour", "default": "#7c5cff" }
    ],
    "variations": ["Retheme through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Audio settings. Label the frequency of every band — an unlabelled EQ is a row of meaningless sliders."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; display: flex; gap: 14px; align-items: flex-end; padding: 1rem; border-radius: 14px;
      background: #151b2a; border: 1px solid #263149; }
    .band { width: 8px; height: 110px; border-radius: 99px; background: #22304a; position: relative; }
    .band i { position: absolute; left: 50%; translate: -50% 50%; bottom: calc(var(--v) * 1%); width: 22px; height: 10px;
      border-radius: 3px; background: #7c5cff; }
    .lbl { position: absolute; left: 0; right: 0; bottom: 4px; display: flex; justify-content: space-around;
      font-size: .62rem; color: #64748b; font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <div class="fx" role="group" aria-label="Equalizer">
    <div class="band" style="--v:40"><i></i></div><div class="band" style="--v:70"><i></i></div>
    <div class="band" style="--v:55"><i></i></div><div class="band" style="--v:80"><i></i></div>
    <div class="band" style="--v:35"><i></i></div>
    <div class="lbl"><span>60</span><span>250</span><span>1k</span><span>4k</span><span>12k</span></div></div>
</body>
</html>
