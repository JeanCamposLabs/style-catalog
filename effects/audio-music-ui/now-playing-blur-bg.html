<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Now Playing</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "now-playing-blur-bg",
    "title": "Now Playing",
    "summary": "A full card with artwork-derived blurred backdrop.",
    "description": "A full card with artwork-derived blurred backdrop.",
    "theme": "audio-music-ui",
    "categories": ["audio", "music"],
    "tags": ["audio", "player", "now-playing", "blur", "artwork", "ambient"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Audio controls need real button semantics and state labels; a play/pause icon swap must also swap the accessible name.",
    "customization": [
      { "name": "--blur", "description": "Backdrop blur", "default": "34px" }
    ],
    "variations": ["Retheme through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Player screens. Deriving the backdrop from the artwork gives every track its own palette without shipping any extra assets."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 250px; padding: 1.4rem; border-radius: 20px; overflow: hidden; color: #fff; text-align: center; }
    .fx::before { content: ""; position: absolute; inset: -30%; filter: blur(34px); opacity: .7;
      background: conic-gradient(from 40deg, #7c5cff, #2dd4bf, #f472b6, #7c5cff); }
    .fx .art { position: relative; width: 130px; height: 130px; border-radius: 16px; margin: 0 auto 1rem;
      background: conic-gradient(from 40deg, #7c5cff, #2dd4bf, #f472b6); box-shadow: 0 16px 34px rgba(0,0,0,.5); }
    .fx b { position: relative; display: block; font-size: 1rem; }
    .fx span { position: relative; font-size: .82rem; opacity: .75; }
  </style>
</head>
<body>
  <div class="fx"><div class="art"></div><b>Midnight City</b><span>M83 · Hurry Up, We're Dreaming</span></div>
</body>
</html>
