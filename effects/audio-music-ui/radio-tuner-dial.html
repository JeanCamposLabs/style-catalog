<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Radio Dial</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "radio-tuner-dial",
    "title": "Radio Dial",
    "summary": "A tuner scale with a moving needle.",
    "description": "A tuner scale with a moving needle.",
    "theme": "audio-music-ui",
    "categories": ["audio", "music"],
    "tags": ["audio", "player", "radio", "tuner", "dial", "skeuomorphic"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Audio controls need real button semantics and state labels; a play/pause icon swap must also swap the accessible name.",
    "customization": [
      { "name": "--p", "description": "Needle position", "default": "58" }
    ],
    "variations": ["Retheme through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Radio and retro-audio apps. Tick marks at irregular label intervals is what makes a tuner scale look real rather than a ruler."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 290px; padding: 1rem; border-radius: 14px; background: linear-gradient(160deg, #2a2118, #14100b);
      border: 1px solid #4a3a26; }
    .fx .scale { position: relative; height: 46px; border-radius: 6px; background: #f5efdf;
      background-image: repeating-linear-gradient(90deg, #4a3a26 0 1px, transparent 1px 14px); }
    .fx .needle { position: absolute; top: -4px; bottom: -4px; left: calc(var(--p) * 1%); width: 3px; background: #dc2626;
      box-shadow: 0 0 8px rgba(220,38,38,.7); }
    .fx .nums { display: flex; justify-content: space-between; margin-top: .4rem; font-family: ui-monospace, monospace;
      font-size: .68rem; color: #a8926b; }
  </style>
</head>
<body>
  <div class="fx" style="--p:58"><div class="scale" role="slider" aria-label="Frequency" aria-valuenow="98.4" aria-valuemin="87.5" aria-valuemax="108">
    <span class="needle"></span></div><div class="nums"><span>87.5</span><span>92</span><span>98</span><span>104</span><span>108</span></div></div>
</body>
</html>
