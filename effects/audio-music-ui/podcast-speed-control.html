<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Playback Speed</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "podcast-speed-control",
    "title": "Playback Speed",
    "summary": "A speed selector with the current rate highlighted.",
    "description": "A speed selector with the current rate highlighted.",
    "theme": "audio-music-ui",
    "categories": ["audio", "music"],
    "tags": ["audio", "player", "speed", "playback", "rate", "podcast"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Audio controls need real button semantics and state labels; a play/pause icon swap must also swap the accessible name.",
    "customization": [
      { "name": "--c", "description": "Active colour", "default": "#7c5cff" }
    ],
    "variations": ["Retheme through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Podcast players. Offer a small fixed set of rates rather than a slider — precise values are what listeners actually want to return to."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: inline-flex; padding: 4px; border-radius: 999px; background: #151b2a; border: 1px solid #263149; }
    .fx button { padding: .35rem .8rem; border: 0; border-radius: 999px; background: transparent; color: #8b93a7;
      font: inherit; font-size: .8rem; font-weight: 700; cursor: pointer; }
    .fx button[aria-pressed="true"] { background: #7c5cff; color: #fff; }
  </style>
</head>
<body>
  <div class="fx" role="group" aria-label="Playback speed">
    <button type="button" aria-pressed="false">0.75×</button><button type="button" aria-pressed="true">1×</button>
    <button type="button" aria-pressed="false">1.5×</button><button type="button" aria-pressed="false">2×</button></div>
</body>
</html>
