<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Major Third Scale</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "type-scale-major-third",
    "title": "Major Third Scale",
    "summary": "A 1.25 ratio type scale from caption to display.",
    "description": "A 1.25 ratio type scale from caption to display.",
    "theme": "typography-systems",
    "categories": ["typography", "reference"],
    "tags": ["typography", "type", "scale", "ratio", "modular", "hierarchy"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Type systems must survive user font-size settings: size in rem, never lock line-height in px, and keep the measure under 75 characters.",
    "customization": [
      { "name": "--ratio", "description": "Scale ratio", "default": "1.25" },
      { "name": "--base", "description": "Base size", "default": "1rem" }
    ],
    "variations": ["Swap in your own scale", "Export as design tokens"],
    "ai_usage": "Pick one ratio and generate every step from it. 1.25 (major third) suits dense product UI; 1.333 or 1.5 suit editorial. Tighten line-height as size grows — display text at 1.6 looks unglued."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 300px; display: grid; gap: .6rem; }
    .fx .r { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; border-bottom: 1px solid #1e2740; padding-bottom: .4rem; }
    .fx .s { color: #64748b; font-size: .7rem; font-family: ui-monospace, monospace; }
    .d { font-size: 2.44rem; font-weight: 800; line-height: 1.1; }
    .h1 { font-size: 1.95rem; font-weight: 800; line-height: 1.15; }
    .h2 { font-size: 1.56rem; font-weight: 700; line-height: 1.2; }
    .h3 { font-size: 1.25rem; font-weight: 700; line-height: 1.3; }
    .b { font-size: 1rem; line-height: 1.6; }
    .c { font-size: .8rem; color: #8b93a7; }
  </style>
</head>
<body>
  <div class="fx"><div class="r"><span class="d">Display</span><span class="s">2.44rem</span></div>
  <div class="r"><span class="h1">Heading 1</span><span class="s">1.95rem</span></div>
  <div class="r"><span class="h2">Heading 2</span><span class="s">1.56rem</span></div>
  <div class="r"><span class="h3">Heading 3</span><span class="s">1.25rem</span></div>
  <div class="r"><span class="b">Body text</span><span class="s">1rem</span></div>
  <div class="r"><span class="c">Caption</span><span class="s">0.8rem</span></div></div>
</body>
</html>
