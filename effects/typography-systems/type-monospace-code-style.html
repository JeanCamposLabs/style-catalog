  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 290px; font-size: .88rem; line-height: 1.65; color: #cbd5e1; }
    .fx code { padding: .1rem .35rem; border-radius: 5px; background: #1e2740; color: #b9a5ff;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .88em; }
    .fx pre { margin: .7rem 0 0; padding: .8rem; border-radius: 10px; background: #10141f; overflow-x: auto;
      font-family: ui-monospace, monospace; font-size: .78rem; line-height: 1.7; color: #c9d1d9; }
  </style>
