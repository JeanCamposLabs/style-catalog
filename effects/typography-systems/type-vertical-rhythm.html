<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vertical Rhythm</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "type-vertical-rhythm",
    "title": "Vertical Rhythm",
    "summary": "Baseline-consistent spacing from one unit.",
    "description": "Baseline-consistent spacing from one unit.",
    "theme": "typography-systems",
    "categories": ["typography", "reference"],
    "tags": ["typography", "type", "rhythm", "baseline", "spacing", "system"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Type systems must survive user font-size settings: size in rem, never lock line-height in px, and keep the measure under 75 characters.",
    "customization": [
      { "name": "--u", "description": "Rhythm unit", "default": "1.5rem" }
    ],
    "variations": ["Swap in your own scale", "Export as design tokens"],
    "ai_usage": "Long-form layouts. Derive every vertical space from one unit equal to the body line-height; ad-hoc margins are what make a page feel subtly wrong without an obvious cause."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 290px; --u: 1.5rem; }
    .fx * { margin: 0; }
    .fx h3 { font-size: 1.3rem; line-height: var(--u); margin-bottom: calc(var(--u) / 2); }
    .fx p { font-size: .88rem; line-height: var(--u); margin-bottom: var(--u); color: #8b93a7; }
    .fx .rule { height: 1px; background: #263149; margin-bottom: var(--u); }
  </style>
</head>
<body>
  <div class="fx"><h3>Vertical rhythm</h3><p>Every margin here is the rhythm unit or half of it.</p>
  <div class="rule"></div><p>Blocks land on a shared baseline, so the column reads as one system.</p></div>
</body>
</html>
