<head>

  <title>Font Pairing</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "type-pairing-serif-sans",
    "title": "Font Pairing",
    "summary": "A serif display paired with a sans body.",
    "description": "A serif display paired with a sans body.",
    "theme": "typography-systems",
    "categories": ["typography", "reference"],
    "tags": ["typography", "type", "pairing", "serif", "sans", "editorial"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Type systems must survive user font-size settings: size in rem, never lock line-height in px, and keep the measure under 75 characters.",
    "customization": [
      { "name": "--display", "description": "Display family", "default": "Georgia, serif" },
      { "name": "--body", "description": "Body family", "default": "system-ui" }
    ],
    "variations": ["Swap in your own scale", "Export as design tokens"],
    "ai_usage": "Editorial layouts. Pair fonts with contrasting structure but similar x-height; two faces from the same classification just look like a loading error."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 290px; }
    .fx h2 { margin: 0 0 .5rem; font-family: Georgia, "Times New Roman", serif; font-size: 1.7rem; line-height: 1.2; font-weight: 700; }
    .fx p { margin: 0 0 .8rem; font-family: system-ui, sans-serif; font-size: .9rem; line-height: 1.65; color: #8b93a7; max-width: 60ch; }
    .fx .meta { font-family: ui-monospace, monospace; font-size: .72rem; color: #64748b; letter-spacing: .04em; }
  </style>
</head>
<body>
  <article class="fx"><h2>The catalogue as a machine-readable museum</h2>
  <p>Serif display over sans body is the safest editorial pairing: high contrast in structure, similar rhythm in the line.</p>
  <div class="meta">4 MIN READ · SEPTEMBER 2026</div></article>
</body>
</html>
