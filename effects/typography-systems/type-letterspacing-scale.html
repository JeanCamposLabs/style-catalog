<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tracking Scale</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "type-letterspacing-scale",
    "title": "Tracking Scale",
    "summary": "Letter-spacing tuned per size.",
    "description": "Letter-spacing tuned per size.",
    "theme": "typography-systems",
    "categories": ["typography", "reference"],
    "tags": ["typography", "type", "tracking", "letter-spacing", "optical", "sizing"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Type systems must survive user font-size settings: size in rem, never lock line-height in px, and keep the measure under 75 characters.",
    "customization": [
      { "name": "--tight", "description": "Display tracking", "default": "-0.02em" },
      { "name": "--caps", "description": "Caps tracking", "default": "0.12em" }
    ],
    "variations": ["Swap in your own scale", "Export as design tokens"],
    "ai_usage": "Optical correction. Tighten tracking as size grows and open it for small caps; uniform letter-spacing across a scale always looks wrong at one end."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 290px; display: grid; gap: .7rem; }
    .fx .r { display: flex; align-items: baseline; justify-content: space-between; }
    .fx .s { font-size: .68rem; color: #64748b; font-family: ui-monospace, monospace; }
    .disp { font-size: 2rem; font-weight: 800; letter-spacing: -.02em; }
    .body { font-size: 1rem; letter-spacing: 0; }
    .caps { font-size: .74rem; text-transform: uppercase; letter-spacing: .12em; color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="fx"><div class="r"><span class="disp">Display</span><span class="s">-0.02em</span></div>
  <div class="r"><span class="body">Body copy</span><span class="s">0</span></div>
  <div class="r"><span class="caps">Small caps label</span><span class="s">+0.12em</span></div></div>
</body>
</html>
