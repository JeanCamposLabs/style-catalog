<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Responsive Heading Set</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "type-responsive-headings",
    "title": "Responsive Heading Set",
    "summary": "Headings that reflow without losing hierarchy.",
    "description": "Headings that reflow without losing hierarchy.",
    "theme": "typography-systems",
    "categories": ["typography", "reference"],
    "tags": ["typography", "type", "container-query", "cqi", "responsive", "headings"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Type systems must survive user font-size settings: size in rem, never lock line-height in px, and keep the measure under 75 characters.",
    "customization": [
      { "name": "--unit", "description": "Query unit", "default": "cqi" }
    ],
    "variations": ["Swap in your own scale", "Export as design tokens"],
    "ai_usage": "Components reused at different widths. Container query units (cqi) size type against the component, not the viewport — the fix for a card that is wide on desktop and narrow in a sidebar."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 290px; container-type: inline-size; }
    .fx h2 { margin: 0 0 .3rem; font-size: clamp(1.3rem, 5cqi, 2rem); line-height: 1.2; }
    .fx h3 { margin: 0 0 .5rem; font-size: clamp(1rem, 3.4cqi, 1.3rem); color: #cbd5e1; }
    .fx p { margin: 0; font-size: .85rem; line-height: 1.6; color: #8b93a7; }
  </style>
</head>
<body>
  <div class="fx"><h2>Container-relative headings</h2><h3>Sized against the component</h3>
  <p>Using cqi instead of vw means this card types correctly whether it is full-width or in a narrow rail.</p></div>
</body>
</html>
