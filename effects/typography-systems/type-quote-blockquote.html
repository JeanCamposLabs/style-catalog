<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blockquote Styling</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "type-quote-blockquote",
    "title": "Blockquote Styling",
    "summary": "A pull quote with attribution.",
    "description": "A pull quote with attribution.",
    "theme": "typography-systems",
    "categories": ["typography", "reference"],
    "tags": ["typography", "type", "blockquote", "quote", "attribution", "editorial"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Type systems must survive user font-size settings: size in rem, never lock line-height in px, and keep the measure under 75 characters.",
    "customization": [
      { "name": "--c", "description": "Rule colour", "default": "#7c5cff" }
    ],
    "variations": ["Swap in your own scale", "Export as design tokens"],
    "ai_usage": "Editorial quotes. Use <blockquote> with <cite> for the source; a styled <p> loses the semantic relationship between the quote and its attribution."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 290px; padding-left: 1rem; border-left: 3px solid #7c5cff; }
    .fx blockquote { margin: 0; font-size: 1.05rem; line-height: 1.55; color: #e7ebf3; font-style: italic; }
    .fx cite { display: block; margin-top: .6rem; font-size: .8rem; font-style: normal; color: #8b93a7; }
    .fx cite b { color: #cbd5e1; font-style: normal; }
  </style>
</head>
<body>
  <figure class="fx" style="margin:0"><blockquote>The best interface is the one that disappears once you know what to do.</blockquote>
  <cite><b>Ada Lovelace</b> · Design notes</cite></figure>
</body>
</html>
