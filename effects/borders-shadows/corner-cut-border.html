<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cut Corner Frame</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "corner-cut-border",
    "title": "Cut Corner Frame",
    "summary": "A panel with clipped corners and a matching outline.",
    "description": "Two stacked clip-path shapes — one for the border colour, one inset for the fill — produce a chamfered frame.",
    "theme": "borders-shadows",
    "categories": ["border", "shape"],
    "tags": ["clip-path", "chamfer", "cut-corner", "tech", "frame"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative edge treatment — never encode meaning in the border colour alone. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Border color", "default": "#2dd4bf" },
      { "name": "--cut", "description": "Corner cut", "default": "18px" }
    ],
    "variations": ["Cut only two corners", "Animate the cut size", "Notch instead of a chamfer"],
    "ai_usage": "Sci-fi, gaming, and technical UIs. Use a wrapper with the border colour and clip-path, and an inner element with the same clip and a slightly smaller box — CSS borders cannot follow a clip-path."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .demo { width: 260px; padding: 1.6rem; color: #e7ebf3; }
    .demo h3 { margin: 0 0 .4rem; font-size: 1.05rem; }
    .demo p { margin: 0; color: #8b93a7; font-size: .88rem; }
    :root { --c: #2dd4bf; --cut: 18px; }
    .frame { background: var(--c); padding: 2px;
      clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)); }
    .demo { background: #10141f;
      clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)); }
  </style>
</head>
<body>
  <div class="frame"><div class="demo"><h3>Chamfered</h3><p>Clip-path frame with a matching fill.</p></div></div>
</body>
</html>
