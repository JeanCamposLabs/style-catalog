<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Corner Accent Rules</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "corner-accent-border",
    "title": "Corner Accent Rules",
    "summary": "Short rules mark only the corners of the panel.",
    "description": "Four small gradient layers positioned at the corners suggest a frame without enclosing the content.",
    "theme": "borders-shadows",
    "categories": ["border"],
    "tags": ["corners", "accent", "minimal", "frame", "technical"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative edge treatment — never encode meaning in the border colour alone. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Accent color", "default": "#2dd4bf" },
      { "name": "--len", "description": "Rule length", "default": "22px" }
    ],
    "variations": ["Longer rules for a full frame", "Animate the rules on hover", "Single corner accent"],
    "ai_usage": "HUDs, viewfinders, and technical panels. Four background-image layers with explicit background-position keep it to one element; each layer is a small linear-gradient sized to --len."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .demo { width: 260px; padding: 1.6rem; color: #e7ebf3; }
    .demo h3 { margin: 0 0 .4rem; font-size: 1.05rem; }
    .demo p { margin: 0; color: #8b93a7; font-size: .88rem; }
    :root { --c: #2dd4bf; --len: 22px; }
    .demo { position: relative; background: #10141f; }
    .demo::before, .demo::after, .demo > span::before, .demo > span::after { content: ""; position: absolute; width: var(--len); height: var(--len); }
    .demo::before { top: 0; left: 0; border-top: 2px solid var(--c); border-left: 2px solid var(--c); }
    .demo::after { top: 0; right: 0; border-top: 2px solid var(--c); border-right: 2px solid var(--c); }
    .demo > span::before { bottom: 0; left: 0; border-bottom: 2px solid var(--c); border-left: 2px solid var(--c); }
    .demo > span::after { bottom: 0; right: 0; border-bottom: 2px solid var(--c); border-right: 2px solid var(--c); }
  </style>
</head>
<body>
  <div class="demo"><span aria-hidden="true"></span><h3>Target locked</h3><p>Corner rules only.</p></div>
</body>
</html>
