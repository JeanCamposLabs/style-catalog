<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Concentric Rings</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "multi-ring-focus",
    "title": "Concentric Rings",
    "summary": "Three rings of decreasing opacity radiate from the box.",
    "description": "Stacked box-shadow spreads without blur produce hard concentric rings that read as a focus halo.",
    "theme": "borders-shadows",
    "categories": ["border"],
    "tags": ["rings", "halo", "focus", "concentric", "attention"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative edge treatment — never encode meaning in the border colour alone. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Ring color", "default": "#7c5cff" }
    ],
    "variations": ["Animate the rings outward", "Single ring for focus states", "Colour-coded rings by severity"],
    "ai_usage": "Onboarding highlights and focus targets. Use spread-only shadows (no blur) with decreasing alpha; blurred rings merge into a glow and lose the concentric read."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .demo { width: 260px; padding: 1.6rem; color: #e7ebf3; }
    .demo h3 { margin: 0 0 .4rem; font-size: 1.05rem; }
    .demo p { margin: 0; color: #8b93a7; font-size: .88rem; }
    :root { --c: #7c5cff; }
    .demo { background: #151b2a; border-radius: 16px;
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 45%, transparent),
        0 0 0 10px color-mix(in srgb, var(--c) 22%, transparent),
        0 0 0 18px color-mix(in srgb, var(--c) 10%, transparent); }
  </style>
</head>
<body>
  <div class="demo"><h3>Look here</h3><p>Concentric attention rings.</p></div>
</body>
</html>
