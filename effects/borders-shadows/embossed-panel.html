<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Embossed Panel</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "embossed-panel",
    "title": "Embossed Panel",
    "summary": "A panel that appears pressed out of the surface.",
    "description": "Opposing inset shadows on two corners give the raised read; the same pair reversed makes it sunken.",
    "theme": "borders-shadows",
    "categories": ["shadow", "skeuomorphic"],
    "tags": ["emboss", "inset", "soft-ui", "surface", "light"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative edge treatment — never encode meaning in the border colour alone. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--light", "description": "Highlight", "default": "rgba(255,255,255,.06)" },
      { "name": "--dark", "description": "Shade", "default": "rgba(0,0,0,.5)" }
    ],
    "variations": ["Deboss variant", "Stronger light for plastic", "Coloured highlight for tinted surfaces"],
    "ai_usage": "Soft-UI surfaces. Keep both shadows subtle and equal in magnitude; asymmetric strengths make the panel look tilted rather than raised."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .demo { width: 260px; padding: 1.6rem; color: #e7ebf3; }
    .demo h3 { margin: 0 0 .4rem; font-size: 1.05rem; }
    .demo p { margin: 0; color: #8b93a7; font-size: .88rem; }
    :root { --light: rgba(255,255,255,.06); --dark: rgba(0,0,0,.5); }
    .demo { background: #171d2b; border-radius: 18px;
      box-shadow: inset 2px 2px 6px var(--light), inset -3px -3px 8px var(--dark), 0 12px 28px rgba(0,0,0,.35); }
  </style>
</head>
<body>
  <div class="demo"><h3>Embossed</h3><p>Raised out of the surface.</p></div>
</body>
</html>
