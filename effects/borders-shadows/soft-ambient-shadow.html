<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ambient Occlusion Shadow</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "soft-ambient-shadow",
    "title": "Ambient Occlusion Shadow",
    "summary": "A tight contact shadow plus a wide ambient one.",
    "description": "Two shadows model the two real components of shading: a dark contact line and a broad ambient falloff.",
    "theme": "borders-shadows",
    "categories": ["shadow"],
    "tags": ["ambient", "contact-shadow", "realistic", "depth", "elevation"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative edge treatment — never encode meaning in the border colour alone. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--contact", "description": "Contact strength", "default": "0.5" },
      { "name": "--ambient", "description": "Ambient strength", "default": "0.25" }
    ],
    "variations": ["Raise the element and widen both", "Warm ambient tint", "Remove the contact shadow for a floating look"],
    "ai_usage": "Realistic elevation in design systems. Ship two tokens per elevation level — a tight, dark contact shadow and a wide, faint ambient one; a single shadow can never do both jobs."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .demo { width: 260px; padding: 1.6rem; color: #e7ebf3; }
    .demo h3 { margin: 0 0 .4rem; font-size: 1.05rem; }
    .demo p { margin: 0; color: #8b93a7; font-size: .88rem; }
    :root { --contact: .5; --ambient: .25; }
    .demo { background: #151b2a; border-radius: 16px;
      box-shadow: 0 1px 2px rgba(2,6,23,var(--contact)), 0 20px 50px -12px rgba(2,6,23,var(--ambient)); }
  </style>
</head>
<body>
  <div class="demo"><h3>Two shadows</h3><p>Contact plus ambient.</p></div>
</body>
</html>
