<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gradient Drop Shadow</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "gradient-shadow-glow",
    "title": "Gradient Drop Shadow",
    "summary": "A blurred copy of the element's gradient acts as its shadow.",
    "description": "A duplicate layer behind the card, blurred and slightly scaled, tints the shadow with the surface's own colours.",
    "theme": "borders-shadows",
    "categories": ["shadow"],
    "tags": ["gradient", "glow", "shadow", "color", "hero"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative edge treatment — never encode meaning in the border colour alone. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--blur", "description": "Shadow blur", "default": "28px" },
      { "name": "--drop", "description": "Shadow offset", "default": "18px" }
    ],
    "variations": ["Stronger drop for a floating feel", "Match the shadow to the dominant colour only", "Animate on hover"],
    "ai_usage": "Colourful cards and CTAs. Reuse the same gradient on a blurred pseudo-element rather than guessing a shadow colour — the tint always matches, even when the gradient changes."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .demo { width: 260px; padding: 1.6rem; color: #e7ebf3; }
    .demo h3 { margin: 0 0 .4rem; font-size: 1.05rem; }
    .demo p { margin: 0; color: #8b93a7; font-size: .88rem; }
    :root { --blur: 28px; --drop: 18px; }
    .wrap { position: relative; }
    .wrap::before { content: ""; position: absolute; inset: 0; border-radius: 18px; transform: translateY(var(--drop)) scale(.92);
      background: linear-gradient(135deg, #7c5cff, #2dd4bf); filter: blur(var(--blur)); opacity: .8; }
    .demo { position: relative; border-radius: 18px; background: linear-gradient(135deg, #7c5cff, #2dd4bf); color: #0b0d12; }
    .demo p { color: rgba(11,13,18,.7); }
  </style>
</head>
<body>
  <div class="wrap"><div class="demo"><h3>Gradient shadow</h3><p>The shadow borrows the surface colours.</p></div></div>
</body>
</html>
