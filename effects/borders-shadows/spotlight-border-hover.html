<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spotlight Border</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "spotlight-border-hover",
    "title": "Spotlight Border",
    "summary": "A soft light rides the border on hover.",
    "description": "A masked gradient ring reveals only a portion of a rotating conic sweep, so the highlight appears to travel the edge.",
    "theme": "borders-shadows",
    "categories": ["border", "hover"],
    "tags": ["hover", "conic-gradient", "mask", "highlight", "card"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative edge treatment — never encode meaning in the border colour alone. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Highlight", "default": "#7c5cff" },
      { "name": "--dur", "description": "Lap time", "default": "3s" }
    ],
    "variations": ["Always-on for a live card", "Slower sweep for calm", "Two highlights opposite each other"],
    "ai_usage": "Premium card grids. The mask-composite:xor trick confines a full-size gradient to the border ring; without it the gradient washes over the card's content."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .demo { width: 260px; padding: 1.6rem; color: #e7ebf3; }
    .demo h3 { margin: 0 0 .4rem; font-size: 1.05rem; }
    .demo p { margin: 0; color: #8b93a7; font-size: .88rem; }
    :root { --c: #7c5cff; --dur: 3s; }
    .sb { position: relative; border-radius: 16px; background: #151b2a; }
    .sb::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; opacity: 0;
      background: conic-gradient(from 0deg, transparent 0 70%, var(--c) 85%, transparent);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude; transition: opacity .3s;
      animation: spin var(--dur) linear infinite; }
    .sb:hover::before { opacity: 1; }
    @keyframes spin { to { transform: rotate(1turn); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="sb"><div class="demo"><h3>Hover me</h3><p>Light travels the border.</p></div></div>
</body>
</html>
