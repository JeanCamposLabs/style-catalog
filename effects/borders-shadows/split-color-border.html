<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Split Colour Border</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "split-color-border",
    "title": "Split Colour Border",
    "summary": "Each edge of the box carries a different colour.",
    "description": "Four border-*-color declarations turn the box's mitred corners into a diagonal colour transition.",
    "theme": "borders-shadows",
    "categories": ["border"],
    "tags": ["multicolor", "border", "mitre", "playful", "frame"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative edge treatment — never encode meaning in the border colour alone. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--w", "description": "Border width", "default": "6px" }
    ],
    "variations": ["Two colours on opposite edges", "Animate a hue rotation", "Thicker border to emphasise the mitres"],
    "ai_usage": "Playful cards and category coding. The mitred corner join is the point of the effect — use a thick border (5px+) or the diagonal transitions are invisible."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .demo { width: 260px; padding: 1.6rem; color: #e7ebf3; }
    .demo h3 { margin: 0 0 .4rem; font-size: 1.05rem; }
    .demo p { margin: 0; color: #8b93a7; font-size: .88rem; }
    :root { --w: 6px; }
    .demo { border: var(--w) solid; border-color: #7c5cff #2dd4bf #f472b6 #fbbf24; border-radius: 6px; background: #10141f; }
  </style>
</head>
<body>
  <div class="demo"><h3>Four edges</h3><p>Colours meet at the mitres.</p></div>
</body>
</html>
