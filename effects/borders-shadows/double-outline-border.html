<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Double Outline</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "double-outline-border",
    "title": "Double Outline",
    "summary": "An outline and a border sit at different offsets for a framed edge.",
    "description": "outline-offset lets a second ring float away from the box without any extra element.",
    "theme": "borders-shadows",
    "categories": ["border"],
    "tags": ["outline", "offset", "double", "frame", "minimal"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative edge treatment — never encode meaning in the border colour alone. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--c1", "description": "Inner border", "default": "#7c5cff" },
      { "name": "--c2", "description": "Outer ring", "default": "#2dd4bf" },
      { "name": "--gap", "description": "Ring gap", "default": "6px" }
    ],
    "variations": ["Dashed outer ring", "Animate the gap on hover", "Three rings for a target motif"],
    "ai_usage": "Cheap framed cards and focus treatments. outline-offset never affects layout, so the outer ring can float freely without changing the element's box."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .demo { width: 260px; padding: 1.6rem; color: #e7ebf3; }
    .demo h3 { margin: 0 0 .4rem; font-size: 1.05rem; }
    .demo p { margin: 0; color: #8b93a7; font-size: .88rem; }
    :root { --c1: #7c5cff; --c2: #2dd4bf; --gap: 6px; }
    .demo { border: 2px solid var(--c1); border-radius: 14px; outline: 2px solid var(--c2); outline-offset: var(--gap); }
  </style>
</head>
<body>
  <div class="demo"><h3>Double outline</h3><p>Border plus an offset outline.</p></div>
</body>
</html>
