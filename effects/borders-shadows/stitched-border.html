<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stitched Edge</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "stitched-border",
    "title": "Stitched Edge",
    "summary": "A dashed inner rule imitates thread stitching on a panel.",
    "description": "An inset dashed border set inside a solid fill reads as stitching, especially with a leather-like ground.",
    "theme": "borders-shadows",
    "categories": ["border", "skeuomorphic"],
    "tags": ["stitch", "thread", "leather", "skeuomorphic", "craft"],
    "tech": ["css"],
    "era": "2000s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative edge treatment — never encode meaning in the border colour alone. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--thread", "description": "Thread color", "default": "#fbbf24" },
      { "name": "--inset", "description": "Stitch inset", "default": "10px" }
    ],
    "variations": ["Zigzag stitch with a repeating gradient", "Contrast thread colour", "Add a subtle leather grain"],
    "ai_usage": "Skeuomorphic and craft-themed UIs. Use a pseudo-element inset from the edge rather than a second border, so the stitch line can sit any distance from the panel edge."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .demo { width: 260px; padding: 1.6rem; color: #e7ebf3; }
    .demo h3 { margin: 0 0 .4rem; font-size: 1.05rem; }
    .demo p { margin: 0; color: #8b93a7; font-size: .88rem; }
    :root { --thread: #fbbf24; --inset: 10px; }
    .demo { position: relative; background: #2a1c14; border-radius: 12px; }
    .demo::after { content: ""; position: absolute; inset: var(--inset); border: 2px dashed var(--thread); border-radius: 8px; opacity: .8; }
  </style>
</head>
<body>
  <div class="demo"><h3>Stitched</h3><p>Thread inset from the edge.</p></div>
</body>
</html>
