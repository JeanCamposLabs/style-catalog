<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Conic Gradient Border</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "gradient-border-conic",
    "title": "Conic Gradient Border",
    "summary": "A full rainbow sweep confined to the border ring.",
    "description": "A conic gradient behind a mask that keeps only the padding area visible produces a true gradient border.",
    "theme": "borders-shadows",
    "categories": ["border"],
    "tags": ["conic-gradient", "mask", "rainbow", "border", "modern"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative edge treatment — never encode meaning in the border colour alone. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--w", "description": "Border width", "default": "2px" }
    ],
    "variations": ["Two-colour sweep", "Animate the angle", "Thicker ring for a frame"],
    "ai_usage": "The portable gradient-border recipe: padding + background gradient + mask-composite exclude. Change --w alone to thicken the ring; the mask uses the same padding value automatically."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .demo { width: 260px; padding: 1.6rem; color: #e7ebf3; }
    .demo h3 { margin: 0 0 .4rem; font-size: 1.05rem; }
    .demo p { margin: 0; color: #8b93a7; font-size: .88rem; }
    :root { --w: 2px; }
    .cg { position: relative; border-radius: 16px; padding: var(--w);
      background: conic-gradient(from 0deg, #7c5cff, #2dd4bf, #f472b6, #fbbf24, #7c5cff); }
    .demo { background: #10141f; border-radius: 14px; }
  </style>
</head>
<body>
  <div class="cg"><div class="demo"><h3>Full sweep</h3><p>Conic gradient, masked to the edge.</p></div></div>
</body>
</html>
