<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pulsing Border Glow</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "glow-pulse-border",
    "title": "Pulsing Border Glow",
    "summary": "The border breathes between dim and bright.",
    "description": "Animating only box-shadow spread and colour keeps the geometry static, so nothing reflows during the pulse.",
    "theme": "borders-shadows",
    "categories": ["border", "glow"],
    "tags": ["pulse", "glow", "attention", "animated", "status"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative edge treatment — never encode meaning in the border colour alone. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Glow color", "default": "#34d399" },
      { "name": "--dur", "description": "Pulse period", "default": "2s" }
    ],
    "variations": ["Red for an error state", "Faster pulse for urgency", "Single pulse on state change"],
    "ai_usage": "Live and recording indicators. Animate box-shadow, never width or padding — a pulsing border-width forces layout on every frame."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .demo { width: 260px; padding: 1.6rem; color: #e7ebf3; }
    .demo h3 { margin: 0 0 .4rem; font-size: 1.05rem; }
    .demo p { margin: 0; color: #8b93a7; font-size: .88rem; }
    :root { --c: #34d399; --dur: 2s; }
    .demo { border: 1px solid var(--c); border-radius: 14px; background: #0f1a17; animation: pulse var(--dur) ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 55%, transparent); }
      50% { box-shadow: 0 0 0 10px color-mix(in srgb, var(--c) 0%, transparent); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="demo"><h3>Live</h3><p>Recording in progress.</p></div>
</body>
</html>
