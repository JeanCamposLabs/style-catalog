<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Relative Time</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "relative-time-list",
    "title": "Relative Time",
    "summary": "Timestamps shown as human-relative strings.",
    "description": "Timestamps shown as human-relative strings.",
    "theme": "calendar-time",
    "categories": ["calendar", "time"],
    "tags": ["calendar", "date", "relative-time", "timestamps", "human", "list"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Dates need machine-readable markup (<time datetime>) and selected days must be announced, not just highlighted.",
    "customization": [
      { "name": "--c", "description": "Time colour", "default": "#8b93a7" }
    ],
    "variations": ["Adapt to a light theme", "Compact variant for dense lists"],
    "ai_usage": "Feeds and activity logs. Put the absolute timestamp in the datetime attribute and a title so hovering reveals the exact time — relative-only stamps are useless in support threads."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 270px; font-size: .86rem; }
    .r { display: flex; justify-content: space-between; padding: .5rem .7rem; border-radius: 9px; color: #cbd5e1; }
    .r:hover { background: #151b2a; }
    .r time { color: #8b93a7; font-size: .78rem; }
  </style>
</head>
<body>
  <div class="fx"><div class="r"><span>Deployed to production</span><time datetime="2026-09-10T12:04" title="10 Sept 2026, 12:04">4m ago</time></div>
  <div class="r"><span>Merged pull request</span><time datetime="2026-09-10T09:12" title="10 Sept 2026, 09:12">3h ago</time></div>
  <div class="r"><span>Opened issue</span><time datetime="2026-09-08T16:40" title="8 Sept 2026, 16:40">2d ago</time></div></div>
</body>
</html>
