<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Day Schedule</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "day-schedule-column",
    "title": "Day Schedule",
    "summary": "An hour grid with positioned events.",
    "description": "An hour grid with positioned events.",
    "theme": "calendar-time",
    "categories": ["calendar", "time"],
    "tags": ["calendar", "date", "schedule", "agenda", "day", "events"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Dates need machine-readable markup (<time datetime>) and selected days must be announced, not just highlighted.",
    "customization": [
      { "name": "--c", "description": "Event colour", "default": "#7c5cff" }
    ],
    "variations": ["Adapt to a light theme", "Compact variant for dense lists"],
    "ai_usage": "Calendar day views. Position events by minute offset (top = minutes × pxPerMinute) rather than by row, so overlapping meetings can be laid out side by side."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 250px; height: 220px; border-radius: 14px; background: #151b2a; border: 1px solid #263149;
      overflow: hidden; font-size: .74rem; }
    .fx .hours { position: absolute; inset: 0; }
    .fx .hours div { height: 44px; border-bottom: 1px solid #1e2740; padding-left: .5rem; color: #64748b; }
    .fx .ev { position: absolute; left: 44px; right: 8px; border-radius: 8px; padding: .35rem .5rem; color: #fff; font-weight: 600; }
    .fx .now { position: absolute; left: 0; right: 0; height: 2px; background: #f87171; }
    .fx .now::before { content: ""; position: absolute; left: 38px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: #f87171; }
  </style>
</head>
<body>
  <div class="fx"><div class="hours"><div>09</div><div>10</div><div>11</div><div>12</div><div>13</div></div>
  <div class="ev" style="top:24px;height:38px;background:#7c5cff">Standup</div>
  <div class="ev" style="top:96px;height:60px;background:#0f766e">Design review</div>
  <div class="now" style="top:132px"></div></div>
</body>
</html>
