<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Analog Clock</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "analog-clock-face",
    "title": "Analog Clock",
    "summary": "A clock with hands driven by the real time.",
    "description": "A clock with hands driven by the real time.",
    "theme": "calendar-time",
    "categories": ["calendar", "time"],
    "tags": ["calendar", "date", "clock", "analog", "hands", "time"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Dates need machine-readable markup (<time datetime>) and selected days must be announced, not just highlighted.",
    "customization": [
      { "name": "--c", "description": "Second hand", "default": "#f87171" }
    ],
    "variations": ["Adapt to a light theme", "Compact variant for dense lists"],
    "ai_usage": "Dashboards and world clocks. Set the hand rotations from Date once and let CSS animate, rather than re-rendering every second in JS."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 140px; aspect-ratio: 1; border-radius: 50%; border: 3px solid #2b3450;
      background: radial-gradient(circle, #151b2a, #10141f); }
    .fx i { position: absolute; left: 50%; bottom: 50%; transform-origin: 50% 100%; border-radius: 3px; }
    .fx .h { width: 5px; height: 34px; margin-left: -2.5px; background: #e7ebf3; }
    .fx .m { width: 3px; height: 48px; margin-left: -1.5px; background: #cbd5e1; }
    .fx .s { width: 2px; height: 54px; margin-left: -1px; background: #f87171; }
    .fx .pin { position: absolute; inset: 50% auto auto 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px;
      border-radius: 50%; background: #f87171; }
    .fx .tick { position: absolute; left: 50%; top: 4px; width: 2px; height: 7px; background: #3b465e;
      transform-origin: 50% 62px; }
  </style>
</head>
<body>
  <div class="fx" role="img" aria-label="Analog clock" id="clk">
    <i class="h"></i><i class="m"></i><i class="s"></i><span class="pin"></span></div>
  <script>
    (function () {
      var c = document.getElementById("clk");
      for (var k = 0; k < 12; k++) {
        var t = document.createElement("span");
        t.className = "tick"; t.style.transform = "rotate(" + k * 30 + "deg)";
        c.appendChild(t);
      }
      function tick() {
        var d = new Date();
        c.querySelector(".h").style.transform = "rotate(" + ((d.getHours() % 12) * 30 + d.getMinutes() * .5) + "deg)";
        c.querySelector(".m").style.transform = "rotate(" + d.getMinutes() * 6 + "deg)";
        c.querySelector(".s").style.transform = "rotate(" + d.getSeconds() * 6 + "deg)";
      }
      tick(); setInterval(tick, 1000);
    })();
  </script>
</body>
</html>
