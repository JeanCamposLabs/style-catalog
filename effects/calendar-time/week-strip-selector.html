<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week Strip</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "week-strip-selector",
    "title": "Week Strip",
    "summary": "A horizontal week selector with the active day marked.",
    "description": "A horizontal week selector with the active day marked.",
    "theme": "calendar-time",
    "categories": ["calendar", "time"],
    "tags": ["calendar", "date", "week", "strip", "selector", "mobile"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Dates need machine-readable markup (<time datetime>) and selected days must be announced, not just highlighted.",
    "customization": [
      { "name": "--c", "description": "Active colour", "default": "#7c5cff" }
    ],
    "variations": ["Adapt to a light theme", "Compact variant for dense lists"],
    "ai_usage": "Mobile agendas. The dot marks days with events; it must have a text equivalent in the day's accessible name."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: flex; gap: 6px; }
    .d { width: 42px; padding: .5rem 0; border-radius: 12px; border: 1px solid #263149; background: #151b2a; text-align: center;
      color: #8b93a7; font: inherit; cursor: pointer; }
    .d .w { font-size: .64rem; letter-spacing: .06em; }
    .d .n { font-size: 1rem; font-weight: 800; color: #cbd5e1; }
    .d[aria-pressed="true"] { background: #7c5cff; border-color: #7c5cff; color: #fff; }
    .d[aria-pressed="true"] .n { color: #fff; }
    .d .dot { display: block; width: 5px; height: 5px; border-radius: 50%; background: #2dd4bf; margin: 3px auto 0; }
  </style>
</head>
<body>
  <div class="fx" role="group" aria-label="Select day">
    <button class="d" type="button" aria-pressed="false"><span class="w">MON</span><span class="n">8</span></button>
    <button class="d" type="button" aria-pressed="false"><span class="w">TUE</span><span class="n">9</span><span class="dot"></span></button>
    <button class="d" type="button" aria-pressed="true"><span class="w">WED</span><span class="n">10</span><span class="dot"></span></button>
    <button class="d" type="button" aria-pressed="false"><span class="w">THU</span><span class="n">11</span></button>
    <button class="d" type="button" aria-pressed="false"><span class="w">FRI</span><span class="n">12</span></button></div>
</body>
</html>
