<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Countdown Timer</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "countdown-timer-units",
    "title": "Countdown Timer",
    "summary": "Days, hours, minutes, and seconds in separate tiles.",
    "description": "Days, hours, minutes, and seconds in separate tiles.",
    "theme": "calendar-time",
    "categories": ["calendar", "time"],
    "tags": ["calendar", "date", "countdown", "timer", "units", "launch"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Dates need machine-readable markup (<time datetime>) and selected days must be announced, not just highlighted.",
    "customization": [
      { "name": "--c", "description": "Tile background", "default": "#151b2a" }
    ],
    "variations": ["Adapt to a light theme", "Compact variant for dense lists"],
    "ai_usage": "Launches and deadlines. tabular-nums stops the tiles from resizing as digits change; drive the values from a timestamp, never from a client-side counter that drifts."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: flex; gap: 8px; }
    .u { width: 62px; padding: .7rem .3rem; border-radius: 12px; background: #151b2a; border: 1px solid #263149; text-align: center; }
    .u .n { font-size: 1.5rem; font-weight: 900; font-variant-numeric: tabular-nums; }
    .u .l { font-size: .64rem; text-transform: uppercase; letter-spacing: .08em; color: #8b93a7; }
  </style>
</head>
<body>
  <div class="fx" role="timer" aria-label="4 days 12 hours 38 minutes remaining">
    <div class="u"><div class="n">04</div><div class="l">Days</div></div>
    <div class="u"><div class="n">12</div><div class="l">Hrs</div></div>
    <div class="u"><div class="n">38</div><div class="l">Min</div></div>
    <div class="u"><div class="n">07</div><div class="l">Sec</div></div></div>
</body>
</html>
