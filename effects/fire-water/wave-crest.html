<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ocean Waves</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "wave-crest",
    "title": "Ocean Waves",
    "summary": "Layered waves rolling across the frame.",
    "description": "Layered waves rolling across the frame.",
    "theme": "fire-water",
    "categories": ["elemental", "animation"],
    "tags": ["elemental", "animated", "waves", "ocean", "sea", "layers"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Elemental loops are decorative and must stop entirely under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Wave colour", "default": "#0ea5e9" }
    ],
    "variations": ["Retune the palette", "Adjust the loop duration"],
    "ai_usage": "Sea and pool themes. Rotating wide flattened ellipses is far cheaper than animating SVG paths and reads identically at small sizes."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 280px; height: 150px; border-radius: 14px; overflow: hidden;
      background: linear-gradient(180deg, #0c4a6e, #082f49); }
    .fx i { position: absolute; bottom: var(--b); left: -50%; width: 200%; height: 60px; border-radius: 45%;
      background: var(--c); animation: roll var(--d) linear infinite; }
    @keyframes roll { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx"><i style="--b:-40px;--c:rgba(14,165,233,.4);--d:9s"></i><i style="--b:-52px;--c:rgba(56,189,248,.55);--d:12s"></i>
  <i style="--b:-64px;--c:#38bdf8;--d:15s"></i></div>
</body>
</html>
