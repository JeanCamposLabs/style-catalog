<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flickering Flame</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "flame-flicker",
    "title": "Flickering Flame",
    "summary": "A candle flame with an inner core and a wobble.",
    "description": "A candle flame with an inner core and a wobble.",
    "theme": "fire-water",
    "categories": ["elemental", "animation"],
    "tags": ["elemental", "animated", "flame", "candle", "flicker", "fire"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Elemental loops are decorative and must stop entirely under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Flame colour", "default": "#f97316" }
    ],
    "variations": ["Retune the palette", "Adjust the loop duration"],
    "ai_usage": "Candles, streaks, and heat indicators. Animate the core out of phase with the outer flame — synchronised layers look like a pulsing blob."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 70px; height: 110px; display: grid; place-items: end center; }
    .fx .fl { width: 46px; height: 84px; border-radius: 50% 50% 40% 40% / 70% 70% 30% 30%;
      background: linear-gradient(180deg, #fef08a, #f97316 45%, #dc2626);
      box-shadow: 0 0 30px rgba(249,115,22,.7); animation: flick .35s ease-in-out infinite alternate; }
    .fx .core { position: absolute; bottom: 12px; width: 20px; height: 40px; border-radius: 50% 50% 40% 40% / 70% 70% 30% 30%;
      background: #fff7ed; opacity: .85; animation: flick .28s ease-in-out infinite alternate-reverse; }
    @keyframes flick { from { transform: scale(1) skewX(-2deg); } to { transform: scale(1.06, .96) skewX(3deg); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx"><span class="fl"></span><span class="core"></span></div>
</body>
</html>
