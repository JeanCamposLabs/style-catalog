<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Freezing Panel</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "frost-freeze-panel",
    "title": "Freezing Panel",
    "summary": "Frost creeping across a surface.",
    "description": "Frost creeping across a surface.",
    "theme": "fire-water",
    "categories": ["elemental", "animation"],
    "tags": ["elemental", "animated", "frost", "freeze", "ice", "creep"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Elemental loops are decorative and must stop entirely under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Frost colour", "default": "rgba(224,242,254,.5)" }
    ],
    "variations": ["Retune the palette", "Adjust the loop duration"],
    "ai_usage": "Cold, locked, or frozen states. Reveal the frost with a clip-path wipe rather than fading it in — real frost spreads from an edge."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 240px; height: 150px; border-radius: 14px; overflow: hidden;
      background: linear-gradient(160deg, #1e3a5f, #0c1a2b); }
    .fx::after { content: ""; position: absolute; inset: 0;
      background-image: radial-gradient(circle at 12% 20%, rgba(224,242,254,.5) 0 8%, transparent 9%),
        radial-gradient(circle at 78% 30%, rgba(224,242,254,.4) 0 10%, transparent 11%),
        radial-gradient(circle at 40% 76%, rgba(224,242,254,.45) 0 12%, transparent 13%);
      clip-path: inset(0 100% 0 0); animation: creep 5s ease-in-out infinite alternate; }
    @keyframes creep { to { clip-path: inset(0 0 0 0); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx"></div>
</body>
</html>
