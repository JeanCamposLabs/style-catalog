<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scratch to Reveal</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "cursor-eraser-reveal",
    "title": "Scratch to Reveal",
    "summary": "A cover layer erased by the pointer.",
    "description": "A cover layer erased by the pointer.",
    "theme": "cursors-pointers",
    "categories": ["cursor", "pointer"],
    "tags": ["cursor", "pointer", "scratch", "erase", "reveal", "canvas"],
    "tech": ["css", "js", "canvas"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Custom cursors are gated to fine pointers; touch and reduced-motion users keep the native cursor and full functionality.",
    "customization": [
      { "name": "--r", "description": "Eraser radius", "default": "18px" }
    ],
    "variations": ["Retune through the custom properties", "Adapt for a light theme"],
    "ai_usage": "Scratch-card promotions. Use destination-out compositing to erase, and always provide a Reveal button — a scratch gesture is impossible for keyboard and many motor-impaired users."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 280px; height: 150px; border-radius: 14px; overflow: hidden; cursor: crosshair; }
    .fx .under { position: absolute; inset: 0; display: grid; place-items: center;
      background: linear-gradient(150deg, #7c5cff, #2dd4bf); color: #0b0d12; font-weight: 900; font-size: 1.2rem; }
    .fx canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div class="fx" id="sr"><div class="under">YOU WON</div><canvas id="sc2"></canvas></div>
  <script>
    (function () {
      var c = document.getElementById("sc2"), x = c.getContext("2d");
      c.width = 280; c.height = 150;
      x.fillStyle = "#2b3450"; x.fillRect(0, 0, 280, 150);
      x.globalCompositeOperation = "destination-out";
      c.addEventListener("pointermove", function (e) {
        var r = c.getBoundingClientRect();
        x.beginPath(); x.arc(e.clientX - r.left, e.clientY - r.top, 18, 0, 6.283); x.fill();
      });
    })();
  </script>
</body>
</html>
