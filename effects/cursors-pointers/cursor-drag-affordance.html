<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drag Affordance Cursor</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "cursor-drag-affordance",
    "title": "Drag Affordance Cursor",
    "summary": "A carousel whose cursor becomes a two-way drag arrow inside it.",
    "description": "The affordance appears only within the draggable region and rotates to match the drag axis.",
    "theme": "cursors-pointers",
    "categories": ["cursor", "drag"],
    "tags": ["drag", "carousel", "affordance", "cursor", "gallery"],
    "tech": ["css", "js"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Custom cursors are gated to fine pointers; touch and reduced-motion users keep the native cursor and full functionality.",
    "customization": [
      { "name": "--c", "description": "Cursor color", "default": "#e7ebf3" }
    ],
    "variations": ["Grabbing state while the button is down", "Vertical drag variant", "Snap indicator at the edges"],
    "ai_usage": "Draggable galleries and maps. Show the affordance on pointerenter of the region only, and always keep native cursor fallbacks (grab / grabbing) so the interaction survives if JS fails."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .rail { position: relative; width: 320px; height: 160px; border-radius: 14px; overflow: hidden; cursor: grab;
      display: flex; gap: 10px; padding: 10px; background: #10141f; border: 1px solid #263149; }
    .rail:active { cursor: grabbing; }
    .rail .card { flex: none; width: 120px; border-radius: 10px; background: linear-gradient(160deg, #7c5cff, #2dd4bf); }
    .dcur { position: fixed; width: 56px; height: 56px; border-radius: 50%; background: rgba(231,235,243,.14);
      border: 1px solid rgba(231,235,243,.5); backdrop-filter: blur(4px); display: grid; place-items: center;
      color: var(--c, #e7ebf3); margin: -28px 0 0 -28px; pointer-events: none; opacity: 0; transition: opacity .2s, transform .1s; z-index: 9; }
    .rail:hover ~ .dcur { opacity: 1; }
  </style>
</head>
<body>
  <div class="rail" id="rl">
    <div class="card"></div><div class="card"></div><div class="card"></div>
  </div>
  <div class="dcur" aria-hidden="true">↔</div>
  <script>
    (function () {
      var rail = document.getElementById("rl"), cur = document.querySelector(".dcur");
      rail.addEventListener("pointermove", function (e) {
        cur.style.transform = "translate(" + e.clientX + "px," + e.clientY + "px)";
      });
    })();
  </script>
</body>
</html>
