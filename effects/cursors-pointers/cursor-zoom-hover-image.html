<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zoom Cursor</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "cursor-zoom-hover-image",
    "title": "Zoom Cursor",
    "summary": "A zoom affordance over an expandable image.",
    "description": "A zoom affordance over an expandable image.",
    "theme": "cursors-pointers",
    "categories": ["cursor", "pointer"],
    "tags": ["cursor", "pointer", "zoom", "image", "cursor", "lightbox"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Custom cursors are gated to fine pointers; touch and reduced-motion users keep the native cursor and full functionality.",
    "customization": [
      { "name": "--z", "description": "Zoom scale", "default": "1.2" }
    ],
    "variations": ["Retune through the custom properties", "Adapt for a light theme"],
    "ai_usage": "Image galleries. The native zoom-in and zoom-out cursors communicate the toggle for free — pair them with a real button so the interaction is not pointer-only."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 260px; aspect-ratio: 4 / 3; border-radius: 14px; overflow: hidden; cursor: zoom-in;
      background: conic-gradient(from 200deg at 35% 30%, #7c5cff, #2dd4bf, #c2891a); transition: transform .4s; }
    .fx.zoomed { cursor: zoom-out; transform: scale(1.2); }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx" id="zi" role="button" tabindex="0" aria-label="Zoom image"></div>
  <script>
    (function () {
      var el = document.getElementById("zi");
      function t() { el.classList.toggle("zoomed"); }
      el.addEventListener("click", t);
      el.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); t(); } });
    })();
  </script>
</body>
</html>
