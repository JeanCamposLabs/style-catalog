<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Resize Handles</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "cursor-resize-handles",
    "title": "Resize Handles",
    "summary": "A box with directional resize affordances.",
    "description": "A box with directional resize affordances.",
    "theme": "cursors-pointers",
    "categories": ["cursor", "pointer"],
    "tags": ["cursor", "pointer", "resize", "handles", "cursors", "editor"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Custom cursors are gated to fine pointers; touch and reduced-motion users keep the native cursor and full functionality.",
    "customization": [
      { "name": "--c", "description": "Handle colour", "default": "#7c5cff" }
    ],
    "variations": ["Retune through the custom properties", "Adapt for a light theme"],
    "ai_usage": "Canvas and layout editors. Match each handle's cursor to its axis; a generic move cursor on every handle destroys the spatial cue users rely on."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 200px; height: 130px; border-radius: 10px; background: #151b2a; border: 1px solid #7c5cff; }
    .fx i { position: absolute; width: 10px; height: 10px; border-radius: 2px; background: #7c5cff; }
    .nw { top: -5px; left: -5px; cursor: nwse-resize; } .ne { top: -5px; right: -5px; cursor: nesw-resize; }
    .sw { bottom: -5px; left: -5px; cursor: nesw-resize; } .se { bottom: -5px; right: -5px; cursor: nwse-resize; }
    .n { top: -5px; left: 50%; margin-left: -5px; cursor: ns-resize; } .s { bottom: -5px; left: 50%; margin-left: -5px; cursor: ns-resize; }
    .w { left: -5px; top: 50%; margin-top: -5px; cursor: ew-resize; } .e { right: -5px; top: 50%; margin-top: -5px; cursor: ew-resize; }
  </style>
</head>
<body>
  <div class="fx"><i class="nw"></i><i class="n"></i><i class="ne"></i><i class="w"></i><i class="e"></i>
  <i class="sw"></i><i class="s"></i><i class="se"></i></div>
</body>
</html>
