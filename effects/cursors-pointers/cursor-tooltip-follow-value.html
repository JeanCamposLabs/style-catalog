<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Value Follower</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "cursor-tooltip-follow-value",
    "title": "Value Follower",
    "summary": "A readout that follows the pointer across a chart.",
    "description": "A readout that follows the pointer across a chart.",
    "theme": "cursors-pointers",
    "categories": ["cursor", "pointer"],
    "tags": ["cursor", "pointer", "crosshair", "chart", "tooltip", "follow"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Custom cursors are gated to fine pointers; touch and reduced-motion users keep the native cursor and full functionality.",
    "customization": [
      { "name": "--c", "description": "Crosshair colour", "default": "rgba(139,147,167,.5)" }
    ],
    "variations": ["Retune through the custom properties", "Adapt for a light theme"],
    "ai_usage": "Charts. Snap the crosshair to the nearest data point rather than the raw pointer x, so the readout always names a real value."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 290px; height: 150px; border-radius: 14px; background: #151b2a; border: 1px solid #263149;
      overflow: hidden; cursor: crosshair; }
    .fx .line { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(139,147,167,.5); opacity: 0; }
    .fx:hover .line { opacity: 1; }
    .fx .tip { position: absolute; top: 10px; padding: .2rem .5rem; border-radius: 6px; background: #7c5cff; color: #fff;
      font-size: .72rem; font-weight: 700; opacity: 0; pointer-events: none; translate: -50% 0; }
    .fx:hover .tip { opacity: 1; }
    .fx svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .fx path { fill: none; stroke: #2dd4bf; stroke-width: 2; }
  </style>
</head>
<body>
  <div class="fx" id="cv"><svg viewBox="0 0 290 150" aria-hidden="true">
    <path d="M10 120 L70 96 L130 104 L190 58 L250 40 L280 26"/></svg>
    <span class="line"></span><span class="tip">—</span></div>
  <script>
    (function () {
      var el = document.getElementById("cv"), ln = el.querySelector(".line"), tip = el.querySelector(".tip");
      el.addEventListener("pointermove", function (e) {
        var r = el.getBoundingClientRect(), x = e.clientX - r.left;
        ln.style.left = x + "px"; tip.style.left = x + "px";
        tip.textContent = Math.round(x / r.width * 100) + "%";
      });
    })();
  </script>
</body>
</html>
