<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inertial Follower</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "cursor-inertia-follower",
    "title": "Inertial Follower",
    "summary": "A shape that eases toward the pointer with drag.",
    "description": "A shape that eases toward the pointer with drag.",
    "theme": "cursors-pointers",
    "categories": ["cursor", "pointer"],
    "tags": ["cursor", "pointer", "inertia", "lerp", "follow", "easing"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Custom cursors are gated to fine pointers; touch and reduced-motion users keep the native cursor and full functionality.",
    "customization": [
      { "name": "--k", "description": "Follow factor", "default": "0.12" }
    ],
    "variations": ["Retune through the custom properties", "Adapt for a light theme"],
    "ai_usage": "Portfolio cursors. Interpolate toward the target each frame (pos += (target - pos) * k) rather than using a CSS transition, which restarts on every pointermove and stutters."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    body { cursor: none; }
    .hint { color: #8b93a7; font-size: .88rem; }
    .dot { position: fixed; top: 0; left: 0; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%;
      background: rgba(45,212,191,.3); border: 2px solid #2dd4bf; pointer-events: none; z-index: 9; }
  </style>
</head>
<body>
  <p class="hint">Move the pointer — the ring trails behind</p><div class="dot" aria-hidden="true"></div>
  <script>
    (function () {
      var d = document.querySelector(".dot"), tx = 0, ty = 0, px = 0, py = 0;
      addEventListener("pointermove", function (e) { tx = e.clientX; ty = e.clientY; });
      (function loop() {
        px += (tx - px) * .12; py += (ty - py) * .12;
        d.style.transform = "translate(" + px + "px," + py + "px)";
        requestAnimationFrame(loop);
      })();
    })();
  </script>
</body>
</html>
