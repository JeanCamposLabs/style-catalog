<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Newspaper Column</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "newspaper-column",
    "title": "Newspaper Column",
    "summary": "Justified serif columns with a drop cap.",
    "description": "Justified serif columns with a drop cap.",
    "theme": "paper-print",
    "categories": ["paper", "print"],
    "tags": ["paper", "print", "newspaper", "columns", "dropcap", "editorial"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Paper textures often lower contrast — verify text against the darkest part of the texture, not its average.",
    "customization": [
      { "name": "--paper", "description": "Newsprint colour", "default": "#f4f1e8" }
    ],
    "variations": ["Retune the palette", "Adjust the loop duration"],
    "ai_usage": "Editorial pastiche. CSS columns plus ::first-letter give the whole newspaper read; add hyphens:auto or justified narrow columns produce rivers."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 270px; padding: 1.2rem; background: #f4f1e8; color: #1c1917; font-family: Georgia, "Times New Roman", serif; }
    .fx h3 { margin: 0 0 .5rem; font-size: 1.2rem; text-align: center; text-transform: uppercase; letter-spacing: .04em;
      border-bottom: 2px solid #1c1917; padding-bottom: .3rem; }
    .fx .cols { column-count: 2; column-gap: 1rem; column-rule: 1px solid #d6d3d1; font-size: .74rem; text-align: justify; hyphens: auto; }
    .fx .cols p { margin: 0 0 .5rem; }
    .fx .cols p:first-child::first-letter { float: left; font-size: 2.4rem; line-height: .8; padding: .1rem .2rem 0 0; font-weight: 700; }
  </style>
</head>
<body>
  <div class="fx"><h3>The Daily Build</h3><div class="cols">
  <p>Overnight the catalogue grew again, with new specimens arriving from every corner of the stylesheet.</p>
  <p>Observers noted the absence of external dependencies, a fact greeted with quiet approval.</p></div></div>
</body>
</html>
