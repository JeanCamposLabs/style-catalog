  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    .fx .stub { width: 74px; padding: .9rem .5rem; border-left: 2px dashed #a16207; display: grid; place-items: center; text-align: center; }
    .fx .bars { width: 40px; height: 46px; background: repeating-linear-gradient(90deg, #1c1917 0 2px, transparent 2px 5px); }
    .fx h3 { margin: 0 0 .3rem; font-size: .9rem; }
    .fx small { color: #78716c; font-size: .7rem; }
  </style>

  <div class="fx"><div class="main"><h3>NIGHT MARKET</h3><small>Sat 12 Sept · 20:00 · Gate B</small></div>
