  {
    "id": "polaroid-frame",
    "title": "Polaroid Frame",
    "summary": "An instant photo with a wide bottom margin and a caption.",
    "description": "An instant photo with a wide bottom margin and a caption.",

    "categories": ["paper", "print"],
    "tags": ["paper", "print", "polaroid", "photo", "frame", "instant"],
    "tech": ["css"],

    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 190px; padding: 12px 12px 44px; background: #fdfdfb; box-shadow: 0 14px 30px rgba(0,0,0,.45);
      transform: rotate(-3deg); position: relative; }
    .fx .img { aspect-ratio: 1; background: conic-gradient(from 160deg at 40% 35%, #7c5cff, #2dd4bf, #f472b6); }
    .fx .cap { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; color: #57534e;
      font-family: "Segoe Script", cursive; font-size: .85rem; }
  </style>
</head>
<body>
  <figure class="fx" style="margin:0"><div class="img"></div><figcaption class="cap">Summer, 2026</figcaption></figure>
</body>
