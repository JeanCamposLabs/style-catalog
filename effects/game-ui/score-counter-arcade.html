<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arcade Scoreboard</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "score-counter-arcade",
    "title": "Arcade Scoreboard",
    "summary": "A high-score panel with padded digits.",
    "description": "A high-score panel with padded digits.",
    "theme": "game-ui",
    "categories": ["game", "ui"],
    "tags": ["game", "hud", "score", "arcade", "counter", "leaderboard"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Game HUDs still need real semantics: use progressbar roles for meters and buttons for slots so the interface is operable without sight.",
    "customization": [
      { "name": "--c", "description": "Display colour", "default": "#22d3ee" }
    ],
    "variations": ["Retheme through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Arcade and casual games. Zero-pad the score and use tabular-nums so the digits never shift width as the number changes."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { padding: 1rem 1.2rem; border-radius: 8px; background: #05070d; border: 2px solid #22d3ee;
      font-family: ui-monospace, monospace; color: #22d3ee; text-align: center; }
    .fx .lbl { font-size: .72rem; letter-spacing: .2em; opacity: .75; }
    .fx .n { font-size: 2rem; font-weight: 900; letter-spacing: .1em; text-shadow: 0 0 10px rgba(34,211,238,.7);
      font-variant-numeric: tabular-nums; }
    .fx .row { display: flex; gap: 1.6rem; justify-content: center; margin-top: .6rem; font-size: .75rem; opacity: .8; }
  </style>
</head>
<body>
  <div class="fx"><div class="lbl">HIGH SCORE</div><div class="n">0042180</div>
  <div class="row"><span>1UP 012400</span><span>2UP 008920</span></div></div>
</body>
</html>
