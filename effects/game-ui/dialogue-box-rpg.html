  <script type="application/json" id="effect-meta">
  {
    "id": "dialogue-box-rpg",
    "title": "Dialogue Box",
    "summary": "An RPG dialogue panel with a typing effect and a speaker name.",
    "description": "An RPG dialogue panel with a typing effect and a speaker name.",
    "theme": "game-ui",
    "categories": ["game", "ui"],
    "tags": ["game", "hud", "dialogue", "rpg", "text-box", "narrative"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Game HUDs still need real semantics: use progressbar roles for meters and buttons for slots so the interface is operable without sight.",
    "customization": [
      { "name": "--c", "description": "Frame colour", "default": "#7c5cff" }

    "variations": ["Retheme through the custom properties", "Scale for a compact variant"],

  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 290px; padding: 1rem 1.1rem 1.4rem; border: 3px solid #7c5cff; border-radius: 10px;
      background: linear-gradient(180deg, #12162a, #0b0d18); position: relative; font-family: ui-monospace, monospace; }
    .fx .who { position: absolute; top: -14px; left: 14px; padding: .1rem .6rem; border: 2px solid #7c5cff; border-radius: 6px;
      background: #12162a; font-size: .75rem; color: #c4b5fd; }
    .fx p { margin: 0; font-size: .88rem; line-height: 1.6; color: #e7ebf3; }
    .fx .next { position: absolute; right: 12px; bottom: 8px; color: #7c5cff; animation: bob .8s ease-in-out infinite alternate; }
    @keyframes bob { to { transform: translateY(4px); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx"><span class="who">ARCHIVIST</span><p>The catalogue holds more than a thousand specimens now. Choose carefully.</p>
  <span class="next" aria-hidden="true">▼</span></div>
</body>
</html>
