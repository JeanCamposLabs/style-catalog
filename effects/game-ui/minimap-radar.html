<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minimap</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "minimap-radar",
    "title": "Minimap",
    "summary": "A circular minimap with blips and a view cone.",
    "description": "A circular minimap with blips and a view cone.",
    "theme": "game-ui",
    "categories": ["game", "ui"],
    "tags": ["game", "hud", "minimap", "radar", "hud", "navigation"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Game HUDs still need real semantics: use progressbar roles for meters and buttons for slots so the interface is operable without sight.",
    "customization": [
      { "name": "--c", "description": "Player colour", "default": "#34d399" }
    ],
    "variations": ["Retheme through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Open-world HUDs. The view cone is what turns a dot map into a minimap — without it players cannot tell which way they are facing."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 150px; height: 150px; border-radius: 50%; border: 3px solid #2b3450;
      background: radial-gradient(circle, #0d1a14, #050b08); overflow: hidden; }
    .fx .cone { position: absolute; left: 50%; top: 50%; width: 0; height: 0; translate: -50% -100%;
      border-left: 32px solid transparent; border-right: 32px solid transparent; border-bottom: 60px solid rgba(52,211,153,.2);
      transform-origin: 50% 100%; animation: look 6s ease-in-out infinite alternate; }
    .fx .me { position: absolute; left: 50%; top: 50%; translate: -50% -50%; width: 9px; height: 9px; border-radius: 50%; background: #34d399; }
    .fx i { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #f87171; }
    @keyframes look { from { rotate: -40deg; } to { rotate: 40deg; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx" role="img" aria-label="Minimap, two enemies nearby">
    <span class="cone"></span><span class="me"></span><i style="left:30%;top:34%"></i><i style="left:68%;top:60%"></i></div>
</body>
</html>
