<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Health Bar</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "health-bar-segmented",
    "title": "Health Bar",
    "summary": "A segmented health bar that shifts colour as it drains.",
    "description": "A segmented health bar that shifts colour as it drains.",
    "theme": "game-ui",
    "categories": ["game", "ui"],
    "tags": ["game", "hud", "health", "hp", "bar", "rpg"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Game HUDs still need real semantics: use progressbar roles for meters and buttons for slots so the interface is operable without sight.",
    "customization": [
      { "name": "--hp", "description": "Health percent", "default": "72" }
    ],
    "variations": ["Retheme through the custom properties", "Scale for a compact variant"],
    "ai_usage": "RPG and action HUDs. Change hue at thresholds and add a pulse only in the critical band — constant animation stops the warning from meaning anything."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 260px; }
    .fx .bar { height: 18px; border: 2px solid #0b0d12; border-radius: 4px; background: #1f2937; overflow: hidden; position: relative; }
    .fx .fill { height: 100%; width: calc(var(--hp) * 1%); background: linear-gradient(180deg, #4ade80, #16a34a); transition: width .3s; }
    .fx.low .fill { background: linear-gradient(180deg, #fbbf24, #d97706); }
    .fx.crit .fill { background: linear-gradient(180deg, #f87171, #dc2626); animation: pulse .6s ease-in-out infinite alternate; }
    .fx .ticks { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 25px, rgba(0,0,0,.5) 25px 27px); }
    .fx .lbl { margin-top: .4rem; font-family: ui-monospace, monospace; font-size: .78rem; color: #8b93a7; }
    @keyframes pulse { to { filter: brightness(1.35); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx" style="--hp:72"><div class="bar" role="progressbar" aria-valuenow="72" aria-valuemin="0" aria-valuemax="100" aria-label="Health">
    <div class="fill"></div><div class="ticks"></div></div><div class="lbl">HP 72 / 100</div></div>
</body>
</html>
