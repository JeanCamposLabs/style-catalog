<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loot Card</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "loot-rarity-card",
    "title": "Loot Card",
    "summary": "An item card whose frame reflects its rarity.",
    "description": "An item card whose frame reflects its rarity.",
    "theme": "game-ui",
    "categories": ["game", "ui"],
    "tags": ["game", "hud", "loot", "rarity", "card", "reward"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Game HUDs still need real semantics: use progressbar roles for meters and buttons for slots so the interface is operable without sight.",
    "customization": [
      { "name": "--c", "description": "Rarity colour", "default": "#a855f7" }
    ],
    "variations": ["Retheme through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Loot drops and gacha reveals. Reserve the rotating sheen for high rarities so the animation itself signals value."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 190px; padding: 1rem; border-radius: 12px; text-align: center; position: relative; overflow: hidden;
      background: linear-gradient(180deg, #1b1030, #0d0819); border: 2px solid #a855f7;
      box-shadow: 0 0 22px rgba(168,85,247,.4), inset 0 0 26px rgba(168,85,247,.2); }
    .fx::after { content: ""; position: absolute; inset: -40%; opacity: .35; mix-blend-mode: screen;
      background: conic-gradient(from 0deg, transparent 0 70%, rgba(216,180,254,.9) 80%, transparent);
      animation: spin 4s linear infinite; }
    .fx .ic { font-size: 2.4rem; }
    .fx b { display: block; margin-top: .4rem; color: #e9d5ff; }
    .fx .rar { font-size: .72rem; letter-spacing: .16em; color: #a855f7; }
    @keyframes spin { to { transform: rotate(1turn); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx"><div class="ic" aria-hidden="true">🔮</div><b>Void Orb</b><div class="rar">EPIC</div></div>
</body>
</html>
