<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ability Cooldown</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "cooldown-ability",
    "title": "Ability Cooldown",
    "summary": "A skill icon sweeping through its cooldown.",
    "description": "A skill icon sweeping through its cooldown.",
    "theme": "game-ui",
    "categories": ["game", "ui"],
    "tags": ["game", "hud", "cooldown", "ability", "conic", "hotbar"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Game HUDs still need real semantics: use progressbar roles for meters and buttons for slots so the interface is operable without sight.",
    "customization": [
      { "name": "--a", "description": "Cooldown angle", "default": "210deg" }
    ],
    "variations": ["Retheme through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Action-bar hotkeys. A conic mask sweeps the darkened overlay exactly like every MOBA cooldown; drive --a from the remaining time."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .row { display: flex; gap: 10px; }
    .ab { position: relative; width: 58px; height: 58px; border-radius: 10px; border: 2px solid #2b3450; overflow: hidden;
      background: linear-gradient(160deg, #1e293b, #0f172a); display: grid; place-items: center; font-size: 1.4rem; }
    .ab .cd { position: absolute; inset: 0; background: rgba(4,7,14,.72);
      -webkit-mask-image: conic-gradient(#000 var(--a), transparent 0); mask-image: conic-gradient(#000 var(--a), transparent 0); }
    .ab .n { position: absolute; inset: 0; display: grid; place-items: center; font-size: 1rem; font-weight: 900; color: #fff; }
    .ab kbd { position: absolute; right: 3px; bottom: 2px; font-size: .6rem; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="row">
    <div class="ab">⚡<kbd>1</kbd></div>
    <div class="ab">❄<span class="cd" style="--a:210deg"></span><span class="n">3</span><kbd>2</kbd></div>
    <div class="ab">🔥<kbd>3</kbd></div>
  </div>
</body>
</html>
