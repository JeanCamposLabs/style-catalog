<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Press Start Screen</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "start-screen-press",
    "title": "Press Start Screen",
    "summary": "A title screen with a blinking prompt.",
    "description": "A title screen with a blinking prompt.",
    "theme": "game-ui",
    "categories": ["game", "ui"],
    "tags": ["game", "hud", "title-screen", "blink", "arcade", "start"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Game HUDs still need real semantics: use progressbar roles for meters and buttons for slots so the interface is operable without sight.",
    "customization": [
      { "name": "--c", "description": "Title colour", "default": "#fde68a" }
    ],
    "variations": ["Retheme through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Arcade and game landing screens. Use steps(1) blinking, not a fade — the hard on/off is the era-correct behaviour."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 280px; height: 170px; border-radius: 10px; display: grid; place-items: center; gap: .8rem;
      background: radial-gradient(circle at 50% 30%, #1e1b4b, #05070d); font-family: ui-monospace, monospace; text-align: center; }
    .fx h2 { margin: 0; font-size: 1.6rem; font-weight: 900; letter-spacing: .12em; color: #fde68a;
      text-shadow: 0 0 12px rgba(251,191,36,.6), 3px 3px 0 #7c2d12; }
    .fx p { margin: 0; font-size: .8rem; color: #a5b4fc; animation: blink 1.4s steps(1) infinite; }
    @keyframes blink { 0%, 60% { opacity: 1; } 61%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx"><h2>PIXEL QUEST</h2><p>PRESS START</p></div>
</body>
</html>
