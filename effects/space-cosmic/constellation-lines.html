<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Constellation</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "constellation-lines",
    "title": "Constellation",
    "summary": "Stars joined by faint lines.",
    "description": "Stars joined by faint lines.",
    "theme": "space-cosmic",
    "categories": ["space", "cosmic"],
    "tags": ["space", "cosmic", "constellation", "stars", "network", "lines"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Deep-space palettes are very low contrast — keep any text on a solid panel above the scene.",
    "customization": [
      { "name": "--c", "description": "Line colour", "default": "rgba(148,163,184,.5)" }
    ],
    "variations": ["Retune the palette", "Slow it down for an ambient version"],
    "ai_usage": "Network and community metaphors. Twinkle the nodes at different phases so the diagram feels alive without any layout change."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 260px; height: 170px; border-radius: 14px; background: #05070d; overflow: hidden; }
    .fx svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .fx line { stroke: rgba(148,163,184,.5); stroke-width: 1; }
    .fx circle { fill: #fff; animation: tw 3s ease-in-out infinite; }
    .fx circle:nth-of-type(2n) { animation-delay: 1s; }
    @keyframes tw { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx"><svg viewBox="0 0 260 170">
  <line x1="40" y1="120" x2="90" y2="60"/><line x1="90" y1="60" x2="150" y2="80"/><line x1="150" y1="80" x2="200" y2="40"/><line x1="150" y1="80" x2="180" y2="135"/>
  <circle cx="40" cy="120" r="3"/><circle cx="90" cy="60" r="4"/><circle cx="150" cy="80" r="3"/><circle cx="200" cy="40" r="4"/><circle cx="180" cy="135" r="3"/>
  </svg></div>
</body>
</html>
