  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 280px; height: 170px; border-radius: 14px; overflow: hidden; background: #05070d; }

      background: linear-gradient(90deg, transparent, #a5f3fc, #fff); animation: fly 4s linear infinite; }
    .fx .c::after { content: ""; position: absolute; right: -3px; top: -3px; width: 9px; height: 9px; border-radius: 50%;
      background: #fff; box-shadow: 0 0 14px #a5f3fc; }
    @keyframes fly { to { transform: translate(320px, 90px); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>

<body>
  <div class="fx"><span class="c"></span></div>
