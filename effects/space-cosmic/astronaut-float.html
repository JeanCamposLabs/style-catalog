<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Floating Astronaut</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "astronaut-float",
    "title": "Floating Astronaut",
    "summary": "A figure drifting with a slow tumble.",
    "description": "A figure drifting with a slow tumble.",
    "theme": "space-cosmic",
    "categories": ["space", "cosmic"],
    "tags": ["space", "cosmic", "astronaut", "float", "drift", "zero-g"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Deep-space palettes are very low contrast — keep any text on a solid panel above the scene.",
    "customization": [
      { "name": "--dur", "description": "Drift period", "default": "7s" }
    ],
    "variations": ["Retune the palette", "Slow it down for an ambient version"],
    "ai_usage": "404 and empty states. Combining a slow drift with an even slower rotation reads as weightlessness; either alone looks like a bounce or a spin."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 200px; height: 180px; display: grid; place-items: center; background: radial-gradient(circle, #0b1226, #05070d);
      border-radius: 14px; overflow: hidden; }
    .fx .a { font-size: 3.4rem; animation: float 7s ease-in-out infinite alternate, tumble 18s linear infinite; }
    @keyframes float { from { transform: translate(-14px, 10px); } to { transform: translate(16px, -12px); } }
    @keyframes tumble { to { rotate: 360deg; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx"><span class="a" aria-hidden="true">👨‍🚀</span></div>
</body>
</html>
