<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Warp Speed</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "warp-speed-stars",
    "title": "Warp Speed",
    "summary": "Stars stretching into streaks toward the viewer.",
    "description": "Stars stretching into streaks toward the viewer.",
    "theme": "space-cosmic",
    "categories": ["space", "cosmic"],
    "tags": ["space", "cosmic", "warp", "hyperspace", "streaks", "speed"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Deep-space palettes are very low contrast — keep any text on a solid panel above the scene.",
    "customization": [
      { "name": "--dur", "description": "Warp period", "default": "1.4s" }
    ],
    "variations": ["Retune the palette", "Slow it down for an ambient version"],
    "ai_usage": "Transitions and launch sequences. Rotate each star to its own angle and scale only on X so the streak always points away from the centre."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 260px; height: 180px; border-radius: 14px; overflow: hidden; background: #04060c; }
    .fx i { position: absolute; top: 50%; left: 50%; width: 2px; height: 2px; background: #fff; border-radius: 99px;
      transform-origin: 0 0; animation: warp var(--d) linear infinite; animation-delay: var(--dl); }
    @keyframes warp {
      0% { transform: rotate(var(--a)) translateX(10px) scaleX(1); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: rotate(var(--a)) translateX(180px) scaleX(28); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx"><i style="--a:10deg;--d:1.4s;--dl:0s"></i><i style="--a:65deg;--d:1.8s;--dl:-.3s"></i>
  <i style="--a:130deg;--d:1.2s;--dl:-.6s"></i><i style="--a:200deg;--d:1.6s;--dl:-.9s"></i>
  <i style="--a:255deg;--d:1.5s;--dl:-.2s"></i><i style="--a:310deg;--d:1.9s;--dl:-1.1s"></i></div>
</body>
</html>
