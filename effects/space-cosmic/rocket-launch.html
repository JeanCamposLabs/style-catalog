<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rocket Launch</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "rocket-launch",
    "title": "Rocket Launch",
    "summary": "A rocket rising on a flickering exhaust plume.",
    "description": "A rocket rising on a flickering exhaust plume.",
    "theme": "space-cosmic",
    "categories": ["space", "cosmic"],
    "tags": ["space", "cosmic", "rocket", "launch", "flame", "startup"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Deep-space palettes are very low contrast — keep any text on a solid panel above the scene.",
    "customization": [
      { "name": "--c", "description": "Flame colour", "default": "#fbbf24" }
    ],
    "variations": ["Retune the palette", "Slow it down for an ambient version"],
    "ai_usage": "Launch and deploy moments. A fast stepped flicker on the plume plus slow hover on the body reads as thrust; matching their speeds looks like bouncing."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 140px; height: 190px; display: grid; place-items: center; }
    .fx .r { position: relative; width: 40px; height: 90px; border-radius: 50% 50% 12px 12px;
      background: linear-gradient(160deg, #f8fafc, #94a3b8); animation: hover 2s ease-in-out infinite alternate; }
    .fx .r::after { content: ""; position: absolute; top: 24px; left: 50%; translate: -50% 0; width: 16px; height: 16px;
      border-radius: 50%; background: #38bdf8; box-shadow: inset 0 2px 4px rgba(0,0,0,.4); }
    .fx .flame { position: absolute; top: 88px; left: 50%; translate: -50% 0; width: 22px; height: 40px;
      border-radius: 50% 50% 60% 60% / 30% 30% 100% 100%; background: linear-gradient(180deg, #fbbf24, #ef4444);
      animation: flicker .18s steps(2) infinite; }
    @keyframes hover { to { transform: translateY(-10px); } }
    @keyframes flicker { to { transform: scaleY(.8) scaleX(1.1); opacity: .85; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx"><span class="r"></span><span class="flame"></span></div>
</body>
</html>
