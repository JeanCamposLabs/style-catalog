<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drifting Leaves</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "wind-leaves-drift",
    "title": "Drifting Leaves",
    "summary": "Leaves tumbling across on a breeze.",
    "description": "Leaves tumbling across on a breeze.",
    "theme": "particles-physics",
    "categories": ["particles", "physics"],
    "tags": ["particles", "motion", "leaves", "wind", "tumble", "drift"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "advanced",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Particle fields are decorative and expensive — cap counts, pause when off-screen, and stop entirely under reduced motion.",
    "customization": [
      { "name": "--dur", "description": "Crossing period", "default": "6s" }
    ],
    "variations": ["Retune the palette", "Scale for a compact variant"],
    "ai_usage": "Seasonal decoration. Combine horizontal travel, a vertical drift, and rotation on one keyframe so each leaf follows its own arc."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 280px; height: 160px; border-radius: 14px; overflow: hidden;
      background: linear-gradient(160deg, #10141f, #0b0d12); }
    .fx i { position: absolute; width: 16px; height: 22px; border-radius: 50% 0 50% 0; background: #c2891a;
      animation: blow var(--d) linear infinite; animation-delay: var(--dl); }
    @keyframes blow {
      0% { transform: translate(-30px, 0) rotate(0); opacity: 0; }
      10%, 90% { opacity: 1; }
      100% { transform: translate(310px, var(--y)) rotate(540deg); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx"><i style="top:20%;--d:6s;--dl:0s;--y:40px"></i><i style="top:52%;--d:8s;--dl:-2s;--y:-30px"></i>
  <i style="top:74%;--d:7s;--dl:-4s;--y:20px"></i></div>
</body>
</html>
