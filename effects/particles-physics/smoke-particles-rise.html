<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Particle Smoke</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "smoke-particles-rise",
    "title": "Particle Smoke",
    "summary": "Soft particles rising and dispersing.",
    "description": "Soft particles rising and dispersing.",
    "theme": "particles-physics",
    "categories": ["particles", "physics"],
    "tags": ["particles", "motion", "smoke", "particles", "rise", "disperse"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "advanced",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Particle fields are decorative and expensive — cap counts, pause when off-screen, and stop entirely under reduced motion.",
    "customization": [
      { "name": "--dur", "description": "Rise period", "default": "5s" }
    ],
    "variations": ["Retune the palette", "Scale for a compact variant"],
    "ai_usage": "Ambient atmosphere. Scale each particle up as it fades so the plume disperses; particles that keep their size read as floating balls."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 180px; height: 190px; overflow: hidden; }
    .fx i { position: absolute; bottom: -20px; left: 50%; width: 40px; height: 40px; border-radius: 50%; filter: blur(12px);
      background: rgba(203,213,225,.28); animation: up var(--d) linear infinite; animation-delay: var(--dl); }
    @keyframes up {
      0% { transform: translate(-50%, 0) scale(.4); opacity: .8; }
      100% { transform: translate(calc(-50% + var(--x)), -190px) scale(2); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx"><i style="--d:5s;--dl:0s;--x:-22px"></i><i style="--d:6.5s;--dl:-2s;--x:26px"></i>
  <i style="--d:5.8s;--dl:-4s;--x:-6px"></i></div>
</body>
</html>
