<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Confetti Burst</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "confetti-burst-click",
    "title": "Confetti Burst",
    "summary": "A burst of confetti fired from a button.",
    "description": "A burst of confetti fired from a button.",
    "theme": "particles-physics",
    "categories": ["particles", "physics"],
    "tags": ["particles", "motion", "confetti", "burst", "celebration", "click"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "advanced",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Particle fields are decorative and expensive — cap counts, pause when off-screen, and stop entirely under reduced motion.",
    "customization": [
      { "name": "--n", "description": "Pieces per burst", "default": "18" }
    ],
    "variations": ["Retune the palette", "Scale for a compact variant"],
    "ai_usage": "Celebration moments. Randomise angle, distance, and rotation per piece, and remove nodes on animationend so repeated clicks do not accumulate DOM."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; display: inline-block; }
    .fx button { padding: .8rem 1.8rem; border: 0; border-radius: 12px; background: #7c5cff; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    .p { position: absolute; top: 50%; left: 50%; width: 8px; height: 12px; border-radius: 2px; pointer-events: none;
      animation: fly .9s cubic-bezier(.2,.7,.4,1) forwards; }
    @keyframes fly {
      0% { transform: translate(0,0) rotate(0); opacity: 1; }
      100% { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="fx" id="cf"><button type="button">Celebrate</button></div>
  <script>
    (function () {
      var host = document.getElementById("cf"), cols = ["#7c5cff", "#10a894", "#c2891a", "#d1478c", "#2f7cc9"];
      host.querySelector("button").addEventListener("click", function () {
        for (var i = 0; i < 18; i++) {
          var p = document.createElement("span"), a = Math.random() * Math.PI * 2, r = 60 + Math.random() * 70;
          p.className = "p";
          p.style.background = cols[i % cols.length];
          p.style.setProperty("--x", Math.cos(a) * r + "px");
          p.style.setProperty("--y", Math.sin(a) * r + "px");
          p.style.setProperty("--r", Math.random() * 720 - 360 + "deg");
          host.appendChild(p);
          p.addEventListener("animationend", function () { this.remove(); });
        }
      });
    })();
  </script>
</body>
</html>
