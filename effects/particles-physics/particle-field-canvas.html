<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Particle Field</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "particle-field-canvas",
    "title": "Particle Field",
    "summary": "Drifting points connected when they come close.",
    "description": "Drifting points connected when they come close.",
    "theme": "particles-physics",
    "categories": ["particles", "physics"],
    "tags": ["particles", "motion", "canvas", "network", "connections", "field"],
    "tech": ["js", "canvas"],
    "era": "2020s",
    "difficulty": "advanced",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Particle fields are decorative and expensive — cap counts, pause when off-screen, and stop entirely under reduced motion.",
    "customization": [
      { "name": "--n", "description": "Particle count", "default": "44" }
    ],
    "variations": ["Retune the palette", "Scale for a compact variant"],
    "ai_usage": "Hero backdrops. Cap the particle count (40–80) and only test pairs within a radius; the naive all-pairs loop is what makes these effects melt laptops."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 290px; height: 190px; border-radius: 14px; overflow: hidden; background: #06080f; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div class="fx"><canvas id="pf"></canvas></div>
  <script>
    (function () {
      var c = document.getElementById("pf"), x = c.getContext("2d"), ps = [];
      var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      function fit() { c.width = c.offsetWidth; c.height = c.offsetHeight; }
      fit(); addEventListener("resize", fit);
      for (var i = 0; i < 44; i++) ps.push({
        x: Math.random() * c.width, y: Math.random() * c.height,
        vx: (Math.random() - .5) * .5, vy: (Math.random() - .5) * .5
      });
      function frame() {
        x.clearRect(0, 0, c.width, c.height);
        for (var i = 0; i < ps.length; i++) {
          var p = ps[i];
          p.x += p.vx; p.y += p.vy;
          if (p.x < 0 || p.x > c.width) p.vx *= -1;
          if (p.y < 0 || p.y > c.height) p.vy *= -1;
          x.fillStyle = "#7c5cff"; x.beginPath(); x.arc(p.x, p.y, 1.8, 0, 6.283); x.fill();
          for (var j = i + 1; j < ps.length; j++) {
            var q = ps[j], d = Math.hypot(p.x - q.x, p.y - q.y);
            if (d < 62) {
              x.strokeStyle = "rgba(124,92,255," + (1 - d / 62) * .5 + ")";
              x.beginPath(); x.moveTo(p.x, p.y); x.lineTo(q.x, q.y); x.stroke();
            }
          }
        }
        if (!reduce) requestAnimationFrame(frame);
      }
      frame();
    })();
  </script>
</body>
</html>
