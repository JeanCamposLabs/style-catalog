<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Buoyant Cards</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "float-buoyancy-cards",
    "title": "Buoyant Cards",
    "summary": "Cards bobbing as if floating on water.",
    "description": "Cards bobbing as if floating on water.",
    "theme": "particles-physics",
    "categories": ["particles", "physics"],
    "tags": ["particles", "motion", "float", "bob", "buoyancy", "ambient"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "advanced",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Particle fields are decorative and expensive — cap counts, pause when off-screen, and stop entirely under reduced motion.",
    "customization": [
      { "name": "--dur", "description": "Bob period", "default": "3s" }
    ],
    "variations": ["Retune the palette", "Scale for a compact variant"],
    "ai_usage": "Ambient hero elements. Pair vertical bob with a tiny rotation and give each card a different period — synchronised bobbing looks mechanical."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: flex; gap: 12px; }
    .c { width: 78px; height: 100px; border-radius: 12px; background: linear-gradient(160deg, #1b2338, #10141f);
      border: 1px solid #263149; animation: bob var(--d) ease-in-out infinite alternate; animation-delay: var(--dl); }
    @keyframes bob { from { transform: translateY(0) rotate(-1.5deg); } to { transform: translateY(-12px) rotate(1.5deg); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx"><div class="c" style="--d:3s;--dl:0s"></div><div class="c" style="--d:3.8s;--dl:-1s"></div>
  <div class="c" style="--d:3.3s;--dl:-2s"></div></div>
</body>
</html>
