<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bouncing Box</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "collision-bounce-box",
    "title": "Bouncing Box",
    "summary": "A ball ricocheting inside a container.",
    "description": "A ball ricocheting inside a container.",
    "theme": "particles-physics",
    "categories": ["particles", "physics"],
    "tags": ["particles", "motion", "collision", "bounce", "ricochet", "screensaver"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "advanced",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Particle fields are decorative and expensive — cap counts, pause when off-screen, and stop entirely under reduced motion.",
    "customization": [
      { "name": "--dx", "description": "Horizontal period", "default": "3.1s" },
      { "name": "--dy", "description": "Vertical period", "default": "2.3s" }
    ],
    "variations": ["Retune the palette", "Scale for a compact variant"],
    "ai_usage": "The DVD-logo screensaver in two lines: independent linear alternate animations on x and y with coprime durations produce a path that never repeats quickly."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 240px; height: 160px; border-radius: 14px; background: #10141f; border: 1px solid #263149; overflow: hidden; }
    .fx i { position: absolute; width: 20px; height: 20px; border-radius: 50%; background: #10a894;
      animation: bx 3.1s linear infinite alternate, by 2.3s linear infinite alternate; }
    @keyframes bx { from { left: 4px; } to { left: 216px; } }
    @keyframes by { from { top: 4px; } to { top: 136px; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx"><i></i></div>
</body>
</html>
