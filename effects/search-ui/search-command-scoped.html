<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Search with Filters Row</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "search-command-scoped",
    "title": "Search with Filters Row",
    "summary": "A search field with quick filter chips beneath it.",
    "description": "A search field with quick filter chips beneath it.",
    "theme": "search-ui",
    "categories": ["search", "filter"],
    "tags": ["search", "find", "filters", "chips", "quick", "row"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Result counts belong in an aria-live region; filter groups need fieldset/legend so their scope is announced.",
    "customization": [
      { "name": "--c", "description": "Active colour", "default": "#7c5cff" }
    ],
    "variations": ["Adapt to a light theme", "Add a compact variant"],
    "ai_usage": "Compact filtering above a result grid. Filters go in one row above the results, never in a modal — users need to see the effect of a change immediately."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 300px; }
    .fx input { width: 100%; padding: .75rem .9rem; border-radius: 12px; border: 1px solid #2b3450; background: #151b2a;
      color: #e7ebf3; font: inherit; margin-bottom: .6rem; }
    .fx .row { display: flex; gap: .4rem; flex-wrap: wrap; }
    .fx .row button { padding: .3rem .75rem; border-radius: 99px; border: 1px solid #2b3450; background: transparent;
      color: #8b93a7; font: inherit; font-size: .78rem; cursor: pointer; }
    .fx .row button[aria-pressed="true"] { background: #1e1740; border-color: #7c5cff; color: #b9a5ff; }
  </style>
</head>
<body>
  <div class="fx"><input type="search" aria-label="Search" placeholder="Search" />
  <div class="row" role="group" aria-label="Quick filters">
    <button type="button" aria-pressed="true">Animated</button><button type="button" aria-pressed="false">CSS only</button>
    <button type="button" aria-pressed="false">Beginner</button><button type="button" aria-pressed="false">Retro</button></div></div>
</body>
</html>
