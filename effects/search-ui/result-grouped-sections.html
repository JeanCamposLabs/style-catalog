  {
    "id": "result-grouped-sections",
    "title": "Grouped Results",
    "summary": "Results grouped by type with counts.",
    "description": "Results grouped by type with counts.",

    "tags": ["search", "find", "grouped", "sections", "types", "results"],

    "dependencies": [],

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 290px; }
    .fx .g { margin-bottom: .9rem; }
    .fx .h { display: flex; justify-content: space-between; font-size: .7rem; text-transform: uppercase;
      letter-spacing: .08em; color: #64748b; margin-bottom: .35rem; }
    .fx .r { display: flex; align-items: center; gap: .6rem; padding: .45rem .6rem; border-radius: 8px; color: #cbd5e1; font-size: .85rem; }
    .fx .r:hover { background: #151b2a; }
    .fx .ic { width: 24px; height: 24px; border-radius: 7px; background: #1e2740; display: grid; place-items: center; font-size: .8rem; }
  </style>
</head>
<body>
  <div class="fx"><div class="g"><div class="h"><span>Effects</span><span>12</span></div>
  <div class="r"><span class="ic">◆</span>Gradient Border Card</div><div class="r"><span class="ic">◆</span>Gradient Shift Text</div></div>
  <div class="g"><div class="h"><span>Themes</span><span>2</span></div>
