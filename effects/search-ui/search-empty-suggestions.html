    "id": "search-empty-suggestions",

    "summary": "A pre-query state with browsable categories.",

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 290px; padding: 1.2rem; border-radius: 16px; background: #151b2a; border: 1px solid #263149; }
    .fx h4 { margin: 0 0 .8rem; font-size: .9rem; }
    .fx .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .fx .c { padding: .6rem .7rem; border-radius: 10px; background: #1c2437; color: #cbd5e1; font-size: .82rem; }
    .fx .c span { display: block; color: #64748b; font-size: .72rem; }
  </style>
</head>
<body>
  <div class="fx"><h4>Browse by theme</h4><div class="grid">
