<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Search Shortcut Hint</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "keyboard-search-hint",
    "title": "Search Shortcut Hint",
    "summary": "A field showing its keyboard shortcut.",
    "description": "A field showing its keyboard shortcut.",
    "theme": "search-ui",
    "categories": ["search", "filter"],
    "tags": ["search", "find", "shortcut", "hint", "kbd", "affordance"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Result counts belong in an aria-live region; filter groups need fieldset/legend so their scope is announced.",
    "customization": [
      { "name": "--bg", "description": "Field background", "default": "#151b2a" }
    ],
    "variations": ["Adapt to a light theme", "Add a compact variant"],
    "ai_usage": "Search entry points in keyboard-first apps. Show the shortcut in the resting state so it is discoverable without documentation."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: flex; align-items: center; gap: .6rem; width: 280px; padding: .65rem .8rem; border-radius: 12px;
      border: 1px solid #2b3450; background: #151b2a; color: #8b93a7; font-size: .88rem; cursor: text; }
    .fx kbd { margin-left: auto; padding: .12rem .4rem; border-radius: 5px; background: #1c2437; border: 1px solid #2b3450;
      border-bottom-width: 2px; font-family: ui-monospace, monospace; font-size: .72rem; color: #cbd5e1; }
  </style>
</head>
<body>
  <button class="fx" type="button" aria-label="Search, press slash"><span aria-hidden="true">⌕</span> Search specimens <kbd>/</kbd></button>
</body>
</html>
