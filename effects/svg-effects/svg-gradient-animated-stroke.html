  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 200px; }
    .fx svg { width: 100%; display: block; }
    .fx path { fill: none; stroke: url(#g); stroke-width: 8; stroke-linecap: round; }
    .fx stop { animation: shift 4s linear infinite; }
  </style>

<body>
  <div class="fx"><svg viewBox="0 0 200 90" aria-hidden="true">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"><animate attributeName="offset" values="0;1;0" dur="4s" repeatCount="indefinite"/></stop>
      <stop offset="0.5" stop-color="#2dd4bf"><animate attributeName="offset" values="0.5;1.5;0.5" dur="4s" repeatCount="indefinite"/></stop>
    </linearGradient></defs>
    <path d="M10 70 C50 10 90 90 130 40 C155 10 175 30 190 20"/></svg></div>
