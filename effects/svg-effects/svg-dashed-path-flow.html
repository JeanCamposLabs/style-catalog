    "id": "svg-dashed-path-flow",

    "summary": "A dashed connector with travelling dashes.",
    "description": "A dashed connector with travelling dashes.",

    "categories": ["svg", "vector"],

    "ai_usage": "Pipeline and architecture diagrams. Animate stroke-dashoffset by exactly one dash period so the flow loops without a visible jump."

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 250px; }
    .fx svg { width: 100%; display: block; }
    .fx .bg { fill: none; stroke: #22304a; stroke-width: 3; }
    .fx .fl { fill: none; stroke: #2dd4bf; stroke-width: 3; stroke-dasharray: 10 14; animation: flow 1.2s linear infinite; }
    .fx circle { fill: #151b2a; stroke: #2dd4bf; stroke-width: 2; }
    @keyframes flow { to { stroke-dashoffset: -24; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx"><svg viewBox="0 0 250 90" aria-hidden="true">
    <path class="bg" d="M30 45 C90 45 90 20 125 20 C160 20 160 70 220 70"/>
    <path class="fl" d="M30 45 C90 45 90 20 125 20 C160 20 160 70 220 70"/>
    <circle cx="30" cy="45" r="10"/><circle cx="220" cy="70" r="10"/></svg></div>
</body>
