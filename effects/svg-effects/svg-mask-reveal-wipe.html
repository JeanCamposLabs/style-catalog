<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SVG Mask Wipe</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "svg-mask-reveal-wipe",
    "title": "SVG Mask Wipe",
    "summary": "Artwork revealed by a moving mask.",
    "description": "Artwork revealed by a moving mask.",
    "theme": "svg-effects",
    "categories": ["svg", "vector"],
    "tags": ["svg", "vector", "mask", "wipe", "reveal", "animation"],
    "tech": ["svg", "css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Inline SVG needs role=img and a title or aria-label when it carries meaning, and aria-hidden when it is decoration.",
    "customization": [
      { "name": "--dur", "description": "Wipe duration", "default": "3s" }
    ],
    "variations": ["Retune through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Reveals over vector art. An SVG mask can use gradients and shapes together, giving soft-edged wipes that clip-path cannot express."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 240px; }
    .fx svg { width: 100%; display: block; }
    .fx .mrect { animation: wipe 3s ease-in-out infinite; }
    @keyframes wipe { 0% { transform: translateX(-100%); } 55%, 100% { transform: translateX(0); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx"><svg viewBox="0 0 240 120" aria-hidden="true">
    <defs><mask id="mk"><rect class="mrect" width="240" height="120" fill="#fff"/></mask>
    <linearGradient id="ag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d1478c"/>
    <stop offset="1" stop-color="#c2891a"/></linearGradient></defs>
    <rect width="240" height="120" rx="14" fill="url(#ag)" mask="url(#mk)"/></svg></div>
</body>
</html>
