    "id": "pixel-sort-bands",

    "summary": "Horizontal bands smeared into streaks.",

    "categories": ["glitch", "distortion"],
    "tags": ["glitch", "distortion", "pixel-sort", "smear", "bands", "art"],

    "dependencies": [],

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 250px; height: 160px; border-radius: 10px; overflow: hidden;
      background: conic-gradient(from 200deg at 30% 40%, #f472b6, #fbbf24, #22d3ee, #f472b6); }
    .fx::after { content: ""; position: absolute; inset: 0; background: inherit; transform: scaleX(3); transform-origin: left;
      -webkit-mask-image: repeating-linear-gradient(180deg, #000 0 6px, transparent 6px 26px);
      mask-image: repeating-linear-gradient(180deg, #000 0 6px, transparent 6px 26px); }
  </style>
