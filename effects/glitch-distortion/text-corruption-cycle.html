<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Corrupting Text</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "text-corruption-cycle",
    "title": "Corrupting Text",
    "summary": "Characters randomly replaced with symbols.",
    "description": "Characters randomly replaced with symbols.",
    "theme": "glitch-distortion",
    "categories": ["glitch", "distortion"],
    "tags": ["glitch", "distortion", "corruption", "scramble", "text", "cycle"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "advanced",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Rapid flicker and high-contrast tearing can trigger discomfort — keep glitches brief and honour prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Text colour", "default": "#22d3ee" }
    ],
    "variations": ["Retune the palette", "Adjust the loop duration"],
    "ai_usage": "Loading and hacking sequences. Replace only a couple of characters per frame; scrambling everything makes the word unreadable rather than corrupted."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { font-family: ui-monospace, Menlo, monospace; font-size: 1.5rem; font-weight: 700; color: #22d3ee;
      letter-spacing: .05em; }
  </style>
</head>
<body>
  <div class="fx" id="cx">SYSTEM ONLINE</div>
  <script>
    (function () {
      var el = document.getElementById("cx"), base = el.textContent, junk = "!@#$%^&*<>?/\\|";
      setInterval(function () {
        var out = base.split("");
        for (var i = 0; i < 2; i++) {
          var k = Math.floor(Math.random() * out.length);
          if (out[k] !== " ") out[k] = junk[Math.floor(Math.random() * junk.length)];
        }
        el.textContent = out.join("");
        setTimeout(function () { el.textContent = base; }, 90);
      }, 900);
    })();
  </script>
</body>
</html>
