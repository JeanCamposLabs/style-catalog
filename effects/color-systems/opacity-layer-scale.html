<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alpha Scale</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "opacity-layer-scale",
    "title": "Alpha Scale",
    "summary": "A consistent set of transparency steps.",
    "description": "A consistent set of transparency steps.",
    "theme": "color-systems",
    "categories": ["color", "reference"],
    "tags": ["color", "tokens", "alpha", "opacity", "scale", "overlays"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Every colour pairing here is checked for contrast; semantic colours always ship with an icon or label so meaning is never colour-only.",
    "customization": [
      { "name": "--a", "description": "Alpha step", "default": "0.08" }
    ],
    "variations": ["Swap in your own scale", "Export as design tokens"],
    "ai_usage": "Overlays, borders, and hover tints. Standardise a handful of alpha values (4%, 8%, 14%, 25%, 45%) instead of inventing one per component — ad-hoc alphas are why dark UIs drift."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 290px; }
    .fx .row { display: flex; gap: 6px; }
    .fx .row i { flex: 1; height: 46px; border-radius: 8px; background: #7c5cff; }
    .fx .lbl { display: flex; gap: 6px; margin-top: .4rem; font-size: .66rem; color: #64748b; font-family: ui-monospace, monospace; }
    .fx .lbl span { flex: 1; text-align: center; }
  </style>
</head>
<body>
  <div class="fx"><div class="row"><i style="opacity:.04"></i><i style="opacity:.08"></i><i style="opacity:.14"></i>
  <i style="opacity:.25"></i><i style="opacity:.45"></i><i style="opacity:1"></i></div>
  <div class="lbl"><span>4%</span><span>8%</span><span>14%</span><span>25%</span><span>45%</span><span>100%</span></div></div>
</body>
</html>
