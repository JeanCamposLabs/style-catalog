<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WCAG Contrast Grid</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "contrast-grid",
    "title": "WCAG Contrast Grid",
    "summary": "Every foreground/background pair in a palette, scored against WCAG 2.1 contrast thresholds and labelled AAA / AA / AA-Large / fail.",
    "description": "A palette is only usable in the combinations that actually pass contrast, and that is not obvious by eye — mid-tone accents on dark surfaces fail far more often than designers expect. This specimen takes a set of tokens, computes the real WCAG 2.1 contrast ratio for every foreground-on-background pair, and renders the matrix with each cell showing its ratio and grade. The maths is the spec formula, not an approximation: sRGB channels are linearised, relative luminance is weighted 0.2126/0.7152/0.0722, and the ratio is (L_light + 0.05) / (L_dark + 0.05).",
    "theme": "color-systems",
    "categories": ["color", "accessibility", "design-tokens", "reference"],
    "tags": ["contrast", "wcag", "accessibility", "a11y", "color", "palette", "tokens", "luminance", "ratio", "audit"],

    "dependencies": [],
    "browser_support": "All modern browsers. Plain DOM and arithmetic, no color-space APIs required.",
    "performance_notes": "One pass over N×N pairs at load; a 6-token palette is 36 cells. Nothing animates and nothing recomputes unless the palette changes.",
    "accessibility_notes": "The grid is a real table with scope-ed headers, so it reads correctly in a screen reader. Grade is never carried by colour alone — every cell states its ratio and its grade as text. Note WCAG 2.1 ratios ignore how the eye actually responds at low luminance; APCA (WCAG 3 draft) scores dark-mode pairs more faithfully, so treat a bare pass on dark surfaces as a floor, not a target.",
    "customization": [
      { "name": "PALETTE", "description": "The tokens to cross-check — swap in your own name/hex pairs", "default": "6 tokens" },
      { "name": "thresholds", "description": "WCAG 2.1 cutoffs: 7 = AAA, 4.5 = AA, 3 = AA Large (18pt+/14pt bold) and non-text UI", "default": "7 / 4.5 / 3" }
    ],
    "variations": [
      "Restrict rows to text tokens and columns to surface tokens — the pairs you would actually ship",
      "Emit the failures as a build-time check that fails CI when a shipped pair regresses",
      "Score with APCA instead for dark-heavy interfaces",
      "Add a column for the smallest passing font size per pair"
    ],
    "related": ["semantic-color-tokens", "dark-mode-tokens", "oklch-gradient"],
    "ai_usage": "Use this to audit a palette BEFORE committing tokens, and to answer 'can I put this colour on that one'. Drop your tokens into PALETTE as {name, hex} and read the matrix.\n\nThe formula, if you are reimplementing it: convert each sRGB channel to 0–1, linearise with c <= 0.03928 ? c/12.92 : ((c+0.055)/1.055)^2.4, take L = 0.2126R + 0.7152G + 0.0722B, then ratio = (Llighter + 0.05) / (Ldarker + 0.05). Ratio runs 1 (identical) to 21 (black on white). Thresholds: 4.5 for body text (AA), 7 for AAA, 3 for large text (18pt / 14pt bold) and for non-text UI such as icons, focus rings, and input borders.\n\nApply it: body copy needs 4.5 minimum — do not ship a 3.2 accent as a text colour just because it looks fine to you on a calibrated display. Placeholder text, disabled states, and thin icon strokes are the usual silent failures. Contrast is symmetric, so the matrix is mirrored; you only need one triangle.\n\nCaveats worth passing on: WCAG 2.1 is known to be lenient on dark backgrounds and harsh on mid-tones, so a 4.6 on a near-black surface can still read poorly — prefer APCA there. And never encode pass/fail in colour alone in your own UI; state the number."

  <style>
    :root {
      --bg: #0b0d12;
      --surface: #12151f;
      --line: #262c3d;
      --text: #e7ebf3;
      --muted: #8b93a7;
      --pass: #2dd4bf;
      --warn: #f5b445;
      --fail: #f2555a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: system-ui, sans-serif; padding: 1rem;
      display: grid; align-content: center; justify-items: center;
    }
    table { border-collapse: collapse; font-size: .62rem; }
    caption {
      caption-side: top; text-align: left; padding-bottom: .6rem;
      font-size: .7rem; color: var(--muted); letter-spacing: .04em;
    }
    caption b { color: var(--text); font-weight: 600; letter-spacing: 0; }
    th, td { border: 1px solid var(--line); padding: .3rem .34rem; text-align: center; }
    thead th, tbody th { background: var(--surface); color: var(--muted); font-weight: 500; }
    tbody th { text-align: right; }
    .sw {
      display: inline-block; width: 9px; height: 9px; border-radius: 2px;
      margin-right: .28rem; vertical-align: -1px; border: 1px solid #ffffff22;
    }
    td { font-family: ui-monospace, Menlo, monospace; line-height: 1.25; }
    td .r { display: block; font-size: .68rem; font-weight: 600; }
    td .g { display: block; font-size: .52rem; letter-spacing: .06em; opacity: .85; }
    /* The ratio is drawn in the actual fg-on-bg pair, so a failing pair looks
       as bad as it scores. The grade beneath it carries an auto-picked ink so
       the reading is never itself a contrast failure. */
    td .g { border-radius: 3px; padding: 0 .2rem; font-weight: 700; }
    .self { color: #4a5268; }
  </style>
</head>
<body>
  <table id="grid">
    <caption><b>WCAG 2.1 contrast</b> — foreground (row) on background (column)</caption>
  </table>

  <script>
    // Swap these for your own tokens; everything below is derived.
    var PALETTE = [
      { name: "text",    hex: "#e7ebf3" },
      { name: "muted",   hex: "#8b93a7" },
      { name: "accent",  hex: "#7c5cff" },
      { name: "accent-2",hex: "#2dd4bf" },
      { name: "surface", hex: "#12151f" },
      { name: "bg",      hex: "#0b0d12" }
    ];

    // WCAG 2.1 relative luminance: linearise each sRGB channel, then weight it.
    function luminance(hex) {
      var n = parseInt(hex.slice(1), 16);
      var ch = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(function (v) {
        var c = v / 255;
        return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
      });
      return 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2];
    }
    function ratio(a, b) {
      var la = luminance(a), lb = luminance(b);
      var hi = Math.max(la, lb), lo = Math.min(la, lb);
      return (hi + 0.05) / (lo + 0.05);
    }
    // WCAG 2.1 cutoffs. 3 also covers non-text UI (icons, focus rings, borders).
    function grade(r) {
      if (r >= 7) return { cls: "aaa", label: "AAA" };
      if (r >= 4.5) return { cls: "aa", label: "AA" };
      if (r >= 3) return { cls: "aal", label: "AA LG" };
      return { cls: "no", label: "FAIL" };
    }

    // Black or white ink, whichever scores higher against this background.
    function pickInk(hex) {
      var onWhite = ratio(hex, "#ffffff"), onBlack = ratio(hex, "#000000");
      return onBlack >= onWhite
        ? { fg: "#000000", bg: "#ffffffcc" }
        : { fg: "#ffffff", bg: "#00000099" };
    }

    var table = document.getElementById("grid");
    var head = document.createElement("thead");
    var hr = document.createElement("tr");
    hr.appendChild(document.createElement("td"));
    PALETTE.forEach(function (c) {
      var th = document.createElement("th");
      th.scope = "col";
      th.innerHTML = '<span class="sw" style="background:' + c.hex + '"></span>' + c.name;
      hr.appendChild(th);
    });
    head.appendChild(hr);
    table.appendChild(head);

    var body = document.createElement("tbody");
    PALETTE.forEach(function (fg) {
      var tr = document.createElement("tr");
      var th = document.createElement("th");
      th.scope = "row";
      th.innerHTML = '<span class="sw" style="background:' + fg.hex + '"></span>' + fg.name;
      tr.appendChild(th);
      PALETTE.forEach(function (bg) {
        var td = document.createElement("td");
        if (fg.hex === bg.hex) {
          td.className = "self";
          td.innerHTML = '<span class="r">—</span><span class="g">SAME</span>';
        } else {
          var r = ratio(fg.hex, bg.hex), g = grade(r);
          td.style.background = bg.hex;
          td.style.color = fg.hex;
          var ink = pickInk(bg.hex);
          // Grade is stated as text, never carried by colour alone.
          td.innerHTML =
            '<span class="r">' + r.toFixed(2) + '</span>' +
            '<span class="g" style="color:' + ink.fg + ';background:' + ink.bg + '">' + g.label + '</span>';
        }
        tr.appendChild(td);
      });
      body.appendChild(tr);
    });
    table.appendChild(body);
  </script>
</body>
</html>
