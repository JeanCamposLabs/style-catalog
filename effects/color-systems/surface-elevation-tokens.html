<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Elevation Surfaces</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "surface-elevation-tokens",
    "title": "Elevation Surfaces",
    "summary": "Surfaces that lighten as they rise.",
    "description": "Surfaces that lighten as they rise.",
    "theme": "color-systems",
    "categories": ["color", "reference"],
    "tags": ["color", "tokens", "elevation", "surfaces", "depth", "dark-mode"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Every colour pairing here is checked for contrast; semantic colours always ship with an icon or label so meaning is never colour-only.",
    "customization": [
      { "name": "--s0", "description": "Base surface", "default": "#0b0d12" }
    ],
    "variations": ["Swap in your own scale", "Export as design tokens"],
    "ai_usage": "Dark-mode depth. In dark themes shadows barely read, so elevation is expressed by lightening the surface — four or five steps is usually enough for a whole product."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 290px; padding: 1rem; border-radius: 14px; background: #0b0d12; display: grid; gap: 8px; }
    .s { padding: .7rem .9rem; border-radius: 10px; font-size: .8rem; color: #cbd5e1; display: flex; justify-content: space-between; }
    .s b { font-family: ui-monospace, monospace; font-size: .68rem; color: #64748b; }
    .s0 { background: #0b0d12; border: 1px solid #1a2130; }
    .s1 { background: #10141f; } .s2 { background: #151b2a; } .s3 { background: #1c2437; } .s4 { background: #232c42; }
  </style>
</head>
<body>
  <div class="fx"><div class="s s0">Base<b>#0b0d12</b></div><div class="s s1">Raised<b>#10141f</b></div>
  <div class="s s2">Card<b>#151b2a</b></div><div class="s s3">Popover<b>#1c2437</b></div><div class="s s4">Dialog<b>#232c42</b></div></div>
</body>
</html>
