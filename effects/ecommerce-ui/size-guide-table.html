  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { border-collapse: collapse; font-size: .82rem; background: #151b2a; border-radius: 12px; overflow: hidden; }
    .fx th, .fx td { padding: .5rem .9rem; text-align: left; border-bottom: 1px solid #22304a; }
    .fx th { background: #1c2437; color: #8b93a7; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; }
    .fx tr.on td { background: #1e1740; color: #fff; }
    .fx td { color: #cbd5e1; }
  </style>
</head>
<body>
  <table class="fx"><caption class="sr" style="position:absolute;left:-9999px">Size guide</caption>
  <thead><tr><th scope="col">Size</th><th scope="col">Chest</th><th scope="col">Length</th></tr></thead>
  <tbody><tr><td>S</td><td>96 cm</td><td>68 cm</td></tr><tr class="on"><td>M</td><td>104 cm</td><td>71 cm</td></tr>
