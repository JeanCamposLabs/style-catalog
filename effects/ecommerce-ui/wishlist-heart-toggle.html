<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wishlist Toggle</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "wishlist-heart-toggle",
    "title": "Wishlist Toggle",
    "summary": "A heart that fills with a pop when saved.",
    "description": "A heart that fills with a pop when saved.",
    "theme": "ecommerce-ui",
    "categories": ["ecommerce", "commerce"],
    "tags": ["ecommerce", "shop", "wishlist", "heart", "save", "toggle"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Price, stock, and discount information must be in text, never only a colour or a badge shape.",
    "customization": [
      { "name": "--c", "description": "Saved colour", "default": "#fb7185" }
    ],
    "variations": ["Adapt to a light theme", "Compact variant for dense lists"],
    "ai_usage": "Save-for-later controls. The accessible name must change with state ('Save' vs 'Saved') — aria-pressed alone is often read too tersely."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 46px; height: 46px; border-radius: 50%; border: 1px solid #2b3450; background: #151b2a;
      color: #8b93a7; font-size: 1.2rem; cursor: pointer; transition: color .2s, border-color .2s; }
    .fx[aria-pressed="true"] { color: #fb7185; border-color: #fb7185; }
    .fx[aria-pressed="true"] span { animation: pop .4s cubic-bezier(.34,1.56,.64,1); }
    @keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.3); } 100% { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <button class="fx" type="button" aria-pressed="false" aria-label="Save to wishlist" id="wl"><span>♥</span></button>
  <script>
    (function () {
      var b = document.getElementById("wl");
      b.addEventListener("click", function () {
        var on = b.getAttribute("aria-pressed") !== "true";
        b.setAttribute("aria-pressed", String(on));
        b.setAttribute("aria-label", on ? "Saved to wishlist" : "Save to wishlist");
      });
    })();
  </script>
</body>
</html>
