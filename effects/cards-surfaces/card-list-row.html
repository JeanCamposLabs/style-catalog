<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>List Row Card</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "card-list-row",
    "title": "List Row Card",
    "summary": "A compact horizontal row with icon, text, and action.",
    "description": "A compact horizontal row with icon, text, and action. Self-contained card markup you can drop into a grid.",
    "theme": "cards-surfaces",
    "categories": ["card", "surface"],
    "tags": ["card", "surface", "row", "list", "compact", "item"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "A clickable card needs one real link or button inside it; never attach a click handler to a bare div.",
    "customization": [
      { "name": "--h", "description": "Row padding", "default": "0.9rem" }
    ],
    "variations": ["Adapt for a light theme", "Add a media area at the top"],
    "ai_usage": "Settings and file lists. min-width:0 on the flexible column is required or long text will refuse to truncate inside a flex row."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .card { width: 260px; border-radius: 18px; padding: 1.4rem; }
    .card h3 { margin: 0 0 .4rem; font-size: 1.05rem; }
    .card p { margin: 0; color: #8b93a7; font-size: .88rem; line-height: 1.5; }
    .card { display: flex; align-items: center; gap: .9rem; padding: .9rem 1rem; background: #151b2a;
      border: 1px solid #263149; border-radius: 14px; }
    .card .ic { flex: none; width: 40px; height: 40px; border-radius: 11px; background: #22304a; display: grid; place-items: center; }
    .card .txt { flex: 1; min-width: 0; }
    .card h3 { font-size: .95rem; margin: 0; }
    .card p { font-size: .8rem; margin: 0; }
    .card .go { color: #8b93a7; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <article class="card"><span class="ic" aria-hidden="true">📁</span><div class="txt"><h3>Design assets</h3><p>24 files · 82 MB</p></div><span class="go" aria-hidden="true">›</span></article>
</body>
</html>
