<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stacked Paper Card</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "card-stacked-shadow",
    "title": "Stacked Paper Card",
    "summary": "Two offset sheets peek out behind the card.",
    "description": "Two offset sheets peek out behind the card. Self-contained card markup you can drop into a grid.",
    "theme": "cards-surfaces",
    "categories": ["card", "surface"],
    "tags": ["card", "surface", "stack", "paper", "layers", "depth"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "A clickable card needs one real link or button inside it; never attach a click handler to a bare div.",
    "customization": [
      { "name": "--off", "description": "Sheet offset", "default": "8px" }
    ],
    "variations": ["Adapt for a light theme", "Add a media area at the top"],
    "ai_usage": "Collections and albums where a card represents many items. Offset the sheets diagonally by a few pixels; large offsets read as separate cards."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .card { width: 260px; border-radius: 18px; padding: 1.4rem; }
    .card h3 { margin: 0 0 .4rem; font-size: 1.05rem; }
    .card p { margin: 0; color: #8b93a7; font-size: .88rem; line-height: 1.5; }
    .wrap { position: relative; }
    .wrap::before, .wrap::after { content: ""; position: absolute; inset: 0; border-radius: 18px; background: #131828; border: 1px solid #222b40; }
    .wrap::before { transform: translate(8px, 8px); }
    .wrap::after { transform: translate(4px, 4px); }
    .card { position: relative; background: #151b2a; border: 1px solid #2b3450; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap"><article class="card"><h3>3 documents</h3><p>Stacked sheets imply a collection.</p></article></div>
</body>
</html>
