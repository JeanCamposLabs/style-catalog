<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Media Card</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "card-media-top",
    "title": "Media Card",
    "summary": "A card with a 16:9 media area above the copy.",
    "description": "A card with a 16:9 media area above the copy. Self-contained card markup you can drop into a grid.",
    "theme": "cards-surfaces",
    "categories": ["card", "surface"],
    "tags": ["card", "surface", "media", "image", "aspect-ratio", "grid"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "A clickable card needs one real link or button inside it; never attach a click handler to a bare div.",
    "customization": [
      { "name": "--ratio", "description": "Media ratio", "default": "16 / 9" }
    ],
    "variations": ["Adapt for a light theme", "Add a media area at the top"],
    "ai_usage": "Article and product grids. Fix the media with aspect-ratio so cards in a row stay the same height regardless of image dimensions."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .card { width: 260px; border-radius: 18px; padding: 1.4rem; }
    .card h3 { margin: 0 0 .4rem; font-size: 1.05rem; }
    .card p { margin: 0; color: #8b93a7; font-size: .88rem; line-height: 1.5; }
    .card { background: #151b2a; border: 1px solid #263149; padding: 0; overflow: hidden; }
    .card .media { aspect-ratio: 16 / 9; background: conic-gradient(from 200deg at 40% 35%, #7c5cff, #2dd4bf, #f472b6); }
    .card .body { padding: 1.2rem 1.4rem 1.4rem; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <article class="card"><div class="media"></div><div class="body"><h3>Media Card</h3><p>Fixed aspect ratio keeps the grid even.</p></div></article>
</body>
</html>
