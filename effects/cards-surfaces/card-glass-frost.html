<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Frosted Card</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "card-glass-frost",
    "title": "Frosted Card",
    "summary": "A translucent card on a colourful backdrop.",
    "description": "A translucent card on a colourful backdrop. Self-contained card markup you can drop into a grid.",
    "theme": "cards-surfaces",
    "categories": ["card", "surface"],
    "tags": ["card", "surface", "glass", "frost", "translucent", "overlay"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "A clickable card needs one real link or button inside it; never attach a click handler to a bare div.",
    "customization": [
      { "name": "--blur", "description": "Backdrop blur", "default": "16px" }
    ],
    "variations": ["Adapt for a light theme", "Add a media area at the top"],
    "ai_usage": "Cards over imagery or video. Always include a solid @supports fallback; without backdrop-filter the card becomes near-invisible."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .card { width: 260px; border-radius: 18px; padding: 1.4rem; }
    .card h3 { margin: 0 0 .4rem; font-size: 1.05rem; }
    .card p { margin: 0; color: #8b93a7; font-size: .88rem; line-height: 1.5; }
    body { background: conic-gradient(from 150deg at 40% 30%, #7c5cff, #2dd4bf, #f472b6, #7c5cff); }
    .card { background: rgba(255,255,255,.13); backdrop-filter: blur(16px) saturate(1.6);
      -webkit-backdrop-filter: blur(16px) saturate(1.6); border: 1px solid rgba(255,255,255,.3); color: #fff; }
    .card p { color: rgba(255,255,255,.82); }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <article class="card"><h3>Frosted Card</h3><p>A translucent card on a colourful backdrop.</p></article>
</body>
</html>
