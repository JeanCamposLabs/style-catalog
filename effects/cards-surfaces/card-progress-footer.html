<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Card with Progress</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "card-progress-footer",
    "title": "Card with Progress",
    "summary": "A progress bar pinned to the card's bottom edge.",
    "description": "A progress bar pinned to the card's bottom edge. Self-contained card markup you can drop into a grid.",
    "theme": "cards-surfaces",
    "categories": ["card", "surface"],
    "tags": ["card", "surface", "progress", "status", "footer", "project"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "A clickable card needs one real link or button inside it; never attach a click handler to a bare div.",
    "customization": [
      { "name": "--c", "description": "Bar colour", "default": "#34d399" }
    ],
    "variations": ["Adapt for a light theme", "Add a media area at the top"],
    "ai_usage": "Project and course cards. Give the bar role=progressbar with aria-valuenow so the percentage is available to assistive tech."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .card { width: 260px; border-radius: 18px; padding: 1.4rem; }
    .card h3 { margin: 0 0 .4rem; font-size: 1.05rem; }
    .card p { margin: 0; color: #8b93a7; font-size: .88rem; line-height: 1.5; }
    .card { position: relative; background: #151b2a; border: 1px solid #263149; overflow: hidden; padding-bottom: 1.7rem; }
    .card .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: #22304a; }
    .card .bar i { display: block; height: 100%; width: 64%; background: #34d399; }
    .card .pct { position: absolute; right: 1rem; bottom: .5rem; font-size: .75rem; color: #8b93a7; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <article class="card"><h3>Onboarding</h3><p>7 of 11 steps complete.</p>
  <span class="pct">64%</span><div class="bar" role="progressbar" aria-valuenow="64" aria-valuemin="0" aria-valuemax="100"><i></i></div></article>
</body>
</html>
