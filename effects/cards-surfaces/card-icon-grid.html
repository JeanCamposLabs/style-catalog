<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Icon Feature Card</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "card-icon-grid",
    "title": "Icon Feature Card",
    "summary": "An icon block above a short feature description.",
    "description": "An icon block above a short feature description. Self-contained card markup you can drop into a grid.",
    "theme": "cards-surfaces",
    "categories": ["card", "surface"],
    "tags": ["card", "surface", "icon", "feature", "marketing", "grid"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "A clickable card needs one real link or button inside it; never attach a click handler to a bare div.",
    "customization": [
      { "name": "--g", "description": "Icon gradient", "default": "linear-gradient(135deg,#7c5cff,#2dd4bf)" }
    ],
    "variations": ["Adapt for a light theme", "Add a media area at the top"],
    "ai_usage": "Feature sections. Keep every icon block the same size across the grid so the headings share a baseline — mismatched icons are the usual cause of ragged feature rows."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .card { width: 260px; border-radius: 18px; padding: 1.4rem; }
    .card h3 { margin: 0 0 .4rem; font-size: 1.05rem; }
    .card p { margin: 0; color: #8b93a7; font-size: .88rem; line-height: 1.5; }
    .card { background: #151b2a; border: 1px solid #263149; }
    .card .ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 1.2rem;
      background: linear-gradient(135deg, #7c5cff, #2dd4bf); color: #0b0d12; margin-bottom: .9rem; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <article class="card"><div class="ic" aria-hidden="true">⚡</div><h3>Instant deploys</h3><p>Ship in seconds with atomic rollbacks.</p></article>
</body>
</html>
