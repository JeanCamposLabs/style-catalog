<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stat Tile</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "card-stat-tile",
    "title": "Stat Tile",
    "summary": "A metric card with a delta indicator.",
    "description": "A metric card with a delta indicator. Self-contained card markup you can drop into a grid.",
    "theme": "cards-surfaces",
    "categories": ["card", "surface"],
    "tags": ["card", "surface", "stat", "metric", "dashboard", "kpi"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "A clickable card needs one real link or button inside it; never attach a click handler to a bare div.",
    "customization": [
      { "name": "--up", "description": "Positive colour", "default": "#34d399" }
    ],
    "variations": ["Adapt for a light theme", "Add a media area at the top"],
    "ai_usage": "Dashboards. Pair the delta with an arrow glyph as well as colour so the direction survives a monochrome print or colour-blind viewing."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .card { width: 260px; border-radius: 18px; padding: 1.4rem; }
    .card h3 { margin: 0 0 .4rem; font-size: 1.05rem; }
    .card p { margin: 0; color: #8b93a7; font-size: .88rem; line-height: 1.5; }
    .card { background: #151b2a; border: 1px solid #263149; }
    .card .n { font-size: 2.1rem; font-weight: 900; letter-spacing: -.02em; }
    .card .lbl { color: #8b93a7; font-size: .82rem; }
    .card .delta { display: inline-flex; gap: .25rem; align-items: center; margin-top: .6rem; padding: .2rem .5rem;
      border-radius: 999px; background: rgba(52,211,153,.14); color: #34d399; font-size: .78rem; font-weight: 700; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <article class="card"><div class="lbl">Monthly revenue</div><div class="n">$48,290</div><span class="delta">▲ 12.4%</span></article>
</body>
</html>
