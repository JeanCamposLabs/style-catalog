<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Neon Card</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "card-neon-outline",
    "title": "Neon Card",
    "summary": "A dark card with a saturated glowing edge.",
    "description": "A dark card with a saturated glowing edge. Self-contained card markup you can drop into a grid.",
    "theme": "cards-surfaces",
    "categories": ["card", "surface"],
    "tags": ["card", "surface", "neon", "glow", "dark", "cyberpunk"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "A clickable card needs one real link or button inside it; never attach a click handler to a bare div.",
    "customization": [
      { "name": "--c", "description": "Neon colour", "default": "#ff2d95" }
    ],
    "variations": ["Adapt for a light theme", "Add a media area at the top"],
    "ai_usage": "Dark, high-energy interfaces. Keep body text at normal weight and near-white — glowing text over a glowing border destroys readability."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .card { width: 260px; border-radius: 18px; padding: 1.4rem; }
    .card h3 { margin: 0 0 .4rem; font-size: 1.05rem; }
    .card p { margin: 0; color: #8b93a7; font-size: .88rem; line-height: 1.5; }
    .card { background: #12101c; border: 1px solid #ff2d95; box-shadow: 0 0 12px rgba(255,45,149,.55), inset 0 0 18px rgba(255,45,149,.18); }
    .card p { color: #c3b3c9; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <article class="card"><h3>Neon Card</h3><p>A dark card with a saturated glowing edge.</p></article>
</body>
</html>
