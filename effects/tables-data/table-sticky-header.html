<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sticky Header Table</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "table-sticky-header",
    "title": "Sticky Header Table",
    "summary": "Column headers that stay put while rows scroll.",
    "description": "Column headers that stay put while rows scroll.",
    "theme": "tables-data",
    "categories": ["table", "data"],
    "tags": ["table", "data", "sticky", "header", "scroll", "table"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Use real table markup with <th scope> and a <caption>; sortable headers need aria-sort, and row selection needs real checkboxes.",
    "customization": [
      { "name": "--hd", "description": "Header background", "default": "#1c2437" }
    ],
    "variations": ["Swap in your own brand ramp and re-run the palette validator", "Add a table view of the same data"],
    "ai_usage": "Long tables. position:sticky on <th> needs a background colour or rows show through; keep the header row a single line so the sticky offset is predictable."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 300px; max-height: 190px; overflow: auto; border-radius: 12px; border: 1px solid #263149; }
    .fx table { width: 100%; border-collapse: collapse; font-size: .82rem; }
    .fx th { position: sticky; top: 0; background: #1c2437; color: #8b93a7; text-align: left; padding: .55rem .8rem;
      font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; }
    .fx td { padding: .55rem .8rem; border-top: 1px solid #1e2740; color: #cbd5e1; }
    .fx tbody tr:hover td { background: #151b2a; }
  </style>
</head>
<body>
  <div class="fx"><table><caption class="sr" style="position:absolute;left:-9999px">Recent builds</caption>
  <thead><tr><th scope="col">Build</th><th scope="col">Theme</th><th scope="col">Count</th></tr></thead>
  <tbody><tr><td>0.24.7</td><td>Loaders</td><td>32</td></tr><tr><td>0.24.6</td><td>Text</td><td>36</td></tr>
  <tr><td>0.24.5</td><td>Buttons</td><td>29</td></tr><tr><td>0.24.4</td><td>Backgrounds</td><td>39</td></tr>
  <tr><td>0.24.3</td><td>Patterns</td><td>43</td></tr><tr><td>0.24.2</td><td>Masks</td><td>20</td></tr></tbody></table></div>
</body>
</html>
