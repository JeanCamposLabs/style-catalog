<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sortable Columns</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "table-sortable-columns",
    "title": "Sortable Columns",
    "summary": "Headers with sort direction indicators.",
    "description": "Headers with sort direction indicators.",
    "theme": "tables-data",
    "categories": ["table", "data"],
    "tags": ["table", "data", "sort", "columns", "aria-sort", "interactive"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Use real table markup with <th scope> and a <caption>; sortable headers need aria-sort, and row selection needs real checkboxes.",
    "customization": [
      { "name": "--hd", "description": "Header background", "default": "#1c2437" }
    ],
    "variations": ["Swap in your own brand ramp and re-run the palette validator", "Add a table view of the same data"],
    "ai_usage": "Sortable data grids. Set aria-sort to ascending/descending on the active header only, and make the header content a button so it is keyboard-operable."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 300px; border-radius: 12px; border: 1px solid #263149; overflow: hidden; }
    .fx table { width: 100%; border-collapse: collapse; font-size: .82rem; }
    .fx th { background: #1c2437; padding: 0; }
    .fx th button { width: 100%; display: flex; justify-content: space-between; gap: .4rem; padding: .55rem .8rem;
      border: 0; background: transparent; color: #8b93a7; font: inherit; font-size: .7rem; text-transform: uppercase;
      letter-spacing: .06em; cursor: pointer; }
    .fx th[aria-sort] button { color: #e7ebf3; }
    .fx th button .ar { opacity: .35; }
    .fx th[aria-sort] button .ar { opacity: 1; }
    .fx td { padding: .55rem .8rem; border-top: 1px solid #1e2740; color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="fx"><table><caption class="sr" style="position:absolute;left:-9999px">Themes by size</caption>
  <thead><tr><th scope="col"><button type="button">Theme <span class="ar">↕</span></button></th>
  <th scope="col" aria-sort="descending"><button type="button">Effects <span class="ar">↓</span></button></th></tr></thead>
  <tbody><tr><td>Patterns</td><td>43</td></tr><tr><td>Backgrounds</td><td>39</td></tr><tr><td>Text</td><td>36</td></tr></tbody></table></div>
</body>
</html>
