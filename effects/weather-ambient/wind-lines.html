<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wind Streaks</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "wind-lines",
    "title": "Wind Streaks",
    "summary": "Curved streaks blowing across the frame.",
    "description": "Curved streaks blowing across the frame.",
    "theme": "weather-ambient",
    "categories": ["weather", "ambient"],
    "tags": ["weather", "ambient", "wind", "streaks", "motion", "speed"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Flashing weather effects (lightning) can be a seizure risk — keep flashes infrequent, low-contrast, and disabled under reduced motion.",
    "customization": [
      { "name": "--c", "description": "Streak colour", "default": "rgba(226,232,240,.6)" }
    ],
    "variations": ["Retune the palette", "Slow it down for an ambient version"],
    "ai_usage": "Wind speed and motion cues. Fade both ends of each streak so they enter and leave without a hard edge."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 260px; height: 150px; border-radius: 14px; overflow: hidden; background: #0f172a; }
    .fx i { position: absolute; height: 2px; border-radius: 99px; background: linear-gradient(90deg, transparent, rgba(226,232,240,.6), transparent);
      animation: blow var(--d) linear infinite; animation-delay: var(--dl); }
    @keyframes blow { from { transform: translateX(-120%); } to { transform: translateX(320%); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx"><i style="top:26%;left:0;width:70px;--d:2.4s;--dl:0s"></i><i style="top:46%;left:0;width:110px;--d:3.1s;--dl:-.8s"></i>
  <i style="top:66%;left:0;width:56px;--d:2s;--dl:-1.4s"></i></div>
</body>
</html>
