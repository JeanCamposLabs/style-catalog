<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sun Rays</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "sun-rays-rotate",
    "title": "Sun Rays",
    "summary": "A sun with slowly rotating light rays.",
    "description": "A sun with slowly rotating light rays.",
    "theme": "weather-ambient",
    "categories": ["weather", "ambient"],
    "tags": ["weather", "ambient", "sun", "rays", "conic", "warm"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Flashing weather effects (lightning) can be a seizure risk — keep flashes infrequent, low-contrast, and disabled under reduced motion.",
    "customization": [
      { "name": "--c", "description": "Sun colour", "default": "#f59e0b" }
    ],
    "variations": ["Retune the palette", "Slow it down for an ambient version"],
    "ai_usage": "Weather and summer themes. A repeating-conic gradient makes every ray in one declaration; rotate slowly (30s+) so it stays ambient."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 180px; height: 180px; display: grid; place-items: center; }
    .fx .rays { position: absolute; inset: 0; border-radius: 50%;
      background: repeating-conic-gradient(from 0deg, rgba(251,191,36,.35) 0 6deg, transparent 6deg 18deg);
      animation: spin 30s linear infinite; }
    .fx .core { width: 84px; height: 84px; border-radius: 50%; background: radial-gradient(circle at 38% 32%, #fef08a, #f59e0b);
      box-shadow: 0 0 40px rgba(251,191,36,.7); }
    @keyframes spin { to { transform: rotate(1turn); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx"><span class="rays"></span><span class="core"></span></div>
</body>
</html>
