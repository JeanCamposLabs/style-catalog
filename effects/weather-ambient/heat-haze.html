<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Heat Haze</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "heat-haze",
    "title": "Heat Haze",
    "summary": "A shimmering distortion rising from a hot surface.",
    "description": "A shimmering distortion rising from a hot surface.",
    "theme": "weather-ambient",
    "categories": ["weather", "ambient"],
    "tags": ["weather", "ambient", "heat", "haze", "distortion", "desert"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Flashing weather effects (lightning) can be a seizure risk — keep flashes infrequent, low-contrast, and disabled under reduced motion.",
    "customization": [
      { "name": "--dur", "description": "Shimmer period", "default": "2.4s" }
    ],
    "variations": ["Retune the palette", "Slow it down for an ambient version"],
    "ai_usage": "Desert and summer scenes. A striped mask over a small backdrop blur costs far less than a turbulence filter and reads the same at this scale."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 250px; height: 160px; border-radius: 14px; overflow: hidden;
      background: linear-gradient(180deg, #fbbf24, #b45309); }
    .fx::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(1.5px);
      -webkit-mask-image: repeating-linear-gradient(180deg, #000 0 4px, transparent 4px 9px);
      mask-image: repeating-linear-gradient(180deg, #000 0 4px, transparent 4px 9px);
      animation: shimmer 2.4s ease-in-out infinite alternate; }
    @keyframes shimmer { from { transform: translateY(0) scaleX(1); } to { transform: translateY(-5px) scaleX(1.02); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx"></div>
</body>
</html>
