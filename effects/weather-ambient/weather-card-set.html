<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weather Card</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "weather-card-set",
    "title": "Weather Card",
    "summary": "A forecast card with an animated condition icon.",
    "description": "A forecast card with an animated condition icon.",
    "theme": "weather-ambient",
    "categories": ["weather", "ambient"],
    "tags": ["weather", "ambient", "weather", "card", "forecast", "widget"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Flashing weather effects (lightning) can be a seizure risk — keep flashes infrequent, low-contrast, and disabled under reduced motion.",
    "customization": [
      { "name": "--a", "description": "Card gradient start", "default": "#1d4ed8" }
    ],
    "variations": ["Retune the palette", "Slow it down for an ambient version"],
    "ai_usage": "Weather widgets. Encode the condition in text as well as the icon — an emoji or glyph alone is not a reliable label."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 220px; padding: 1.2rem; border-radius: 18px; color: #fff;
      background: linear-gradient(160deg, #1d4ed8, #0c4a6e); box-shadow: 0 18px 40px rgba(29,78,216,.35); }
    .fx .top { display: flex; justify-content: space-between; align-items: flex-start; }
    .fx .t { font-size: 2.6rem; font-weight: 900; line-height: 1; }
    .fx .c { font-size: 2rem; animation: bob 3s ease-in-out infinite alternate; }
    .fx .meta { margin-top: 1rem; display: flex; justify-content: space-between; font-size: .78rem; opacity: .8; }
    @keyframes bob { to { transform: translateY(-6px); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx"><div class="top"><div><div class="t">18°</div><div>Partly cloudy</div></div><div class="c" aria-hidden="true">⛅</div></div>
  <div class="meta"><span>H 21°</span><span>L 12°</span><span>Wind 8 km/h</span></div></div>
</body>
</html>
