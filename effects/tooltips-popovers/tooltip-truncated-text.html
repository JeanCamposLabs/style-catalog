<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Truncation Tooltip</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "tooltip-truncated-text",
    "title": "Truncation Tooltip",
    "summary": "A hint that appears only when text is actually clipped.",
    "description": "A hint that appears only when text is actually clipped.",
    "theme": "tooltips-popovers",
    "categories": ["tooltip", "overlay"],
    "tags": ["tooltip", "popover", "truncation", "ellipsis", "conditional", "table"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Hover-only content is unreachable by keyboard and touch: show on focus too, link with aria-describedby, and never put interactive content in a hover tooltip.",
    "customization": [
      { "name": "--w", "description": "Column width", "default": "240px" }
    ],
    "variations": ["Recolour through the custom properties", "Scale it for a compact variant"],
    "ai_usage": "Data tables. Compare scrollWidth to clientWidth and only set the title when the text overflows — an always-present tooltip that duplicates visible text is noise."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .row { width: 240px; }
    .name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: .55rem .8rem;
      background: #151b2a; border: 1px solid #263149; border-radius: 10px; color: #e7ebf3; }
    .hint { margin-top: .6rem; color: #8b93a7; font-size: .78rem; }
  </style>
</head>
<body>
  <div class="row"><span class="name" id="nm">quarterly-financial-projection-2026-final-v7.xlsx</span>
  <p class="hint">The title attribute is added only when the text is clipped.</p></div>
  <script>
    (function () {
      var el = document.getElementById("nm");
      if (el.scrollWidth > el.clientWidth) el.title = el.textContent;
    })();
  </script>
</body>
</html>
