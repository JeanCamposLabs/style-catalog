<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Four-Side Tooltip</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "tooltip-arrow-positions",
    "title": "Four-Side Tooltip",
    "summary": "The same tooltip anchored on all four sides.",
    "description": "The same tooltip anchored on all four sides.",
    "theme": "tooltips-popovers",
    "categories": ["tooltip", "overlay"],
    "tags": ["tooltip", "popover", "positions", "arrow", "sides", "reference"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Hover-only content is unreachable by keyboard and touch: show on focus too, link with aria-describedby, and never put interactive content in a hover tooltip.",
    "customization": [
      { "name": "--bg", "description": "Tooltip background", "default": "#1f2637" }
    ],
    "variations": ["Recolour through the custom properties", "Scale it for a compact variant"],
    "ai_usage": "Reference set for a tooltip component. Ship all four placements and flip automatically near viewport edges — a fixed placement will be clipped somewhere."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .grid { display: grid; grid-template-columns: repeat(2, 130px); gap: 2.6rem; }
    .t { position: relative; display: grid; place-items: center; }
    .t button { padding: .5rem .9rem; border-radius: 9px; border: 1px solid #2b3450; background: #151b2a; color: #e7ebf3; font: inherit; }
    .bub { position: absolute; white-space: nowrap; padding: .35rem .6rem; border-radius: 7px; background: #1f2637; color: #e7ebf3;
      font-size: .78rem; opacity: 0; transition: opacity .18s; pointer-events: none; }
    .t:hover .bub, .t button:focus-visible + .bub { opacity: 1; }
    .bub::after { content: ""; position: absolute; border: 5px solid transparent; }
    .top .bub { bottom: calc(100% + 8px); } .top .bub::after { top: 100%; left: 50%; translate: -50% 0; border-top-color: #1f2637; }
    .bottom .bub { top: calc(100% + 8px); } .bottom .bub::after { bottom: 100%; left: 50%; translate: -50% 0; border-bottom-color: #1f2637; }
    .left .bub { right: calc(100% + 8px); } .left .bub::after { left: 100%; top: 50%; translate: 0 -50%; border-left-color: #1f2637; }
    .right .bub { left: calc(100% + 8px); } .right .bub::after { right: 100%; top: 50%; translate: 0 -50%; border-right-color: #1f2637; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="grid">
    <span class="t top"><button type="button" aria-describedby="a">Top</button><span class="bub" id="a" role="tooltip">Above</span></span>
    <span class="t bottom"><button type="button" aria-describedby="b">Bottom</button><span class="bub" id="b" role="tooltip">Below</span></span>
    <span class="t left"><button type="button" aria-describedby="c">Left</button><span class="bub" id="c" role="tooltip">Before</span></span>
    <span class="t right"><button type="button" aria-describedby="d">Right</button><span class="bub" id="d" role="tooltip">After</span></span>
  </div>
</body>
</html>
