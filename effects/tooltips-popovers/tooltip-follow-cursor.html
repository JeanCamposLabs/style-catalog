<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cursor-Following Tooltip</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "tooltip-follow-cursor",
    "title": "Cursor-Following Tooltip",
    "summary": "A hint that trails the pointer across a region.",
    "description": "A hint that trails the pointer across a region.",
    "theme": "tooltips-popovers",
    "categories": ["tooltip", "overlay"],
    "tags": ["tooltip", "popover", "cursor", "follow", "chart", "hint"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Hover-only content is unreachable by keyboard and touch: show on focus too, link with aria-describedby, and never put interactive content in a hover tooltip.",
    "customization": [
      { "name": "--c", "description": "Tip colour", "default": "#7c5cff" }
    ],
    "variations": ["Recolour through the custom properties", "Scale it for a compact variant"],
    "ai_usage": "Charts and maps where the hint must track a value under the pointer. Offset it from the cursor so it never sits under the pointer itself."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .zone { width: 300px; height: 170px; border-radius: 14px; border: 1px dashed #2b3450; display: grid; place-items: center;
      color: #8b93a7; background: #10141f; }
    .tip { position: fixed; padding: .3rem .6rem; border-radius: 7px; background: #7c5cff; color: #fff; font-size: .78rem;
      font-weight: 600; pointer-events: none; opacity: 0; transition: opacity .15s; translate: 12px 12px; }
    .zone:hover ~ .tip { opacity: 1; }
  </style>
</head>
<body>
  <div class="zone">Move across this area</div><div class="tip" id="tip" role="status">x: 0</div>
  <script>
    (function () {
      var z = document.querySelector(".zone"), t = document.getElementById("tip");
      z.addEventListener("pointermove", function (e) {
        var r = z.getBoundingClientRect();
        t.style.left = e.clientX + "px"; t.style.top = e.clientY + "px";
        t.textContent = "x: " + Math.round(e.clientX - r.left);
      });
    })();
  </script>
</body>
</html>
