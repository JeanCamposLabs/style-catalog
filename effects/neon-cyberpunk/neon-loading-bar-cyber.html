<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cyber Loading Bar</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "neon-loading-bar-cyber",
    "title": "Cyber Loading Bar",
    "summary": "An angular loading bar with a chevron fill.",
    "description": "An angular loading bar with a chevron fill.",
    "theme": "neon-cyberpunk",
    "categories": ["neon", "cyberpunk"],
    "tags": ["neon", "glow", "dark", "loading", "angular", "cyber", "bar"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Saturated glow on black is hard to read: keep body copy near-white and unglowing, and reserve neon for accents.",
    "customization": [
      { "name": "--c", "description": "Bar colour", "default": "#22d3ee" }
    ],
    "variations": ["Retune the palette via the custom properties", "Slow the motion for an ambient version"],
    "ai_usage": "Sci-fi loading states. Skewed clip-path plus marching chevrons gives the genre look without any extra assets."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 280px; height: 22px; background: #0a1520; border: 1px solid #22d3ee;
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 100%, 10px 100%); overflow: hidden; }
    .fx i { display: block; height: 100%; width: 62%;
      background: repeating-linear-gradient(115deg, #22d3ee 0 10px, #0e7490 10px 20px); animation: march .8s linear infinite; }
    @keyframes march { to { background-position: 22px 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx" role="progressbar" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100"><i></i></div>
</body>
</html>
