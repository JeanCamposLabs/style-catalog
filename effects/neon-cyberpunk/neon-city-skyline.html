  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;

      background: linear-gradient(180deg, #2a0a3d, #0a0316); }
    .fx .b { position: absolute; bottom: 0; background: #06010f; box-shadow: 0 0 22px rgba(168,85,247,.5); }
    .fx .w { position: absolute; width: 3px; height: 3px; background: #fbbf24; box-shadow: 0 0 5px #fbbf24; }
