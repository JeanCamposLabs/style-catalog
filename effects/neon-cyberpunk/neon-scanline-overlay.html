  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 280px; height: 170px; border-radius: 12px; overflow: hidden;
      background: linear-gradient(135deg, #0a1520, #06101a); }
    .fx::before { content: ""; position: absolute; inset: 0;
      background: repeating-linear-gradient(180deg, rgba(34,211,238,.09) 0 1px, transparent 1px 3px); }
    .fx::after { content: ""; position: absolute; left: 0; right: 0; height: 40px;
      background: linear-gradient(180deg, transparent, rgba(34,211,238,.16), transparent); animation: roll 4s linear infinite; }
    @keyframes roll { from { top: -40px; } to { top: 100%; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
