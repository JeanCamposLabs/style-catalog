<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HUD Frame</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "neon-hud-frame",
    "title": "HUD Frame",
    "summary": "A targeting frame with corner brackets and a scan line.",
    "description": "A targeting frame with corner brackets and a scan line.",
    "theme": "neon-cyberpunk",
    "categories": ["neon", "cyberpunk"],
    "tags": ["neon", "glow", "dark", "hud", "frame", "scan", "sci-fi"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Saturated glow on black is hard to read: keep body copy near-white and unglowing, and reserve neon for accents.",
    "customization": [
      { "name": "--c", "description": "HUD colour", "default": "#22d3ee" }
    ],
    "variations": ["Retune the palette via the custom properties", "Slow the motion for an ambient version"],
    "ai_usage": "Game and sci-fi overlays. Corner brackets plus one moving scan line read as a HUD; a full border reads as a plain box."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 260px; height: 170px; border: 1px solid rgba(34,211,238,.4); }
    .fx::before, .fx::after { content: ""; position: absolute; width: 26px; height: 26px; border: 2px solid #22d3ee; }
    .fx::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
    .fx::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
    .fx i { position: absolute; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, #22d3ee, transparent);
      animation: scan 2.6s ease-in-out infinite; }
    @keyframes scan { 0%, 100% { top: 4%; } 50% { top: 94%; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx"><i></i></div>
</body>
</html>
