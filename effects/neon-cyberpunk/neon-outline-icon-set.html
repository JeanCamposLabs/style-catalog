<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Neon Icon Row</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "neon-outline-icon-set",
    "title": "Neon Icon Row",
    "summary": "Three glowing outline icons with hover ignition.",
    "description": "Three glowing outline icons with hover ignition.",
    "theme": "neon-cyberpunk",
    "categories": ["neon", "cyberpunk"],
    "tags": ["neon", "glow", "dark", "icons", "outline", "hover", "row"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Saturated glow on black is hard to read: keep body copy near-white and unglowing, and reserve neon for accents.",
    "customization": [
      { "name": "--c", "description": "Icon colour", "default": "#22d3ee" }
    ],
    "variations": ["Retune the palette via the custom properties", "Slow the motion for an ambient version"],
    "ai_usage": "Icon navigation in dark UIs. Keep the resting state visible at 3:1 contrast so icons are discoverable before hover."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .row { display: flex; gap: 14px; }
    .ic { width: 62px; height: 62px; border-radius: 14px; border: 2px solid #22d3ee; display: grid; place-items: center;
      color: #22d3ee; font-size: 1.4rem; background: rgba(8,20,26,.6); transition: box-shadow .25s, color .25s; }
    .ic:hover { color: #fff; box-shadow: 0 0 14px #22d3ee, inset 0 0 16px rgba(34,211,238,.35); }
  </style>
</head>
<body>
  <div class="row"><span class="ic">◈</span><span class="ic">◉</span><span class="ic">◬</span></div>
</body>
</html>
