<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mechanical Keycaps</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "keycap-mechanical-row",
    "title": "Mechanical Keycaps",
    "summary": "A row of keys with a physical press.",
    "description": "A row of keys with a physical press.",
    "theme": "keyboard-input",
    "categories": ["keyboard", "input"],
    "tags": ["keyboard", "shortcut", "keycap", "mechanical", "press", "keyboard"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Shortcut hints must reflect the user's platform, and no action should be reachable only by a shortcut.",
    "customization": [
      { "name": "--h", "description": "Cap height", "default": "5px" }
    ],
    "variations": ["Reskin through the custom properties", "Swap the copy for your own"],
    "ai_usage": "Keyboard demos and shortcut teaching. The press must travel exactly the shadow height so the cap meets its own base; anything else looks like it floats."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: flex; gap: 6px; }
    .fx button { min-width: 46px; height: 46px; border: 0; border-radius: 8px; background: #e2e8f0; color: #0b0d12;
      font-family: ui-monospace, monospace; font-weight: 700; cursor: pointer;
      box-shadow: 0 5px 0 #94a3b8, 0 8px 12px rgba(0,0,0,.45), inset 0 2px 0 #fff;
      transition: transform .06s, box-shadow .06s; }
    .fx button:active { transform: translateY(5px); box-shadow: 0 0 0 #94a3b8, 0 3px 8px rgba(0,0,0,.4), inset 0 2px 0 #fff; }
  </style>
</head>
<body>
  <div class="fx"><button type="button">⌘</button><button type="button">⇧</button><button type="button">K</button></div>
</body>
</html>
