<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Modifier Legend</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "modifier-key-legend",
    "title": "Modifier Legend",
    "summary": "Platform-correct modifier symbols.",
    "description": "Platform-correct modifier symbols.",
    "theme": "keyboard-input",
    "categories": ["keyboard", "input"],
    "tags": ["keyboard", "shortcut", "modifiers", "symbols", "legend", "reference"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Shortcut hints must reflect the user's platform, and no action should be reachable only by a shortcut.",
    "customization": [
      { "name": "--bg", "description": "Key background", "default": "#1c2437" }
    ],
    "variations": ["Reskin through the custom properties", "Swap the copy for your own"],
    "ai_usage": "Help panels and shortcut sheets. A definition list pairs symbol and meaning semantically, which matters because the glyphs alone are announced inconsistently."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 260px; padding: 1rem; border-radius: 12px; background: #151b2a; border: 1px solid #263149; }
    .fx dl { margin: 0; display: grid; grid-template-columns: 44px 1fr; gap: .4rem .8rem; align-items: center; }
    .fx dt { text-align: center; padding: .2rem; border-radius: 6px; background: #1c2437; border: 1px solid #2b3450;
      font-family: ui-monospace, monospace; font-size: .82rem; color: #e7ebf3; }
    .fx dd { margin: 0; color: #8b93a7; font-size: .82rem; }
  </style>
</head>
<body>
  <div class="fx"><dl><dt>⌘</dt><dd>Command (Ctrl on Windows)</dd><dt>⌥</dt><dd>Option (Alt)</dd>
  <dt>⇧</dt><dd>Shift</dd><dt>⌃</dt><dd>Control</dd><dt>⏎</dt><dd>Return</dd></dl></div>
</body>
</html>
