<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dot Matrix Fade</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "dot-matrix-fade",
    "title": "Dot Matrix Fade",
    "summary": "A dot grid that thins toward the bottom.",
    "description": "A dot grid that thins toward the bottom. Built from tiled CSS gradients on a single element, so it scales to any size without an image request.",
    "theme": "patterns-textures",
    "categories": ["pattern", "background"],
    "tags": ["pattern", "css-only", "tileable", "dots", "matrix", "fade", "mask"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Purely decorative. Keep pattern contrast low behind text, and avoid high-frequency stripes that can trigger visual discomfort.",
    "customization": [
      { "name": "--c", "description": "Dot colour", "default": "rgba(231,235,243,.35)" },
      { "name": "--s", "description": "Dot pitch", "default": "18px" }
    ],
    "variations": ["Recolour via the custom properties", "Scale the tile with --s"],
    "ai_usage": "Section transitions and hero bases. A mask gradient is the cleanest way to fade a repeating pattern out toward content."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .bg { position: fixed; inset: 0; }
    :root { --c: rgba(231,235,243,.35); --s: 18px; }
    .bg { background-color: #0b0d12;
      background-image: radial-gradient(var(--c) 1.4px, transparent 1.5px); background-size: var(--s) var(--s);
      -webkit-mask-image: linear-gradient(#000, transparent); mask-image: linear-gradient(#000, transparent); }
  </style>
</head>
<body>
  <div class="bg"></div>
</body>
</html>
