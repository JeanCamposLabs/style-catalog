<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Concentric Rings</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "concentric-rings",
    "title": "Concentric Rings",
    "summary": "Evenly spaced rings radiating from a point.",
    "description": "Evenly spaced rings radiating from a point. Built from tiled CSS gradients on a single element, so it scales to any size without an image request.",
    "theme": "patterns-textures",
    "categories": ["pattern", "background"],
    "tags": ["pattern", "css-only", "tileable", "rings", "concentric", "radial", "target"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Purely decorative. Keep pattern contrast low behind text, and avoid high-frequency stripes that can trigger visual discomfort.",
    "customization": [
      { "name": "--c", "description": "Ring colour", "default": "rgba(124,92,255,.3)" },
      { "name": "--s", "description": "Ring spacing", "default": "26px" }
    ],
    "variations": ["Recolour via the custom properties", "Scale the tile with --s"],
    "ai_usage": "Focus points and radar motifs. Move the gradient's centre off-screen for a sweeping arc pattern instead of a bullseye."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .bg { position: fixed; inset: 0; }
    :root { --c: rgba(124,92,255,.3); --s: 26px; }
    .bg { background-color: #0b0d12;
      background-image: repeating-radial-gradient(circle at 50% 50%, transparent 0 calc(var(--s) - 2px), var(--c) calc(var(--s) - 2px) var(--s)); }
  </style>
</head>
<body>
  <div class="bg"></div>
</body>
</html>
