  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .bg { position: fixed; inset: 0; }
    :root { --c: rgba(251,191,36,.35); --s: 46px; }
    .bg { background-color: #0b0d12;
      background-image: repeating-linear-gradient(45deg, var(--c) 0 1.5px, transparent 1.5px var(--s)),
