<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vertical Stripes</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "stripes-vertical",
    "title": "Vertical Stripes",
    "summary": "Even vertical bands in two tones.",
    "description": "Even vertical bands in two tones. Built from tiled CSS gradients on a single element, so it scales to any size without an image request.",
    "theme": "patterns-textures",
    "categories": ["pattern", "background"],
    "tags": ["pattern", "css-only", "tileable", "stripes", "vertical", "bands"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Purely decorative. Keep pattern contrast low behind text, and avoid high-frequency stripes that can trigger visual discomfort.",
    "customization": [
      { "name": "--a", "description": "Stripe A", "default": "#131a28" },
      { "name": "--b", "description": "Stripe B", "default": "#0b0d12" },
      { "name": "--s", "description": "Stripe width", "default": "24px" }
    ],
    "variations": ["Recolour via the custom properties", "Scale the tile with --s"],
    "ai_usage": "Ticket stubs, awnings, and sport branding. One repeating-linear-gradient — change the angle alone to get horizontal or diagonal variants."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .bg { position: fixed; inset: 0; }
    :root { --a: #131a28; --b: #0b0d12; --s: 24px; }
    .bg { background: repeating-linear-gradient(90deg, var(--a) 0 var(--s), var(--b) var(--s) calc(var(--s) * 2)); }
  </style>
</head>
<body>
  <div class="bg"></div>
</body>
</html>
