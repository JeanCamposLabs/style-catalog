<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dense Circuit</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "circuit-traces-dense",
    "title": "Dense Circuit",
    "summary": "Tight PCB traces with vias.",
    "description": "Tight PCB traces with vias. Built from tiled CSS gradients on a single element, so it scales to any size without an image request.",
    "theme": "patterns-textures",
    "categories": ["pattern", "background"],
    "tags": ["pattern", "css-only", "tileable", "circuit", "pcb", "tech", "dense"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Purely decorative. Keep pattern contrast low behind text, and avoid high-frequency stripes that can trigger visual discomfort.",
    "customization": [
      { "name": "--c", "description": "Trace colour", "default": "rgba(52,211,153,.28)" },
      { "name": "--s", "description": "Trace pitch", "default": "34px" }
    ],
    "variations": ["Recolour via the custom properties", "Scale the tile with --s"],
    "ai_usage": "Hardware and hacker aesthetics. Offset the via layer by half a tile so pads land between traces rather than on them."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .bg { position: fixed; inset: 0; }
    :root { --c: rgba(52,211,153,.28); --s: 34px; }
    .bg { background-color: #061410;
      background-image: linear-gradient(var(--c) 1px, transparent 1px), linear-gradient(90deg, var(--c) 1px, transparent 1px),
        radial-gradient(circle, rgba(52,211,153,.6) 1.6px, transparent 2px);
      background-size: var(--s) var(--s), var(--s) var(--s), var(--s) var(--s);
      background-position: 0 0, 0 0, calc(var(--s) / 2) calc(var(--s) / 2); }
  </style>
</head>
<body>
  <div class="bg"></div>
</body>
</html>
