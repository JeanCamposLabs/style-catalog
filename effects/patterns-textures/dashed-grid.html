<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashed Grid</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "dashed-grid",
    "title": "Dashed Grid",
    "summary": "A grid drawn with dashed rather than solid rules.",
    "description": "A grid drawn with dashed rather than solid rules. Built from tiled CSS gradients on a single element, so it scales to any size without an image request.",
    "theme": "patterns-textures",
    "categories": ["pattern", "background"],
    "tags": ["pattern", "css-only", "tileable", "grid", "dashed", "guides", "design-tool"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Purely decorative. Keep pattern contrast low behind text, and avoid high-frequency stripes that can trigger visual discomfort.",
    "customization": [
      { "name": "--c", "description": "Rule colour", "default": "rgba(148,163,184,.3)" },
      { "name": "--s", "description": "Cell size", "default": "44px" }
    ],
    "variations": ["Recolour via the custom properties", "Scale the tile with --s"],
    "ai_usage": "Design canvases and wireframe modes. Sizing each layer to a 1px axis keeps the dashes on the lines rather than filling the field."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .bg { position: fixed; inset: 0; }
    :root { --c: rgba(148,163,184,.3); --s: 44px; }
    .bg { background-color: #0b0d12;
      background-image: repeating-linear-gradient(90deg, var(--c) 0 6px, transparent 6px 12px),
        repeating-linear-gradient(0deg, var(--c) 0 6px, transparent 6px 12px);
      background-size: 1px var(--s), var(--s) 1px; background-repeat: repeat-y, repeat-x; }
  </style>
</head>
<body>
  <div class="bg"></div>
</body>
</html>
