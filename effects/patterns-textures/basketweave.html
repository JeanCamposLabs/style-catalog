  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .bg { position: fixed; inset: 0; }
    :root { --a: #26314a; --b: #131a28; --s: 32px; }
    .bg { background-color: var(--b);
      background-image: linear-gradient(90deg, var(--a) 50%, transparent 50%), linear-gradient(var(--a) 50%, transparent 50%);
      background-size: var(--s) var(--s);
      background-position: 0 0, calc(var(--s) / 2) calc(var(--s) / 2); }
