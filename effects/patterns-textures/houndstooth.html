  <title>Houndstooth</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "houndstooth",
    "title": "Houndstooth",
    "summary": "The classic broken-check textile pattern.",
    "description": "The classic broken-check textile pattern. Built from tiled CSS gradients on a single element, so it scales to any size without an image request.",
    "theme": "patterns-textures",
    "categories": ["pattern", "background"],
    "tags": ["pattern", "css-only", "tileable", "houndstooth", "textile", "fashion", "check"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Purely decorative. Keep pattern contrast low behind text, and avoid high-frequency stripes that can trigger visual discomfort.",
    "customization": [
      { "name": "--a", "description": "Light tone", "default": "#e7ebf3" },
      { "name": "--b", "description": "Dark tone", "default": "#0b0d12" },
      { "name": "--s", "description": "Tile size", "default": "40px" }
    ],
    "variations": ["Recolour via the custom properties", "Scale the tile with --s"],

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .bg { position: fixed; inset: 0; }
    :root { --a: #e7ebf3; --b: #0b0d12; --s: 40px; }
    .bg { background-color: var(--b);
      background-image: linear-gradient(-45deg, var(--a) 25%, transparent 25% 75%, var(--a) 75%),
        linear-gradient(45deg, var(--a) 25%, transparent 25% 75%, var(--a) 75%),
        linear-gradient(-45deg, var(--b) 12%, transparent 12% 88%, var(--b) 88%);
      background-size: var(--s) var(--s); background-position: 0 0, calc(var(--s) / 2) calc(var(--s) / 2), 0 0; }
  </style>
</head>
<body>
  <div class="bg"></div>
</body>
</html>
