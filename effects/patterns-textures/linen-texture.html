  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .bg { position: fixed; inset: 0; }
    :root { --a: rgba(255,255,255,.035); --s: 5px; }
    .bg { background-color: #1a1f2b;
      background-image: repeating-linear-gradient(0deg, var(--a) 0 1px, transparent 1px var(--s)),
