    "theme": "patterns-textures",
    "categories": ["pattern", "background"],
    "tags": ["pattern", "css-only", "tileable", "plus", "crosses", "grid", "technical"],

    "customization": [
      { "name": "--c", "description": "Mark colour", "default": "rgba(148,163,184,.28)" },
      { "name": "--s", "description": "Grid pitch", "default": "34px" }

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .bg { position: fixed; inset: 0; }
    :root { --c: rgba(148,163,184,.28); --s: 34px; }
    .bg { background-color: #0b0d12;
      background-image: linear-gradient(var(--c) 2px, transparent 2px), linear-gradient(90deg, var(--c) 2px, transparent 2px);
      background-size: var(--s) var(--s); background-position: center;
      -webkit-mask-image: repeating-linear-gradient(0deg, #000 0 8px, transparent 8px 34px), repeating-linear-gradient(90deg, #000 0 8px, transparent 8px 34px);
      mask-image: repeating-linear-gradient(0deg, #000 0 8px, transparent 8px 34px), repeating-linear-gradient(90deg, #000 0 8px, transparent 8px 34px); }

  <div class="bg"></div>
