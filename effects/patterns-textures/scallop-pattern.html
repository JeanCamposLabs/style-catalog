    "theme": "patterns-textures",
    "categories": ["pattern", "background"],
    "tags": ["pattern", "css-only", "tileable", "scallop", "scales", "arcs", "tiles"],

    "customization": [

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .bg { position: fixed; inset: 0; }
    :root { --c: #1c2333; --bg: #0b0d12; --s: 44px; }
    .bg { background-color: var(--bg);
      background-image: radial-gradient(circle at 50% 0, transparent 0 20px, var(--c) 20px 22px, transparent 22px);
      background-size: var(--s) calc(var(--s) / 2); }
