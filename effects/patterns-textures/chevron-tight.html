<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tight Chevrons</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "chevron-tight",
    "title": "Tight Chevrons",
    "summary": "Dense arrow-like chevrons.",
    "description": "Dense arrow-like chevrons. Built from tiled CSS gradients on a single element, so it scales to any size without an image request.",
    "theme": "patterns-textures",
    "categories": ["pattern", "background"],
    "tags": ["pattern", "css-only", "tileable", "chevron", "zigzag", "arrows", "dense"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Purely decorative. Keep pattern contrast low behind text, and avoid high-frequency stripes that can trigger visual discomfort.",
    "customization": [
      { "name": "--a", "description": "Chevron colour", "default": "#1f2a44" },
      { "name": "--b", "description": "Ground", "default": "#0b0d12" },
      { "name": "--s", "description": "Tile size", "default": "22px" }
    ],
    "variations": ["Recolour via the custom properties", "Scale the tile with --s"],
    "ai_usage": "Sport, packaging, and directional emphasis. Four gradients are the minimum for a true chevron; two only give diagonal stripes."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .bg { position: fixed; inset: 0; }
    :root { --a: #1f2a44; --b: #0b0d12; --s: 22px; }
    .bg { background-color: var(--b);
      background-image: linear-gradient(135deg, var(--a) 25%, transparent 25%), linear-gradient(225deg, var(--a) 25%, transparent 25%),
        linear-gradient(45deg, var(--a) 25%, transparent 25%), linear-gradient(315deg, var(--a) 25%, transparent 25%);
      background-position: calc(var(--s) / 2) 0, calc(var(--s) / 2) 0, 0 0, 0 0;
      background-size: var(--s) var(--s); }
  </style>
</head>
<body>
  <div class="bg"></div>
</body>
</html>
