<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Comic Halftone</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "comic-halftone",
    "title": "Comic Halftone",
    "summary": "Big printed dots in the pop-art tradition.",
    "description": "Big printed dots in the pop-art tradition. Built from tiled CSS gradients on a single element, so it scales to any size without an image request.",
    "theme": "patterns-textures",
    "categories": ["pattern", "background"],
    "tags": ["pattern", "css-only", "tileable", "halftone", "comic", "pop-art", "print"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Purely decorative. Keep pattern contrast low behind text, and avoid high-frequency stripes that can trigger visual discomfort.",
    "customization": [
      { "name": "--c", "description": "Dot colour", "default": "#ff2d95" },
      { "name": "--s", "description": "Dot pitch", "default": "18px" }
    ],
    "variations": ["Recolour via the custom properties", "Scale the tile with --s"],
    "ai_usage": "Comic panels and pop-art sections. Larger dots (30%+ of the tile) read as deliberate print; small dots read as a texture."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .bg { position: fixed; inset: 0; }
    :root { --c: #ff2d95; --s: 18px; }
    .bg { background-color: #ffd166;
      background-image: radial-gradient(var(--c) 32%, transparent 33%); background-size: var(--s) var(--s);
      background-position: 0 0, calc(var(--s) / 2) calc(var(--s) / 2); }
  </style>
</head>
<body>
  <div class="bg"></div>
</body>
</html>
