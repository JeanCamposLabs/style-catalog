  {
    "id": "bubbles-scatter",
    "title": "Bubble Field",
    "summary": "Outlined bubbles of assorted sizes.",
    "description": "Outlined bubbles of assorted sizes. Built from tiled CSS gradients on a single element, so it scales to any size without an image request.",
    "theme": "patterns-textures",
    "categories": ["pattern", "background"],
    "tags": ["pattern", "css-only", "tileable", "bubbles", "circles", "water", "scatter"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",

    "customization": [
      { "name": "--c", "description": "Bubble colour", "default": "rgba(125,211,252,.3)" }

    "variations": ["Recolour via the custom properties", "Scale the tile with --s"],

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .bg { position: fixed; inset: 0; }
    :root { --c: rgba(125,211,252,.3); }
    .bg { background-color: #06121c;
      background-image: radial-gradient(circle at 20% 30%, transparent 0 10px, var(--c) 10px 11px, transparent 12px),
        radial-gradient(circle at 70% 60%, transparent 0 16px, var(--c) 16px 17px, transparent 18px),
        radial-gradient(circle at 45% 85%, transparent 0 7px, var(--c) 7px 8px, transparent 9px);
      background-size: 120px 120px, 170px 170px, 90px 90px; }
  </style>

  <div class="bg"></div>
