<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Herringbone</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "herringbone",
    "title": "Herringbone",
    "summary": "Interlocking diagonal blocks, parquet style.",
    "description": "Interlocking diagonal blocks, parquet style. Built from tiled CSS gradients on a single element, so it scales to any size without an image request.",
    "theme": "patterns-textures",
    "categories": ["pattern", "background"],
    "tags": ["pattern", "css-only", "tileable", "herringbone", "parquet", "floor", "weave"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Purely decorative. Keep pattern contrast low behind text, and avoid high-frequency stripes that can trigger visual discomfort.",
    "customization": [
      { "name": "--a", "description": "Block colour", "default": "#1a2130" },
      { "name": "--b", "description": "Ground", "default": "#0e1219" },
      { "name": "--s", "description": "Tile size", "default": "34px" }
    ],
    "variations": ["Recolour via the custom properties", "Scale the tile with --s"],
    "ai_usage": "Flooring, fabric, and heritage design. The two mirrored gradient sets must be offset by exactly one tile to interlock."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .bg { position: fixed; inset: 0; }
    :root { --a: #1a2130; --b: #0e1219; --s: 34px; }
    .bg { background-color: var(--b);
      background-image: repeating-linear-gradient(45deg, var(--a) 0 8px, transparent 8px 16px),
        repeating-linear-gradient(-45deg, var(--a) 0 8px, transparent 8px 16px);
      background-size: var(--s) var(--s), var(--s) var(--s);
      background-position: 0 0, var(--s) 0; }
  </style>
</head>
<body>
  <div class="bg"></div>
</body>
</html>
