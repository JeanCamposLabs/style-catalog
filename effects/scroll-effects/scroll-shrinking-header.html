<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shrinking Header</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "scroll-shrinking-header",
    "title": "Shrinking Header",
    "summary": "A header that condenses after the first scroll.",
    "description": "A header that condenses after the first scroll.",
    "theme": "scroll-effects",
    "categories": ["scroll", "motion"],
    "tags": ["scroll", "header", "shrink", "sticky", "scroll"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Scroll-linked motion must be disabled under prefers-reduced-motion, and content must never depend on scrolling to become readable.",
    "customization": [
      { "name": "--dur", "description": "Transition", "default": "0.25s" }
    ],
    "variations": ["Retune through the custom properties", "Add a reduced-motion static variant"],
    "ai_usage": "App and marketing headers. Trigger the class with an IntersectionObserver on a sentinel element rather than a scroll listener — it avoids a layout read on every frame."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    body { min-height: 220vh; margin: 0; }
    .hd { position: fixed; top: 0; left: 0; right: 0; padding: 1.4rem 1.2rem; background: rgba(11,13,18,.85);
      backdrop-filter: blur(10px); color: #e7ebf3; display: flex; justify-content: space-between; align-items: center;
      transition: padding .25s, background .25s; border-bottom: 1px solid transparent; }
    .hd.small { padding: .6rem 1.2rem; border-bottom-color: #263149; }
    .hd b { font-size: 1.2rem; transition: font-size .25s; }
    .hd.small b { font-size: .95rem; }
    .body { padding: 8rem 1.2rem; color: #8b93a7; max-width: 34ch; line-height: 1.6; }
  </style>
</head>
<body>
  <header class="hd" id="hd"><b>Style Catalog</b><span>Docs</span></header>
  <div class="body">Scroll down. The header condenses once the page leaves the top, then stays compact.</div>
  <script>
    (function () {
      var hd = document.getElementById("hd"), s = document.createElement("div");
      s.style.position = "absolute"; s.style.top = "0"; s.style.height = "1px"; s.style.width = "1px";
      document.body.appendChild(s);
      new IntersectionObserver(function (es) {
        hd.classList.toggle("small", !es[0].isIntersecting);
      }).observe(s);
    })();
  </script>
</body>
</html>
