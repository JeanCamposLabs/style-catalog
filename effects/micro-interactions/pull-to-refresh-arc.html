<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pull to Refresh</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "pull-to-refresh-arc",
    "title": "Pull to Refresh",
    "summary": "An arc that fills as the list is pulled down.",
    "description": "An arc that fills as the list is pulled down.",
    "theme": "micro-interactions",
    "categories": ["micro-interaction", "feedback"],
    "tags": ["micro-interaction", "feedback", "pull-to-refresh", "gesture", "mobile", "loading"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Every micro-interaction must have a non-animated equivalent: state changes are announced through ARIA, not through motion.",
    "customization": [
      { "name": "--c", "description": "Indicator colour", "default": "#7c5cff" }
    ],
    "variations": ["Adapt to a light theme", "Add a compact variant"],
    "ai_usage": "Mobile lists. Map the pull distance to the arc's rotation before release so the gesture feels connected, then hand over to a spin on commit."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 280px; height: 150px; border-radius: 14px; overflow: hidden; background: #151b2a;
      border: 1px solid #263149; }
    .fx .ind { position: absolute; top: 12px; left: 50%; translate: -50% 0; width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid #22304a; border-top-color: #7c5cff; animation: spin 1s linear infinite; }
    .fx .list { position: absolute; inset: 52px 0 0 0; padding: 0 1rem; color: #8b93a7; font-size: .85rem; line-height: 2; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx"><span class="ind" role="status" aria-label="Refreshing"></span>
  <div class="list">Aurora background<br>Ripple button<br>Skeleton loader</div></div>
</body>
</html>
