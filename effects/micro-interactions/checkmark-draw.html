<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drawing Checkmark</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "checkmark-draw",
    "title": "Drawing Checkmark",
    "summary": "A tick that draws itself inside a filling circle.",
    "description": "A tick that draws itself inside a filling circle.",
    "theme": "micro-interactions",
    "categories": ["micro-interaction", "feedback"],
    "tags": ["micro-interaction", "feedback", "checkmark", "draw", "success", "confirm"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Every micro-interaction must have a non-animated equivalent: state changes are announced through ARIA, not through motion.",
    "customization": [
      { "name": "--ok", "description": "Success colour", "default": "#10a894" }
    ],
    "variations": ["Adapt to a light theme", "Add a compact variant"],
    "ai_usage": "Success confirmations. Sequence the circle pop and the tick draw — playing them together reads as a single static graphic appearing."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 74px; height: 74px; border-radius: 50%; background: #10a894; display: grid; place-items: center;
      animation: pop .4s cubic-bezier(.34,1.56,.64,1) both; }
    .fx svg { width: 38px; }
    .fx path { fill: none; stroke: #04241f; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw .35s ease-out .25s forwards; }
    @keyframes pop { from { transform: scale(.4); opacity: 0; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .fx { animation: none; } .fx path { animation: none; stroke-dashoffset: 0; }
    }
  </style>
</head>
<body>
  <div class="fx" role="img" aria-label="Success"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 21 L17 30 L33 12"/></svg></div>
</body>
</html>
