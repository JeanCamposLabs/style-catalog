<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Icon Spin on Hover</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "hover-icon-rotate",
    "title": "Icon Spin on Hover",
    "summary": "A settings icon that turns when hovered.",
    "description": "A settings icon that turns when hovered.",
    "theme": "micro-interactions",
    "categories": ["micro-interaction", "feedback"],
    "tags": ["micro-interaction", "feedback", "icon", "rotate", "hover", "settings"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Every micro-interaction must have a non-animated equivalent: state changes are announced through ARIA, not through motion.",
    "customization": [
      { "name": "--dur", "description": "Rotation duration", "default": "0.5s" }
    ],
    "variations": ["Adapt to a light theme", "Add a compact variant"],
    "ai_usage": "Icon buttons. A 90° turn is enough to feel responsive; a full rotation on hover reads as a loading state and confuses meaning."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 52px; height: 52px; border-radius: 14px; border: 1px solid #263149; background: #151b2a; color: #cbd5e1;
      font-size: 1.3rem; cursor: pointer; }
    .fx span { display: inline-block; transition: transform .5s cubic-bezier(.34,1.56,.64,1); }
    .fx:hover span, .fx:focus-visible span { transform: rotate(90deg); }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <button class="fx" type="button" aria-label="Settings"><span aria-hidden="true">⚙</span></button>
</body>
</html>
