<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Password Reveal</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "password-reveal-toggle",
    "title": "Password Reveal",
    "summary": "A field with a show/hide control.",
    "description": "A field with a show/hide control.",
    "theme": "micro-interactions",
    "categories": ["micro-interaction", "feedback"],
    "tags": ["micro-interaction", "feedback", "password", "reveal", "toggle", "form"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Every micro-interaction must have a non-animated equivalent: state changes are announced through ARIA, not through motion.",
    "customization": [
      { "name": "--c", "description": "Icon colour", "default": "#8b93a7" }
    ],
    "variations": ["Adapt to a light theme", "Add a compact variant"],
    "ai_usage": "Password fields. Toggle the input type and update the button's accessible name to 'Show'/'Hide'; never render the password in a tooltip or title."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 280px; }
    .fx input { width: 100%; padding: .8rem 3rem .8rem 1rem; border-radius: 12px; border: 1px solid #2b3450;
      background: #151b2a; color: #e7ebf3; font: inherit; letter-spacing: .1em; }
    .fx button { position: absolute; right: .5rem; top: 50%; translate: 0 -50%; width: 34px; height: 34px; border: 0;
      border-radius: 9px; background: transparent; color: #8b93a7; cursor: pointer; }
    .fx button:hover { background: #1e2740; color: #e7ebf3; }
  </style>
</head>
<body>
  <div class="fx"><input type="password" value="correcthorsebattery" aria-label="Password" id="pw" />
  <button type="button" aria-label="Show password" id="pt">👁</button></div>
  <script>
    (function () {
      var i = document.getElementById("pw"), b = document.getElementById("pt");
      b.addEventListener("click", function () {
        var show = i.type === "password";
        i.type = show ? "text" : "password";
        b.setAttribute("aria-label", show ? "Hide password" : "Show password");
      });
    })();
  </script>
</body>
</html>
