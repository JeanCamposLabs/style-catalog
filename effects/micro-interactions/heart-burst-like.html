<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Heart Burst</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "heart-burst-like",
    "title": "Heart Burst",
    "summary": "A like that pops and throws particles.",
    "description": "A like that pops and throws particles.",
    "theme": "micro-interactions",
    "categories": ["micro-interaction", "feedback"],
    "tags": ["micro-interaction", "feedback", "like", "heart", "burst", "particles"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Every micro-interaction must have a non-animated equivalent: state changes are announced through ARIA, not through motion.",
    "customization": [
      { "name": "--c", "description": "Active colour", "default": "#d1478c" }
    ],
    "variations": ["Adapt to a light theme", "Add a compact variant"],
    "ai_usage": "Reaction buttons. The burst is decoration; the state change must still be conveyed by aria-pressed and by the colour, not by the animation."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 64px; height: 64px; border: 0; background: none; cursor: pointer; font-size: 1.8rem;
      color: #3b465e; }
    .fx[aria-pressed="true"] { color: #d1478c; }
    .fx[aria-pressed="true"] .h { animation: pop .45s cubic-bezier(.34,1.56,.64,1); }
    .fx i { position: absolute; top: 50%; left: 50%; width: 5px; height: 5px; border-radius: 50%; background: #d1478c;
      opacity: 0; pointer-events: none; }
    .fx[aria-pressed="true"] i { animation: burst .55s ease-out; }
    @keyframes pop { 0% { transform: scale(.7); } 55% { transform: scale(1.3); } 100% { transform: scale(1); } }
    @keyframes burst { 0% { opacity: 1; transform: translate(0,0) scale(1); } 100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(.3); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <button class="fx" type="button" aria-pressed="false" aria-label="Like" id="hb"><span class="h">♥</span>
  <i style="--x:-20px;--y:-22px"></i><i style="--x:18px;--y:-24px"></i><i style="--x:-22px;--y:16px"></i><i style="--x:20px;--y:18px"></i></button>
  <script>
    (function () {
      var b = document.getElementById("hb");
      b.addEventListener("click", function () {
        b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true");
      });
    })();
  </script>
</body>
</html>
