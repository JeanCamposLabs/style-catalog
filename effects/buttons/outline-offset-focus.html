<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Focus Ring Showcase</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "outline-offset-focus",
    "title": "Focus Ring Showcase",
    "summary": "Three focus-ring treatments compared side by side, keyboard-only.",
    "description": "A reference for :focus-visible: an offset outline, a double ring for any background, and an inset ring for tight layouts.",
    "theme": "buttons",
    "categories": ["button", "reference"],
    "tags": ["focus", "accessibility", "focus-visible", "outline", "reference"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "All three rings meet the 3:1 non-text contrast requirement against both the button and the page, and appear only for keyboard users via :focus-visible.",
    "customization": [
      { "name": "--ring", "description": "Ring color", "default": "#7c5cff" },
      { "name": "--off", "description": "Ring offset", "default": "3px" }
    ],
    "variations": ["High-contrast mode variant", "Animated ring on focus", "Ring that follows the roving tabindex in a toolbar"],
    "ai_usage": "Copy this as your focus-ring baseline. Never remove the outline without a replacement; the double-ring pattern (dark inner + light outer) is the only one that survives on unknown backgrounds. Tab through the demo to see them."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    button { font: inherit; cursor: pointer; border: 0; }
    button:focus-visible { outline: 2px solid #7c5cff; outline-offset: 3px; }
    :root { --ring: #7c5cff; --off: 3px; }
    .row { display: flex; gap: .8rem; }
    .row button { padding: .8rem 1.4rem; border-radius: 10px; background: #151b2a; border: 1px solid #263149; color: #e7ebf3; font-weight: 600; }
    .f1:focus-visible { outline: 2px solid var(--ring); outline-offset: var(--off); }
    .f2:focus-visible { outline: 2px solid #0b0d12; outline-offset: 0; box-shadow: 0 0 0 4px var(--ring); }
    .f3:focus-visible { outline: 2px solid var(--ring); outline-offset: -4px; }
    .hint { margin-top: 1rem; color: #8b93a7; font-size: .85rem; text-align: center; }
  </style>
</head>
<body>
  <div>
    <div class="row">
      <button class="f1" type="button">Offset ring</button>
      <button class="f2" type="button">Double ring</button>
      <button class="f3" type="button">Inset ring</button>
    </div>
    <p class="hint">Press Tab to see the rings — they appear for keyboard focus only.</p>
  </div>
</body>
</html>
