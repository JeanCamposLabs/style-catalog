<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Icon Button Set</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "button-icon-only-grid",
    "title": "Icon Button Set",
    "summary": "A toolbar of icon-only buttons with hidden labels.",
    "description": "A toolbar of icon-only buttons with hidden labels.",
    "theme": "buttons",
    "categories": ["button", "action"],
    "tags": ["button", "action", "icons", "toolbar", "labels", "compact"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Use a real <button>, keep a visible :focus-visible ring, and never signal state with colour alone.",
    "customization": [
      { "name": "--c", "description": "Active colour", "default": "#7c5cff" }
    ],
    "variations": ["Retune through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Editor toolbars. Every icon button needs a visually-hidden label; a title attribute alone is unreliable across screen readers and invisible on touch."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: #151b2a; border: 1px solid #263149; }
    .fx button { width: 38px; height: 38px; border: 0; border-radius: 9px; background: transparent; color: #cbd5e1;
      font-size: 1rem; cursor: pointer; }
    .fx button:hover { background: #22304a; color: #fff; }
    .fx button[aria-pressed="true"] { background: #7c5cff; color: #fff; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  </style>
</head>
<body>
  <div class="fx" role="group" aria-label="Text formatting">
    <button type="button" aria-pressed="true"><b>B</b><span class="sr">Bold</span></button>
    <button type="button" aria-pressed="false"><i>I</i><span class="sr">Italic</span></button>
    <button type="button" aria-pressed="false"><u>U</u><span class="sr">Underline</span></button></div>
</body>
</html>
