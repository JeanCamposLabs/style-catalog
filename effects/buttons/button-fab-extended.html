<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Extended FAB</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "button-fab-extended",
    "title": "Extended FAB",
    "summary": "A floating action button that collapses on scroll.",
    "description": "A floating action button that collapses on scroll.",
    "theme": "buttons",
    "categories": ["button", "action"],
    "tags": ["button", "action", "fab", "extended", "collapse", "mobile"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Use a real <button>, keep a visible :focus-visible ring, and never signal state with colour alone.",
    "customization": [
      { "name": "--c", "description": "FAB colour", "default": "#7c5cff" }
    ],
    "variations": ["Retune through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Mobile primary actions. Collapse the label on scroll but keep the accessible name intact, so the button never becomes an unlabelled circle to assistive tech."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: inline-flex; align-items: center; gap: .6rem; padding: .9rem 1.4rem; border: 0; border-radius: 999px;
      background: #7c5cff; color: #fff; font: inherit; font-weight: 700; cursor: pointer;
      box-shadow: 0 12px 26px rgba(124,92,255,.45); transition: padding .25s, gap .25s; }
    .fx .lbl { max-width: 120px; overflow: hidden; white-space: nowrap; transition: max-width .25s, opacity .25s; }
    .fx.small { padding: .9rem; gap: 0; }
    .fx.small .lbl { max-width: 0; opacity: 0; }
  </style>
</head>
<body>
  <button class="fx" type="button" aria-label="New specimen"><span aria-hidden="true">＋</span><span class="lbl">New specimen</span></button>
</body>
</html>
