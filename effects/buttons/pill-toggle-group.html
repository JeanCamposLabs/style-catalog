<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Segmented Pill Toggle</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "pill-toggle-group",
    "title": "Segmented Pill Toggle",
    "summary": "A sliding pill follows the selected option in a segmented control.",
    "description": "One absolutely positioned thumb translates between segments, so the highlight moves continuously rather than blinking between states.",
    "theme": "buttons",
    "categories": ["button", "toggle"],
    "tags": ["segmented", "toggle", "pill", "tabs", "slider"],
    "tech": ["css", "js"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Use a real <button>; keep a visible :focus-visible ring and never rely on hover alone to convey state. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--thumb", "description": "Thumb color", "default": "#7c5cff" },
      { "name": "--dur", "description": "Slide duration", "default": "0.3s" }
    ],
    "variations": ["Three or more segments", "Icons instead of labels", "Vertical orientation"],
    "ai_usage": "View switchers and filters. Implement as radio inputs (or role=tablist) so keyboard and screen-reader behaviour is free; the thumb reads its x-offset from the checked index via a CSS variable."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    button { font: inherit; cursor: pointer; border: 0; }
    button:focus-visible { outline: 2px solid #7c5cff; outline-offset: 3px; }
    :root { --thumb: #7c5cff; --dur: .3s; }
    .pillg { position: relative; display: inline-flex; padding: 4px; border-radius: 999px; background: #151b2a; border: 1px solid #263149; }
    .pillg .thumb { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / 3); border-radius: 999px;
      background: var(--thumb); transition: transform var(--dur) cubic-bezier(.7,0,.2,1); }
    .pillg button { position: relative; z-index: 2; padding: .55rem 1.3rem; border-radius: 999px; background: transparent;
      color: #94a3b8; font-weight: 700; transition: color var(--dur); }
    .pillg button[aria-pressed="true"] { color: #fff; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="pillg" id="pg" role="group" aria-label="View">
    <span class="thumb" aria-hidden="true"></span>
    <button type="button" aria-pressed="true">Day</button>
    <button type="button" aria-pressed="false">Week</button>
    <button type="button" aria-pressed="false">Month</button>
  </div>
  <script>
    (function () {
      var g = document.getElementById("pg"), thumb = g.querySelector(".thumb");
      var btns = [].slice.call(g.querySelectorAll("button"));
      btns.forEach(function (b, i) {
        b.addEventListener("click", function () {
          btns.forEach(function (o) { o.setAttribute("aria-pressed", "false"); });
          b.setAttribute("aria-pressed", "true");
          thumb.style.transform = "translateX(" + i * 100 + "%)";
        });
      });
    })();
  </script>
</body>
</html>
