<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Download Progress Button</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "download-progress-button",
    "title": "Download Progress Button",
    "summary": "The button's own fill doubles as the download progress bar.",
    "description": "A width-animated layer behind the label turns the control into its own progress indicator, so no extra UI appears mid-action.",
    "theme": "buttons",
    "categories": ["button", "progress"],
    "tags": ["download", "progress", "inline", "state", "feedback"],
    "tech": ["css", "js"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Use a real <button>; keep a visible :focus-visible ring and never rely on hover alone to convey state. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Progress color", "default": "#34d399" },
      { "name": "--dur", "description": "Simulated download", "default": "2.4s" }
    ],
    "variations": ["Indeterminate stripes when the size is unknown", "Cancel button while in flight", "Success checkmark at the end"],
    "ai_usage": "Downloads, exports, and uploads. Drive the fill from real progress events, not a timer; keep the label readable over the fill by using a mid-tone fill or a text-shadow."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    button { font: inherit; cursor: pointer; border: 0; }
    button:focus-visible { outline: 2px solid #7c5cff; outline-offset: 3px; }
    :root { --c: #34d399; --dur: 2.4s; }
    .dl { position: relative; overflow: hidden; width: 210px; padding: .95rem 0; border-radius: 12px; background: #151b2a;
      border: 1px solid #263149; color: #e7ebf3; font-weight: 700; }
    .dl span { position: relative; z-index: 2; }
    .dl::before { content: ""; position: absolute; inset: 0; width: 0; background: color-mix(in srgb, var(--c) 35%, transparent); }
    .dl.is-run::before { animation: fill var(--dur) linear forwards; }
    .dl.is-done { border-color: var(--c); color: var(--c); }
    @keyframes fill { to { width: 100%; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <button class="dl" id="dlb" type="button"><span id="dll">Download 42 MB</span></button>
  <script>
    (function () {
      var b = document.getElementById("dlb"), l = document.getElementById("dll");
      function go() {
        b.classList.remove("is-done"); b.classList.add("is-run"); l.textContent = "Downloading…";
        setTimeout(function () { b.classList.remove("is-run"); b.classList.add("is-done"); l.textContent = "Saved ✓"; }, 2400);
        setTimeout(function () { b.classList.remove("is-done"); l.textContent = "Download 42 MB"; }, 4200);
      }
      b.addEventListener("click", go); setInterval(go, 5200);
    })();
  </script>
</body>
</html>
