<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arrow Link</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "button-arrow-underline-link",
    "title": "Arrow Link",
    "summary": "A text link whose arrow slides on hover.",
    "description": "A text link whose arrow slides on hover.",
    "theme": "buttons",
    "categories": ["button", "action"],
    "tags": ["button", "action", "link", "arrow", "underline", "cta"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Use a real <button>, keep a visible :focus-visible ring, and never signal state with colour alone.",
    "customization": [
      { "name": "--c", "description": "Link colour", "default": "#b9a5ff" }
    ],
    "variations": ["Retune through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Tertiary calls to action. Move the arrow and draw the underline on the same duration so the two read as one gesture rather than two effects."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: inline-flex; align-items: center; gap: .4rem; color: #b9a5ff; text-decoration: none; font-weight: 700;
      font-size: .95rem; position: relative; }
    .fx .ar { transition: transform .25s cubic-bezier(.2,.8,.3,1); }
    .fx::after { content: ""; position: absolute; left: 0; right: 1.2rem; bottom: -3px; height: 2px; background: currentColor;
      transform: scaleX(0); transform-origin: left; transition: transform .25s; }
    .fx:hover .ar, .fx:focus-visible .ar { transform: translateX(4px); }
    .fx:hover::after, .fx:focus-visible::after { transform: scaleX(1); }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <a class="fx" href="#">Browse the catalogue <span class="ar" aria-hidden="true">→</span></a>
</body>
</html>
