<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Disabled State Set</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "disabled-state-button",
    "title": "Disabled State Set",
    "summary": "Four button states — default, hover, loading, disabled — shown side by side.",
    "description": "A reference specimen: the disabled treatment keeps 4.5:1 contrast and pairs a cursor change with reduced opacity rather than relying on color alone.",
    "theme": "buttons",
    "categories": ["button", "reference"],
    "tags": ["states", "disabled", "loading", "reference", "accessibility"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Disabled controls must remain readable; never signal disabled with color alone, and prefer aria-disabled plus a real explanation over removing the button from the tab order.",
    "customization": [
      { "name": "--c", "description": "Primary color", "default": "#7c5cff" }
    ],
    "variations": ["Add an error/destructive state", "Tooltip explaining why an action is disabled", "Skeleton state for async labels"],
    "ai_usage": "Copy this as the baseline state matrix for a design system. Note the pattern: disabled uses aria-disabled plus pointer-events:none on the label only, so the button stays focusable and can explain itself in a tooltip."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    button { font: inherit; cursor: pointer; border: 0; }
    button:focus-visible { outline: 2px solid #7c5cff; outline-offset: 3px; }
    :root { --c: #7c5cff; }
    .row { display: flex; gap: .8rem; flex-wrap: wrap; justify-content: center; max-width: 460px; }
    .btn { padding: .8rem 1.5rem; border-radius: 10px; background: var(--c); color: #fff; font-weight: 700;
      display: inline-flex; align-items: center; gap: .5rem; }
    .btn.hover { background: color-mix(in srgb, var(--c) 82%, #fff); }
    .btn[aria-disabled="true"] { background: #2b3350; color: #8b93a7; cursor: not-allowed; }
    .btn .sp { width: 15px; height: 15px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff;
      border-radius: 50%; animation: sp .8s linear infinite; }
    @keyframes sp { to { transform: rotate(1turn); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="row">
    <button class="btn" type="button">Default</button>
    <button class="btn hover" type="button">Hover</button>
    <button class="btn" type="button"><span class="sp" aria-hidden="true"></span>Saving</button>
    <button class="btn" type="button" aria-disabled="true">Disabled</button>
  </div>
</body>
</html>
