<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Expanding FAB</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "fab-expand",
    "title": "Expanding FAB",
    "summary": "A floating action button that fans out into labelled sub-actions.",
    "description": "Children translate out on staggered delays and the trigger rotates 45° into a close icon, so one control covers both states.",
    "theme": "buttons",
    "categories": ["button", "navigation"],
    "tags": ["fab", "speed-dial", "expand", "mobile", "stagger"],
    "tech": ["css", "js"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Use a real <button>; keep a visible :focus-visible ring and never rely on hover alone to convey state. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "FAB color", "default": "#7c5cff" },
      { "name": "--dur", "description": "Fan duration", "default": "0.3s" }
    ],
    "variations": ["Fan horizontally", "Labels that slide in beside each action", "Backdrop dim while open"],
    "ai_usage": "Mobile primary actions. Manage aria-expanded on the trigger, move focus into the first action when opened, and close on Escape; the stagger should be short (40–60ms) or the menu feels sluggish."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    button { font: inherit; cursor: pointer; border: 0; }
    button:focus-visible { outline: 2px solid #7c5cff; outline-offset: 3px; }
    :root { --c: #7c5cff; --dur: .3s; }
    .fab { position: relative; height: 230px; width: 200px; display: flex; align-items: flex-end; justify-content: center; }
    .fab .main { width: 58px; height: 58px; border-radius: 50%; background: var(--c); color: #fff; font-size: 1.5rem;
      display: grid; place-items: center; transition: transform var(--dur); z-index: 2; }
    .fab.is-open .main { transform: rotate(45deg); }
    .fab .act { position: absolute; bottom: 6px; width: 44px; height: 44px; border-radius: 50%; background: #1f2637;
      color: #e7ebf3; display: grid; place-items: center; opacity: 0; transform: translateY(0) scale(.6);
      transition: transform var(--dur) cubic-bezier(.34,1.56,.64,1), opacity var(--dur); }
    .fab.is-open .act { opacity: 1; transform: translateY(calc(var(--i) * -58px - 66px)) scale(1);
      transition-delay: calc(var(--i) * .05s); }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fab" id="fb">
    <button class="act" type="button" style="--i:0" aria-label="New note">✎</button>
    <button class="act" type="button" style="--i:1" aria-label="Upload">↑</button>
    <button class="act" type="button" style="--i:2" aria-label="Invite">＋</button>
    <button class="main" type="button" aria-expanded="false" aria-label="Actions">✕</button>
  </div>
  <script>
    (function () {
      var f = document.getElementById("fb"), m = f.querySelector(".main");
      m.addEventListener("click", function () {
        var open = f.classList.toggle("is-open");
        m.setAttribute("aria-expanded", String(open));
      });
    })();
  </script>
</body>
</html>
