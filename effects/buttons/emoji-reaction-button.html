<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reaction Button</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "emoji-reaction-button",
    "title": "Reaction Button",
    "summary": "A like button that pops, bursts, and increments its count.",
    "description": "Scale overshoot on the icon plus radiating particles and a rolling number make one tap feel like three pieces of feedback.",
    "theme": "buttons",
    "categories": ["button", "social"],
    "tags": ["like", "reaction", "burst", "counter", "social"],
    "tech": ["css", "js"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Use a real <button>; keep a visible :focus-visible ring and never rely on hover alone to convey state. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Active color", "default": "#fb7185" },
      { "name": "--dur", "description": "Burst duration", "default": "0.6s" }
    ],
    "variations": ["Multiple reaction types", "Long-press for a picker", "Undo on second tap"],
    "ai_usage": "Social and feedback UIs. Toggle a class rather than replacing the node so the count keeps its DOM position; set aria-pressed and update an aria-live count so the change is announced."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    button { font: inherit; cursor: pointer; border: 0; }
    button:focus-visible { outline: 2px solid #7c5cff; outline-offset: 3px; }
    :root { --c: #fb7185; --dur: .6s; }
    .react { position: relative; display: inline-flex; align-items: center; gap: .5rem; padding: .6rem 1.1rem;
      border-radius: 999px; background: #151b2a; border: 1px solid #263149; color: #94a3b8; font-weight: 700; }
    .react .heart { font-size: 1.1rem; transition: transform .3s cubic-bezier(.34,1.56,.64,1); }
    .react.is-on { color: var(--c); border-color: var(--c); }
    .react.is-on .heart { transform: scale(1.25); }
    .react i { position: absolute; left: 1.15rem; top: 50%; width: 5px; height: 5px; border-radius: 50%; background: var(--c);
      opacity: 0; pointer-events: none; }
    .react.is-on i { animation: burst var(--dur) ease-out; }
    @keyframes burst {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(.4); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <button class="react" id="rb" type="button" aria-pressed="false">
    <span class="heart" aria-hidden="true">♥</span><span id="rc">128</span>
    <i aria-hidden="true" style="--x:-18px;--y:-20px"></i><i aria-hidden="true" style="--x:16px;--y:-22px"></i>
    <i aria-hidden="true" style="--x:-20px;--y:14px"></i><i aria-hidden="true" style="--x:18px;--y:16px"></i>
  </button>
  <script>
    (function () {
      var b = document.getElementById("rb"), c = document.getElementById("rc"), n = 128, on = false;
      b.addEventListener("click", function () {
        on = !on; b.classList.toggle("is-on", on); b.setAttribute("aria-pressed", String(on));
        n += on ? 1 : -1; c.textContent = n;
      });
    })();
  </script>
</body>
</html>
