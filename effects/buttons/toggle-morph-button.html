<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Morphing Submit Button</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "toggle-morph-button",
    "title": "Morphing Submit Button",
    "summary": "The button collapses into a circle, spins, and becomes a checkmark.",
    "description": "Width, radius, and content swap on one class change, so a submit turns into its own success state without a layout jump.",
    "theme": "buttons",
    "categories": ["button", "state"],
    "tags": ["morph", "submit", "success", "state", "loading"],
    "tech": ["css", "js"],
    "era": "2020s",
    "difficulty": "advanced",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Use a real <button>; keep a visible :focus-visible ring and never rely on hover alone to convey state. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Button color", "default": "#7c5cff" },
      { "name": "--ok", "description": "Success color", "default": "#34d399" }
    ],
    "variations": ["Error state that shakes and turns red", "Progress ring while pending", "Return to idle after a delay"],
    "ai_usage": "Form submissions where feedback must stay in place. Animate width and border-radius on the button itself and cross-fade the inner label/spinner/check; never swap the element or focus is lost mid-flow. Announce the result with aria-live."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    button { font: inherit; cursor: pointer; border: 0; }
    button:focus-visible { outline: 2px solid #7c5cff; outline-offset: 3px; }
    :root { --c: #7c5cff; --ok: #34d399; }
    .morph { width: 180px; height: 52px; border-radius: 12px; background: var(--c); color: #fff; font-weight: 700;
      display: grid; place-items: center; transition: width .4s cubic-bezier(.7,0,.2,1), border-radius .4s, background .3s; }
    .morph .lbl, .morph .spin, .morph .ok { grid-area: 1 / 1; transition: opacity .2s; }
    .morph .spin, .morph .ok { opacity: 0; }
    .morph .spin { width: 22px; height: 22px; border: 3px solid rgba(255,255,255,.35); border-top-color: #fff;
      border-radius: 50%; animation: sp .8s linear infinite; }
    .morph.is-busy { width: 52px; border-radius: 50%; }
    .morph.is-busy .lbl { opacity: 0; }
    .morph.is-busy .spin { opacity: 1; }
    .morph.is-done { width: 52px; border-radius: 50%; background: var(--ok); }
    .morph.is-done .spin { opacity: 0; }
    .morph.is-done .ok { opacity: 1; font-size: 1.4rem; }
    @keyframes sp { to { transform: rotate(1turn); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <button class="morph" type="button" id="m">
    <span class="lbl">Submit</span><span class="spin" aria-hidden="true"></span><span class="ok" aria-hidden="true">✓</span>
  </button>
  <script>
    (function () {
      var b = document.getElementById("m");
      function cycle() {
        b.classList.add("is-busy");
        setTimeout(function () { b.classList.remove("is-busy"); b.classList.add("is-done"); }, 1400);
        setTimeout(function () { b.classList.remove("is-done"); }, 3000);
      }
      b.addEventListener("click", cycle);
      setInterval(cycle, 4200);
    })();
  </script>
</body>
</html>
