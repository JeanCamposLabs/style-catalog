<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stacked Layers Button</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "stacked-layers-button",
    "title": "Stacked Layers Button",
    "summary": "Colored layers fan out behind the button on hover.",
    "description": "Two offset copies slide out at different distances, implying a stack of cards behind the face.",
    "theme": "buttons",
    "categories": ["button", "hover"],
    "tags": ["stack", "layers", "offset", "depth", "hover"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Use a real <button>; keep a visible :focus-visible ring and never rely on hover alone to convey state. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Face color", "default": "#e7ebf3" },
      { "name": "--l1", "description": "First layer", "default": "#7c5cff" },
      { "name": "--l2", "description": "Second layer", "default": "#2dd4bf" }
    ],
    "variations": ["Fan on the vertical axis", "More layers", "Rotate each layer slightly"],
    "ai_usage": "Playful CTAs and card-based UIs. Layers are absolutely positioned siblings behind the label; move them with transform only and keep the face opaque so the offsets read as depth."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    button { font: inherit; cursor: pointer; border: 0; }
    button:focus-visible { outline: 2px solid #7c5cff; outline-offset: 3px; }
    :root { --c: #e7ebf3; --l1: #7c5cff; --l2: #2dd4bf; }
    .stk { position: relative; display: inline-block; }
    .stk i { position: absolute; inset: 0; border-radius: 12px; transition: transform .3s cubic-bezier(.34,1.56,.64,1); }
    .stk i:nth-of-type(1) { background: var(--l1); }
    .stk i:nth-of-type(2) { background: var(--l2); }
    .stk button { position: relative; z-index: 2; padding: .95rem 2.2rem; border-radius: 12px; background: var(--c);
      color: #0b0d12; font-weight: 800; }
    .stk:hover i:nth-of-type(1) { transform: translate(6px, 6px); }
    .stk:hover i:nth-of-type(2) { transform: translate(12px, 12px); }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <span class="stk"><i aria-hidden="true"></i><i aria-hidden="true"></i><button type="button">Stacked</button></span>
</body>
</html>
