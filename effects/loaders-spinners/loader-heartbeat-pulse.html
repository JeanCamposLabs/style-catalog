<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Heartbeat</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "loader-heartbeat-pulse",
    "title": "Heartbeat",
    "summary": "A pulse with the double-beat rhythm of a heart.",
    "description": "A pulse with the double-beat rhythm of a heart.",
    "theme": "loaders-spinners",
    "categories": ["loader", "spinner"],
    "tags": ["loader", "waiting", "heartbeat", "pulse", "health", "rhythm"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Pair every indicator with a visually-hidden aria-live status; motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Heart colour", "default": "#d1478c" }
    ],
    "variations": ["Retune through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Health and monitoring products. The double beat (strong then weaker) is what distinguishes a heartbeat from a generic pulse."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 54px; height: 54px; background: #d1478c; transform: rotate(-45deg);
      animation: beat 1.4s ease-in-out infinite; position: relative; }
    .fx::before, .fx::after { content: ""; position: absolute; width: 54px; height: 54px; border-radius: 50%; background: #d1478c; }
    .fx::before { top: -27px; left: 0; }
    .fx::after { top: 0; left: 27px; }
    @keyframes beat { 0%, 100% { transform: rotate(-45deg) scale(1); } 15% { transform: rotate(-45deg) scale(1.18); }
      30% { transform: rotate(-45deg) scale(1); } 45% { transform: rotate(-45deg) scale(1.12); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx" role="status" aria-label="Live"></div>
</body>
</html>
