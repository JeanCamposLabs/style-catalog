<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Infinity Loop</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "infinity-loop-loader",
    "title": "Infinity Loop",
    "summary": "A dash travels an endless figure-eight path.",
    "description": "One SVG path plus stroke-dasharray gives a short dash that runs the lemniscate forever, crossing itself at the middle.",
    "theme": "loaders-spinners",
    "categories": ["loader", "svg"],
    "tags": ["infinity", "svg", "stroke-dasharray", "path", "loop"],
    "tech": ["svg", "css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative status indicator — pair it with a visually-hidden aria-live message so screen readers announce the wait. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Dash color", "default": "#a78bfa" },
      { "name": "--track", "description": "Track color", "default": "#1c2333" },
      { "name": "--dur", "description": "Lap time", "default": "1.8s" }
    ],
    "variations": ["Two dashes half a lap apart", "Thicker stroke for a bolder mark", "Gradient stroke via a linearGradient def"],
    "ai_usage": "A calm, brand-friendly loader for long operations. Change the dash length by editing the first stroke-dasharray value and keep the animation's dashoffset equal to the total path length (here ~370) so the loop is seamless."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    :root { --c: #a78bfa; --track: #1c2333; --dur: 1.8s; }
    .inf { width: 150px; }
    .inf svg { width: 100%; display: block; }
    .inf path { fill: none; stroke-width: 8; stroke-linecap: round; }
    .inf .track { stroke: var(--track); }
    .inf .dash { stroke: var(--c); stroke-dasharray: 60 310; animation: run var(--dur) linear infinite; }
    @keyframes run { to { stroke-dashoffset: -370; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="inf" role="status" aria-label="Loading">
    <svg viewBox="0 0 200 100" aria-hidden="true">
      <path class="track" d="M60 50a25 25 0 1 1 25 25 60 60 0 0 1-25-50 25 25 0 1 0 25 25 60 60 0 0 0-25 50 25 25 0 1 1-25-25z"/>
      <path class="dash" d="M60 50a25 25 0 1 1 25 25 60 60 0 0 1-25-50 25 25 0 1 0 25 25 60 60 0 0 0-25 50 25 25 0 1 1-25-25z"/>
    </svg>
  </div>
</body>
</html>
