<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Comet Spinner</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "comet-spinner",
    "title": "Comet Spinner",
    "summary": "A bright head chases its own fading tail around a circular track.",
    "description": "A conic gradient supplies the fading tail while an absolutely positioned dot rides the leading edge, so the arc reads as a comet rather than a plain arc.",
    "theme": "loaders-spinners",
    "categories": ["loader", "spinner"],
    "tags": ["comet", "tail", "conic-gradient", "glow", "spinner"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative status indicator — pair it with a visually-hidden aria-live message so screen readers announce the wait. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Comet color", "default": "#2dd4bf" },
      { "name": "--size", "description": "Track diameter", "default": "84px" },
      { "name": "--dur", "description": "Orbit period", "default": "1.1s" }
    ],
    "variations": ["Slow the tail with a longer conic stop", "Two comets 180° apart", "Add a blur filter on the head for a softer glow"],
    "ai_usage": "Use as a premium-feeling spinner on dark surfaces. The rotation lives on the wrapper so head and tail stay locked together; the head dot is positioned at top center with transform-origin at the wrapper center."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    :root { --c: #2dd4bf; --size: 84px; --dur: 1.1s; }
    .comet { width: var(--size); aspect-ratio: 1; position: relative; animation: orbit var(--dur) linear infinite; }
    .comet::before { content: ""; position: absolute; inset: 0; border-radius: 50%;
      background: conic-gradient(transparent 0 40%, color-mix(in srgb, var(--c) 60%, transparent) 85%, var(--c));
      -webkit-mask: radial-gradient(farthest-side, transparent 72%, #000 73%);
      mask: radial-gradient(farthest-side, transparent 72%, #000 73%); }
    .comet i { position: absolute; top: -3px; left: 50%; width: 12px; height: 12px; margin-left: -6px;
      border-radius: 50%; background: var(--c); box-shadow: 0 0 14px var(--c); }
    @keyframes orbit { to { transform: rotate(1turn); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="comet" role="status" aria-label="Loading"><i></i></div>
</body>
</html>
