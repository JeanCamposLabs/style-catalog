<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Morphing Loader</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "loader-morphing-shape",
    "title": "Morphing Loader",
    "summary": "A shape cycling through square, circle, and triangle.",
    "description": "A shape cycling through square, circle, and triangle.",
    "theme": "loaders-spinners",
    "categories": ["loader", "spinner"],
    "tags": ["loader", "waiting", "morph", "shapes", "rotate", "cycle"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Pair every indicator with a visually-hidden aria-live status; motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--dur", "description": "Cycle", "default": "3s" }
    ],
    "variations": ["Retune through the custom properties", "Scale for a compact variant"],
    "ai_usage": "A loader with more character than a spinner. Combine border-radius and clip-path changes with rotation so each state arrives at a different angle."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 56px; height: 56px; background: #7c5cff; animation: morph 3s ease-in-out infinite; }
    @keyframes morph {
      0%, 100% { border-radius: 6px; transform: rotate(0); }
      33% { border-radius: 50%; transform: rotate(120deg); }
      66% { border-radius: 6px; transform: rotate(240deg); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx"></div>
</body>
</html>
