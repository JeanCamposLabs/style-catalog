  <script type="application/json" id="effect-meta">
  {
    "id": "loader-bar-ping-pong",
    "title": "Ping-Pong Bar",
    "summary": "A bar bouncing between the track ends.",
    "description": "A bar bouncing between the track ends.",
    "theme": "loaders-spinners",
    "categories": ["loader", "spinner"],
    "tags": ["loader", "waiting", "indeterminate", "bounce", "bar", "track"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Pair every indicator with a visually-hidden aria-live status; motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--dur", "description": "Sweep", "default": "1.4s" }
    ],
    "variations": ["Retune through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Indeterminate progress in a tight space. An alternate-direction ease reads as searching; a one-way loop reads as slow progress that never completes."

  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 260px; height: 6px; border-radius: 99px; background: #1b2231; overflow: hidden; }
    .fx i { display: block; height: 100%; width: 34%; border-radius: 99px; background: #2dd4bf;
      animation: pong 1.4s cubic-bezier(.65,0,.35,1) infinite alternate; }
    @keyframes pong { from { transform: translateX(0); } to { transform: translateX(196%); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx" role="status" aria-label="Loading"><i></i></div>
</body>
