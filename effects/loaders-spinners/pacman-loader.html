<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pac-Man Loader</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "pacman-loader",
    "title": "Pac-Man Loader",
    "summary": "A chomping arc eats a stream of dots that respawn off-screen.",
    "description": "Two clipped half-circles hinge open and closed for the mouth while dots translate leftward on a loop and vanish at the bite point.",
    "theme": "loaders-spinners",
    "categories": ["loader", "retro"],
    "tags": ["pacman", "retro", "game", "chomp", "dots"],
    "tech": ["css"],
    "era": "2000s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative status indicator — pair it with a visually-hidden aria-live message so screen readers announce the wait. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Character color", "default": "#fbbf24" },
      { "name": "--dot", "description": "Dot color", "default": "#e7ebf3" },
      { "name": "--dur", "description": "Chomp speed", "default": "0.5s" }
    ],
    "variations": ["Ghost chasing behind", "Power pellet that flashes", "Sound-free retro arcade framing"],
    "ai_usage": "Nostalgic loader for games, retro pages, or 404s. The mouth is two half-discs rotating around the center; the dots are separate elements on a longer linear loop, so keep the chomp period a clean divisor of the dot travel time."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    :root { --c: #fbbf24; --dot: #e7ebf3; --dur: .5s; }
    .pac { position: relative; display: flex; align-items: center; width: 180px; height: 48px; }
    .pac .man { position: relative; width: 48px; height: 48px; flex: none; }
    .pac .man i { position: absolute; left: 0; width: 48px; height: 24px; background: var(--c); }
    .pac .man .up { top: 0; border-radius: 24px 24px 0 0; transform-origin: 50% 100%; animation: chompU var(--dur) linear infinite; }
    .pac .man .dn { bottom: 0; border-radius: 0 0 24px 24px; transform-origin: 50% 0; animation: chompD var(--dur) linear infinite; }
    .pac .dots { position: absolute; left: 56px; display: flex; gap: 22px; }
    .pac .dots b { width: 8px; height: 8px; border-radius: 50%; background: var(--dot); animation: eat 1.5s linear infinite; animation-delay: var(--d); }
    @keyframes chompU { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-34deg); } }
    @keyframes chompD { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(34deg); } }
    @keyframes eat { 0% { transform: translateX(60px); opacity: 1; } 90% { opacity: 1; } 100% { transform: translateX(-10px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="pac" role="status" aria-label="Loading">
    <div class="man"><i class="up"></i><i class="dn"></i></div>
    <div class="dots"><b style="--d:0s"></b><b style="--d:.5s"></b><b style="--d:1s"></b></div>
  </div>
</body>
</html>
