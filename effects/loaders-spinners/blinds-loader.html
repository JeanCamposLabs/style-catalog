<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Venetian Blinds</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "blinds-loader",
    "title": "Venetian Blinds",
    "summary": "Vertical slats flip closed and open like window blinds.",
    "description": "Each slat animates rotateY through 180° with a staggered delay, so light appears to sweep across the panel.",
    "theme": "loaders-spinners",
    "categories": ["loader", "3d"],
    "tags": ["blinds", "slats", "rotateY", "stagger", "panel"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative status indicator — pair it with a visually-hidden aria-live message so screen readers announce the wait. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Slat color", "default": "#60a5fa" },
      { "name": "--dur", "description": "Sweep", "default": "1.8s" }
    ],
    "variations": ["Horizontal slats via rotateX", "Alternate slat colors", "Freeze mid-sweep as a hover state"],
    "ai_usage": "Use as a panel-level loading cover rather than an inline spinner — it fills a rectangle nicely. Give the container perspective so the slats have depth; without it, rotateY just squashes their width."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    :root { --c: #60a5fa; --dur: 1.8s; }
    .blinds { display: flex; gap: 4px; perspective: 400px; }
    .blinds i { width: 14px; height: 64px; border-radius: 3px; background: linear-gradient(180deg, var(--c), color-mix(in srgb, var(--c) 55%, #000));
      animation: slat var(--dur) ease-in-out infinite; animation-delay: calc(var(--i) * .1s); }
    @keyframes slat { 0%, 100% { transform: rotateY(0deg); } 50% { transform: rotateY(180deg); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="blinds" role="status" aria-label="Loading">
    <i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i>
  </div>
</body>
</html>
