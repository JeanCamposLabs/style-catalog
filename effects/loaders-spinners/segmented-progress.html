<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Segmented Progress</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "segmented-progress",
    "title": "Segmented Progress",
    "summary": "Discrete blocks fill one after another instead of a continuous bar.",
    "description": "Segments read as countable steps, which makes slow progress feel like it is moving even when each block takes a while.",
    "theme": "loaders-spinners",
    "categories": ["loader", "progress"],
    "tags": ["segments", "blocks", "progress", "stepped", "discrete"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative status indicator — pair it with a visually-hidden aria-live message so screen readers announce the wait. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Filled color", "default": "#38bdf8" },
      { "name": "--off", "description": "Empty color", "default": "#1c2333" },
      { "name": "--dur", "description": "Fill cycle", "default": "2.4s" }
    ],
    "variations": ["More, thinner segments for finer resolution", "Color the last segment differently", "Fill from the center outward"],
    "ai_usage": "Use when progress is genuinely chunked (files processed, steps done). Each block animates background-color with a delay of index * cycle/count; for real progress just toggle an .is-on class per completed block."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    :root { --c: #38bdf8; --off: #1c2333; --dur: 2.4s; }
    .seg { display: flex; gap: 5px; }
    .seg i { width: 26px; height: 26px; border-radius: 5px; background: var(--off);
      animation: fill var(--dur) linear infinite; animation-delay: calc(var(--i) * (var(--dur) / 8)); }
    @keyframes fill { 0%, 4% { background: var(--off); } 10%, 96% { background: var(--c); } 100% { background: var(--off); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="seg" role="status" aria-label="Loading">
    <i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i>
    <i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i><i style="--i:7"></i>
  </div>
</body>
</html>
