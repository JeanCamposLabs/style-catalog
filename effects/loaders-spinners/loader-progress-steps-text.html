<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Step Status Loader</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "loader-progress-steps-text",
    "title": "Step Status Loader",
    "summary": "A spinner with a changing status line.",
    "description": "A spinner with a changing status line.",
    "theme": "loaders-spinners",
    "categories": ["loader", "spinner"],
    "tags": ["loader", "waiting", "status", "steps", "text", "progress"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Pair every indicator with a visually-hidden aria-live status; motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Spinner colour", "default": "#7c5cff" }
    ],
    "variations": ["Retune through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Multi-stage operations. Naming the current stage turns an opaque wait into a legible one — update the text through an aria-live region so the change is announced."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: flex; align-items: center; gap: .8rem; width: 280px; padding: .9rem 1rem; border-radius: 12px;
      background: #151b2a; border: 1px solid #263149; }
    .fx .sp { width: 20px; height: 20px; border: 3px solid #22304a; border-top-color: #7c5cff; border-radius: 50%;
      animation: spin .9s linear infinite; flex: none; }
    .fx .txt { font-size: .85rem; color: #cbd5e1; }
    .fx .sub { display: block; font-size: .74rem; color: #64748b; }
    @keyframes spin { to { transform: rotate(1turn); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx" role="status"><span class="sp" aria-hidden="true"></span>
  <span class="txt">Building catalogue<span class="sub">Step 2 of 4 · validating specimens</span></span></div>
</body>
</html>
