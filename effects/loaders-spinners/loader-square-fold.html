<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Folding Squares</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "loader-square-fold",
    "title": "Folding Squares",
    "summary": "Four squares folding toward the centre in turn.",
    "description": "Four squares folding toward the centre in turn.",
    "theme": "loaders-spinners",
    "categories": ["loader", "spinner"],
    "tags": ["loader", "waiting", "fold", "squares", "stagger", "sequence"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Pair every indicator with a visually-hidden aria-live status; motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--dur", "description": "Cycle", "default": "1.6s" }
    ],
    "variations": ["Retune through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Compact loaders. Order the delays clockwise (0, 1, 3, 2) so the sequence reads as rotation rather than as a random flicker."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: grid; grid-template-columns: repeat(2, 26px); gap: 3px; }
    .fx i { width: 26px; height: 26px; background: #2dd4bf; animation: fold 1.6s ease-in-out infinite;
      animation-delay: calc(var(--i) * .2s); }
    @keyframes fold { 0%, 70%, 100% { transform: scale(1); opacity: 1; } 35% { transform: scale(.2); opacity: .3; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx" role="status" aria-label="Loading"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:3"></i><i style="--i:2"></i></div>
</body>
</html>
