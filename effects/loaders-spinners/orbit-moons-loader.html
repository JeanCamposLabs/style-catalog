<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orbiting Moons</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "orbit-moons-loader",
    "title": "Orbiting Moons",
    "summary": "Two moons circle a core on tilted, differently timed orbits.",
    "description": "Counter-rotating orbits of unequal period keep the two moons from ever lining up the same way twice within a short loop.",
    "theme": "loaders-spinners",
    "categories": ["loader", "ambient"],
    "tags": ["orbit", "moons", "rotate", "celestial", "counter-rotate"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative status indicator — pair it with a visually-hidden aria-live message so screen readers announce the wait. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--a", "description": "Inner moon", "default": "#7c5cff" },
      { "name": "--b", "description": "Outer moon", "default": "#2dd4bf" },
      { "name": "--dur", "description": "Inner period", "default": "1.2s" }
    ],
    "variations": ["Add trailing tails to each moon", "Third orbit at a third speed", "Ellipse orbits via scaleY"],
    "ai_usage": "Ambient waiting state for space, network, or sync themes. Use unequal, non-multiple durations (1.2s and 1.9s) — durations in a simple ratio make the motion look like one rigid object turning."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    :root { --a: #7c5cff; --b: #2dd4bf; --dur: 1.2s; }
    .orb { position: relative; width: 110px; aspect-ratio: 1; display: grid; place-items: center; }
    .orb .path { position: absolute; border-radius: 50%; border: 1px dashed #232c42; }
    .orb .p1 { inset: 22px; animation: spin var(--dur) linear infinite; }
    .orb .p2 { inset: 0; animation: spin calc(var(--dur) * 1.6) linear infinite reverse; }
    .orb .path i { position: absolute; top: -6px; left: 50%; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; }
    .orb .p1 i { background: var(--a); box-shadow: 0 0 12px var(--a); }
    .orb .p2 i { background: var(--b); box-shadow: 0 0 12px var(--b); }
    .orb .core { width: 20px; height: 20px; border-radius: 50%; background: #e7ebf3; }
    @keyframes spin { to { transform: rotate(1turn); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="orb" role="status" aria-label="Loading">
    <div class="path p1"><i></i></div>
    <div class="path p2"><i></i></div>
    <span class="core"></span>
  </div>
</body>
</html>
