<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Squash & Stretch Ball</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "squash-bounce-ball",
    "title": "Squash & Stretch Ball",
    "summary": "A ball bounces with real squash-and-stretch and a shadow that reacts to height.",
    "description": "Two synchronized animations — the ball translating and squashing at the floor, the shadow scaling and fading — sell the weight that a plain translate cannot.",
    "theme": "loaders-spinners",
    "categories": ["loader", "animation"],
    "tags": ["bounce", "squash-stretch", "physics", "ball", "shadow"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative status indicator — pair it with a visually-hidden aria-live message so screen readers announce the wait. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Ball color", "default": "#ffb020" },
      { "name": "--dur", "description": "Bounce period", "default": "0.62s" },
      { "name": "--h", "description": "Bounce height", "default": "62px" }
    ],
    "variations": ["Tint the shadow to match the ball", "Add a second ball with a delay", "Rotate the ball slightly for spin"],
    "ai_usage": "The animation-principles demo of squash and stretch. Timing is the whole trick: use ease-in on the fall and ease-out on the rise (cubic-bezier(.3,0,.7,1) approximates both) and squash only in the two frames around contact."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    :root { --c: #ffb020; --dur: .62s; --h: 62px; }
    .stage { display: grid; place-items: end center; height: 120px; }
    .ball { width: 44px; height: 44px; border-radius: 50%; background: radial-gradient(circle at 34% 30%, #fff6, transparent 45%), var(--c);
      animation: hop var(--dur) cubic-bezier(.3,0,.7,1) infinite alternate; transform-origin: 50% 100%; }
    .shadow { width: 52px; height: 8px; border-radius: 50%; background: #000; opacity: .45; filter: blur(3px);
      animation: shade var(--dur) cubic-bezier(.3,0,.7,1) infinite alternate; }
    @keyframes hop {
      0% { transform: translateY(0) scale(1.16, .84); }
      14% { transform: translateY(-12px) scale(.94, 1.06); }
      100% { transform: translateY(calc(var(--h) * -1)) scale(1); }
    }
    @keyframes shade { 0% { transform: scale(1); opacity: .45; } 100% { transform: scale(.5); opacity: .15; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="stage"><div class="ball"></div><div class="shadow"></div></div>
</body>
</html>
