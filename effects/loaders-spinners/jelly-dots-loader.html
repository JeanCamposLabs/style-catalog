<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jelly Dots</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "jelly-dots-loader",
    "title": "Jelly Dots",
    "summary": "Three dots stretch and rebound on a springy cubic-bezier.",
    "description": "An overshooting easing curve on scale plus a small vertical hop gives the dots elasticity without any physics library.",
    "theme": "loaders-spinners",
    "categories": ["loader", "spinner"],
    "tags": ["dots", "jelly", "spring", "elastic", "bounce"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative status indicator — pair it with a visually-hidden aria-live message so screen readers announce the wait. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Dot color", "default": "#a78bfa" },
      { "name": "--dur", "description": "Cycle", "default": "1s" }
    ],
    "variations": ["Different hue per dot", "Longer overshoot for more wobble", "Horizontal squash instead of vertical"],
    "ai_usage": "Use when a plain three-dot loader feels too flat. The elasticity is entirely in cubic-bezier(.34,1.56,.64,1) — reuse that curve anywhere you want a spring without JS."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    :root { --c: #a78bfa; --dur: 1s; }
    .jelly { display: flex; gap: 12px; }
    .jelly i { width: 16px; height: 16px; border-radius: 50%; background: var(--c);
      animation: jel var(--dur) cubic-bezier(.34,1.56,.64,1) infinite; animation-delay: calc(var(--i) * .14s); }
    @keyframes jel {
      0%, 100% { transform: translateY(0) scale(1); }
      35% { transform: translateY(-14px) scale(1.25, .8); }
      60% { transform: translateY(0) scale(.8, 1.2); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="jelly" role="status" aria-label="Loading">
    <i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i>
  </div>
</body>
</html>
