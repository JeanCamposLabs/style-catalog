<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Loading Ellipsis</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "loader-text-dots",
    "title": "Loading Ellipsis",
    "summary": "A label with animated trailing dots.",
    "description": "A label with animated trailing dots.",
    "theme": "loaders-spinners",
    "categories": ["loader", "spinner"],
    "tags": ["loader", "waiting", "ellipsis", "dots", "text", "inline"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Pair every indicator with a visually-hidden aria-live status; motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--dur", "description": "Cycle", "default": "1.4s" }
    ],
    "variations": ["Retune through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Inline waiting states. Animating width in ch steps keeps the label from shifting; animating the text content itself makes screen readers re-announce it constantly."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { font-size: 1rem; color: #cbd5e1; font-family: ui-monospace, monospace; }
    .fx i { display: inline-block; width: 1ch; animation: dots 1.4s steps(4) infinite; overflow: hidden; vertical-align: bottom; }
    @keyframes dots { to { width: 4ch; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx" role="status">Generating posters<i>....</i></div>
</body>
</html>
