<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Percent Counter Ring</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "percent-counter-loader",
    "title": "Percent Counter Ring",
    "summary": "A ring that fills while a number counts up in step with it.",
    "description": "A conic-gradient angle and a text counter are driven by one requestAnimationFrame loop, so the label can never drift from the arc.",
    "theme": "loaders-spinners",
    "categories": ["loader", "progress"],
    "tags": ["percent", "counter", "conic-gradient", "javascript", "progress"],
    "tech": ["css", "js"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative status indicator — pair it with a visually-hidden aria-live message so screen readers announce the wait. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Fill color", "default": "#7c5cff" },
      { "name": "--track", "description": "Track color", "default": "#1c2333" },
      { "name": "--size", "description": "Ring diameter", "default": "120px" }
    ],
    "variations": ["Ease the counter for a natural finish", "Snap to real upload progress", "Color shift as it approaches 100%"],
    "ai_usage": "Use for determinate progress where the exact number matters (uploads, exports). Drive the arc by setting the --p custom property (0–100) and reading it in conic-gradient(var(--c) calc(var(--p) * 1%), var(--track) 0) — one variable keeps ring and label in sync."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    :root { --c: #7c5cff; --track: #1c2333; --size: 120px; }
    .pc { --p: 0; width: var(--size); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center;
      background: conic-gradient(var(--c) calc(var(--p) * 1%), var(--track) 0); }
    .pc::before { content: ""; position: absolute; width: calc(var(--size) - 22px); aspect-ratio: 1; border-radius: 50%; background: #0b0d12; }
    .pc span { position: relative; font-variant-numeric: tabular-nums; font-size: 1.5rem; font-weight: 700; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="pc" role="status" aria-label="Loading"><span>0%</span></div>
  <script>
    (function () {
      var el = document.querySelector(".pc"), out = el.querySelector("span"), p = 0;
      setInterval(function () {
        p = (p + 1) % 101;
        el.style.setProperty("--p", p);
        out.textContent = p + "%";
      }, 40);
    })();
  </script>
</body>
</html>
