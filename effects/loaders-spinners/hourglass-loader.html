<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hourglass</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "hourglass-loader",
    "title": "Hourglass",
    "summary": "Sand drains from the top bulb to the bottom, then the whole glass flips.",
    "description": "Two clipped triangles change height on the same timeline as a falling grain stream; a flip at the end of the cycle restarts it without a jump.",
    "theme": "loaders-spinners",
    "categories": ["loader", "time"],
    "tags": ["hourglass", "sand", "flip", "time", "clip-path"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative status indicator — pair it with a visually-hidden aria-live message so screen readers announce the wait. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--sand", "description": "Sand color", "default": "#fbbf24" },
      { "name": "--glass", "description": "Glass edge", "default": "#94a3b8" },
      { "name": "--dur", "description": "Drain time", "default": "3s" }
    ],
    "variations": ["Slow the flip for a heavier glass", "Add grain speckles inside the sand", "Pair with a countdown number"],
    "ai_usage": "Best for waits you can actually estimate — an hourglass implies finite time. The bulbs are clip-path triangles; animate the inner fill's height, and put the flip on the outer wrapper so the sand levels swap seamlessly."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    :root { --sand: #fbbf24; --glass: #94a3b8; --dur: 3s; }
    .hg { width: 60px; height: 92px; position: relative; animation: flip calc(var(--dur) + .6s) ease-in-out infinite; }
    .hg .bulb { position: absolute; left: 0; right: 0; height: 44px; background: #131a2a; border: 2px solid var(--glass); overflow: hidden; }
    .hg .top { top: 0; clip-path: polygon(0 0, 100% 0, 52% 100%, 48% 100%); }
    .hg .bot { bottom: 0; clip-path: polygon(48% 0, 52% 0, 100% 100%, 0 100%); }
    .hg .fill { position: absolute; left: 0; right: 0; background: var(--sand); }
    .hg .top .fill { top: 0; height: 100%; animation: drain var(--dur) linear infinite; }
    .hg .bot .fill { bottom: 0; height: 0; animation: fillup var(--dur) linear infinite; }
    .hg .stream { position: absolute; top: 44px; left: 50%; width: 2px; height: 6px; margin-left: -1px; background: var(--sand); }
    @keyframes drain { to { height: 0; } }
    @keyframes fillup { to { height: 100%; } }
    @keyframes flip { 0%, 84% { transform: rotate(0); } 100% { transform: rotate(180deg); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="hg" role="status" aria-label="Loading">
    <div class="bulb top"><div class="fill"></div></div>
    <span class="stream"></span>
    <div class="bulb bot"><div class="fill"></div></div>
  </div>
</body>
</html>
