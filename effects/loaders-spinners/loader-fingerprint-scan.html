<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fingerprint Scan</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "loader-fingerprint-scan",
    "title": "Fingerprint Scan",
    "summary": "Concentric arcs filling as a scan completes.",
    "description": "Concentric arcs filling as a scan completes.",
    "theme": "loaders-spinners",
    "categories": ["loader", "spinner"],
    "tags": ["loader", "waiting", "fingerprint", "scan", "biometric", "security"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Pair every indicator with a visually-hidden aria-live status; motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Scan colour", "default": "#2dd4bf" }
    ],
    "variations": ["Retune through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Authentication flows. The moving scan line over static arcs is the recognisable biometric idiom; animating the arcs themselves loses it."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 84px; height: 84px; display: grid; place-items: center; overflow: hidden; border-radius: 12px; }
    .fx i { position: absolute; border: 2px solid #22304a; border-radius: 50%; border-bottom-color: transparent; }
    .fx i:nth-child(1) { width: 26px; height: 26px; } .fx i:nth-child(2) { width: 46px; height: 46px; }
    .fx i:nth-child(3) { width: 66px; height: 66px; } .fx i:nth-child(4) { width: 84px; height: 84px; }
    .fx .line { position: absolute; left: 0; right: 0; height: 2px; background: #2dd4bf; box-shadow: 0 0 12px #2dd4bf;
      animation: scan 2s ease-in-out infinite alternate; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx" role="status" aria-label="Scanning"><i></i><i></i><i></i><i></i><span class="line"></span></div>
  <style>@keyframes scan { from { top: 6%; } to { top: 92%; } }</style>
</body>
</html>
