<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sliding Bar Loader</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "bar-slide-loader",
    "title": "Sliding Bar Loader",
    "summary": "An indeterminate track where a short bar accelerates across and stretches mid-flight.",
    "description": "One bar animates left position and scaleX together so it appears to stretch as it accelerates — the Material-style indeterminate bar in nine lines.",
    "theme": "loaders-spinners",
    "categories": ["loader", "progress"],
    "tags": ["indeterminate", "bar", "progress", "slide", "track"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative status indicator — pair it with a visually-hidden aria-live message so screen readers announce the wait. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Bar color", "default": "#7c5cff" },
      { "name": "--h", "description": "Track height", "default": "5px" },
      { "name": "--dur", "description": "Sweep period", "default": "1.4s" }
    ],
    "variations": ["Two offset bars for a busier feel", "Gradient bar instead of a flat fill", "Rounded caps with border-radius"],
    "ai_usage": "Use above content that is loading with unknown duration. Keep the track's overflow hidden; the bar animates both left and transform:scaleX so the easing reads as acceleration. Swap --dur to match perceived latency (shorter feels faster but busier)."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    :root { --c: #7c5cff; --h: 5px; --dur: 1.4s; }
    .track { width: 260px; height: var(--h); border-radius: 99px; background: #1b2030; overflow: hidden; position: relative; }
    .track b { position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: 99px; background: var(--c);
      animation: slide var(--dur) cubic-bezier(.65,.05,.36,1) infinite; }
    @keyframes slide {
      0% { left: -40%; transform: scaleX(.6); }
      50% { transform: scaleX(1.2); }
      100% { left: 100%; transform: scaleX(.6); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="track" role="status" aria-label="Loading"><b></b></div>
</body>
</html>
