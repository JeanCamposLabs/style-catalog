<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Domino Dots</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "domino-dots-loader",
    "title": "Domino Dots",
    "summary": "A row of dots topples like dominoes and resets from the far end.",
    "description": "Each dot rotates about its bottom-left corner on a shared keyframe with a stepped delay, producing the chain-reaction read.",
    "theme": "loaders-spinners",
    "categories": ["loader", "spinner"],
    "tags": ["dots", "domino", "stagger", "topple", "rotate"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative status indicator — pair it with a visually-hidden aria-live message so screen readers announce the wait. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Dot color", "default": "#f472b6" },
      { "name": "--dur", "description": "Cycle", "default": "1.6s" }
    ],
    "variations": ["Reverse the fall direction", "Use squares for a more literal domino", "Speed up the reset half of the cycle"],
    "ai_usage": "Playful loader for short waits. The mechanic is transform-origin: bottom left plus rotate(90deg); stagger with animation-delay: calc(var(--i) * .12s). Keep the row short (5–7 dots) or the cycle feels slow."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    :root { --c: #f472b6; --dur: 1.6s; }
    .dom { display: flex; gap: 6px; align-items: flex-end; height: 40px; }
    .dom i { width: 12px; height: 30px; border-radius: 4px; background: var(--c); transform-origin: bottom left;
      animation: fall var(--dur) ease-in-out infinite; animation-delay: calc(var(--i) * .13s); }
    @keyframes fall {
      0%, 10% { transform: rotate(0deg); }
      40%, 60% { transform: rotate(84deg); }
      90%, 100% { transform: rotate(0deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="dom" role="status" aria-label="Loading">
    <i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i>
  </div>
</body>
</html>
