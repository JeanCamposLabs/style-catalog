<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wi‑Fi Signal</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "wifi-signal-loader",
    "title": "Wi‑Fi Signal",
    "summary": "Three arcs and a dot light up outward like a connecting signal.",
    "description": "Each arc is a bordered circle clipped to its top quarter; sequential delays make the signal climb from dot to outer arc.",
    "theme": "loaders-spinners",
    "categories": ["loader", "status"],
    "tags": ["wifi", "signal", "connect", "arcs", "network"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative status indicator — pair it with a visually-hidden aria-live message so screen readers announce the wait. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Signal color", "default": "#38bdf8" },
      { "name": "--dur", "description": "Cycle", "default": "1.5s" }
    ],
    "variations": ["Red arcs for a failed connection", "Hold the full signal at the end", "Mirror it for an upload indicator"],
    "ai_usage": "Connectivity and sync states. Each arc uses border-top-color plus a rotate(45deg) so only the top quarter shows; stagger animation-delay by a third of the cycle for the climbing read."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    :root { --c: #38bdf8; --dur: 1.5s; }
    .wifi { position: relative; width: 96px; height: 60px; display: grid; place-items: end center; }
    .wifi i { position: absolute; bottom: 0; border: 7px solid transparent; border-top-color: var(--c); border-radius: 50%;
      transform: rotate(-45deg); opacity: .18; animation: sig var(--dur) ease-in-out infinite; animation-delay: calc(var(--i) * .22s); }
    .wifi i:nth-child(1) { width: 34px; height: 34px; }
    .wifi i:nth-child(2) { width: 62px; height: 62px; }
    .wifi i:nth-child(3) { width: 90px; height: 90px; }
    .wifi .dot { position: absolute; bottom: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--c);
      animation: sig var(--dur) ease-in-out infinite; opacity: .18; }
    @keyframes sig { 0%, 60%, 100% { opacity: .18; } 30% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="wifi" role="status" aria-label="Connecting">
    <span class="dot"></span>
    <i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i>
  </div>
</body>
</html>
