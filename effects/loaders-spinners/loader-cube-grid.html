<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cube Grid</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "loader-cube-grid",
    "title": "Cube Grid",
    "summary": "A 3×3 grid pulsing in a diagonal wave.",
    "description": "A 3×3 grid pulsing in a diagonal wave.",
    "theme": "loaders-spinners",
    "categories": ["loader", "spinner"],
    "tags": ["loader", "waiting", "grid", "cubes", "wave", "stagger"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Pair every indicator with a visually-hidden aria-live status; motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--dur", "description": "Wave", "default": "1.3s" }
    ],
    "variations": ["Retune through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Data and dashboard contexts. Delay by row + column so the pulse travels diagonally; a linear index delay produces a row-by-row sweep instead."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: grid; grid-template-columns: repeat(3, 18px); gap: 4px; }
    .fx i { width: 18px; height: 18px; background: #7c5cff; animation: scale 1.3s ease-in-out infinite;
      animation-delay: calc((var(--r) + var(--c)) * .12s); }
    @keyframes scale { 0%, 70%, 100% { transform: scale(.4); opacity: .4; } 35% { transform: scale(1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx" role="status" aria-label="Loading">
    <i style="--r:0;--c:0"></i><i style="--r:0;--c:1"></i><i style="--r:0;--c:2"></i>
    <i style="--r:1;--c:0"></i><i style="--r:1;--c:1"></i><i style="--r:1;--c:2"></i>
    <i style="--r:2;--c:0"></i><i style="--r:2;--c:1"></i><i style="--r:2;--c:2"></i></div>
</body>
</html>
