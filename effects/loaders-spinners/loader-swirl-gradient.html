<head>
  <meta charset="UTF-8" />

  <title>Swirl Loader</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "loader-swirl-gradient",
    "title": "Swirl Loader",
    "summary": "A conic swirl fading into the background.",
    "description": "A conic swirl fading into the background.",
    "theme": "loaders-spinners",
    "categories": ["loader", "spinner"],
    "tags": ["loader", "waiting", "conic", "swirl", "gradient", "mask"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Pair every indicator with a visually-hidden aria-live status; motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--a", "description": "Start colour", "default": "#d1478c" },
      { "name": "--b", "description": "End colour", "default": "#7c5cff" }
    ],
    "variations": ["Retune through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Branded spinners. A two-colour conic sweep masked into a ring gives a gradient arc that a border spinner cannot produce."

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 76px; aspect-ratio: 1; border-radius: 50%;
      background: conic-gradient(from 0deg, transparent, #d1478c, #7c5cff, transparent);
      -webkit-mask: radial-gradient(farthest-side, transparent 58%, #000 59%); mask: radial-gradient(farthest-side, transparent 58%, #000 59%);
      animation: spin 1.4s linear infinite; }
    @keyframes spin { to { transform: rotate(1turn); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx"></div>
</body>
