<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Striped Progress Bar</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "striped-progress-bar",
    "title": "Striped Progress Bar",
    "summary": "A determinate bar with diagonal barber-pole stripes marching along it.",
    "description": "repeating-linear-gradient supplies the stripes; animating background-position by exactly one stripe period makes the march seamless.",
    "theme": "loaders-spinners",
    "categories": ["loader", "progress"],
    "tags": ["stripes", "progress", "barber-pole", "repeating-gradient", "determinate"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative status indicator — pair it with a visually-hidden aria-live message so screen readers announce the wait. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Bar color", "default": "#34d399" },
      { "name": "--w", "description": "Fill percentage", "default": "64%" },
      { "name": "--dur", "description": "Stripe speed", "default": "0.9s" }
    ],
    "variations": ["Reverse the stripe direction", "Pulse the bar when complete", "Red stripes for an error state"],
    "ai_usage": "Determinate progress that still reads as active. The march is seamless only if the background-position translation equals the gradient's repeat length (here 28px) — mismatch it and you get a visible stutter every loop."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    :root { --c: #34d399; --w: 64%; --dur: .9s; }
    .sp { width: 280px; height: 18px; border-radius: 99px; background: #151b2a; overflow: hidden; border: 1px solid #232c42; }
    .sp b { display: block; height: 100%; width: var(--w); background-color: var(--c);
      background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.22) 0 10px, transparent 10px 20px);
      background-size: 28px 28px; animation: march var(--dur) linear infinite; }
    @keyframes march { to { background-position: 28px 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="sp" role="progressbar" aria-valuenow="64" aria-valuemin="0" aria-valuemax="100"><b></b></div>
</body>
</html>
