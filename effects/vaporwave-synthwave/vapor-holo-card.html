  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 190px; height: 260px; border-radius: 16px; overflow: hidden;
      background: linear-gradient(160deg, #1e1b4b, #4c1d95); border: 1px solid rgba(255,255,255,.25); }
    .fx::after { content: ""; position: absolute; inset: -50%; mix-blend-mode: color-dodge; opacity: .5;
      background: conic-gradient(from 0deg, #ff2d95, #fbbf24, #22d3ee, #a855f7, #ff2d95);
      animation: spin 7s linear infinite; filter: blur(24px); }
    @keyframes spin { to { transform: rotate(1turn); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
