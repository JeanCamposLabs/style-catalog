  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 260px; border: 2px solid #0b0d12; border-radius: 2px; background: #c0c0c0; color: #0b0d12;
      box-shadow: 4px 4px 0 rgba(0,0,0,.6); font-family: "MS Sans Serif", Tahoma, system-ui, sans-serif; }
    .fx .bar { display: flex; justify-content: space-between; align-items: center; padding: .3rem .4rem;
      background: linear-gradient(90deg, #000080, #1084d0); color: #fff; font-size: .8rem; font-weight: 700; }
    .fx .bar span { display: flex; gap: 3px; }
    .fx .bar b { width: 16px; height: 14px; background: #c0c0c0; border: 1px solid #0b0d12; box-shadow: inset 1px 1px 0 #fff; }
    .fx .body { padding: .9rem; font-size: .82rem; }
  </style>
</head>
<body>
  <div class="fx"><div class="bar">welcome.txt<span><b></b><b></b><b></b></span></div><div class="body">A E S T H E T I C</div></div>
</body>
