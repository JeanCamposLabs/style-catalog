<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dolphin Grid Scene</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "vapor-dolphin-scene",
    "title": "Dolphin Grid Scene",
    "summary": "A composed scene with grid, sun, and silhouette.",
    "description": "A composed scene with grid, sun, and silhouette.",
    "theme": "vaporwave-synthwave",
    "categories": ["retro", "vaporwave"],
    "tags": ["vaporwave", "retro", "80s", "scene", "composition", "grid", "sun"],
    "tech": ["css"],
    "era": "2000s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "High-saturation magenta on cyan is a contrast trap — keep body copy on a neutral surface.",
    "customization": [
      { "name": "--sun", "description": "Sun colour", "default": "#ff2d95" }
    ],
    "variations": ["Retune the palette via the custom properties", "Slow the motion for an ambient version"],
    "ai_usage": "A complete synthwave backdrop in one element tree — sky gradient, banded sun, perspective grid, and a silhouette on top."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 300px; height: 200px; border-radius: 14px; overflow: hidden;
      background: linear-gradient(180deg, #2b1055 0 58%, #0a0316 58%); }
    .fx .sun { position: absolute; top: 16%; left: 50%; translate: -50% 0; width: 96px; height: 96px; border-radius: 50%;
      background: linear-gradient(180deg, #fde68a, #ff2d95); }
    .fx .grid { position: absolute; left: -60%; right: -60%; bottom: 0; height: 42%;
      background-image: repeating-linear-gradient(90deg, rgba(34,211,238,.55) 0 2px, transparent 2px 40px),
        repeating-linear-gradient(0deg, rgba(34,211,238,.55) 0 2px, transparent 2px 40px);
      transform: perspective(150px) rotateX(70deg); transform-origin: bottom; }
    .fx .icon { position: absolute; top: 26%; left: 50%; translate: -50% 0; font-size: 2.6rem; filter: drop-shadow(0 0 12px #22d3ee); }
  </style>
</head>
<body>
  <div class="fx"><span class="sun"></span><span class="icon" aria-hidden="true">🐬</span><span class="grid"></span></div>
</body>
</html>
