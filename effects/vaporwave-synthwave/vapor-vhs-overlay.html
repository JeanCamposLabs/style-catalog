  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 280px; height: 170px; border-radius: 10px; overflow: hidden;
      background: linear-gradient(135deg, #4c1d95, #be185d); }
    .fx::before { content: ""; position: absolute; inset: 0;
      background: repeating-linear-gradient(180deg, rgba(255,255,255,.07) 0 1px, transparent 1px 3px); }
    .fx::after { content: ""; position: absolute; left: 0; right: 0; height: 14px; background: rgba(255,255,255,.14);
      filter: blur(2px); animation: track 5s linear infinite; }
    .tc { position: absolute; top: 10px; right: 12px; font-family: ui-monospace, monospace; font-size: .8rem; color: #fff;
      text-shadow: 2px 0 #ff2d95, -2px 0 #22d3ee; }
    @keyframes track { from { top: 110%; } to { top: -14px; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
