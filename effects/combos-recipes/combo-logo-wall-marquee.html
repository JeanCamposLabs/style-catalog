<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logo Wall</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "combo-logo-wall-marquee",
    "title": "Logo Wall",
    "summary": "A scrolling row of customer marks.",
    "description": "A scrolling row of customer marks.",
    "theme": "combos-recipes",
    "categories": ["combo", "section"],
    "tags": ["combo", "block", "logos", "marquee", "social-proof", "scroll"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Composed blocks keep real landmarks and heading levels so the section still makes sense in a document outline.",
    "customization": [
      { "name": "--dur", "description": "Scroll period", "default": "14s" }
    ],
    "variations": ["Reskin through the custom properties", "Swap the copy for your own"],
    "ai_usage": "Trust sections. Duplicate the set and translate by exactly -50% for a seamless loop, and pause on hover so people can actually read the names."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { display: grid; place-items: center; padding: 2rem 1rem; }
    .wrap { width: min(92vw, 300px); text-align: center; }
    .wrap p { margin: 0 0 .9rem; color: #64748b; font-size: .74rem; text-transform: uppercase; letter-spacing: .1em; }
    .rail { overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
      mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
    .rail div { display: flex; gap: 1.6rem; width: max-content; animation: slide 14s linear infinite; }
    .rail b { color: #8b93a7; font-weight: 800; font-size: .95rem; letter-spacing: .04em; white-space: nowrap; }
    @keyframes slide { to { transform: translateX(-50%); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <section class="wrap"><p>Trusted by teams at</p><div class="rail"><div>
  <b>ANALYTICAL</b><b>BABBAGE</b><b>TURING CO</b><b>HOPPER</b><b>ANALYTICAL</b><b>BABBAGE</b><b>TURING CO</b><b>HOPPER</b></div></div></section>
</body>
</html>
