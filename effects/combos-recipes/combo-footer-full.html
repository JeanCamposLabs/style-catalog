<head>

    "id": "combo-footer-full",

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { display: grid; place-items: center; padding: 2rem 1rem; }
    .fx { width: min(92vw, 310px); padding: 1.2rem; border-radius: 16px; background: #10141f; border: 1px solid #263149; }
    .fx .top { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
    .fx .brand b { font-size: .95rem; }
    .fx .brand p { margin: .3rem 0 0; color: #64748b; font-size: .74rem; line-height: 1.5; }
    .fx h4 { margin: 0 0 .4rem; font-size: .66rem; text-transform: uppercase; letter-spacing: .08em; color: #64748b; }
    .fx a { display: block; padding: .15rem 0; color: #cbd5e1; text-decoration: none; font-size: .78rem; }
    .fx .legal { display: flex; justify-content: space-between; margin-top: 1.1rem; padding-top: .8rem;
      border-top: 1px solid #1e2740; color: #64748b; font-size: .72rem; }
  </style>
</head>
<body>
  <footer class="fx"><div class="top"><div class="brand"><b>Style Catalog</b><p>A museum of web effects.</p></div>
  <nav aria-label="Product"><h4>Product</h4><a href="#">Gallery</a><a href="#">API</a></nav>
  <nav aria-label="Resources"><h4>Resources</h4><a href="#">Docs</a><a href="#">Changelog</a></nav></div>
  <div class="legal"><span>© 2026 Style Catalog</span><span>MIT licence</span></div></footer>
</body>
</html>
