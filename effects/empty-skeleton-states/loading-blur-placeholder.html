<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blur-Up Image</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "loading-blur-placeholder",
    "title": "Blur-Up Image",
    "summary": "A blurred placeholder resolving into the full image.",
    "description": "A blurred placeholder resolving into the full image.",
    "theme": "empty-skeleton-states",
    "categories": ["state", "empty"],
    "tags": ["state", "placeholder", "blur-up", "progressive", "image", "placeholder"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Loading placeholders must be hidden from assistive tech (aria-hidden) with a single aria-live status instead; empty states need real headings and a focusable action.",
    "customization": [
      { "name": "--blur", "description": "Placeholder blur", "default": "18px" }
    ],
    "variations": ["Adapt to a light theme", "Add a compact variant"],
    "ai_usage": "Image loading. Ship a tiny blurred base64 preview and cross-fade to the full image on load; it removes the layout flash without a spinner."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 260px; aspect-ratio: 16 / 10; border-radius: 14px; overflow: hidden; }
    .fx .lo { position: absolute; inset: 0; filter: blur(18px); transform: scale(1.1);
      background: linear-gradient(135deg, #7c5cff, #2dd4bf); }
    .fx .hi { position: absolute; inset: 0; background: conic-gradient(from 160deg at 40% 35%, #7c5cff, #2dd4bf, #f472b6, #7c5cff);
      animation: reveal 3s ease-in-out infinite; }
    @keyframes reveal { 0%, 30% { opacity: 0; } 60%, 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx"><div class="lo"></div><div class="hi"></div></div>
</body>
</html>
