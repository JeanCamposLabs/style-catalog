<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Error State</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "error-state-retry",
    "title": "Error State",
    "summary": "A failure screen with a retry and a details link.",
    "description": "A failure screen with a retry and a details link.",
    "theme": "empty-skeleton-states",
    "categories": ["state", "empty"],
    "tags": ["state", "placeholder", "error", "retry", "failure", "recovery"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Loading placeholders must be hidden from assistive tech (aria-hidden) with a single aria-live status instead; empty states need real headings and a focusable action.",
    "customization": [
      { "name": "--bad", "description": "Error colour", "default": "#d1478c" }
    ],
    "variations": ["Adapt to a light theme", "Add a compact variant"],
    "ai_usage": "Failed loads. Say what failed in plain language, offer retry, and link to detail for those who want it — an error code with no action is a support ticket waiting to happen."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 285px; padding: 1.8rem 1.3rem; border-radius: 16px; background: #1a1114; border: 1px solid #4a2430; text-align: center; }
    .fx .ic { font-size: 2rem; }
    .fx h3 { margin: .7rem 0 .3rem; font-size: 1rem; color: #ffd6e0; }
    .fx p { margin: 0 0 1.1rem; color: #d5a3b3; font-size: .84rem; line-height: 1.5; }
    .fx .row { display: flex; gap: .5rem; justify-content: center; }
    .fx button { padding: .5rem 1.1rem; border-radius: 9px; border: 1px solid #7f3049; background: transparent;
      color: #ffd6e0; font: inherit; font-size: .82rem; cursor: pointer; }
    .fx .primary { background: #d1478c; border-color: #d1478c; color: #2a0d1c; font-weight: 700; }
  </style>
</head>
<body>
  <div class="fx" role="alert"><div class="ic" aria-hidden="true">⚠</div><h3>Could not load specimens</h3>
  <p>The catalogue API did not respond. Your connection looks fine.</p>
  <div class="row"><button class="primary" type="button">Retry</button><button type="button">Details</button></div></div>
</body>
</html>
