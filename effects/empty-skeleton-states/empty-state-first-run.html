  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 280px; padding: 2rem 1.4rem; border-radius: 16px; background: #151b2a; border: 1px solid #263149; text-align: center; }
    .fx .ic { font-size: 2.4rem; opacity: .6; }
    .fx h3 { margin: .8rem 0 .3rem; font-size: 1rem; }
    .fx p { margin: 0 0 1.2rem; color: #8b93a7; font-size: .85rem; line-height: 1.5; }
    .fx button { padding: .55rem 1.3rem; border: 0; border-radius: 10px; background: #7c5cff; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <div class="fx"><div class="ic" aria-hidden="true">🗂</div><h3>No collections yet</h3>
