<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline State</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "offline-state-banner",
    "title": "Offline State",
    "summary": "An offline notice with queued-changes reassurance.",
    "description": "An offline notice with queued-changes reassurance.",
    "theme": "empty-skeleton-states",
    "categories": ["state", "empty"],
    "tags": ["state", "placeholder", "offline", "connectivity", "queued", "reassurance"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Loading placeholders must be hidden from assistive tech (aria-hidden) with a single aria-live status instead; empty states need real headings and a focusable action.",
    "customization": [
      { "name": "--c", "description": "Status colour", "default": "#c2891a" }
    ],
    "variations": ["Adapt to a light theme", "Add a compact variant"],
    "ai_usage": "Connectivity loss. Tell users what still works and what is queued; an offline banner that only says 'You are offline' causes people to abandon unsaved work."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: flex; gap: .8rem; width: 295px; padding: .9rem 1rem; border-radius: 12px; background: #1c1c1c;
      border: 1px solid #3f3f46; color: #e4e4e7; }
    .fx .ic { font-size: 1.2rem; }
    .fx b { display: block; font-size: .88rem; }
    .fx p { margin: .15rem 0 0; color: #a1a1aa; font-size: .82rem; line-height: 1.45; }
    .fx .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #c2891a; margin-right: .35rem; }
  </style>
</head>
<body>
  <div class="fx" role="status"><span class="ic" aria-hidden="true">📡</span>
  <div><b><span class="dot"></span>You are offline</b><p>Two edits are queued and will sync automatically when the connection returns.</p></div></div>
</body>
</html>
