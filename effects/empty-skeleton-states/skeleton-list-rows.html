<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skeleton Rows</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "skeleton-list-rows",
    "title": "Skeleton Rows",
    "summary": "Placeholder list rows with avatars.",
    "description": "Placeholder list rows with avatars.",
    "theme": "empty-skeleton-states",
    "categories": ["state", "empty"],
    "tags": ["state", "placeholder", "skeleton", "list", "rows", "loading"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Loading placeholders must be hidden from assistive tech (aria-hidden) with a single aria-live status instead; empty states need real headings and a focusable action.",
    "customization": [
      { "name": "--dur", "description": "Shimmer period", "default": "1.6s" }
    ],
    "variations": ["Adapt to a light theme", "Add a compact variant"],
    "ai_usage": "List views. Show three to five skeleton rows, never a screen full — a long placeholder list overstates how much content is coming."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 290px; display: grid; gap: 10px; }
    .r { display: flex; align-items: center; gap: .8rem; padding: .6rem .8rem; border-radius: 12px;
      background: #151b2a; border: 1px solid #263149; }
    .r .av { width: 34px; height: 34px; border-radius: 50%; flex: none; }
    .r .col { flex: 1; display: grid; gap: 6px; }
    .r .l { height: 8px; border-radius: 4px; }
    .r .l.s { width: 55%; }
    .sk { background: linear-gradient(90deg, #1b2231 25%, #2b3550 37%, #1b2231 63%); background-size: 400% 100%;
      animation: sheen 1.6s ease-in-out infinite; }
    @keyframes sheen { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx" aria-hidden="true"><div class="r"><span class="av sk"></span><span class="col"><span class="l sk"></span><span class="l s sk"></span></span></div>
  <div class="r"><span class="av sk"></span><span class="col"><span class="l sk"></span><span class="l s sk"></span></span></div>
  <div class="r"><span class="av sk"></span><span class="col"><span class="l sk"></span><span class="l s sk"></span></span></div></div>
</body>
</html>
