<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skeleton Grid</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "skeleton-card-grid",
    "title": "Skeleton Grid",
    "summary": "Placeholder cards matching the real layout.",
    "description": "Placeholder cards matching the real layout.",
    "theme": "empty-skeleton-states",
    "categories": ["state", "empty"],
    "tags": ["state", "placeholder", "skeleton", "grid", "placeholder", "loading"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Loading placeholders must be hidden from assistive tech (aria-hidden) with a single aria-live status instead; empty states need real headings and a focusable action.",
    "customization": [
      { "name": "--dur", "description": "Shimmer period", "default": "1.6s" }
    ],
    "variations": ["Adapt to a light theme", "Add a compact variant"],
    "ai_usage": "Card grids waiting on data. Match the skeleton's box model to the real card exactly so nothing shifts on arrival; hide the whole grid from screen readers and announce 'Loading' once."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: grid; grid-template-columns: repeat(2, 130px); gap: 12px; }
    .c { border-radius: 12px; background: #151b2a; border: 1px solid #263149; padding: .7rem; }
    .c .img { aspect-ratio: 16 / 10; border-radius: 8px; margin-bottom: .6rem; }
    .c .l { height: 9px; border-radius: 5px; margin-bottom: 6px; }
    .c .l.s { width: 60%; }
    .sk { background: linear-gradient(90deg, #1b2231 25%, #2b3550 37%, #1b2231 63%); background-size: 400% 100%;
      animation: sheen 1.6s ease-in-out infinite; }
    @keyframes sheen { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx" aria-hidden="true"><div class="c"><div class="img sk"></div><div class="l sk"></div><div class="l s sk"></div></div>
  <div class="c"><div class="img sk"></div><div class="l sk"></div><div class="l s sk"></div></div>
  <div class="c"><div class="img sk"></div><div class="l sk"></div><div class="l s sk"></div></div>
  <div class="c"><div class="img sk"></div><div class="l sk"></div><div class="l s sk"></div></div></div>
  <span class="sr" style="position:absolute;left:-9999px" role="status">Loading specimens</span>
</body>
</html>
