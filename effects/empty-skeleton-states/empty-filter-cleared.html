<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Filtered To Nothing</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "empty-filter-cleared",
    "title": "Filtered To Nothing",
    "summary": "A state caused by filters, with a one-click reset.",
    "description": "A state caused by filters, with a one-click reset.",
    "theme": "empty-skeleton-states",
    "categories": ["state", "empty"],
    "tags": ["state", "placeholder", "filters", "empty", "reset", "recovery"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Loading placeholders must be hidden from assistive tech (aria-hidden) with a single aria-live status instead; empty states need real headings and a focusable action.",
    "customization": [
      { "name": "--c", "description": "Chip background", "default": "#1e2740" }
    ],
    "variations": ["Adapt to a light theme", "Add a compact variant"],
    "ai_usage": "Over-filtered lists. Show the active filters in the empty state itself so the cause is obvious, and make clearing them a single click."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 290px; padding: 1.5rem 1.2rem; border-radius: 16px; background: #151b2a; border: 1px solid #263149; text-align: center; }
    .fx .chips { display: flex; gap: .4rem; justify-content: center; flex-wrap: wrap; margin-bottom: .9rem; }
    .fx .chip { display: inline-flex; gap: .3rem; align-items: center; padding: .22rem .6rem; border-radius: 99px;
      background: #1e2740; color: #cbd5e1; font-size: .76rem; }
    .fx h3 { margin: 0 0 .3rem; font-size: .96rem; }
    .fx p { margin: 0 0 1rem; color: #8b93a7; font-size: .83rem; }
    .fx button { padding: .45rem 1.1rem; border: 1px solid #2b3450; border-radius: 9px; background: transparent;
      color: #cbd5e1; font: inherit; font-size: .82rem; cursor: pointer; }
  </style>
</head>
<body>
  <div class="fx" role="status"><div class="chips"><span class="chip">webgl ×</span><span class="chip">1990s ×</span><span class="chip">beginner ×</span></div>
  <h3>No specimens match all three filters</h3><p>Nothing in the catalogue uses WebGL from the 1990s.</p>
  <button type="button">Clear all filters</button></div>
</body>
</html>
