<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skeleton Paragraph</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "skeleton-text-paragraph",
    "title": "Skeleton Paragraph",
    "summary": "Placeholder text lines with varied widths.",
    "description": "Placeholder text lines with varied widths.",
    "theme": "empty-skeleton-states",
    "categories": ["state", "empty"],
    "tags": ["state", "placeholder", "skeleton", "text", "paragraph", "shimmer"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Loading placeholders must be hidden from assistive tech (aria-hidden) with a single aria-live status instead; empty states need real headings and a focusable action.",
    "customization": [
      { "name": "--dur", "description": "Shimmer period", "default": "1.6s" }
    ],
    "variations": ["Adapt to a light theme", "Add a compact variant"],
    "ai_usage": "Article and description placeholders. Vary the line widths — uniform bars read as a UI element rather than as text about to appear."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 290px; display: grid; gap: 10px; }
    .fx i { height: 10px; border-radius: 5px; width: var(--w, 100%);
      background: linear-gradient(90deg, #1b2231 25%, #2b3550 37%, #1b2231 63%); background-size: 400% 100%;
      animation: sheen 1.6s ease-in-out infinite; }
    .fx .h { height: 16px; width: 45%; }
    @keyframes sheen { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx" aria-hidden="true"><i class="h"></i><i></i><i style="--w:96%"></i><i style="--w:88%"></i><i style="--w:54%"></i></div>
</body>
</html>
