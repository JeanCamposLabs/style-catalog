<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tilt with Shine</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "image-tilt-shine",
    "title": "Tilt with Shine",
    "summary": "An image that tilts and catches light with the pointer.",
    "description": "An image that tilts and catches light with the pointer.",
    "theme": "images-media",
    "categories": ["image", "media"],
    "tags": ["image", "media", "tilt", "shine", "pointer", "3d"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative images need empty alt; meaningful ones need real descriptions. Never convey information through a hover-only image treatment.",
    "customization": [
      { "name": "--tilt", "description": "Maximum tilt", "default": "12deg" }
    ],
    "variations": ["Retune through the custom properties", "Add a reduced-motion static variant"],
    "ai_usage": "Product and portfolio images. Tilt and highlight must share the same pointer position, or the light appears to come from a different direction than the tilt implies."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 250px; aspect-ratio: 4 / 3; border-radius: 16px; overflow: hidden; position: relative;
      transition: transform .2s ease-out; }
    .fx .img { position: absolute; inset: 0; background: conic-gradient(from 200deg at 35% 30%, #7c5cff, #2dd4bf, #c2891a); }
    .fx .sh { position: absolute; inset: 0; background: radial-gradient(220px circle at var(--x, 50%) var(--y, 50%), rgba(255,255,255,.35), transparent 60%);
      opacity: 0; transition: opacity .2s; }
    .fx:hover .sh { opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx" id="ti"><div class="img"></div><div class="sh"></div></div>
  <script>
    (function () {
      var el = document.getElementById("ti");
      el.addEventListener("pointermove", function (e) {
        var r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
        el.style.transform = "perspective(700px) rotateY(" + (x - .5) * 16 + "deg) rotateX(" + (.5 - y) * 16 + "deg)";
        el.style.setProperty("--x", x * 100 + "%");
        el.style.setProperty("--y", y * 100 + "%");
      });
      el.addEventListener("pointerleave", function () { el.style.transform = ""; });
    })();
  </script>
</body>
</html>
