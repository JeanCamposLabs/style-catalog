<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Duotone Hover</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "image-duotone-hover",
    "title": "Duotone Hover",
    "summary": "A duotone image returning to full colour on hover.",
    "description": "A duotone image returning to full colour on hover.",
    "theme": "images-media",
    "categories": ["image", "media"],
    "tags": ["image", "media", "duotone", "hover", "grayscale", "reveal"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative images need empty alt; meaningful ones need real descriptions. Never convey information through a hover-only image treatment.",
    "customization": [
      { "name": "--a", "description": "Duotone shadow", "default": "#2f7cc9" },
      { "name": "--b", "description": "Duotone highlight", "default": "#d1478c" }
    ],
    "variations": ["Retune through the custom properties", "Add a reduced-motion static variant"],
    "ai_usage": "Editorial and portfolio grids. Grayscale first, then a colour-blended tint — tinting a colour image directly produces muddy midtones."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 260px; aspect-ratio: 4 / 3; border-radius: 14px; overflow: hidden; }
    .fx .img { position: absolute; inset: 0; background: conic-gradient(from 200deg at 35% 30%, #7c5cff, #2dd4bf, #c2891a, #7c5cff);
      filter: grayscale(1) contrast(1.15); transition: filter .4s; }
    .fx::after { content: ""; position: absolute; inset: 0; mix-blend-mode: color; opacity: 1; transition: opacity .4s;
      background: linear-gradient(135deg, #2f7cc9, #d1478c); }
    .fx:hover .img { filter: none; }
    .fx:hover::after { opacity: 0; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx"><div class="img"></div></div>
</body>
</html>
