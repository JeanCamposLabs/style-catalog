<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scattered Photos</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "image-polaroid-scatter",
    "title": "Scattered Photos",
    "summary": "Overlapping photos at slight angles.",
    "description": "Overlapping photos at slight angles.",
    "theme": "images-media",
    "categories": ["image", "media"],
    "tags": ["image", "media", "scatter", "photos", "polaroid", "collage"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative images need empty alt; meaningful ones need real descriptions. Never convey information through a hover-only image treatment.",
    "customization": [
      { "name": "--r", "description": "Rotation range", "default": "8deg" }
    ],
    "variations": ["Retune through the custom properties", "Add a reduced-motion static variant"],
    "ai_usage": "Memory walls and about pages. Small random rotations (±8°) plus overlap create the pile; straightening on hover is what makes it feel touchable."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 280px; height: 200px; }
    .p { position: absolute; width: 110px; padding: 8px 8px 26px; background: #fdfdfb; box-shadow: 0 10px 24px rgba(0,0,0,.5);
      transition: transform .3s, z-index 0s; }
    .p .img { aspect-ratio: 1; }
    .p:hover { transform: scale(1.06) rotate(0deg) !important; z-index: 5; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx"><div class="p" style="left:0;top:20px;transform:rotate(-7deg)"><div class="img" style="background:#7c5cff"></div></div>
  <div class="p" style="left:84px;top:0;transform:rotate(4deg)"><div class="img" style="background:#10a894"></div></div>
  <div class="p" style="left:162px;top:28px;transform:rotate(-3deg)"><div class="img" style="background:#c2891a"></div></div></div>
</body>
</html>
