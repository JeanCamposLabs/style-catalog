<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Player Controls</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "video-player-controls",
    "title": "Player Controls",
    "summary": "A media control bar with a scrubber.",
    "description": "A media control bar with a scrubber.",
    "theme": "images-media",
    "categories": ["image", "media"],
    "tags": ["image", "media", "video", "player", "controls", "scrubber"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Decorative images need empty alt; meaningful ones need real descriptions. Never convey information through a hover-only image treatment.",
    "customization": [
      { "name": "--c", "description": "Progress colour", "default": "#7c5cff" }
    ],
    "variations": ["Retune through the custom properties", "Add a reduced-motion static variant"],
    "ai_usage": "Custom media players. Keep the native <video> element and only restyle its controls; rebuilding playback from scratch loses captions, PiP, and keyboard shortcuts."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 290px; border-radius: 14px; overflow: hidden; background: #0b0d12; }
    .fx .screen { aspect-ratio: 16 / 9; background: conic-gradient(from 160deg at 40% 35%, #1e1b4b, #7c5cff, #2dd4bf); }
    .fx .bar { display: flex; align-items: center; gap: .6rem; padding: .6rem .8rem; background: #12161f; }
    .fx button { width: 30px; height: 30px; border: 0; border-radius: 8px; background: transparent; color: #e7ebf3; cursor: pointer; }
    .fx .track { flex: 1; height: 4px; border-radius: 99px; background: #2b3450; position: relative; }
    .fx .track i { position: absolute; inset: 0 auto 0 0; width: 42%; border-radius: 99px; background: #7c5cff; }
    .fx .track b { position: absolute; left: 42%; top: 50%; translate: -50% -50%; width: 11px; height: 11px;
      border-radius: 50%; background: #fff; }
    .fx .t { font-size: .72rem; color: #8b93a7; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div class="fx"><div class="screen"></div><div class="bar"><button type="button" aria-label="Play">▶</button>
  <span class="track" role="slider" aria-label="Seek" aria-valuenow="42" aria-valuemin="0" aria-valuemax="100"><i></i><b></b></span>
  <span class="t">1:24 / 3:18</span><button type="button" aria-label="Mute">🔊</button></div></div>
</body>
</html>
