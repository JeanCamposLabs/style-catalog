<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Onboarding Page</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "template-onboarding-checklist",
    "title": "Onboarding Page",
    "summary": "A guided setup checklist with progress.",
    "description": "A guided setup checklist with progress.",
    "theme": "website-templates",
    "categories": ["template", "page"],
    "tags": ["template", "page", "onboarding", "checklist", "setup", "progress"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "advanced",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Full pages keep landmark elements (header, nav, main, footer), a single h1, and a visible focus order that matches the layout.",
    "customization": [
      { "name": "--ok", "description": "Complete colour", "default": "#10a894" }
    ],
    "variations": ["Reskin through the custom properties", "Swap the copy for your own"],
    "ai_usage": "First-run experiences. Show the count as text as well as a bar, and let users skip ahead — a linear checklist that blocks exploration increases abandonment."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { padding: 1.4rem; max-width: 30rem; margin: 0 auto; }
    h1 { margin: 0 0 .3rem; font-size: 1.4rem; }
    .sub { margin: 0 0 1rem; color: #8b93a7; font-size: .88rem; }
    .bar { height: 7px; border-radius: 99px; background: #22304a; overflow: hidden; margin-bottom: 1.2rem; }
    .bar i { display: block; height: 100%; width: 60%; background: #10a894; }
    .step { display: flex; gap: .8rem; padding: .9rem 1rem; border-radius: 12px; background: #151b2a;
      border: 1px solid #263149; margin-bottom: 8px; }
    .step.done { opacity: .65; }
    .step .box { width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid #3b465e; display: grid;
      place-items: center; flex: none; font-size: .74rem; }
    .step.done .box { background: #10a894; border-color: #10a894; color: #04241f; }
    .step b { display: block; font-size: .9rem; }
    .step span { color: #8b93a7; font-size: .8rem; }
    .step a { margin-left: auto; align-self: center; color: #b9a5ff; text-decoration: none; font-size: .82rem; font-weight: 700; }
  </style>
</head>
<body>
  <h1>Finish setting up</h1><p class="sub">3 of 5 steps complete</p>
  <div class="bar" role="progressbar" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100"><i></i></div>
  <main><div class="step done"><span class="box">✓</span><div><b>Create your workspace</b><span>Named “Analytical”</span></div></div>
  <div class="step done"><span class="box">✓</span><div><b>Invite your team</b><span>4 members joined</span></div></div>
  <div class="step done"><span class="box">✓</span><div><b>Connect a repository</b><span>github.com/analytical/site</span></div></div>
  <div class="step"><span class="box"></span><div><b>Pick a theme</b><span>Choose a starting palette</span></div><a href="#">Start →</a></div>
  <div class="step"><span class="box"></span><div><b>Publish your first page</b><span>Takes about two minutes</span></div><a href="#">Start →</a></div></main>
</body>
</html>
