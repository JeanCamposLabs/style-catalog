<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Holy Grail</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "layout-holy-grail-grid",
    "title": "Holy Grail",
    "summary": "Header, three columns, and footer in one grid.",
    "description": "Header, three columns, and footer in one grid.",
    "theme": "layout-archetypes",
    "categories": ["layout", "structure"],
    "tags": ["layout", "grid", "holy-grail", "grid-template-areas", "classic", "layout"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Layouts must reflow rather than scroll horizontally, and the DOM order must match the visual reading order.",
    "customization": [
      { "name": "--side", "description": "Side column width", "default": "60px" }
    ],
    "variations": ["Retune through the custom properties", "Scale for a compact variant"],
    "ai_usage": "The classic page skeleton. grid-template-areas makes the structure readable in the CSS itself, and reordering for mobile is a one-line change."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: grid; width: 300px; height: 190px; gap: 6px; font-size: .74rem; color: #8b93a7;
      grid-template: "hd hd hd" 32px "l main r" 1fr "ft ft ft" 28px / 60px 1fr 60px; }
    .fx > * { background: #151b2a; border: 1px solid #263149; border-radius: 8px; display: grid; place-items: center; }
    .hd { grid-area: hd; } .l { grid-area: l; } .main { grid-area: main; background: #10141f; } .r { grid-area: r; } .ft { grid-area: ft; }
  </style>
</head>
<body>
  <div class="fx"><div class="hd">header</div><div class="l">nav</div><div class="main">content</div>
  <div class="r">aside</div><div class="ft">footer</div></div>
</body>
</html>
