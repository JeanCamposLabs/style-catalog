<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Full-Bleed Content</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "layout-full-bleed-grid",
    "title": "Full-Bleed Content",
    "summary": "Content in a measure with full-width breakouts.",
    "description": "Content in a measure with full-width breakouts.",
    "theme": "layout-archetypes",
    "categories": ["layout", "structure"],
    "tags": ["layout", "grid", "full-bleed", "breakout", "measure", "article"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Layouts must reflow rather than scroll horizontally, and the DOM order must match the visual reading order.",
    "customization": [
      { "name": "--measure", "description": "Content width", "default": "220px" }
    ],
    "variations": ["Retune through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Long-form articles with wide images. A three-column grid where content sits in the middle track lets any child break out with grid-column: 1 / -1 — no negative margins."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: grid; grid-template-columns: 1fr min(220px, 100%) 1fr; width: 300px; border-radius: 14px;
      overflow: hidden; background: #10141f; padding-block: 1rem; }
    .fx > * { grid-column: 2; }
    .fx .bleed { grid-column: 1 / -1; }
    .fx p { margin: 0 0 .8rem; color: #8b93a7; font-size: .8rem; line-height: 1.6; }
    .fx .bleed { height: 60px; background: conic-gradient(from 160deg, #7c5cff, #2dd4bf, #d1478c); margin-bottom: .8rem; }
  </style>
</head>
<body>
  <div class="fx"><p>Body copy stays within a readable measure.</p><div class="bleed"></div>
  <p>The image above breaks out to the full width without leaving the flow.</p></div>
</body>
</html>
