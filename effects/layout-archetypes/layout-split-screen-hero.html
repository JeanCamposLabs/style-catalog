<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Split Hero</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "layout-split-screen-hero",
    "title": "Split Hero",
    "summary": "A two-panel hero with copy and visual.",
    "description": "A two-panel hero with copy and visual.",
    "theme": "layout-archetypes",
    "categories": ["layout", "structure"],
    "tags": ["layout", "grid", "split", "hero", "two-panel", "landing"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Layouts must reflow rather than scroll horizontally, and the DOM order must match the visual reading order.",
    "customization": [
      { "name": "--ratio", "description": "Split ratio", "default": "1fr 1fr" }
    ],
    "variations": ["Retune through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Landing pages. Keep the copy panel first in the DOM so it is read before the decorative half regardless of which side it appears on visually."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: grid; grid-template-columns: 1fr 1fr; width: 300px; height: 180px; border-radius: 16px; overflow: hidden; }
    .fx .copy { background: #10141f; padding: 1rem; display: grid; align-content: center; gap: .4rem; }
    .fx h3 { margin: 0; font-size: 1.05rem; }
    .fx p { margin: 0; color: #8b93a7; font-size: .78rem; line-height: 1.5; }
    .fx .art { background: conic-gradient(from 160deg at 40% 35%, #7c5cff, #2dd4bf, #d1478c); }
    @media (max-width: 420px) { .fx { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="fx"><div class="copy"><h3>Ship faster</h3><p>A thousand ready-made effects, all offline.</p></div><div class="art"></div></div>
</body>
</html>
