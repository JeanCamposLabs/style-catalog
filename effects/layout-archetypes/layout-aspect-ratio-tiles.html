<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aspect Ratio Tiles</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "layout-aspect-ratio-tiles",
    "title": "Aspect Ratio Tiles",
    "summary": "Tiles that keep their proportions at any width.",
    "description": "Tiles that keep their proportions at any width.",
    "theme": "layout-archetypes",
    "categories": ["layout", "structure"],
    "tags": ["layout", "grid", "aspect-ratio", "tiles", "proportion", "grid"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Layouts must reflow rather than scroll horizontally, and the DOM order must match the visual reading order.",
    "customization": [
      { "name": "--ratio", "description": "Tile ratio", "default": "1" }
    ],
    "variations": ["Retune through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Media grids. aspect-ratio reserves the box before content loads, which removes the layout shift that padding-top hacks were invented to solve."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 300px; }
    .fx div { aspect-ratio: 1; border-radius: 12px; display: grid; place-items: center; color: #0b0d12; font-weight: 800; font-size: .78rem; }
    .fx .wide { grid-column: span 2; aspect-ratio: 2 / 1; }
  </style>
</head>
<body>
  <div class="fx"><div class="wide" style="background:#7c5cff">2:1</div><div style="background:#10a894">1:1</div>
  <div style="background:#c2891a">1:1</div><div style="background:#d1478c">1:1</div><div style="background:#2f7cc9">1:1</div></div>
</body>
</html>
