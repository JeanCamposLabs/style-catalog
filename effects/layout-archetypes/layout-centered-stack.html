<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Centred Stack</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "layout-centered-stack",
    "title": "Centred Stack",
    "summary": "A readable measure centred with consistent rhythm.",
    "description": "A readable measure centred with consistent rhythm.",
    "theme": "layout-archetypes",
    "categories": ["layout", "structure"],
    "tags": ["layout", "grid", "stack", "measure", "rhythm", "prose"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Layouts must reflow rather than scroll horizontally, and the DOM order must match the visual reading order.",
    "customization": [
      { "name": "--gap", "description": "Stack gap", "default": "1rem" }
    ],
    "variations": ["Retune through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Article and form layouts. One gap value on a grid container replaces every margin rule underneath it, and max-width in ch keeps the measure readable at any font size."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 290px; margin-inline: auto; display: grid; gap: 1rem; padding: 1rem; border-radius: 14px;
      background: #10141f; border: 1px solid #263149; }
    .fx h3 { margin: 0; font-size: 1.05rem; }
    .fx p { margin: 0; color: #8b93a7; font-size: .84rem; line-height: 1.65; max-width: 60ch; }
  </style>
</head>
<body>
  <div class="fx"><h3>The stack</h3><p>Spacing comes from one gap value, not from margins on individual children.</p>
  <p>That makes vertical rhythm a single number to tune.</p></div>
</body>
</html>
