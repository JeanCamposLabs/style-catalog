<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Auto-Fit Card Grid</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "layout-card-grid-auto-fit",
    "title": "Auto-Fit Card Grid",
    "summary": "Cards that reflow without media queries.",
    "description": "Cards that reflow without media queries.",
    "theme": "layout-archetypes",
    "categories": ["layout", "structure"],
    "tags": ["layout", "grid", "auto-fit", "minmax", "responsive", "grid"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Layouts must reflow rather than scroll horizontally, and the DOM order must match the visual reading order.",
    "customization": [
      { "name": "--min", "description": "Minimum track", "default": "88px" }
    ],
    "variations": ["Retune through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Responsive card grids. repeat(auto-fit, minmax(X, 1fr)) reflows at every width with no breakpoints; use auto-fill instead when empty tracks should be preserved."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: 8px; width: 300px; }
    .fx div { height: 70px; border-radius: 12px; background: #151b2a; border: 1px solid #263149; display: grid;
      place-items: center; color: #8b93a7; font-size: .76rem; }
  </style>
</head>
<body>
  <div class="fx"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div></div>
</body>
</html>
