<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Masonry Columns</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "layout-masonry-grid-native",
    "title": "Masonry Columns",
    "summary": "Ragged-height tiles in balanced columns.",
    "description": "Ragged-height tiles in balanced columns.",
    "theme": "layout-archetypes",
    "categories": ["layout", "structure"],
    "tags": ["layout", "grid", "masonry", "columns", "ragged", "gallery"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Layouts must reflow rather than scroll horizontally, and the DOM order must match the visual reading order.",
    "customization": [
      { "name": "--cols", "description": "Column count", "default": "3" }
    ],
    "variations": ["Retune through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Pinterest-style walls. CSS columns order items top-to-bottom per column, so tab order will not match the visual layout — use it only where order is not meaningful."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { columns: 3; column-gap: 8px; width: 300px; }
    .fx div { break-inside: avoid; margin-bottom: 8px; border-radius: 10px; background: #151b2a; border: 1px solid #263149;
      display: grid; place-items: center; color: #8b93a7; font-size: .74rem; }
  </style>
</head>
<body>
  <div class="fx"><div style="height:60px">1</div><div style="height:96px">2</div><div style="height:74px">3</div>
  <div style="height:110px">4</div><div style="height:66px">5</div><div style="height:88px">6</div></div>
</body>
</html>
