<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hit Counter</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "hit-counter-odometer",
    "title": "Hit Counter",
    "summary": "A mechanical visitor counter.",
    "description": "A mechanical visitor counter.",
    "theme": "retro-web",
    "categories": ["retro", "nostalgia"],
    "tags": ["retro", "nostalgia", "counter", "visitors", "odometer", "90s"],
    "tech": ["css"],
    "era": "1990s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "These recreate deprecated tags accessibly: motion respects prefers-reduced-motion and nothing depends on blinking to be readable.",
    "customization": [
      { "name": "--c", "description": "Digit colour", "default": "#0f0" }
    ],
    "variations": ["Retune through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Nostalgia pages. Zero-pad to a fixed width so the counter never changes size, and keep the number in text so it can be read aloud."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: inline-flex; gap: 2px; padding: 4px; background: #000; border: 2px inset #808080; }
    .fx span { width: 22px; height: 32px; background: linear-gradient(180deg, #333, #000); color: #0f0;
      display: grid; place-items: center; font-family: ui-monospace, monospace; font-size: 1.1rem; font-weight: 700;
      border: 1px solid #222; }
    .lbl { display: block; margin-top: .5rem; font-family: "MS Sans Serif", Tahoma, sans-serif; font-size: .72rem; color: #8b93a7; }
  </style>
</head>
<body>
  <div><div class="fx" role="img" aria-label="Visitor number 0042189"><span>0</span><span>0</span><span>4</span><span>2</span><span>1</span><span>8</span><span>9</span></div>
  <span class="lbl">You are visitor number 42,189</span></div>
</body>
</html>
