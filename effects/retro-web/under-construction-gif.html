<head>
  <meta charset="UTF-8" />

  <title>Under Construction</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "under-construction-gif",
    "title": "Under Construction",
    "summary": "The classic roadworks banner, rebuilt in CSS.",
    "description": "The classic roadworks banner, rebuilt in CSS.",
    "theme": "retro-web",
    "categories": ["retro", "nostalgia"],
    "tags": ["retro", "nostalgia", "under-construction", "90s", "banner", "geocities"],
    "tech": ["css"],
    "era": "1990s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "These recreate deprecated tags accessibly: motion respects prefers-reduced-motion and nothing depends on blinking to be readable.",
    "customization": [
      { "name": "--c", "description": "Sign colour", "default": "#ffe600" }
    ],
    "variations": ["Retune through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Deliberate 90s pastiche and placeholder pages. The hazard stripes plus Comic Sans are the two signals that place it precisely; either alone reads as generic warning."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: flex; align-items: center; gap: .8rem; padding: .7rem 1rem; background: #ffe600; color: #000;
      border: 3px solid #000; font-family: "Comic Sans MS", "Segoe Print", cursive; font-weight: 700; }
    .fx .sign { width: 34px; height: 30px; background: #000; clip-path: polygon(50% 0, 100% 100%, 0 100%);
      position: relative; }
    .fx .sign::after { content: ""; position: absolute; left: 50%; top: 40%; translate: -50% 0; width: 4px; height: 12px; background: #ffe600; }
    .fx .bar { width: 100%; height: 8px; background: repeating-linear-gradient(45deg, #000 0 8px, #ffe600 8px 16px);
      animation: march .8s linear infinite; }
    @keyframes march { to { background-position: 22px 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div><div class="fx"><span class="sign"></span>UNDER CONSTRUCTION</div><div class="bar"></div></div>
</body>
