<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fading Long Shadow</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "text-shadow-long-fade",
    "title": "Fading Long Shadow",
    "summary": "A long shadow that dissolves with distance.",
    "description": "A long shadow that dissolves with distance.",
    "theme": "text-effects",
    "categories": ["text", "typography"],
    "tags": ["text", "type", "long-shadow", "fade", "mask", "flat"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Keep the real text in the DOM so it stays selectable and readable by assistive tech; decorative duplicates are aria-hidden.",
    "customization": [
      { "name": "--c", "description": "Shadow colour", "default": "#7c5cff" }
    ],
    "variations": ["Retune through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Flat-design headlines. Masking the shadow layer gives the fade that a stack of solid text-shadows cannot produce on its own."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; font-size: 2.6rem; font-weight: 900; color: #e7ebf3; }
    .fx::after { content: attr(data-t); position: absolute; left: 0; top: 0; color: #7c5cff; z-index: -1;
      text-shadow: 1px 1px #7c5cff, 2px 2px #7c5cff, 3px 3px #7c5cff, 4px 4px #7c5cff, 5px 5px #7c5cff,
        6px 6px #7c5cff, 7px 7px #7c5cff, 8px 8px #7c5cff, 9px 9px #7c5cff, 10px 10px #7c5cff;
      -webkit-mask-image: linear-gradient(135deg, #000, transparent 70%); mask-image: linear-gradient(135deg, #000, transparent 70%); }
  </style>
</head>
<body>
  <h2 class="fx" data-t="FADE">FADE</h2>
</body>
</html>
