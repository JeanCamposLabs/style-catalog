<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Slot Machine Digits</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "slot-machine-digits",
    "title": "Slot Machine Digits",
    "summary": "Number reels spin vertically and snap to the final figure.",
    "description": "Each reel is a column of digits translated by a multiple of the line height, so the stop always lands exactly on a glyph.",
    "theme": "text-effects",
    "categories": ["text", "animation"],
    "tags": ["counter", "reel", "digits", "slot", "stats"],
    "tech": ["css", "js"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Keep the real text in the DOM so it stays selectable and readable by assistive tech; decorative layers use aria-hidden. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--h", "description": "Digit height", "default": "54px" },
      { "name": "--dur", "description": "Spin duration", "default": "1.6s" }
    ],
    "variations": ["Blur the reel mid-spin", "Different delay per column", "Loop for an odometer"],
    "ai_usage": "Stat counters and score reveals. Translate by calc(var(--digit) * var(--h) * -1) with a single cubic-bezier so the reel decelerates into place; a linear stop looks like a jump cut."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    :root { --h: 54px; --dur: 1.6s; }
    .slot { display: flex; gap: 6px; font-variant-numeric: tabular-nums; }
    .reel { height: var(--h); overflow: hidden; width: 40px; border-radius: 8px; background: #15192a; }
    .reel div { transition: transform var(--dur) cubic-bezier(.16,1,.3,1); }
    .reel span { display: block; height: var(--h); line-height: var(--h); text-align: center; font-size: 2rem; font-weight: 800; }
  </style>
</head>
<body>
  <div class="slot" id="slot" aria-label="Value"></div>
  <script>
    (function () {
      var target = "42", host = document.getElementById("slot");
      target.split("").forEach(function (d, i) {
        var reel = document.createElement("div"); reel.className = "reel";
        var strip = document.createElement("div");
        for (var r = 0; r < 3; r++) for (var n = 0; n <= 9; n++) {
          var s = document.createElement("span"); s.textContent = n; strip.appendChild(s);
        }
        reel.appendChild(strip); host.appendChild(reel);
        setTimeout(function () {
          strip.style.transform = "translateY(" + (-(20 + Number(d)) * 54) + "px)";
        }, 120 + i * 160);
      });
    })();
  </script>
</body>
</html>
