<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drawn Underline</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "underline-draw-text",
    "title": "Drawn Underline",
    "summary": "An underline draws itself under the phrase, then erases from the far side.",
    "description": "transform-origin flips between left and right across the loop, so the stroke draws in one direction and wipes out in the other.",
    "theme": "text-effects",
    "categories": ["text", "underline"],
    "tags": ["underline", "draw", "scaleX", "emphasis", "link"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Keep the real text in the DOM so it stays selectable and readable by assistive tech; decorative layers use aria-hidden. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Underline color", "default": "#2dd4bf" },
      { "name": "--dur", "description": "Draw duration", "default": "1.1s" },
      { "name": "--w", "description": "Stroke weight", "default": "3px" }
    ],
    "variations": ["Keep it drawn after the first pass", "Thicker stroke as a highlighter", "Trigger on hover for links"],
    "ai_usage": "Emphasis and animated links. The draw-then-erase illusion needs the transform-origin switched at the midpoint of the keyframes — animating scaleX alone just shrinks the line back the way it came."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    :root { --c: #2dd4bf; --dur: 1.1s; --w: 3px; }
    .ud { font-size: clamp(1.4rem, 5vw, 2.2rem); font-weight: 700; position: relative; display: inline-block; }
    .ud::after { content: ""; position: absolute; left: 0; right: 0; bottom: -6px; height: var(--w); background: var(--c);
      transform: scaleX(0); transform-origin: left; animation: draw calc(var(--dur) * 2) ease-in-out infinite; }
    @keyframes draw {
      0% { transform: scaleX(0); transform-origin: left; }
      45%, 55% { transform: scaleX(1); transform-origin: left; }
      56% { transform: scaleX(1); transform-origin: right; }
      100% { transform: scaleX(0); transform-origin: right; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <span class="ud">Draw the line</span>
</body>
</html>
