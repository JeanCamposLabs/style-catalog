<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gold Foil Text</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "gold-foil-text",
    "title": "Gold Foil Text",
    "summary": "A warm foil headline with a highlight that sweeps across on a loop.",
    "description": "A wide gradient clipped to the text plus an animated background-position gives the moving specular band that sells foil stamping.",
    "theme": "text-effects",
    "categories": ["text", "material"],
    "tags": ["gold", "foil", "shine", "gradient", "luxury"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Keep the real text in the DOM so it stays selectable and readable by assistive tech; decorative layers use aria-hidden. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--dur", "description": "Sweep period", "default": "3.2s" }
    ],
    "variations": ["Silver or rose-gold stops", "Sweep only on hover", "Add a subtle emboss shadow underneath"],
    "ai_usage": "Luxury, awards, and premium tiers. Keep background-size at 200%+ so the sweep has travel; if the shine looks like a flat wash, your light stop is too wide — narrow it to 8–12%."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    :root { --dur: 3.2s; }
    .foil { font-size: clamp(2.2rem, 9vw, 4.4rem); font-weight: 900;
      background: linear-gradient(100deg, #8a6216 0 32%, #ffe9a8 42%, #fff8dd 48%, #ffe08a 54%, #8a6216 66%);
      background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: sweep var(--dur) linear infinite; }
    @keyframes sweep { to { background-position: -300% 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <h1 class="foil">PREMIUM</h1>
</body>
</html>
