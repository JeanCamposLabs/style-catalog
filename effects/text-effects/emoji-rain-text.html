<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Confetti Headline</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "emoji-rain-text",
    "title": "Confetti Headline",
    "summary": "Confetti falls behind a headline in a self-contained celebration block.",
    "description": "Small colored rectangles fall on staggered loops with independent rotation, so the celebration never looks like a repeating tile.",
    "theme": "text-effects",
    "categories": ["text", "celebration"],
    "tags": ["confetti", "celebration", "success", "particles", "stagger"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Keep the real text in the DOM so it stays selectable and readable by assistive tech; decorative layers use aria-hidden. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--dur", "description": "Fall duration", "default": "3s" }
    ],
    "variations": ["Burst once on success instead of looping", "Brand-colored confetti only", "Add a slight horizontal sway"],
    "ai_usage": "Success and completion states. Give each piece its own delay, duration, x position, and rotation — shared values make the fall look like a curtain. Mark the confetti layer aria-hidden and keep the message in real text."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    :root { --dur: 3s; }
    .conf { position: relative; padding: 2rem 2.6rem; overflow: hidden; text-align: center; }
    .conf h1 { position: relative; margin: 0; font-size: clamp(1.6rem, 6vw, 2.6rem); font-weight: 900; }
    .conf i { position: absolute; top: -14px; width: 8px; height: 14px; border-radius: 2px; opacity: .9;
      animation: fall var(--d) linear infinite; animation-delay: var(--dl); left: var(--x); background: var(--bg); }
    @keyframes fall {
      0% { transform: translateY(0) rotate(0); opacity: 1; }
      100% { transform: translateY(160px) rotate(540deg); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="conf">
    <i aria-hidden="true" style="--x:6%;--d:2.4s;--dl:0s;--bg:#f472b6"></i>
    <i aria-hidden="true" style="--x:22%;--d:3.1s;--dl:.4s;--bg:#fbbf24"></i>
    <i aria-hidden="true" style="--x:38%;--d:2.7s;--dl:.9s;--bg:#34d399"></i>
    <i aria-hidden="true" style="--x:57%;--d:3.4s;--dl:.2s;--bg:#38bdf8"></i>
    <i aria-hidden="true" style="--x:73%;--d:2.5s;--dl:1.2s;--bg:#a78bfa"></i>
    <i aria-hidden="true" style="--x:88%;--d:3s;--dl:.7s;--bg:#fb7185"></i>
    <h1>Payment complete</h1>
  </div>
</body>
</html>
