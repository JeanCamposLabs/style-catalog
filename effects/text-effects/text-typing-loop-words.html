<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Typed Word Loop</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "text-typing-loop-words",
    "title": "Typed Word Loop",
    "summary": "One phrase whose final word retypes itself.",
    "description": "One phrase whose final word retypes itself.",
    "theme": "text-effects",
    "categories": ["text", "typography"],
    "tags": ["text", "type", "typewriter", "loop", "words", "marketing"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Keep the real text in the DOM so it stays selectable and readable by assistive tech; decorative duplicates are aria-hidden.",
    "customization": [
      { "name": "--c", "description": "Word colour", "default": "#2dd4bf" }
    ],
    "variations": ["Retune through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Marketing headlines. Width in ch with steps() timing keeps the caret glued to the last character; using JS to swap text content makes screen readers re-announce the whole line."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { font-size: 1.5rem; font-weight: 800; display: flex; gap: .4ch; align-items: baseline; }
    .fx .word { color: #2dd4bf; border-right: 2px solid #2dd4bf; white-space: nowrap; overflow: hidden;
      animation: type 8s steps(9) infinite, caret .7s step-end infinite; }
    @keyframes type { 0%, 10% { width: 0; } 20%, 30% { width: 9ch; } 40%, 50% { width: 0; } 60%, 70% { width: 7ch; } 80%, 100% { width: 0; } }
    @keyframes caret { 50% { border-color: transparent; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx">Build <span class="word">something</span></div>
</body>
</html>
