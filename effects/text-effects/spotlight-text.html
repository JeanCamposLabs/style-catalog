<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spotlight Text</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "spotlight-text",
    "title": "Spotlight Text",
    "summary": "A moving light reveals the headline out of near-darkness.",
    "description": "A radial-gradient mask travels across the block, so only the lit portion of the type is fully visible.",
    "theme": "text-effects",
    "categories": ["text", "reveal"],
    "tags": ["spotlight", "mask", "radial-gradient", "reveal", "dramatic"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Keep the real text in the DOM so it stays selectable and readable by assistive tech; decorative layers use aria-hidden. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--r", "description": "Spotlight radius", "default": "120px" },
      { "name": "--dur", "description": "Sweep time", "default": "4s" }
    ],
    "variations": ["Follow the pointer with JS", "Two spotlights crossing", "Warm gel color on the light"],
    "ai_usage": "Theatrical hero sections. The dim base copy sits underneath at low opacity while a masked copy on top gets the moving gradient — masking a single element to zero would hide the text entirely and break selection."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    :root { --r: 120px; --dur: 4s; }
    .spot { position: relative; font-size: clamp(2rem, 8vw, 3.6rem); font-weight: 900; color: #262c3d; }
    .spot span { position: absolute; inset: 0; color: #fff;
      -webkit-mask-image: radial-gradient(circle var(--r) at var(--x, 0%) 50%, #000 0 40%, transparent 70%);
      mask-image: radial-gradient(circle var(--r) at var(--x, 0%) 50%, #000 0 40%, transparent 70%);
      animation: sweep var(--dur) ease-in-out infinite alternate; }
    @keyframes sweep { from { --x: 0%; } to { --x: 100%; } }
    @property --x { syntax: "<percentage>"; inherits: false; initial-value: 0%; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <h1 class="spot">SPOTLIGHT<span aria-hidden="true">SPOTLIGHT</span></h1>
</body>
</html>
