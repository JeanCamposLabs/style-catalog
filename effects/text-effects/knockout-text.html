<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Knockout Gradient Text</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "knockout-text",
    "title": "Knockout Gradient Text",
    "summary": "The headline is genuinely cut out of a gradient panel, so the page shows through the letters.",
    "description": "An SVG mask paints the panel white and the text black, and the panel is drawn through that mask — a real cutout, not text painted with a gradient.",
    "theme": "text-effects",
    "categories": ["text", "svg"],
    "tags": ["knockout", "cutout", "svg-mask", "gradient", "hero"],
    "tech": ["svg", "css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Keep the real text in the DOM so it stays selectable and readable by assistive tech; decorative layers use aria-hidden. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--a", "description": "Gradient start", "default": "#7c5cff" },
      { "name": "--b", "description": "Gradient end", "default": "#2dd4bf" }
    ],
    "variations": ["Animate the gradient stops", "Place a photo behind the panel", "Invert the mask for solid text on a cut panel"],
    "ai_usage": "Use when the background behind the panel must show through the letters — background-clip:text cannot do that, only an SVG mask (or mask-image) can. Keep the text inside the <mask> black and the covering rect white; anything gray becomes partially transparent."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .ko { width: min(90vw, 420px); }
    .ko svg { width: 100%; display: block; }
    .ko text { font-family: system-ui, sans-serif; font-weight: 900; font-size: 58px; }
  </style>
</head>
<body>
  <div class="ko" role="img" aria-label="Knockout">
    <svg viewBox="0 0 420 150" aria-hidden="true">
      <defs>
        <linearGradient id="kog" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#2dd4bf"/>
        </linearGradient>
        <mask id="kom">
          <rect width="420" height="150" rx="20" fill="#fff"/>
          <text x="210" y="93" text-anchor="middle" fill="#000">KNOCK</text>
        </mask>
      </defs>
      <rect width="420" height="150" rx="20" fill="url(#kog)" mask="url(#kom)"/>
    </svg>
  </div>
</body>
</html>
