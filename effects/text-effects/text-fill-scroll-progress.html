<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reading Fill</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "text-fill-scroll-progress",
    "title": "Reading Fill",
    "summary": "Text that fills with colour as you scroll.",
    "description": "Text that fills with colour as you scroll.",
    "theme": "text-effects",
    "categories": ["text", "typography"],
    "tags": ["text", "type", "scroll", "fill", "reading", "progress"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Keep the real text in the DOM so it stays selectable and readable by assistive tech; decorative duplicates are aria-hidden.",
    "customization": [
      { "name": "--p", "description": "Fill percentage", "default": "0%" }
    ],
    "variations": ["Retune through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Long-form intros. Keep the unfilled state readable (a mid-tone, not near-transparent) so the text is legible before the scroll fills it."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { min-height: 200vh; }
    .wrap { padding: 45vh 1.5rem; }
    .fx { font-size: 1.6rem; font-weight: 800; max-width: 18ch; line-height: 1.3; color: #2b3450;
      background: linear-gradient(90deg, #e7ebf3 var(--p, 0%), transparent var(--p, 0%));
      -webkit-background-clip: text; background-clip: text; }
  </style>
</head>
<body>
  <div class="wrap"><h2 class="fx" id="rf">Read on, and the words fill in as you go.</h2></div>
  <script>
    (function () {
      var h = document.getElementById("rf");
      function upd() {
        var r = h.getBoundingClientRect();
        var p = Math.min(Math.max((innerHeight - r.top) / (innerHeight * .7), 0), 1);
        h.style.setProperty("--p", (p * 100).toFixed(1) + "%");
      }
      addEventListener("scroll", upd, { passive: true }); upd();
    })();
  </script>
</body>
</html>
