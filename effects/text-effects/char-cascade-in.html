<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Character Cascade</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "char-cascade-in",
    "title": "Character Cascade",
    "summary": "Letters drop into place one after another with a slight overshoot.",
    "description": "Each glyph animates from above with a spring curve and an index-based delay, so the line assembles rather than appearing at once.",
    "theme": "text-effects",
    "categories": ["text", "entrance"],
    "tags": ["cascade", "stagger", "entrance", "drop", "kinetic"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Keep the real text in the DOM so it stays selectable and readable by assistive tech; decorative layers use aria-hidden. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--dur", "description": "Per-letter duration", "default": "0.5s" },
      { "name": "--step", "description": "Stagger step", "default": "0.05s" }
    ],
    "variations": ["Rise from below instead", "Add a rotate for a tumbling drop", "Reverse for an exit animation"],
    "ai_usage": "Page and section entrances. Split text into spans at build time or with JS; keep total = duration + letters * step under ~1.2s or the headline feels slow. Give the wrapper aria-label and hide the spans."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    :root { --dur: .5s; --step: .05s; }
    .casc { font-size: clamp(1.8rem, 7vw, 3.2rem); font-weight: 800; display: flex; }
    .casc span { display: inline-block; opacity: 0; transform: translateY(-.6em);
      animation: drop var(--dur) cubic-bezier(.34,1.56,.64,1) forwards; animation-delay: calc(var(--i) * var(--step)); }
    @keyframes drop { to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .casc span { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <h1 class="casc" aria-label="Cascade">
    <span aria-hidden="true" style="--i:0">C</span><span aria-hidden="true" style="--i:1">a</span><span aria-hidden="true" style="--i:2">s</span><span aria-hidden="true" style="--i:3">c</span><span aria-hidden="true" style="--i:4">a</span><span aria-hidden="true" style="--i:5">d</span><span aria-hidden="true" style="--i:6">e</span>
  </h1>
</body>
</html>
