<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blur Focus In</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "blur-focus-text",
    "title": "Blur Focus In",
    "summary": "The headline resolves from a heavy blur into sharp type.",
    "description": "Animating the filter blur alongside a small scale gives the read of a camera pulling focus rather than a plain fade.",
    "theme": "text-effects",
    "categories": ["text", "entrance"],
    "tags": ["blur", "focus", "entrance", "reveal", "filter"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Keep the real text in the DOM so it stays selectable and readable by assistive tech; decorative layers use aria-hidden. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--dur", "description": "Focus duration", "default": "1.2s" }
    ],
    "variations": ["Blur out on exit", "Per-letter focus with delays", "Combine with a letter-spacing collapse"],
    "ai_usage": "Hero entrances and section reveals. Animate filter: blur() plus letter-spacing together — the spacing collapse is what makes it feel like focus rather than a dissolve. Skip the blur under reduced motion."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    :root { --dur: 1.2s; }
    .focus { font-size: clamp(2rem, 8vw, 4rem); font-weight: 800;
      animation: focusin var(--dur) cubic-bezier(.25,.46,.45,.94) both infinite alternate; }
    @keyframes focusin {
      from { filter: blur(12px); letter-spacing: .4em; opacity: .4; }
      to { filter: blur(0); letter-spacing: 0; opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .focus { animation: none; filter: none; letter-spacing: 0; }
    }
  </style>
</head>
<body>
  <h1 class="focus">In Focus</h1>
</body>
</html>
