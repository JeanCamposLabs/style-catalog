<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Multi-Line Highlight</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "text-highlight-marker-multi",
    "title": "Multi-Line Highlight",
    "summary": "A marker highlight that wraps correctly.",
    "description": "A marker highlight that wraps correctly.",
    "theme": "text-effects",
    "categories": ["text", "typography"],
    "tags": ["text", "type", "highlight", "marker", "wrap", "emphasis"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Keep the real text in the DOM so it stays selectable and readable by assistive tech; decorative duplicates are aria-hidden.",
    "customization": [
      { "name": "--c", "description": "Marker colour", "default": "rgba(251,191,36,.45)" }
    ],
    "variations": ["Retune through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Emphasis in body copy. A gradient background that starts partway down the line height gives a marker look that survives line breaks — a pseudo-element only covers the last line."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { max-width: 26ch; font-size: 1.1rem; line-height: 2; }
    .fx mark { background: linear-gradient(180deg, transparent 55%, rgba(251,191,36,.45) 55%);
      color: inherit; padding: 0 .1em; }
  </style>
</head>
<body>
  <p class="fx">The important thing is that <mark>the highlight wraps across every line of the phrase</mark> without breaking.</p>
</body>
</html>
