<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Perspective Title</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "perspective-tilt-text",
    "title": "Perspective Title",
    "summary": "A headline lying back in 3D space, Star Wars crawl style.",
    "description": "rotateX with a strong perspective plus a vertical gradient fade produces the receding crawl without any JS.",
    "theme": "text-effects",
    "categories": ["text", "3d"],
    "tags": ["perspective", "crawl", "3d", "star-wars", "retro"],
    "tech": ["css"],
    "era": "2000s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Keep the real text in the DOM so it stays selectable and readable by assistive tech; decorative layers use aria-hidden. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--tilt", "description": "Lay-back angle", "default": "52deg" },
      { "name": "--c", "description": "Text color", "default": "#ffd166" }
    ],
    "variations": ["Animate the text scrolling upward", "Reduce the tilt for a subtle lean", "Add a starfield behind it"],
    "ai_usage": "Cinematic intros and retro sci-fi. Perspective must live on the parent and the rotation on the child; a mask-image fade at the far edge is what sells the distance."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    :root { --tilt: 52deg; --c: #ffd166; }
    .scene { perspective: 340px; width: 320px; }
    .crawl { transform: rotateX(var(--tilt)); transform-origin: 50% 100%; color: var(--c); text-align: center;
      font-weight: 900; font-size: 1.6rem; line-height: 1.35;
      -webkit-mask-image: linear-gradient(transparent, #000 45%); mask-image: linear-gradient(transparent, #000 45%); }
  </style>
</head>
<body>
  <div class="scene"><div class="crawl">A LONG TIME AGO IN A STYLESHEET FAR, FAR AWAY</div></div>
</body>
</html>
