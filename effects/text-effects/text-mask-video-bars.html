<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bar Reveal Text</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "text-mask-video-bars",
    "title": "Bar Reveal Text",
    "summary": "Vertical bars wipe away to expose the headline beneath.",
    "description": "A row of absolutely positioned bars scales to zero height on staggered delays, uncovering the type strip by strip.",
    "theme": "text-effects",
    "categories": ["text", "reveal"],
    "tags": ["reveal", "bars", "wipe", "stagger", "entrance"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Keep the real text in the DOM so it stays selectable and readable by assistive tech; decorative layers use aria-hidden. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--bar", "description": "Bar color", "default": "#0b0d12" },
      { "name": "--dur", "description": "Wipe duration", "default": "0.6s" }
    ],
    "variations": ["Horizontal bars", "Bars that slide sideways instead of scaling", "Reverse to conceal the text"],
    "ai_usage": "Section headings that reveal on scroll. Bars must exactly cover the text box (inset:0 with flex children) and animate transform, not height, to stay on the compositor. Set them aria-hidden."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    :root { --bar: #0b0d12; --dur: .6s; }
    .br { position: relative; display: inline-block; font-size: clamp(2rem, 8vw, 3.6rem); font-weight: 900; }
    .br .bars { position: absolute; inset: -6px; display: flex; }
    .br .bars i { flex: 1; background: var(--bar); transform-origin: top;
      animation: wipe var(--dur) cubic-bezier(.7,0,.2,1) forwards; animation-delay: calc(var(--i) * .07s); }
    @keyframes wipe { to { transform: scaleY(0); } }
    @media (prefers-reduced-motion: reduce) {
      .br .bars { display: none; }
    }
  </style>
</head>
<body>
  <h1 class="br">REVEALED
    <span class="bars" aria-hidden="true">
      <i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i>
      <i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i><i style="--i:7"></i>
    </span>
  </h1>
</body>
</html>
