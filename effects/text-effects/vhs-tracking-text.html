<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VHS Tracking Text</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "vhs-tracking-text",
    "title": "VHS Tracking Text",
    "summary": "Horizontal tearing and colour bleed like a worn videotape.",
    "description": "A clipped duplicate jumps horizontally on a jittery keyframe while scanlines drift over the top, reproducing tracking error.",
    "theme": "text-effects",
    "categories": ["text", "retro"],
    "tags": ["vhs", "tracking", "scanlines", "analog", "glitch"],
    "tech": ["css"],
    "era": "1990s",
    "difficulty": "advanced",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Keep the real text in the DOM so it stays selectable and readable by assistive tech; decorative layers use aria-hidden. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Bleed color", "default": "#ff2d95" },
      { "name": "--dur", "description": "Tear cycle", "default": "3s" }
    ],
    "variations": ["Add vertical roll", "Stronger bleed for older tape", "Trigger only on hover"],
    "ai_usage": "Retro-analog aesthetics: 90s, found-footage, lo-fi. Combine three cues — horizontal tear (clip-path jump), chroma bleed (offset colored copy) and scanlines (repeating-linear-gradient); any one alone reads as a generic glitch."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    :root { --c: #ff2d95; --dur: 3s; }
    .vhs { position: relative; font-size: clamp(2rem, 8vw, 3.6rem); font-weight: 900; color: #e7ebf3; }
    .vhs::before { content: attr(data-text); position: absolute; inset: 0; color: var(--c); mix-blend-mode: screen;
      animation: tear var(--dur) steps(1) infinite; }
    .vhs::after { content: ""; position: absolute; inset: -10px;
      background: repeating-linear-gradient(180deg, rgba(255,255,255,.07) 0 1px, transparent 1px 3px);
      animation: roll 6s linear infinite; pointer-events: none; }
    @keyframes tear {
      0%, 92%, 100% { clip-path: inset(0 0 0 0); transform: none; }
      93% { clip-path: inset(22% 0 58% 0); transform: translateX(8px); }
      95% { clip-path: inset(64% 0 18% 0); transform: translateX(-10px); }
      97% { clip-path: inset(40% 0 40% 0); transform: translateX(5px); }
    }
    @keyframes roll { to { background-position: 0 60px; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <h1 class="vhs" data-text="PLAY ▶">PLAY ▶</h1>
</body>
</html>
