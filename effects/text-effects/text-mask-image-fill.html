<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Textured Text</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "text-mask-image-fill",
    "title": "Textured Text",
    "summary": "Letterforms filled with a pattern.",
    "description": "Letterforms filled with a pattern.",
    "theme": "text-effects",
    "categories": ["text", "typography"],
    "tags": ["text", "type", "texture", "pattern", "clip", "fill"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Keep the real text in the DOM so it stays selectable and readable by assistive tech; decorative duplicates are aria-hidden.",
    "customization": [
      { "name": "--s", "description": "Stripe width", "default": "8px" }
    ],
    "variations": ["Retune through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Bold display type. Keep the pattern's scale small relative to the stroke width, or thin letterforms show only one band and lose the texture."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { font-size: 2.6rem; font-weight: 900;
      background-image: repeating-linear-gradient(45deg, #7c5cff 0 8px, #2dd4bf 8px 16px);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 3px 6px rgba(0,0,0,.5)); }
  </style>
</head>
<body>
  <h2 class="fx">TEXTURE</h2>
</body>
</html>
