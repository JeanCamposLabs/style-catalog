  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; font-size: 2.4rem; font-weight: 900; color: #e7ebf3; }
    .fx::before, .fx::after { content: attr(data-t); position: absolute; inset: 0; }
    .fx::before { clip-path: inset(0 0 50% 0); transform: translateX(-4px); color: #7c5cff; }
    .fx::after { clip-path: inset(50% 0 0 0); transform: translateX(4px); color: #2dd4bf; }
  </style>
