<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Multi-Line Link Underline</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "underline-multi-link",
    "title": "Multi-Line Link Underline",
    "summary": "An underline that wraps correctly across multiple lines on hover.",
    "description": "background-image with background-size animation underlines wrapped text properly, where a pseudo-element only underlines the last line.",
    "theme": "hover-interactions",
    "categories": ["hover", "link"],
    "tags": ["underline", "wrapping", "background-size", "link", "typography"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Every hover affordance here also responds to :focus-visible so keyboard users get the same information. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Underline color", "default": "#2dd4bf" },
      { "name": "--h", "description": "Underline weight", "default": "2px" }
    ],
    "variations": ["Draw from the centre", "Thicker weight for headings", "Different colour on visited links"],
    "ai_usage": "Body-copy links that may wrap. Use background-image: linear-gradient(color,color) with background-size: 0% var(--h) animating to 100% — this is the only underline technique that follows line breaks."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    :root { --c: #2dd4bf; --h: 2px; }
    .ml { max-width: 26ch; line-height: 1.8; font-size: 1.05rem; color: #cbd5e1; }
    .ml a { color: #e7ebf3; text-decoration: none; background-image: linear-gradient(var(--c), var(--c));
      background-repeat: no-repeat; background-position: 0 100%; background-size: 0% var(--h);
      transition: background-size .35s cubic-bezier(.2,.8,.3,1); }
    .ml a:hover, .ml a:focus-visible { background-size: 100% var(--h); }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <p class="ml">Read the <a href="#">complete guide to progressive enhancement and resilient interface patterns</a> before shipping.</p>
</body>
</html>
