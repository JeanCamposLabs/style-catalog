<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Neighbour Push List</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "neighbor-push-list",
    "title": "Neighbour Push List",
    "summary": "Hovering a list item nudges its neighbours away.",
    "description": "Sibling selectors move the adjacent rows by a decreasing amount, producing a proximity falloff with no JS.",
    "theme": "hover-interactions",
    "categories": ["hover", "list"],
    "tags": ["list", "siblings", "push", "falloff", "navigation"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Every hover affordance here also responds to :focus-visible so keyboard users get the same information. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--push", "description": "Push distance", "default": "10px" }
    ],
    "variations": ["Scale the hovered row too", "Vertical navigation menu", "Colour falloff instead of movement"],
    "ai_usage": "Navigation lists and menus. Use :hover + li and :hover + li + li with decreasing transforms; it is the CSS-only approximation of a dock magnification effect."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    :root { --push: 10px; }
    .nl { list-style: none; margin: 0; padding: 0; width: 230px; }
    .nl li { padding: .7rem 1rem; border-radius: 10px; background: #151b2a; margin-bottom: 6px; color: #cbd5e1;
      transition: transform .25s cubic-bezier(.2,.8,.3,1), background .25s; cursor: pointer; }
    .nl li:hover { background: #23304a; transform: translateX(calc(var(--push) * 1.6)); }
    .nl li:hover + li { transform: translateX(var(--push)); }
    .nl li:hover + li + li { transform: translateX(calc(var(--push) * .4)); }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <ul class="nl"><li>Overview</li><li>Analytics</li><li>Reports</li><li>Settings</li><li>Billing</li></ul>
</body>
</html>
