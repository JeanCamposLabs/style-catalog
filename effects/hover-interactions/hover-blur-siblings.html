<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blur the Rest</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "hover-blur-siblings",
    "title": "Blur the Rest",
    "summary": "Hovering one item softens its neighbours.",
    "description": "Hovering one item softens its neighbours.",
    "theme": "hover-interactions",
    "categories": ["hover", "interaction"],
    "tags": ["hover", "pointer", "focus", "blur", "siblings", "emphasis"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Every hover state here is mirrored on :focus-visible so keyboard users get the same information.",
    "customization": [
      { "name": "--blur", "description": "Sibling blur", "default": "2px" }
    ],
    "variations": ["Retune through the custom properties", "Adapt for a light theme"],
    "ai_usage": "Galleries and pricing tables. Dim the siblings rather than only enlarging the target — the contrast between states is what creates the focus."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: flex; gap: 10px; }
    .fx div { width: 82px; height: 100px; border-radius: 12px; background: linear-gradient(150deg, #7c5cff, #2dd4bf);
      transition: filter .3s, opacity .3s, transform .3s; }
    .fx:hover div { filter: blur(2px); opacity: .5; transform: scale(.96); }
    .fx div:hover { filter: none; opacity: 1; transform: scale(1.05); }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx"><div></div><div></div><div></div><div></div></div>
</body>
</html>
