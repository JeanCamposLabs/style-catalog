<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Glow Trail List</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "hover-glow-trail-list",
    "title": "Glow Trail List",
    "summary": "A moving glow that follows the hovered row.",
    "description": "A moving glow that follows the hovered row.",
    "theme": "hover-interactions",
    "categories": ["hover", "interaction"],
    "tags": ["hover", "pointer", "list", "glow", "follow", "navigation"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Every hover state here is mirrored on :focus-visible so keyboard users get the same information.",
    "customization": [
      { "name": "--bg", "description": "Highlight colour", "default": "#1e2740" }
    ],
    "variations": ["Retune through the custom properties", "Adapt for a light theme"],
    "ai_usage": "Navigation lists. One shared highlight element that translates between rows is smoother than fading a background on each row, and it costs one node."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .list { position: relative; width: 250px; padding: 4px; border-radius: 14px; background: #10141f; border: 1px solid #263149; }
    .list .glow { position: absolute; left: 4px; right: 4px; height: 40px; border-radius: 10px; background: #1e2740;
      transition: transform .28s cubic-bezier(.7,0,.2,1), opacity .2s; opacity: 0; }
    .list:hover .glow { opacity: 1; }
    .list a { position: relative; display: flex; align-items: center; height: 40px; padding: 0 .8rem; color: #cbd5e1;
      text-decoration: none; font-size: .88rem; border-radius: 10px; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <nav class="list" id="gl"><span class="glow"></span><a href="#">Overview</a><a href="#">Specimens</a><a href="#">Themes</a><a href="#">API</a></nav>
  <script>
    (function () {
      var l = document.getElementById("gl"), g = l.querySelector(".glow");
      l.querySelectorAll("a").forEach(function (a, i) {
        a.addEventListener("pointerenter", function () { g.style.transform = "translateY(" + i * 40 + "px)"; });
        a.addEventListener("focus", function () { g.style.transform = "translateY(" + i * 40 + "px)"; });
      });
    })();
  </script>
</body>
</html>
