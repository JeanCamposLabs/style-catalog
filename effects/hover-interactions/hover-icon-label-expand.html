<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Expanding Icon Label</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "hover-icon-label-expand",
    "title": "Expanding Icon Label",
    "summary": "An icon button that grows to show its label.",
    "description": "An icon button that grows to show its label.",
    "theme": "hover-interactions",
    "categories": ["hover", "interaction"],
    "tags": ["hover", "pointer", "expand", "icon", "label", "hover"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Every hover state here is mirrored on :focus-visible so keyboard users get the same information.",
    "customization": [
      { "name": "--dur", "description": "Expand duration", "default": "0.25s" }
    ],
    "variations": ["Retune through the custom properties", "Adapt for a light theme"],
    "ai_usage": "Compact toolbars. Animate max-width rather than width so the label sizes itself; keep the accessible name on the button so it never depends on the visible label."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: inline-flex; align-items: center; gap: 0; padding: .7rem; border-radius: 999px; border: 1px solid #2b3450;
      background: #151b2a; color: #cbd5e1; font: inherit; cursor: pointer; transition: gap .25s, padding .25s; }
    .fx .lbl { max-width: 0; overflow: hidden; white-space: nowrap; opacity: 0; transition: max-width .25s, opacity .25s; }
    .fx:hover, .fx:focus-visible { gap: .5rem; padding-right: 1.1rem; }
    .fx:hover .lbl, .fx:focus-visible .lbl { max-width: 110px; opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <button class="fx" type="button" aria-label="Add to bundle"><span aria-hidden="true">＋</span><span class="lbl">Add to bundle</span></button>
</body>
</html>
