<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Holographic Card Shine</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "card-shine-follow",
    "title": "Holographic Card Shine",
    "summary": "A rainbow sheen slides across a card as the pointer moves.",
    "description": "Pointer position drives both a gradient offset and a tilt, so the sheen behaves like light on a real holographic foil.",
    "theme": "hover-interactions",
    "categories": ["hover", "3d"],
    "tags": ["holographic", "shine", "tilt", "trading-card", "pointer"],
    "tech": ["css", "js"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Every hover affordance here also responds to :focus-visible so keyboard users get the same information. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--tilt", "description": "Maximum tilt", "default": "10deg" }
    ],
    "variations": ["Foil pattern overlay", "Sparkle particles on the sheen", "Snap-back spring on leave"],
    "ai_usage": "Collectible, gaming, and pricing cards. Combine tilt with a moving highlight — tilt alone looks mechanical, and a sheen without tilt looks like a sliding gradient."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .holo { position: relative; width: 220px; height: 300px; border-radius: 18px; overflow: hidden;
      background: linear-gradient(160deg, #1b2338, #0f1420); border: 1px solid #2b3450;
      transform-style: preserve-3d; transition: transform .2s ease-out; }
    .holo::after { content: ""; position: absolute; inset: -40%; opacity: .5; pointer-events: none;
      background: conic-gradient(from calc(var(--a, 0) * 1deg), #ff2d95, #ffd166, #2dd4bf, #7c5cff, #ff2d95);
      mix-blend-mode: color-dodge; filter: blur(18px); }
    .holo .label { position: absolute; inset: auto 0 0 0; padding: 1rem; font-weight: 800; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="holo" id="ho"><div class="label">Holo Rare</div></div>
  <script>
    (function () {
      var el = document.getElementById("ho");
      el.addEventListener("pointermove", function (e) {
        var r = el.getBoundingClientRect();
        var x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
        el.style.transform = "perspective(700px) rotateY(" + (x * 20) + "deg) rotateX(" + (-y * 20) + "deg)";
        el.style.setProperty("--a", (x * 180 + 180).toFixed(0));
      });
      el.addEventListener("pointerleave", function () { el.style.transform = ""; });
    })();
  </script>
</body>
</html>
