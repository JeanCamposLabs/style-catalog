<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Parallax Depth Card</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "depth-parallax-card",
    "title": "Parallax Depth Card",
    "summary": "Card layers shift by different amounts as the pointer moves.",
    "description": "Each layer's translation is scaled by its own depth factor, so foreground elements outrun the background and the card gains real dimension.",
    "theme": "hover-interactions",
    "categories": ["hover", "3d"],
    "tags": ["parallax", "depth", "layers", "pointer", "card"],
    "tech": ["css", "js"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Every hover affordance here also responds to :focus-visible so keyboard users get the same information. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--max", "description": "Maximum layer shift", "default": "18px" }
    ],
    "variations": ["Add a tilt to the whole card", "Depth on scroll instead of pointer", "Shadow that moves opposite the layers"],
    "ai_usage": "Product and feature cards. Multiply the normalized pointer offset by a per-layer depth (0.2 → 1.0) and apply with translate3d; a single shared offset gives a slide, not parallax."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .pcard { position: relative; width: 280px; height: 200px; border-radius: 18px; overflow: hidden;
      background: linear-gradient(140deg, #1b2338, #10141f); border: 1px solid #263149; }
    .pcard .layer { position: absolute; inset: 0; display: grid; place-items: center; transition: transform .12s ease-out; }
    .pcard .glow { background: radial-gradient(circle at 30% 20%, rgba(124,92,255,.5), transparent 60%); }
    .pcard h3 { margin: 0; font-size: 1.6rem; }
    .pcard .badge { align-self: start; justify-self: end; margin: 14px; padding: .25rem .6rem; border-radius: 999px;
      background: #7c5cff; font-size: .75rem; font-weight: 700; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="pcard" id="pc">
    <div class="layer glow" data-depth=".3" aria-hidden="true"></div>
    <div class="layer" data-depth=".7"><h3>Aurora</h3></div>
    <div class="layer" data-depth="1"><span class="badge">New</span></div>
  </div>
  <script>
    (function () {
      var card = document.getElementById("pc"), layers = card.querySelectorAll(".layer");
      card.addEventListener("pointermove", function (e) {
        var r = card.getBoundingClientRect();
        var x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
        layers.forEach(function (l) {
          var d = parseFloat(l.dataset.depth);
          l.style.transform = "translate3d(" + (-x * 18 * d) + "px," + (-y * 18 * d) + "px,0)";
        });
      });
      card.addEventListener("pointerleave", function () {
        layers.forEach(function (l) { l.style.transform = ""; });
      });
    })();
  </script>
</body>
</html>
