<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Growing Underline</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "hover-underline-thickness",
    "title": "Growing Underline",
    "summary": "An underline that thickens rather than sliding.",
    "description": "An underline that thickens rather than sliding.",
    "theme": "hover-interactions",
    "categories": ["hover", "interaction"],
    "tags": ["hover", "pointer", "underline", "thickness", "native", "link"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Every hover state here is mirrored on :focus-visible so keyboard users get the same information.",
    "customization": [
      { "name": "--c", "description": "Underline colour", "default": "#7c5cff" }
    ],
    "variations": ["Retune through the custom properties", "Adapt for a light theme"],
    "ai_usage": "Body links. The native text-decoration properties are now animatable and skip descenders correctly — a pseudo-element underline cannot do either."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { font-size: 1.2rem; color: #e7ebf3; text-decoration: none; text-decoration-line: underline;
      text-decoration-color: #7c5cff; text-underline-offset: 4px; text-decoration-thickness: 2px;
      transition: text-decoration-thickness .2s, text-underline-offset .2s; }
    .fx:hover, .fx:focus-visible { text-decoration-thickness: 6px; text-underline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <a class="fx" href="#">A native animated underline</a>
</body>
</html>
