<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Coloured Lift</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "hover-3d-lift-shadow-color",
    "title": "Coloured Lift",
    "summary": "A card lifting with a shadow that borrows its own colour.",
    "description": "A card lifting with a shadow that borrows its own colour.",
    "theme": "hover-interactions",
    "categories": ["hover", "interaction"],
    "tags": ["hover", "pointer", "lift", "shadow", "color", "hover"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Every hover state here is mirrored on :focus-visible so keyboard users get the same information.",
    "customization": [
      { "name": "--lift", "description": "Hover lift", "default": "6px" }

    "variations": ["Retune through the custom properties", "Adapt for a light theme"],

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .card { width: 240px; padding: 1.4rem; border-radius: 16px; color: #0b0d12; font-weight: 700;
      background: linear-gradient(150deg, #7c5cff, #2dd4bf); transition: transform .3s, box-shadow .3s;
      box-shadow: 0 6px 18px rgba(124,92,255,.3); }
    .card:hover, .card:focus-visible { transform: translateY(-6px); box-shadow: 0 22px 40px rgba(124,92,255,.5); }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="card" tabindex="0">Coloured shadow lift</div>
</body>
