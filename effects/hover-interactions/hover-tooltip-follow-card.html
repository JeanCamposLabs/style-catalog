<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Preview on Hover</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "hover-tooltip-follow-card",
    "title": "Preview on Hover",
    "summary": "A thumbnail preview appearing beside a link.",
    "description": "A thumbnail preview appearing beside a link.",
    "theme": "hover-interactions",
    "categories": ["hover", "interaction"],
    "tags": ["hover", "pointer", "preview", "hover", "link", "thumbnail"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Every hover state here is mirrored on :focus-visible so keyboard users get the same information.",
    "customization": [
      { "name": "--w", "description": "Preview width", "default": "160px" }
    ],
    "variations": ["Retune through the custom properties", "Adapt for a light theme"],
    "ai_usage": "Wiki and documentation links. Delay the preview by ~300ms so it does not flash while the pointer crosses a paragraph of links."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; display: inline-block; }
    .fx a { color: #b9a5ff; text-decoration: underline; font-size: .95rem; }
    .fx .pv { position: absolute; bottom: calc(100% + 8px); left: 0; width: 160px; padding: 6px; border-radius: 12px;
      background: #141a28; border: 1px solid #2b3450; opacity: 0; visibility: hidden; transform: translateY(6px);
      transition: opacity .2s, transform .2s, visibility .2s; }
    .fx .pv .img { aspect-ratio: 16 / 10; border-radius: 8px; background: conic-gradient(from 160deg, #7c5cff, #2dd4bf, #d1478c); }
    .fx .pv b { display: block; margin-top: .35rem; font-size: .74rem; color: #cbd5e1; }
    .fx:hover .pv, .fx:focus-within .pv { opacity: 1; visibility: visible; transform: none; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <span class="fx"><a href="#">aurora-background</a><span class="pv" role="tooltip"><span class="img"></span><b>Backgrounds · CSS</b></span></span>
</body>
</html>
