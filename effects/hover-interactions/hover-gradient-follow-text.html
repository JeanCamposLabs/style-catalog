<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gradient Follows Pointer</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "hover-gradient-follow-text",
    "title": "Gradient Follows Pointer",
    "summary": "Heading colour tracking the cursor.",
    "description": "Heading colour tracking the cursor.",
    "theme": "hover-interactions",
    "categories": ["hover", "interaction"],
    "tags": ["hover", "pointer", "gradient", "pointer", "text", "interactive"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Every hover state here is mirrored on :focus-visible so keyboard users get the same information.",
    "customization": [
      { "name": "--r", "description": "Gradient radius", "default": "180px" }
    ],
    "variations": ["Retune through the custom properties", "Adapt for a light theme"],
    "ai_usage": "Interactive hero headlines. Because the gradient is a background, only two custom properties change per frame — far cheaper than per-letter colouring."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { font-size: 2rem; font-weight: 900; cursor: default;
      background: radial-gradient(180px circle at var(--x, 50%) var(--y, 50%), #2dd4bf, #7c5cff 60%);
      -webkit-background-clip: text; background-clip: text; color: transparent; }
  </style>
</head>
<body>
  <h2 class="fx" id="gt">Follow the light</h2>
  <script>
    (function () {
      var el = document.getElementById("gt");
      el.addEventListener("pointermove", function (e) {
        var r = el.getBoundingClientRect();
        el.style.setProperty("--x", (e.clientX - r.left) + "px");
        el.style.setProperty("--y", (e.clientY - r.top) + "px");
      });
    })();
  </script>
</body>
</html>
