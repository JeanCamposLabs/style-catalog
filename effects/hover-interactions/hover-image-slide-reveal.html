<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Image Slide Reveal</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "hover-image-slide-reveal",
    "title": "Image Slide Reveal",
    "summary": "A second image sliding over the first.",
    "description": "A second image sliding over the first.",
    "theme": "hover-interactions",
    "categories": ["hover", "interaction"],
    "tags": ["hover", "pointer", "reveal", "slide", "image", "gallery"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Every hover state here is mirrored on :focus-visible so keyboard users get the same information.",
    "customization": [
      { "name": "--dur", "description": "Slide duration", "default": "0.45s" }
    ],
    "variations": ["Retune through the custom properties", "Adapt for a light theme"],
    "ai_usage": "Product alternates and before/after shots. Moving both layers at different rates gives a parallax feel that a single sliding layer lacks."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 250px; aspect-ratio: 4 / 3; border-radius: 14px; overflow: hidden; }
    .fx div { position: absolute; inset: 0; transition: transform .45s cubic-bezier(.7,0,.2,1); }
    .fx .a { background: conic-gradient(from 160deg at 35% 30%, #7c5cff, #2dd4bf); }
    .fx .b { background: conic-gradient(from 160deg at 35% 30%, #d1478c, #c2891a); transform: translateY(100%); }
    .fx:hover .b, .fx:focus-within .b { transform: translateY(0); }
    .fx:hover .a, .fx:focus-within .a { transform: translateY(-30%); }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx" tabindex="0"><div class="a"></div><div class="b"></div></div>
</body>
</html>
