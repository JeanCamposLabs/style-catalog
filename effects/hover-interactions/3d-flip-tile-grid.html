<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flip Tile Grid</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "3d-flip-tile-grid",
    "title": "Flip Tile Grid",
    "summary": "Tiles flip individually to reveal their back face on hover.",
    "description": "Each tile is its own 3D scene, so hovering one never disturbs the layout of the others.",
    "theme": "hover-interactions",
    "categories": ["hover", "3d"],
    "tags": ["flip", "grid", "tiles", "3d", "reveal"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Every hover affordance here also responds to :focus-visible so keyboard users get the same information. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--dur", "description": "Flip duration", "default": "0.5s" }
    ],
    "variations": ["Flip on the Y axis instead", "Auto-flip in sequence", "Different back colour per tile"],
    "ai_usage": "Feature grids and stat tiles. Put perspective on each tile (not the grid) and backface-visibility:hidden on both faces; forgetting the latter shows mirrored text through the card."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    :root { --dur: .5s; }
    .tiles { display: grid; grid-template-columns: repeat(3, 92px); gap: 10px; }
    .tile { perspective: 600px; height: 92px; }
    .tile .in { position: relative; width: 100%; height: 100%; transform-style: preserve-3d;
      transition: transform var(--dur) cubic-bezier(.7,0,.2,1); }
    .tile:hover .in, .tile:focus-within .in { transform: rotateX(180deg); }
    .tile .f, .tile .b { position: absolute; inset: 0; display: grid; place-items: center; border-radius: 12px;
      backface-visibility: hidden; font-weight: 800; }
    .tile .f { background: #1b2338; color: #e7ebf3; }
    .tile .b { background: #7c5cff; color: #fff; transform: rotateX(180deg); }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="tiles">
    <div class="tile" tabindex="0"><div class="in"><div class="f">01</div><div class="b">↑ 12%</div></div></div>
    <div class="tile" tabindex="0"><div class="in"><div class="f">02</div><div class="b">↓ 3%</div></div></div>
    <div class="tile" tabindex="0"><div class="in"><div class="f">03</div><div class="b">↑ 41%</div></div></div>
    <div class="tile" tabindex="0"><div class="in"><div class="f">04</div><div class="b">↑ 8%</div></div></div>
    <div class="tile" tabindex="0"><div class="in"><div class="f">05</div><div class="b">— 0%</div></div></div>
    <div class="tile" tabindex="0"><div class="in"><div class="f">06</div><div class="b">↑ 27%</div></div></div>
  </div>
</body>
</html>
