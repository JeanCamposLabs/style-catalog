<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Velocity Skew</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "skew-on-move",
    "title": "Velocity Skew",
    "summary": "A card skews in proportion to how fast the pointer crosses it.",
    "description": "Pointer velocity, not position, drives the skew, so slow movement barely bends the card while a flick throws it.",
    "theme": "hover-interactions",
    "categories": ["hover", "motion"],
    "tags": ["velocity", "skew", "pointer", "physics", "kinetic"],
    "tech": ["css", "js"],
    "era": "2020s",
    "difficulty": "advanced",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Every hover affordance here also responds to :focus-visible so keyboard users get the same information. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--k", "description": "Velocity multiplier", "default": "0.6" },
      { "name": "--max", "description": "Maximum skew", "default": "14deg" }
    ],
    "variations": ["Scale instead of skew", "Apply to a list of items", "Clamp harder for a subtler effect"],
    "ai_usage": "Playful portfolios. Track deltaX between pointermove events, clamp it, and decay toward zero on a rAF loop — without decay the card stays skewed when the pointer stops."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .vs { width: 240px; height: 150px; border-radius: 16px; display: grid; place-items: center; font-weight: 800;
      background: linear-gradient(135deg, #7c5cff, #2dd4bf); color: #0b0d12; will-change: transform; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="vs" id="vs">Flick me</div>
  <script>
    (function () {
      var el = document.getElementById("vs"), last = 0, sk = 0, target = 0;
      el.addEventListener("pointermove", function (e) {
        if (last) target = Math.max(-14, Math.min(14, (e.clientX - last) * .6));
        last = e.clientX;
      });
      el.addEventListener("pointerleave", function () { last = 0; target = 0; });
      (function loop() {
        sk += (target - sk) * .12; target *= .9;
        el.style.transform = "skewX(" + sk.toFixed(2) + "deg)";
        requestAnimationFrame(loop);
      })();
    })();
  </script>
</body>
</html>
