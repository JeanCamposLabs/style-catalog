<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Caption Slide Up</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "caption-slide-up",
    "title": "Caption Slide Up",
    "summary": "A caption panel slides over the image from below on hover.",
    "description": "The panel is translated fully out of view and back, so no height animation and no reflow of neighbouring cards.",
    "theme": "hover-interactions",
    "categories": ["hover", "image"],
    "tags": ["caption", "overlay", "slide", "gallery", "image"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Every hover affordance here also responds to :focus-visible so keyboard users get the same information. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--dur", "description": "Slide duration", "default": "0.35s" },
      { "name": "--bg", "description": "Panel background", "default": "rgba(11,13,18,.9)" }
    ],
    "variations": ["Fade plus slide", "Panel from the side", "Persistent title with extra detail on hover"],
    "ai_usage": "Image galleries and portfolio grids. Keep the essential label always visible and reserve the slide-up for secondary detail — hiding the only label behind hover breaks touch devices."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    :root { --dur: .35s; --bg: rgba(11,13,18,.9); }
    .gal { position: relative; width: 280px; height: 190px; border-radius: 14px; overflow: hidden;
      background: conic-gradient(from 140deg at 30% 40%, #7c5cff, #2dd4bf, #f472b6, #7c5cff); }
    .gal .cap { position: absolute; inset: auto 0 0 0; padding: .9rem 1rem; background: var(--bg);
      transform: translateY(100%); transition: transform var(--dur) cubic-bezier(.7,0,.2,1); }
    .gal:hover .cap, .gal:focus-within .cap { transform: translateY(0); }
    .gal h4 { margin: 0 0 .2rem; font-size: 1rem; }
    .gal p { margin: 0; color: #8b93a7; font-size: .85rem; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <figure class="gal" tabindex="0" style="margin:0">
    <figcaption class="cap"><h4>Chromatic study</h4><p>Gradient, 2026</p></figcaption>
  </figure>
</body>
</html>
