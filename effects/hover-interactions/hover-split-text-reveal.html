<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Split Reveal Link</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "hover-split-text-reveal",
    "title": "Split Reveal Link",
    "summary": "A link whose halves part to show a colour.",
    "description": "A link whose halves part to show a colour.",
    "theme": "hover-interactions",
    "categories": ["hover", "interaction"],
    "tags": ["hover", "pointer", "split", "link", "clip", "hover"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Every hover state here is mirrored on :focus-visible so keyboard users get the same information.",
    "customization": [
      { "name": "--c", "description": "Reveal colour", "default": "#2dd4bf" }
    ],
    "variations": ["Retune through the custom properties", "Adapt for a light theme"],
    "ai_usage": "Navigation and editorial links. Clip one copy top and the other bottom, then offset them in opposite directions; the base text underneath stays selectable."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; display: inline-block; padding: .5rem .2rem; color: #e7ebf3; text-decoration: none;
      font-size: 1.3rem; font-weight: 800; overflow: hidden; }
    .fx span { display: block; transition: transform .35s cubic-bezier(.7,0,.2,1); }
    .fx .t { clip-path: inset(0 0 50% 0); }
    .fx .b { position: absolute; inset: 0; padding: .5rem .2rem; clip-path: inset(50% 0 0 0); color: #2dd4bf; }
    .fx:hover .t { transform: translateX(-6px); }
    .fx:hover .b { transform: translateX(6px); }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <a class="fx" href="#"><span class="t">Explore</span><span class="b">Explore</span></a>
</body>
</html>
