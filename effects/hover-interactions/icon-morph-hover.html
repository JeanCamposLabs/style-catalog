<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Morphing Icon Button</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "icon-morph-hover",
    "title": "Morphing Icon Button",
    "summary": "A play icon morphs into a pause icon on hover.",
    "description": "Two bars change width, gap, and clip so one shape becomes the other without swapping any SVG paths.",
    "theme": "hover-interactions",
    "categories": ["hover", "icon"],
    "tags": ["icon", "morph", "play-pause", "transition", "media"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Every hover affordance here also responds to :focus-visible so keyboard users get the same information. Motion stops under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Icon color", "default": "#e7ebf3" },
      { "name": "--dur", "description": "Morph duration", "default": "0.3s" }
    ],
    "variations": ["Hamburger to close", "Plus to minus", "Bind to real playback state"],
    "ai_usage": "Media controls. Morphing two rectangles by animating width/clip-path is far cheaper and smoother than cross-fading two icons, and it survives colour changes for free."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    :root { --c: #e7ebf3; --dur: .3s; }
    .mor { width: 70px; height: 70px; border-radius: 50%; background: #1b2338; border: 1px solid #2b3450;
      display: grid; place-items: center; cursor: pointer; }
    .mor .ico { display: flex; gap: 6px; align-items: center; }
    .mor .ico i { display: block; width: 8px; height: 26px; background: var(--c);
      transition: clip-path var(--dur) ease, width var(--dur) ease, transform var(--dur) ease; }
    .mor .ico i:nth-child(1) { clip-path: polygon(0 0, 100% 22%, 100% 78%, 0 100%); }
    .mor .ico i:nth-child(2) { clip-path: polygon(0 22%, 100% 50%, 100% 50%, 0 78%); width: 14px; }
    .mor:hover .ico i, .mor:focus-visible .ico i { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); width: 8px; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <button class="mor" type="button" aria-label="Play"><span class="ico" aria-hidden="true"><i></i><i></i></span></button>
</body>
</html>
