  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }

      background: #0f0a1e; border: 1px solid rgba(255,255,255,.2); }
    .fx::after { content: ""; position: absolute; inset: -50%; mix-blend-mode: color-dodge; filter: blur(26px); opacity: .55;
      background: conic-gradient(from 0deg, #ff2d95, #fbbf24, #22d3ee, #a855f7, #ff2d95); animation: spin 8s linear infinite; }
    .fx b { position: absolute; inset: auto 0 0 0; padding: 1rem; font-weight: 800; color: #fff; }

      * { animation: none !important; transition: none !important; }
    }
