<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Balanced Stones</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "stone-stack-balance",
    "title": "Balanced Stones",
    "summary": "Stacked pebbles that settle with a gentle wobble.",
    "description": "Stacked pebbles that settle with a gentle wobble.",
    "theme": "nature-organic",
    "categories": ["nature", "organic"],
    "tags": ["organic", "nature", "stones", "balance", "zen", "stack"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Ambient nature motion should be slow and optional — disable it entirely under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Stone tone", "default": "#94a3b8" }
    ],
    "variations": ["Retune the palette", "Slow it down for an ambient version"],
    "ai_usage": "Meditation and wellness. Keep the wobble under 2° — larger angles break the sense of balance the motif depends on."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: grid; justify-items: center; gap: 3px; }
    .fx i { border-radius: 50%; background: linear-gradient(160deg, #94a3b8, #475569);
      box-shadow: inset -4px -3px 6px rgba(0,0,0,.35); animation: wobble 4s ease-in-out infinite; animation-delay: var(--dl); }
    @keyframes wobble { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx"><i style="width:34px;height:22px;--dl:0s"></i><i style="width:52px;height:30px;--dl:.3s"></i><i style="width:70px;height:34px;--dl:.6s"></i></div>
</body>
</html>
