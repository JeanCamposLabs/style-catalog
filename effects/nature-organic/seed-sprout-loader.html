<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sprouting Seed</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "seed-sprout-loader",
    "title": "Sprouting Seed",
    "summary": "A seed splits and sends up a shoot.",
    "description": "A seed splits and sends up a shoot.",
    "theme": "nature-organic",
    "categories": ["nature", "organic"],
    "tags": ["organic", "nature", "seed", "sprout", "grow", "loader"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Ambient nature motion should be slow and optional — disable it entirely under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Shoot colour", "default": "#22c55e" }
    ],
    "variations": ["Retune the palette", "Slow it down for an ambient version"],
    "ai_usage": "Loading states for eco products. Sequencing (stem first, leaves after) is what makes growth read as growth rather than an assembly of parts."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 120px; height: 120px; display: grid; place-items: end center; }
    .fx .stem { width: 4px; height: 0; background: #22c55e; border-radius: 2px; animation: rise 3s ease-out infinite; }
    .fx .leaf { position: absolute; bottom: 44px; width: 22px; height: 14px; background: #4ade80; border-radius: 0 99px 0 99px;
      transform: scale(0); animation: unfurl 3s ease-out infinite; }
    .fx .leaf.r { left: 50%; } .fx .leaf.l { right: 50%; border-radius: 99px 0 99px 0; }
    @keyframes rise { 0% { height: 0; } 60%, 100% { height: 74px; } }
    @keyframes unfurl { 0%, 45% { transform: scale(0); } 70%, 100% { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx"><span class="leaf l"></span><span class="leaf r"></span><span class="stem"></span></div>
</body>
</html>
