<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grass Blades</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "grass-field",
    "title": "Grass Blades",
    "summary": "A row of blades bending in a passing breeze.",
    "description": "A row of blades bending in a passing breeze.",
    "theme": "nature-organic",
    "categories": ["nature", "organic"],
    "tags": ["organic", "nature", "grass", "blades", "breeze", "stagger"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Ambient nature motion should be slow and optional — disable it entirely under prefers-reduced-motion.",
    "customization": [
      { "name": "--c", "description": "Blade colour", "default": "#4ade80" }
    ],
    "variations": ["Retune the palette", "Slow it down for an ambient version"],
    "ai_usage": "Landscape and outdoor headers. An index-based delay makes the breeze travel across the field instead of bending it all at once."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: flex; align-items: flex-end; gap: 5px; height: 90px; }
    .fx i { width: 5px; border-radius: 99px 99px 0 0; background: linear-gradient(180deg, #4ade80, #166534);
      transform-origin: bottom; animation: bend 3s ease-in-out infinite; animation-delay: calc(var(--i) * .12s); }
    @keyframes bend { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(12deg); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx"><i style="--i:0;height:52px"></i><i style="--i:1;height:74px"></i><i style="--i:2;height:60px"></i><i style="--i:3;height:88px"></i>
  <i style="--i:4;height:66px"></i><i style="--i:5;height:80px"></i><i style="--i:6;height:56px"></i><i style="--i:7;height:72px"></i></div>
</body>
</html>
