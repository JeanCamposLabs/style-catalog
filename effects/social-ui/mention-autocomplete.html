<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mention Suggestions</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "mention-autocomplete",
    "title": "Mention Suggestions",
    "summary": "An @-mention list appearing above the input.",
    "description": "An @-mention list appearing above the input.",
    "theme": "social-ui",
    "categories": ["social", "feed"],
    "tags": ["social", "community", "mention", "autocomplete", "at", "typeahead"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Reaction counts and follow state need accessible names that change with state, and threads need real heading or list structure.",
    "customization": [
      { "name": "--bg", "description": "List background", "default": "#141a28" }
    ],
    "variations": ["Adapt to a light theme", "Compact variant for dense lists"],
    "ai_usage": "Composers and comment boxes. Implement as a combobox with aria-activedescendant so arrow-key selection is announced without moving DOM focus."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 280px; }
    .fx .list { position: absolute; bottom: calc(100% + 6px); left: 0; right: 0; padding: .3rem; border-radius: 12px;
      background: #141a28; border: 1px solid #2b3450; box-shadow: 0 16px 40px rgba(0,0,0,.5); }
    .fx .it { display: flex; align-items: center; gap: .6rem; padding: .4rem .5rem; border-radius: 8px; font-size: .85rem; color: #cbd5e1; }
    .fx .it.on { background: #22304a; color: #fff; }
    .fx .av { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: .68rem;
      font-weight: 800; color: #0b0d12; }
    .fx .h { color: #8b93a7; font-size: .78rem; }
    .fx input { width: 100%; padding: .7rem .9rem; border-radius: 12px; border: 1px solid #2b3450; background: #151b2a;
      color: #e7ebf3; font: inherit; }
  </style>
</head>
<body>
  <div class="fx"><div class="list" role="listbox" aria-label="Mention suggestions">
    <div class="it on" role="option" aria-selected="true"><span class="av" style="background:#7c5cff">A</span>Ada Lovelace <span class="h">@ada</span></div>
    <div class="it" role="option" aria-selected="false"><span class="av" style="background:#2dd4bf">A</span>Alan Turing <span class="h">@alan</span></div>
  </div><input type="text" value="Thanks @a" aria-label="Write a comment" /></div>
</body>
</html>
