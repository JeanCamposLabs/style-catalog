<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stories Row</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "stories-ring-row",
    "title": "Stories Row",
    "summary": "Avatar rings marking unseen stories.",
    "description": "Avatar rings marking unseen stories.",
    "theme": "social-ui",
    "categories": ["social", "feed"],
    "tags": ["social", "community", "stories", "ring", "avatar", "unseen"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Reaction counts and follow state need accessible names that change with state, and threads need real heading or list structure.",
    "customization": [
      { "name": "--ring", "description": "Unseen ring", "default": "conic-gradient(#f472b6,#fbbf24,#7c5cff)" }
    ],
    "variations": ["Adapt to a light theme", "Compact variant for dense lists"],
    "ai_usage": "Story rails. The gradient ring means unseen; make that state textual too ('New story from Ada') for non-visual users."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: flex; gap: 12px; }
    .s { display: grid; justify-items: center; gap: .35rem; font-size: .7rem; color: #8b93a7; }
    .s .ring { width: 62px; height: 62px; border-radius: 50%; padding: 3px;
      background: conic-gradient(#f472b6, #fbbf24, #7c5cff, #f472b6); }
    .s.seen .ring { background: #2b3450; }
    .s .av { width: 100%; height: 100%; border-radius: 50%; border: 2px solid #0b0d12; display: grid; place-items: center;
      font-weight: 800; color: #0b0d12; }
  </style>
</head>
<body>
  <div class="fx"><div class="s"><div class="ring"><div class="av" style="background:#7c5cff">A</div></div>ada</div>
  <div class="s"><div class="ring"><div class="av" style="background:#2dd4bf">J</div></div>jean</div>
  <div class="s seen"><div class="ring"><div class="av" style="background:#fbbf24">M</div></div>max</div></div>
</body>
</html>
