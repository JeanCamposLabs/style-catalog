<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Comment Thread</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "comment-thread-nested",
    "title": "Comment Thread",
    "summary": "Nested replies with connecting rails.",
    "description": "Nested replies with connecting rails.",
    "theme": "social-ui",
    "categories": ["social", "feed"],
    "tags": ["social", "community", "comments", "thread", "nested", "replies"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Reaction counts and follow state need accessible names that change with state, and threads need real heading or list structure.",
    "customization": [
      { "name": "--rail", "description": "Rail colour", "default": "#22304a" }
    ],
    "variations": ["Adapt to a light theme", "Compact variant for dense lists"],
    "ai_usage": "Discussion threads. Cap nesting at two or three levels and use a list structure — deeper indentation becomes unreadable on narrow screens."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 290px; font-size: .85rem; }
    .c { display: flex; gap: .6rem; padding: .5rem 0; }
    .c .av { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center;
      font-size: .7rem; font-weight: 800; color: #0b0d12; }
    .c b { font-size: .82rem; }
    .c p { margin: .15rem 0 0; color: #cbd5e1; line-height: 1.5; }
    .c .meta { font-size: .72rem; color: #8b93a7; }
    .nest { margin-left: 1.1rem; padding-left: .9rem; border-left: 2px solid #22304a; }
  </style>
</head>
<body>
  <div class="fx"><div class="c"><span class="av" style="background:#7c5cff">A</span>
  <div><b>Ada</b> <span class="meta">3h</span><p>How are the posters generated?</p></div></div>
  <div class="nest"><div class="c"><span class="av" style="background:#2dd4bf">J</span>
  <div><b>Jean</b> <span class="meta">2h</span><p>Playwright screenshots, committed to the repo.</p></div></div></div></div>
</body>
</html>
