<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verified Badge</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "badge-verified-tick",
    "title": "Verified Badge",
    "summary": "A verification tick beside a display name.",
    "description": "A verification tick beside a display name.",
    "theme": "social-ui",
    "categories": ["social", "feed"],
    "tags": ["social", "community", "verified", "badge", "tick", "identity"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Reaction counts and follow state need accessible names that change with state, and threads need real heading or list structure.",
    "customization": [
      { "name": "--c", "description": "Badge colour", "default": "#38bdf8" }
    ],
    "variations": ["Adapt to a light theme", "Compact variant for dense lists"],
    "ai_usage": "Identity markers. The tick needs an accessible label ('Verified account') — a decorative glyph beside a name communicates nothing to screen readers."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: inline-flex; align-items: center; gap: .35rem; font-weight: 700; }
    .fx .v { width: 18px; height: 18px; border-radius: 50%; background: #38bdf8; color: #04222b; display: grid;
      place-items: center; font-size: .7rem; font-weight: 900; }
  </style>
</head>
<body>
  <span class="fx">Jean Campos <span class="v" role="img" aria-label="Verified account">✓</span></span>
</body>
</html>
