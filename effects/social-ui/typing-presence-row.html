<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Presence Row</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "typing-presence-row",
    "title": "Presence Row",
    "summary": "Online status dots on a list of contacts.",
    "description": "Online status dots on a list of contacts.",
    "theme": "social-ui",
    "categories": ["social", "feed"],
    "tags": ["social", "community", "presence", "online", "status", "contacts"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Reaction counts and follow state need accessible names that change with state, and threads need real heading or list structure.",
    "customization": [
      { "name": "--on", "description": "Online colour", "default": "#34d399" }
    ],
    "variations": ["Adapt to a light theme", "Compact variant for dense lists"],
    "ai_usage": "Contact lists. Pair the status dot with text ('Online', 'Away') — a coloured dot is the classic colour-only signal."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 260px; }
    .r { display: flex; align-items: center; gap: .7rem; padding: .5rem .6rem; border-radius: 10px; font-size: .88rem; color: #cbd5e1; }
    .r:hover { background: #151b2a; }
    .r .av { position: relative; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
      font-weight: 800; color: #0b0d12; font-size: .75rem; }
    .r .st { position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #0b0d12; }
    .r .away .st, .r .st.away { background: #fbbf24; }
    .r .st.on { background: #34d399; }
    .r .st.off { background: #64748b; }
    .r small { display: block; color: #8b93a7; font-size: .74rem; }
  </style>
</head>
<body>
  <div class="fx"><div class="r"><span class="av" style="background:#7c5cff">A<span class="st on"></span></span><span>Ada<small>Online</small></span></div>
  <div class="r"><span class="av" style="background:#2dd4bf">M<span class="st away"></span></span><span>Max<small>Away</small></span></div>
  <div class="r"><span class="av" style="background:#64748b">S<span class="st off"></span></span><span>Sam<small>Offline</small></span></div></div>
</body>
</html>
