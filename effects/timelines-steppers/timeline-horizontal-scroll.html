  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;

    .rail { position: relative; display: flex; gap: 1.4rem; min-width: 460px; padding-top: 1.6rem; }
    .rail::before { content: ""; position: absolute; top: 8px; left: 0; right: 0; height: 2px; background: #2b3450; }
    .m { position: relative; width: 130px; flex: none; }
    .m::before { content: ""; position: absolute; top: -18px; left: 0; width: 12px; height: 12px; border-radius: 50%;
      background: #7c5cff; border: 2px solid #0b0d12; }
    .m time { display: block; color: #8b93a7; font-size: .72rem; margin-bottom: .2rem; }
    .m b { font-size: .84rem; }
    .m p { margin: .2rem 0 0; color: #8b93a7; font-size: .76rem; line-height: 1.4; }
