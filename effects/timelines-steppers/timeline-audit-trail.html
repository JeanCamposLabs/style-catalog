<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Audit Trail</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "timeline-audit-trail",
    "title": "Audit Trail",
    "summary": "Immutable log entries with actor and hash.",
    "description": "Immutable log entries with actor and hash.",
    "theme": "timelines-steppers",
    "categories": ["timeline", "stepper"],
    "tags": ["timeline", "sequence", "audit", "log", "trail", "compliance"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Sequences need list markup and an explicit current marker (aria-current) — position and colour alone are not enough.",
    "customization": [
      { "name": "--c", "description": "Marker colour", "default": "#2dd4bf" }
    ],
    "variations": ["Adapt to a light theme", "Add a compact variant"],
    "ai_usage": "Compliance and security views. Show the actor, the action, the timestamp, and the record hash — an audit trail missing any one of those is not auditable."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 290px; font-family: ui-monospace, Menlo, monospace; font-size: .74rem; }
    .e { display: grid; grid-template-columns: 8px 1fr; gap: .7rem; }
    .e .rail { display: grid; justify-items: center; }
    .e .d { width: 8px; height: 8px; border-radius: 50%; background: #2dd4bf; margin-top: 5px; }
    .e .line { width: 1px; flex: 1; background: #22304a; height: 100%; }
    .e .body { padding-bottom: .9rem; color: #cbd5e1; }
    .e .h { color: #64748b; }
    .e time { color: #8b93a7; }
  </style>
</head>
<body>
  <div class="fx"><div class="e"><span class="rail"><span class="d"></span><span class="line"></span></span>
  <div class="body"><time>12:04:18Z</time> jean · publish<br><span class="h">sha 8f2a4c…</span></div></div>
  <div class="e"><span class="rail"><span class="d"></span><span class="line"></span></span>
  <div class="body"><time>11:58:02Z</time> ci-bot · build<br><span class="h">sha 41b0de…</span></div></div>
  <div class="e"><span class="rail"><span class="d"></span></span>
  <div class="body"><time>11:42:55Z</time> ada · approve<br><span class="h">sha c7e119…</span></div></div></div>
</body>
</html>
