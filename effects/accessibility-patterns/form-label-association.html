<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Label Association</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "form-label-association",
    "title": "Label Association",
    "summary": "Correct and incorrect field labelling.",
    "description": "Correct and incorrect field labelling.",
    "theme": "accessibility-patterns",
    "categories": ["accessibility", "reference"],
    "tags": ["accessibility", "a11y", "labels", "forms", "for", "aria-describedby"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "These specimens are the accessibility reference — each demonstrates the correct semantics, not just the visual result.",
    "customization": [
      { "name": "--c", "description": "Field border", "default": "#2b3450" }
    ],
    "variations": ["Retune the palette", "Scale for a compact variant"],
    "ai_usage": "Every input needs a programmatically associated label — <label for> matching the input id, or aria-label when no visible label exists. Placeholder text is not a label; it disappears the moment someone types."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: grid; gap: 1rem; width: 290px; }
    .f label { display: block; font-size: .8rem; color: #8b93a7; margin-bottom: .3rem; }
    .f input { width: 100%; padding: .65rem .8rem; border-radius: 10px; border: 1px solid #2b3450; background: #151b2a;
      color: #e7ebf3; font: inherit; }
    .f .hint { margin: .35rem 0 0; font-size: .76rem; color: #64748b; }
    .bad { opacity: .75; }
    .bad .warn { color: #f0a3c6; font-size: .76rem; margin-top: .35rem; }
  </style>
</head>
<body>
  <div class="fx"><div class="f"><label for="ok1">Workspace name</label>
  <input id="ok1" type="text" aria-describedby="h1" /><p class="hint" id="h1">Lowercase letters and hyphens only.</p></div>
  <div class="f bad"><input type="text" placeholder="Workspace name" />
  <p class="warn">✕ Placeholder-only: no label, and the hint vanishes on input.</p></div></div>
</body>
</html>
