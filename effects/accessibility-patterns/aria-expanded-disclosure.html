<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Disclosure Pattern</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "aria-expanded-disclosure",
    "title": "Disclosure Pattern",
    "summary": "A native details/summary disclosure.",
    "description": "A native details/summary disclosure.",
    "theme": "accessibility-patterns",
    "categories": ["accessibility", "reference"],
    "tags": ["accessibility", "a11y", "disclosure", "details", "summary", "native"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "These specimens are the accessibility reference — each demonstrates the correct semantics, not just the visual result.",
    "customization": [
      { "name": "--bg", "description": "Panel background", "default": "#151b2a" }
    ],
    "variations": ["Retune the palette", "Scale for a compact variant"],
    "ai_usage": "FAQs and progressive detail. <details>/<summary> is keyboard-operable, announced as a disclosure, and findable by in-page search — reach for it before building an ARIA accordion."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 290px; }
    .fx details { border-radius: 12px; background: #151b2a; border: 1px solid #263149; margin-bottom: 8px; overflow: hidden; }
    .fx summary { padding: .75rem .9rem; cursor: pointer; font-size: .88rem; list-style: none; display: flex;
      justify-content: space-between; align-items: center; }
    .fx summary::-webkit-details-marker { display: none; }
    .fx summary .ch { color: #8b93a7; transition: transform .25s; }
    .fx details[open] summary .ch { transform: rotate(90deg); }
    .fx p { margin: 0; padding: 0 .9rem .9rem; color: #8b93a7; font-size: .82rem; line-height: 1.55; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx"><details open><summary>What makes a specimen valid? <span class="ch">›</span></summary>
  <p>A single self-contained HTML file with an embedded metadata block that passes the schema.</p></details>
  <details><summary>Are external assets allowed? <span class="ch">›</span></summary>
  <p>No. Every specimen must run offline with no network requests.</p></details></div>
</body>
</html>
