<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reduced Motion</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "reduced-motion-fallback",
    "title": "Reduced Motion",
    "summary": "The same component with and without motion.",
    "description": "The same component with and without motion.",
    "theme": "accessibility-patterns",
    "categories": ["accessibility", "reference"],
    "tags": ["accessibility", "a11y", "reduced-motion", "prefers-reduced-motion", "fallback", "media-query"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "These specimens are the accessibility reference — each demonstrates the correct semantics, not just the visual result.",
    "customization": [
      { "name": "--dur", "description": "Animation duration", "default": "3s" }
    ],
    "variations": ["Retune the palette", "Scale for a compact variant"],
    "ai_usage": "Every animated component. Reduce motion rather than removing meaning: keep the end state, drop the movement, and never leave an element stuck at opacity 0 because its entrance never ran."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: flex; gap: 14px; align-items: center; }
    .card { width: 120px; height: 120px; border-radius: 14px; background: linear-gradient(160deg, #7c5cff, #2dd4bf);
      display: grid; place-items: center; color: #0b0d12; font-weight: 800; font-size: .8rem; text-align: center; padding: .5rem; }
    .card.anim { animation: spin 3s linear infinite; }
    .note { max-width: 250px; color: #8b93a7; font-size: .8rem; line-height: 1.5; }
    @keyframes spin { to { transform: rotate(1turn); } }
    @media (prefers-reduced-motion: reduce) { .card.anim { animation: none; } }
  </style>
</head>
<body>
  <div class="fx"><div class="card anim">Motion</div>
  <p class="note">Enable “Reduce motion” in your OS settings and the rotation stops — the component still shows its final state.</p></div>
</body>
</html>
