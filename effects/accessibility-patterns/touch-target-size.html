<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Touch Target Size</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "touch-target-size",
    "title": "Touch Target Size",
    "summary": "Hit areas below and above the 44px minimum.",
    "description": "Hit areas below and above the 44px minimum.",
    "theme": "accessibility-patterns",
    "categories": ["accessibility", "reference"],
    "tags": ["accessibility", "a11y", "touch-target", "hit-area", "mobile", "wcag"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "These specimens are the accessibility reference — each demonstrates the correct semantics, not just the visual result.",
    "customization": [
      { "name": "--min", "description": "Minimum target", "default": "44px" }
    ],
    "variations": ["Retune the palette", "Scale for a compact variant"],
    "ai_usage": "WCAG 2.2 asks for 24×24 CSS pixels minimum; 44×44 is the practical target. When the visual control must stay small, expand the hit area with padding or a pseudo-element rather than scaling the icon."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: flex; gap: 20px; align-items: center; }
    .t { display: grid; justify-items: center; gap: .4rem; font-size: .72rem; color: #8b93a7; }
    .small { width: 24px; height: 24px; }
    .good { width: 44px; height: 44px; }
    .t button { border-radius: 10px; border: 1px solid #263149; background: #151b2a; color: #cbd5e1; cursor: pointer;
      display: grid; place-items: center; }
    .pad { position: relative; width: 24px; height: 24px; }
    .pad button { position: absolute; inset: -10px; width: auto; height: auto; }
    .note { margin-top: .9rem; max-width: 280px; color: #8b93a7; font-size: .8rem; line-height: 1.5; }
  </style>
</head>
<body>
  <div><div class="fx"><div class="t"><button class="small" type="button" aria-label="Too small">×</button>24px</div>
  <div class="t"><button class="good" type="button" aria-label="Comfortable">×</button>44px</div>
  <div class="t"><span class="pad"><button type="button" aria-label="Small icon, large hit area">×</button></span>24px + padding</div></div>
  <p class="note">The third control looks 24px but its hit area is 44px — the recommended compromise for dense toolbars.</p></div>
</body>
</html>
