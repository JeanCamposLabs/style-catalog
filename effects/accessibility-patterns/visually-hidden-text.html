<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visually Hidden Text</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "visually-hidden-text",
    "title": "Visually Hidden Text",
    "summary": "Content available to screen readers only.",
    "description": "Content available to screen readers only.",
    "theme": "accessibility-patterns",
    "categories": ["accessibility", "reference"],
    "tags": ["accessibility", "a11y", "visually-hidden", "screen-reader", "sr-only", "labels"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "These specimens are the accessibility reference — each demonstrates the correct semantics, not just the visual result.",
    "customization": [
      { "name": "--size", "description": "Icon button size", "default": "46px" }
    ],
    "variations": ["Retune the palette", "Scale for a compact variant"],
    "ai_usage": "Icon-only controls. This clip-path recipe keeps text in the accessibility tree while removing it visually — display:none and visibility:hidden remove it from both."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: flex; gap: 10px; }
    .fx button { width: 46px; height: 46px; border-radius: 12px; border: 1px solid #263149; background: #151b2a;
      color: #cbd5e1; font-size: 1.1rem; cursor: pointer; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }
    .note { margin-top: .9rem; color: #8b93a7; font-size: .8rem; max-width: 260px; line-height: 1.5; }
  </style>
</head>
<body>
  <div><div class="fx"><button type="button">✂<span class="sr-only">Cut</span></button>
  <button type="button">⧉<span class="sr-only">Copy</span></button>
  <button type="button">📋<span class="sr-only">Paste</span></button></div>
  <p class="note">Each button carries a hidden label, so screen readers announce “Cut”, not “scissors”.</p></div>
</body>
</html>
