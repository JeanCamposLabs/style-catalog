<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Motion Hierarchy</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "motion-hierarchy-layers",
    "title": "Motion Hierarchy",
    "summary": "Foreground moves further and faster than background.",
    "description": "Foreground moves further and faster than background.",
    "theme": "motion-principles",
    "categories": ["motion", "reference"],
    "tags": ["motion", "easing", "hierarchy", "layers", "parallax", "depth"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Every motion token here has a reduced-motion equivalent: durations collapse to zero rather than the animation being left half-played.",
    "customization": [
      { "name": "--rate", "description": "Foreground rate", "default": "1" }
    ],
    "variations": ["Swap in your own scale", "Export as design tokens"],
    "ai_usage": "Layered scenes. Elements nearer the viewer should move further and finish sooner; identical motion across depths flattens the composition instantly."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 290px; height: 170px; border-radius: 14px; overflow: hidden; background: #0d1220; }
    .fx i { position: absolute; border-radius: 12px; animation: slide var(--d) ease-in-out infinite alternate; }
    .bg { inset: 20px; background: #1a2130; --d: 5s; }
    .mid { inset: 45px; background: #26304a; --d: 4s; }
    .fg { inset: 68px; background: linear-gradient(150deg, #7c5cff, #2dd4bf); --d: 3s; }
    @keyframes slide { from { transform: translateX(-14px); } to { transform: translateX(14px); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx"><i class="bg"></i><i class="mid"></i><i class="fg"></i></div>
</body>
</html>
