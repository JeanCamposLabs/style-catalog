<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Enter / Exit Asymmetry</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "enter-exit-asymmetry",
    "title": "Enter / Exit Asymmetry",
    "summary": "Entrances slower than exits.",
    "description": "Entrances slower than exits.",
    "theme": "motion-principles",
    "categories": ["motion", "reference"],
    "tags": ["motion", "easing", "enter", "exit", "asymmetry", "timing"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Every motion token here has a reduced-motion equivalent: durations collapse to zero rather than the animation being left half-played.",
    "customization": [
      { "name": "--in", "description": "Enter duration", "default": "250ms" },
      { "name": "--out", "description": "Exit duration", "default": "150ms" }
    ],
    "variations": ["Swap in your own scale", "Export as design tokens"],
    "ai_usage": "Transient UI. Enter slower than you exit (250ms in, 150ms out): arrivals need to be noticed, departures should get out of the way."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 300px; display: grid; gap: .8rem; }
    .lbl { font-size: .68rem; color: #64748b; font-family: ui-monospace, monospace; margin-bottom: .25rem; }
    .card { padding: .7rem .9rem; border-radius: 10px; background: #151b2a; border: 1px solid #263149; color: #cbd5e1; font-size: .8rem; }
    .in { animation: cycle 3s ease-in-out infinite; }
    @keyframes cycle {
      0% { opacity: 0; transform: translateY(10px); }
      20%, 70% { opacity: 1; transform: none; }
      80%, 100% { opacity: 0; transform: translateY(-6px); }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx"><div><div class="lbl">enter 250ms · exit 150ms</div><div class="card in">Toast message</div></div></div>
</body>
</html>
