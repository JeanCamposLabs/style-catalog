<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Command Menu</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "nav-command-menu-groups",
    "title": "Command Menu",
    "summary": "A keyboard-driven menu with grouped commands.",
    "description": "A keyboard-driven menu with grouped commands.",
    "theme": "navigation-menus",
    "categories": ["navigation", "menu"],
    "tags": ["navigation", "menu", "command", "palette", "keyboard", "groups"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Navigation must be keyboard-operable: disclosure widgets manage aria-expanded, and the current page carries aria-current.",
    "customization": [
      { "name": "--bg", "description": "Panel background", "default": "#141a28" }
    ],
    "variations": ["Retune through the custom properties", "Adapt for a light theme"],
    "ai_usage": "Keyboard-first apps. Keep DOM focus in the input and track the highlighted row with aria-activedescendant, so typing and arrow navigation both keep working."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 290px; border-radius: 14px; background: #141a28; border: 1px solid #2b3450; overflow: hidden; }
    .fx input { width: 100%; padding: .8rem 1rem; border: 0; border-bottom: 1px solid #22304a; background: transparent;
      color: #e7ebf3; font: inherit; }
    .fx input:focus { outline: none; }
    .fx .g { padding: .4rem .35rem; }
    .fx .lbl { padding: .2rem .65rem; font-size: .66rem; text-transform: uppercase; letter-spacing: .08em; color: #64748b; }
    .fx .it { display: flex; justify-content: space-between; padding: .45rem .65rem; border-radius: 8px; color: #cbd5e1; font-size: .86rem; }
    .fx .it.on { background: #22304a; color: #fff; }
    .fx kbd { color: #64748b; font-size: .74rem; font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <div class="fx" role="dialog" aria-label="Command menu"><input type="text" placeholder="Type a command…" aria-label="Command" />
  <div class="g"><div class="lbl">Navigate</div><div class="it on">Go to specimens <kbd>G S</kbd></div>
  <div class="it">Go to themes <kbd>G T</kbd></div></div>
  <div class="g"><div class="lbl">Actions</div><div class="it">Copy for AI <kbd>⌘C</kbd></div></div></div>
</body>
</html>
