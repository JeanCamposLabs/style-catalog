<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mega Menu with Feature</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "nav-mega-featured-panel",
    "title": "Mega Menu with Feature",
    "summary": "A dropdown with links plus a promoted card.",
    "description": "A dropdown with links plus a promoted card.",
    "theme": "navigation-menus",
    "categories": ["navigation", "menu"],
    "tags": ["navigation", "menu", "mega-menu", "featured", "dropdown", "promo"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Navigation must be keyboard-operable: disclosure widgets manage aria-expanded, and the current page carries aria-current.",
    "customization": [
      { "name": "--bg", "description": "Panel background", "default": "#141a28" }
    ],
    "variations": ["Retune through the custom properties", "Adapt for a light theme"],
    "ai_usage": "Marketing navigation. Open on click for touch parity, close on Escape and outside click, and keep the promoted card last in the DOM so it is not read before the links."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; display: inline-block; }
    .fx > button { padding: .6rem 1rem; border-radius: 10px; border: 1px solid #2b3450; background: #151b2a; color: #e7ebf3;
      font: inherit; cursor: pointer; }
    .fx .panel { position: absolute; top: calc(100% + 8px); left: 0; display: none; grid-template-columns: 1fr 130px;
      gap: 1rem; padding: 1rem; border-radius: 14px; background: #141a28; border: 1px solid #2b3450;
      box-shadow: 0 22px 50px rgba(0,0,0,.55); width: 300px; }
    .fx.is-open .panel { display: grid; }
    .fx h4 { margin: 0 0 .4rem; font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: #64748b; }
    .fx a { display: block; padding: .2rem 0; color: #cbd5e1; text-decoration: none; font-size: .84rem; }
    .fx .promo { border-radius: 10px; padding: .7rem; background: linear-gradient(150deg, #7c5cff, #2dd4bf); color: #0b0d12; font-size: .76rem; }
  </style>
</head>
<body>
  <div class="fx" id="mm2"><button type="button" aria-expanded="false">Product ▾</button>
  <div class="panel"><div><h4>Explore</h4><a href="#">Gallery</a><a href="#">Themes</a><a href="#">Bundles</a></div>
  <div class="promo"><b>New</b><br>1,181 specimens</div></div></div>
  <script>
    (function () {
      var m = document.getElementById("mm2"), b = m.querySelector("button");
      b.addEventListener("click", function () { b.setAttribute("aria-expanded", String(m.classList.toggle("is-open"))); });
      addEventListener("keydown", function (e) { if (e.key === "Escape") { m.classList.remove("is-open"); b.setAttribute("aria-expanded", "false"); } });
    })();
  </script>
</body>
</html>
