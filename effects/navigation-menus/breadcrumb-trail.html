<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Breadcrumb Trail</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "breadcrumb-trail",
    "title": "Breadcrumb Trail",
    "summary": "A path trail with chevron separators and a current-page marker.",
    "description": "The last crumb is not a link and carries aria-current, which is what makes a breadcrumb accessible rather than decorative.",
    "theme": "navigation-menus",
    "categories": ["navigation"],
    "tags": ["breadcrumb", "path", "hierarchy", "trail", "wayfinding"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Navigation is keyboard-operable: focus states mirror hover, and disclosure widgets manage aria-expanded.",
    "customization": [
      { "name": "--c", "description": "Link colour", "default": "#8b93a7" }
    ],
    "variations": ["Collapse the middle on small screens", "Dropdown on each crumb"],
    "ai_usage": "Deep hierarchies. Wrap in <nav aria-label=Breadcrumb> with an <ol>, and mark the final item aria-current=page without a link."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .bc ol { display: flex; gap: .5rem; list-style: none; margin: 0; padding: 0; align-items: center; font-size: .9rem; }
    .bc a { color: var(--c, #8b93a7); text-decoration: none; }
    .bc a:hover { color: #e7ebf3; text-decoration: underline; }
    .bc li + li::before { content: "›"; margin-right: .5rem; color: #3b465e; }
    .bc [aria-current] { color: #e7ebf3; font-weight: 600; }
  </style>
</head>
<body>
  <nav class="bc" aria-label="Breadcrumb"><ol>
    <li><a href="#">Catalog</a></li><li><a href="#">Themes</a></li><li><a href="#">Buttons</a></li>
    <li><span aria-current="page">Ripple</span></li>
  </ol></nav>
</body>
</html>
