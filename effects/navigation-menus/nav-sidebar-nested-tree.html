  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 240px; padding: .6rem; border-radius: 14px; background: #151b2a; border: 1px solid #263149; font-size: .86rem; }
    .fx details { margin-bottom: 2px; }
    .fx summary { display: flex; align-items: center; gap: .5rem; padding: .45rem .6rem; border-radius: 8px; cursor: pointer;
      color: #cbd5e1; list-style: none; }
    .fx summary::-webkit-details-marker { display: none; }
    .fx summary:hover { background: #1e2740; }
    .fx summary .ch { color: #64748b; transition: transform .2s; }
    .fx details[open] summary .ch { transform: rotate(90deg); }
    .fx a { display: block; padding: .35rem .6rem .35rem 1.9rem; border-radius: 8px; color: #8b93a7; text-decoration: none; }
    .fx a:hover { background: #1e2740; color: #e7ebf3; }
    .fx a[aria-current] { background: #1e1740; color: #b9a5ff; }
  </style>
</head>
<body>
