<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Column Mega Menu</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "mega-dropdown-columns",
    "title": "Column Mega Menu",
    "summary": "A wide dropdown organised into labelled columns.",
    "description": "Grouping links under headings turns a long list into a scannable map of the site.",
    "theme": "navigation-menus",
    "categories": ["navigation"],
    "tags": ["mega-menu", "dropdown", "columns", "grouped", "header"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Navigation is keyboard-operable: focus states mirror hover, and disclosure widgets manage aria-expanded.",
    "customization": [
      { "name": "--bg", "description": "Panel background", "default": "#141a28" }
    ],
    "variations": ["Featured promo column", "Full-width panel"],
    "ai_usage": "Large sites with many sections. Open on click (not hover) for touch parity, manage aria-expanded, and close on Escape and on outside click."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .mm { position: relative; }
    .mm > button { padding: .6rem 1rem; border-radius: 10px; border: 1px solid #2b3450; background: #151b2a; color: #e7ebf3; font: inherit; cursor: pointer; }
    .mm .panel { position: absolute; top: calc(100% + 8px); left: 0; display: none; grid-template-columns: repeat(3, 130px);
      gap: 1rem; padding: 1.1rem; background: var(--bg, #141a28); border: 1px solid #2b3450; border-radius: 14px;
      box-shadow: 0 20px 50px rgba(0,0,0,.5); }
    .mm.is-open .panel { display: grid; }
    .mm h4 { margin: 0 0 .5rem; font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: #8b93a7; }
    .mm a { display: block; padding: .3rem 0; color: #cbd5e1; text-decoration: none; font-size: .9rem; }
    .mm a:hover { color: #7c5cff; }
  </style>
</head>
<body>
  <div class="mm" id="mm">
    <button type="button" aria-expanded="false">Products ▾</button>
    <div class="panel">
      <div><h4>Build</h4><a href="#">Editor</a><a href="#">CLI</a><a href="#">SDK</a></div>
      <div><h4>Ship</h4><a href="#">Deploy</a><a href="#">Preview</a><a href="#">Rollback</a></div>
      <div><h4>Learn</h4><a href="#">Docs</a><a href="#">Guides</a><a href="#">Changelog</a></div>
    </div>
  </div>
  <script>
    (function () {
      var m = document.getElementById("mm"), b = m.querySelector("button");
      b.addEventListener("click", function () {
        var open = m.classList.toggle("is-open");
        b.setAttribute("aria-expanded", String(open));
      });
      addEventListener("keydown", function (e) { if (e.key === "Escape") { m.classList.remove("is-open"); b.setAttribute("aria-expanded", "false"); } });
    })();
  </script>
</body>
</html>
