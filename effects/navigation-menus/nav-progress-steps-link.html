<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wizard Navigation</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "nav-progress-steps-link",
    "title": "Wizard Navigation",
    "summary": "Steps that are also links to completed stages.",
    "description": "Steps that are also links to completed stages.",
    "theme": "navigation-menus",
    "categories": ["navigation", "menu"],
    "tags": ["navigation", "menu", "wizard", "steps", "links", "navigation"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Navigation must be keyboard-operable: disclosure widgets manage aria-expanded, and the current page carries aria-current.",
    "customization": [
      { "name": "--done", "description": "Completed colour", "default": "#10a894" }
    ],
    "variations": ["Retune through the custom properties", "Adapt for a light theme"],
    "ai_usage": "Multi-step flows. Make completed steps real links so users can go back without losing data, and leave future steps as plain text until they are reachable."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: flex; align-items: center; width: 300px; font-size: .74rem; }
    .fx a, .fx span.st { display: grid; justify-items: center; gap: .3rem; color: #8b93a7; text-decoration: none; }
    .fx .d { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 800;
      background: #1c2437; border: 2px solid #2b3450; }
    .fx a .d { background: #10a894; border-color: #10a894; color: #04241f; }
    .fx .now .d { border-color: #7c5cff; color: #b9a5ff; }
    .fx .now { color: #e7ebf3; }
    .fx .ln { flex: 1; height: 2px; background: #2b3450; margin: 0 .3rem 1rem; }
    .fx .ln.done { background: #10a894; }
  </style>
</head>
<body>
  <nav class="fx" aria-label="Progress"><a href="#"><span class="d">✓</span>Account</a>
  <span class="ln done" aria-hidden="true"></span><span class="st now" aria-current="step"><span class="d">2</span>Profile</span>
  <span class="ln" aria-hidden="true"></span><span class="st"><span class="d">3</span>Billing</span></nav>
</body>
</html>
