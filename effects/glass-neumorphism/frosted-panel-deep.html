<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deep Frosted Panel</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "frosted-panel-deep",
    "title": "Deep Frosted Panel",
    "summary": "Heavy backdrop blur with saturation boost and a bright edge.",
    "description": "Saturation is the detail most glass effects miss — blur alone turns the backdrop grey and lifeless.",
    "theme": "glass-neumorphism",
    "categories": ["glass"],
    "tags": ["glassmorphism", "backdrop-filter", "saturate", "frost", "panel"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Soft surfaces easily fall below 3:1 contrast — check the border and text against the backdrop before shipping.",
    "customization": [
      { "name": "--blur", "description": "Backdrop blur", "default": "18px" },
      { "name": "--sat", "description": "Saturation boost", "default": "1.6" }
    ],
    "variations": ["Lighter frost for readability", "Tinted glass", "Noise overlay to reduce banding"],
    "ai_usage": "Overlays on colourful backdrops. Always pair backdrop-filter: blur() with saturate(1.4–1.8) and a 1px top highlight; add a solid fallback background for browsers without backdrop-filter."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    body { background: conic-gradient(from 200deg at 30% 30%, #7c5cff, #2dd4bf, #f472b6, #7c5cff); }
    :root { --blur: 18px; --sat: 1.6; }
    .glass { width: 260px; padding: 1.6rem; border-radius: 20px; color: #fff;
      background: rgba(255,255,255,.12); backdrop-filter: blur(var(--blur)) saturate(var(--sat));
      -webkit-backdrop-filter: blur(var(--blur)) saturate(var(--sat));
      border: 1px solid rgba(255,255,255,.28); box-shadow: 0 18px 50px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.4); }
    .glass h3 { margin: 0 0 .4rem; }
    .glass p { margin: 0; opacity: .8; font-size: .88rem; }
  </style>
</head>
<body>
  <div class="glass"><h3>Frosted</h3><p>Blur plus saturation.</p></div>
</body>
</html>
