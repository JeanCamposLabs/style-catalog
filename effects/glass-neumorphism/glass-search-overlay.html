<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Glass Search Bar</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "glass-search-overlay",
    "title": "Glass Search Bar",
    "summary": "A frosted search field over imagery.",
    "description": "A frosted search field over imagery.",
    "theme": "glass-neumorphism",
    "categories": ["glass", "surface"],
    "tags": ["glass", "surface", "glass", "search", "frosted", "overlay"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Translucent surfaces easily fall below contrast minimums — check text and borders against the busiest part of the backdrop.",
    "customization": [
      { "name": "--blur", "description": "Backdrop blur", "default": "16px" }
    ],
    "variations": ["Retune through the custom properties", "Adapt for a light theme"],
    "ai_usage": "Search over hero imagery. Placeholder text on glass needs at least 70% white; anything dimmer disappears over light regions of the backdrop."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    body { background: conic-gradient(from 200deg at 30% 40%, #1e1b4b, #7c5cff, #2dd4bf); }
    .fx { display: flex; align-items: center; gap: .6rem; width: 290px; padding: .75rem 1rem; border-radius: 999px;
      background: rgba(255,255,255,.18); backdrop-filter: blur(16px) saturate(1.6);
      -webkit-backdrop-filter: blur(16px) saturate(1.6); border: 1px solid rgba(255,255,255,.35); }
    .fx input { flex: 1; min-width: 0; border: 0; background: transparent; color: #fff; font: inherit; }
    .fx input::placeholder { color: rgba(255,255,255,.7); }
    .fx input:focus { outline: none; }
  </style>
</head>
<body>
  <div class="fx"><span aria-hidden="true" style="color:#fff">⌕</span>
  <label class="sr" for="gq" style="position:absolute;left:-9999px">Search</label>
  <input id="gq" type="search" placeholder="Search specimens" /></div>
</body>
</html>
