<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Glass Tab Bar</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "glass-bottom-nav-bar",
    "title": "Glass Tab Bar",
    "summary": "A translucent bottom navigation bar.",
    "description": "A translucent bottom navigation bar.",
    "theme": "glass-neumorphism",
    "categories": ["glass", "surface"],
    "tags": ["glass", "surface", "glass", "tab-bar", "mobile", "navigation"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Translucent surfaces easily fall below contrast minimums — check text and borders against the busiest part of the backdrop.",
    "customization": [
      { "name": "--blur", "description": "Backdrop blur", "default": "18px" }
    ],
    "variations": ["Retune through the custom properties", "Adapt for a light theme"],
    "ai_usage": "Mobile app shells. Keep the bar above the safe-area inset and give the active item a weight change as well as a colour change, since translucency flattens colour differences."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    body { background: linear-gradient(180deg, #7c3aed, #0b0d12); }
    .fx { display: flex; width: 290px; padding: .5rem; border-radius: 20px;
      background: rgba(255,255,255,.15); backdrop-filter: blur(18px) saturate(1.6);
      -webkit-backdrop-filter: blur(18px) saturate(1.6); border: 1px solid rgba(255,255,255,.3); }
    .fx a { flex: 1; display: grid; justify-items: center; gap: 2px; padding: .4rem 0; color: rgba(255,255,255,.7);
      text-decoration: none; font-size: .68rem; }
    .fx a[aria-current] { color: #fff; font-weight: 700; }
    .fx .ic { font-size: 1.1rem; }
  </style>
</head>
<body>
  <nav class="fx" aria-label="Sections"><a href="#" aria-current="page"><span class="ic" aria-hidden="true">⌂</span>Home</a>
  <a href="#"><span class="ic" aria-hidden="true">⌕</span>Search</a><a href="#"><span class="ic" aria-hidden="true">♥</span>Saved</a>
  <a href="#"><span class="ic" aria-hidden="true">☺</span>You</a></nav>
</body>
</html>
