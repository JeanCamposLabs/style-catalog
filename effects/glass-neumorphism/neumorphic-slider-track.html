<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Neumorphic Slider</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "neumorphic-slider-track",
    "title": "Neumorphic Slider",
    "summary": "A soft-UI range control.",
    "description": "A soft-UI range control.",
    "theme": "glass-neumorphism",
    "categories": ["glass", "surface"],
    "tags": ["glass", "surface", "neumorphism", "slider", "soft-ui", "inset"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Translucent surfaces easily fall below contrast minimums — check text and borders against the busiest part of the backdrop.",
    "customization": [
      { "name": "--c", "description": "Fill colour", "default": "#7c5cff" }
    ],
    "variations": ["Retune through the custom properties", "Adapt for a light theme"],
    "ai_usage": "Soft-UI settings. The track is inset and the knob is outset — that contrast is the entire neumorphic language; matching them makes the control disappear."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    body { background: #232a3a; }
    .fx { width: 270px; }
    .fx label { display: block; font-size: .8rem; color: #8b93a7; margin-bottom: .6rem; }
    .fx .track { position: relative; height: 14px; border-radius: 99px; background: #232a3a;
      box-shadow: inset 3px 3px 6px rgba(0,0,0,.5), inset -3px -3px 6px rgba(255,255,255,.05); }
    .fx .fill { position: absolute; inset: 0 auto 0 0; width: 58%; border-radius: 99px; background: #7c5cff; }
    .fx .knob { position: absolute; top: 50%; left: 58%; translate: -50% -50%; width: 28px; height: 28px; border-radius: 50%;
      background: #232a3a; box-shadow: 3px 3px 7px rgba(0,0,0,.5), -3px -3px 7px rgba(255,255,255,.06); }
  </style>
</head>
<body>
  <div class="fx"><label for="ns">Intensity</label><div class="track" role="slider" aria-label="Intensity"
    aria-valuenow="58" aria-valuemin="0" aria-valuemax="100"><div class="fill"></div><div class="knob"></div></div></div>
</body>
</html>
