<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claymorphic Tile</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "claymorphic-tile",
    "title": "Claymorphic Tile",
    "summary": "A puffy clay surface with double inner highlights.",
    "description": "Large radii, a saturated fill, and two inset highlights (top-left light, bottom-right dark) create the inflated clay look.",
    "theme": "glass-neumorphism",
    "categories": ["claymorphism"],
    "tags": ["clay", "puffy", "3d", "soft", "playful"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Soft surfaces easily fall below 3:1 contrast — check the border and text against the backdrop before shipping.",
    "customization": [
      { "name": "--c", "description": "Clay colour", "default": "#7c5cff" },
      { "name": "--r", "description": "Corner radius", "default": "34px" }
    ],
    "variations": ["Pastel palette", "Larger radius for more inflation", "Add a drop shadow in the same hue"],
    "ai_usage": "Playful, kid-friendly, and app-icon aesthetics. The recipe is: big radius, saturated fill, two inset shadows, and a large soft outer shadow tinted with the fill colour."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    :root { --c: #7c5cff; --r: 34px; }
    .clay { width: 200px; height: 150px; border-radius: var(--r); background: var(--c); display: grid; place-items: center;
      color: #fff; font-weight: 800;
      box-shadow: inset 8px 8px 16px rgba(255,255,255,.35), inset -8px -8px 16px rgba(0,0,0,.25),
        0 22px 40px color-mix(in srgb, var(--c) 40%, transparent); }
  </style>
</head>
<body>
  <div class="clay">Clay</div>
</body>
</html>
