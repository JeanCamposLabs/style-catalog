  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;

    .fx aside { width: 96px; padding: .8rem .6rem; background: rgba(255,255,255,.16);
      backdrop-filter: blur(18px) saturate(1.6); -webkit-backdrop-filter: blur(18px) saturate(1.6);
      border-right: 1px solid rgba(255,255,255,.28); }
    .fx aside a { display: block; padding: .4rem .5rem; border-radius: 8px; color: #fff; text-decoration: none; font-size: .78rem; }
    .fx aside a[aria-current] { background: rgba(255,255,255,.28); font-weight: 700; }
    .fx main { flex: 1; padding: 1rem; color: #fff; font-size: .85rem; }
  </style>
</head>
