<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sticky Glass Bar</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "glass-navbar-blur",
    "title": "Sticky Glass Bar",
    "summary": "A translucent top bar that blurs the content scrolling under it.",
    "description": "The bar only gains its border and shadow once the page has scrolled, so a page at rest stays clean.",
    "theme": "glass-neumorphism",
    "categories": ["glass", "navigation"],
    "tags": ["navbar", "sticky", "backdrop-filter", "scroll", "header"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Soft surfaces easily fall below 3:1 contrast — check the border and text against the backdrop before shipping.",
    "customization": [
      { "name": "--blur", "description": "Backdrop blur", "default": "14px" }
    ],
    "variations": ["Hide on scroll down, show on scroll up", "Solid on scroll instead of glass", "Progress bar under the bar"],
    "ai_usage": "App and marketing headers. Add the elevated class only after scrollY > 0 (via IntersectionObserver on a sentinel, not a scroll listener) so the resting header has no border."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    body { min-height: 200vh; background: linear-gradient(180deg, #7c5cff, #0b0d12 40%); }
    :root { --blur: 14px; }
    .bar { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between;
      padding: .9rem 1.2rem; background: rgba(11,13,18,.55); backdrop-filter: blur(var(--blur)) saturate(1.5);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(1.5); border-bottom: 1px solid rgba(255,255,255,.12); color: #e7ebf3; }
    .bar b { font-weight: 800; }
    .bar nav { display: flex; gap: 1rem; color: #b9c2d4; font-size: .9rem; }
    .content { padding: 6rem 1.2rem; color: #e7ebf3; max-width: 40ch; }
  </style>
</head>
<body>
  <header class="bar"><b>Catalog</b><nav><span>Docs</span><span>API</span><span>Pricing</span></nav></header>
  <div class="content"><h2>Scroll me</h2><p>The bar blurs whatever passes beneath it.</p></div>
</body>
</html>
