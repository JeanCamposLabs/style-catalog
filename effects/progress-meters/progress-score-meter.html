<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Score Meter</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "progress-score-meter",
    "title": "Score Meter",
    "summary": "A horizontal meter with threshold zones.",
    "description": "A horizontal meter with threshold zones.",
    "theme": "progress-meters",
    "categories": ["progress", "meter"],
    "tags": ["progress", "indicator", "score", "threshold", "zones", "rating"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Give every indicator role=progressbar (or <progress>/<meter>) with aria-valuenow, and never rely on colour alone to signal a threshold.",
    "customization": [
      { "name": "--p", "description": "Score position", "default": "78" }
    ],
    "variations": ["Recolour through the custom properties", "Scale it for a compact variant"],
    "ai_usage": "Credit scores, performance grades, and audits. Zone colours must be backed by labels — the bands are meaningless to a colour-blind user otherwise."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .sm { width: 300px; }
    .sm .track { position: relative; height: 12px; border-radius: 999px;
      background: linear-gradient(90deg, #f87171 0 33%, #fbbf24 33% 66%, #34d399 66%); }
    .sm .pin { position: absolute; top: -6px; left: calc(var(--p) * 1%); translate: -50% 0; width: 4px; height: 24px;
      border-radius: 2px; background: #e7ebf3; box-shadow: 0 0 0 3px #0b0d12; }
    .sm .lbl { display: flex; justify-content: space-between; margin-top: .6rem; font-size: .75rem; color: #8b93a7; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="sm" style="--p:78"><div class="track" role="meter" aria-valuenow="78" aria-valuemin="0" aria-valuemax="100" aria-label="Performance score"><span class="pin"></span></div>
  <div class="lbl"><span>Poor</span><span>Fair</span><span>Good</span></div></div>
</body>
</html>
