<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Radial Countdown</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "progress-radial-countdown",
    "title": "Radial Countdown",
    "summary": "A ring that empties as time runs out.",
    "description": "A ring that empties as time runs out.",
    "theme": "progress-meters",
    "categories": ["progress", "meter"],
    "tags": ["progress", "indicator", "countdown", "timer", "ring", "conic"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Give every indicator role=progressbar (or <progress>/<meter>) with aria-valuenow, and never rely on colour alone to signal a threshold.",
    "customization": [
      { "name": "--p", "description": "Time remaining", "default": "35" }
    ],
    "variations": ["Recolour through the custom properties", "Scale it for a compact variant"],
    "ai_usage": "Session timeouts and resend cooldowns. Drive --p from a real timestamp so a backgrounded tab resumes at the correct position instead of drifting."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .rc { width: 120px; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center;
      background: conic-gradient(#fbbf24 calc(var(--p) * 1%), #22304a 0);
      -webkit-mask: radial-gradient(farthest-side, transparent 68%, #000 69%); mask: radial-gradient(farthest-side, transparent 68%, #000 69%); }
    .wrap { position: relative; display: grid; place-items: center; }
    .wrap b { position: absolute; font-size: 1.3rem; font-weight: 900; font-variant-numeric: tabular-nums; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap"><div class="rc" style="--p:35" role="timer" aria-label="35 seconds remaining"></div><b>0:35</b></div>
</body>
</html>
