<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Segmented Ring</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "progress-circular-steps",
    "title": "Segmented Ring",
    "summary": "A ring divided into discrete step segments.",
    "description": "A ring divided into discrete step segments.",
    "theme": "progress-meters",
    "categories": ["progress", "meter"],
    "tags": ["progress", "indicator", "segments", "ring", "steps", "conic"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Give every indicator role=progressbar (or <progress>/<meter>) with aria-valuenow, and never rely on colour alone to signal a threshold.",
    "customization": [
      { "name": "--done", "description": "Steps complete", "default": "4" }
    ],
    "variations": ["Recolour through the custom properties", "Scale it for a compact variant"],
    "ai_usage": "Multi-step processes shown as a ring. A repeating-conic mask cuts the gaps, so segment count changes need only one number."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .sr { width: 140px; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center;
      background: conic-gradient(#7c5cff 0 calc(var(--done) * 60deg), #22304a calc(var(--done) * 60deg) 360deg);
      -webkit-mask: radial-gradient(farthest-side, transparent 62%, #000 63%), repeating-conic-gradient(#000 0 56deg, transparent 56deg 60deg);
      mask: radial-gradient(farthest-side, transparent 62%, #000 63%), repeating-conic-gradient(#000 0 56deg, transparent 56deg 60deg);
      -webkit-mask-composite: source-in; mask-composite: intersect; }
    .wrap { position: relative; display: grid; place-items: center; }
    .wrap b { position: absolute; font-size: 1.4rem; font-weight: 900; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap"><div class="sr" style="--done:4" role="img" aria-label="4 of 6 steps"></div><b>4/6</b></div>
</body>
</html>
