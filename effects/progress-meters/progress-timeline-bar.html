<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Milestone Bar</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "progress-timeline-bar",
    "title": "Milestone Bar",
    "summary": "A progress bar with milestone markers along it.",
    "description": "A progress bar with milestone markers along it.",
    "theme": "progress-meters",
    "categories": ["progress", "meter"],
    "tags": ["progress", "indicator", "milestones", "markers", "roadmap", "stages"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Give every indicator role=progressbar (or <progress>/<meter>) with aria-valuenow, and never rely on colour alone to signal a threshold.",
    "customization": [
      { "name": "--p", "description": "Percent complete", "default": "58" }
    ],
    "variations": ["Recolour through the custom properties", "Scale it for a compact variant"],
    "ai_usage": "Roadmaps and delivery tracking. Position markers by percentage so they stay aligned when the bar is fluid width."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .mb { width: 320px; padding-top: 1.6rem; }
    .mb .bar { position: relative; height: 6px; border-radius: 999px; background: #22304a; }
    .mb .bar i { display: block; height: 100%; width: calc(var(--p) * 1%); border-radius: 999px; background: #7c5cff; }
    .mb .m { position: absolute; top: 50%; translate: -50% -50%; width: 14px; height: 14px; border-radius: 50%;
      background: #0b0d12; border: 2px solid #3b465e; }
    .mb .m.done { border-color: #7c5cff; background: #7c5cff; }
    .mb .m span { position: absolute; bottom: 18px; left: 50%; translate: -50% 0; white-space: nowrap; font-size: .72rem; color: #8b93a7; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="mb" style="--p:58"><div class="bar" role="progressbar" aria-valuenow="58" aria-valuemin="0" aria-valuemax="100"><i></i>
    <span class="m done" style="left:0"><span>Kickoff</span></span>
    <span class="m done" style="left:35%"><span>Alpha</span></span>
    <span class="m" style="left:70%"><span>Beta</span></span>
    <span class="m" style="left:100%"><span>GA</span></span>
  </div></div>
</body>
</html>
