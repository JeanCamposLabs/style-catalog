<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arc Gauge</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "meter-gauge-arc",
    "title": "Arc Gauge",
    "summary": "A half-circle gauge with a needle and a numeric readout.",
    "description": "A half-circle gauge with a needle and a numeric readout.",
    "theme": "progress-meters",
    "categories": ["progress", "meter"],
    "tags": ["progress", "indicator", "gauge", "arc", "svg", "dial"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Give every indicator role=progressbar (or <progress>/<meter>) with aria-valuenow, and never rely on colour alone to signal a threshold.",
    "customization": [
      { "name": "--p", "description": "Percent filled", "default": "72" },
      { "name": "--c", "description": "Arc colour", "default": "#34d399" }
    ],
    "variations": ["Recolour through the custom properties", "Scale it for a compact variant"],
    "ai_usage": "Speed, capacity, and score dials. The arc length is π×r (here 251 for r=80); set stroke-dasharray to that and drive dashoffset from the percentage."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .g { width: 220px; }
    .g svg { width: 100%; display: block; }
    .g .track { fill: none; stroke: #22304a; stroke-width: 14; stroke-linecap: round; }
    .g .bar { fill: none; stroke: #34d399; stroke-width: 14; stroke-linecap: round; stroke-dasharray: 251; stroke-dashoffset: calc(251 - 251 * var(--p) / 100); transition: stroke-dashoffset .6s; }
    .g .val { text-align: center; margin-top: -2.2rem; font-size: 1.9rem; font-weight: 900; }
    .g .unit { text-align: center; color: #8b93a7; font-size: .8rem; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="g" style="--p:72"><svg viewBox="0 0 200 110" role="img" aria-label="72 percent">
    <path class="track" d="M20 100 A80 80 0 0 1 180 100"/><path class="bar" d="M20 100 A80 80 0 0 1 180 100"/>
  </svg><div class="val">72</div><div class="unit">of 100 credits</div></div>
</body>
</html>
