<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Upload Queue</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "progress-upload-list",
    "title": "Upload Queue",
    "summary": "Multiple files each with their own progress row.",
    "description": "Multiple files each with their own progress row.",
    "theme": "progress-meters",
    "categories": ["progress", "meter"],
    "tags": ["progress", "indicator", "upload", "queue", "files", "multiple"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Give every indicator role=progressbar (or <progress>/<meter>) with aria-valuenow, and never rely on colour alone to signal a threshold.",
    "customization": [
      { "name": "--c", "description": "Bar colour", "default": "#7c5cff" }
    ],
    "variations": ["Recolour through the custom properties", "Scale it for a compact variant"],
    "ai_usage": "Batch uploads. Give each row its own progressbar role and keep an aggregate summary — a single combined bar hides which file is stuck."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .q { width: 300px; display: grid; gap: 10px; }
    .q .row { background: #151b2a; border: 1px solid #263149; border-radius: 12px; padding: .7rem .9rem; }
    .q .top { display: flex; justify-content: space-between; font-size: .85rem; color: #cbd5e1; margin-bottom: .5rem; }
    .q .pct { color: #8b93a7; font-size: .78rem; }
    .q .bar { height: 5px; border-radius: 99px; background: #22304a; overflow: hidden; }
    .q .bar i { display: block; height: 100%; background: #7c5cff; width: calc(var(--p) * 1%); }
    .q .done .bar i { background: #34d399; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="q">
    <div class="row done" style="--p:100"><div class="top"><span>brief.pdf</span><span class="pct">Done</span></div><div class="bar"><i></i></div></div>
    <div class="row" style="--p:64"><div class="top"><span>hero.mp4</span><span class="pct">64%</span></div><div class="bar"><i></i></div></div>
    <div class="row" style="--p:18"><div class="top"><span>assets.zip</span><span class="pct">18%</span></div><div class="bar"><i></i></div></div>
  </div>
</body>
</html>
