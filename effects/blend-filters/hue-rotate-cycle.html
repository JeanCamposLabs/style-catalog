<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hue Cycle</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "hue-rotate-cycle",
    "title": "Hue Cycle",
    "summary": "The whole surface walks the colour wheel.",
    "description": "The whole surface walks the colour wheel. Applied with CSS filters or blend modes, so the underlying content stays live and selectable.",
    "theme": "blend-filters",
    "categories": ["filter", "color"],
    "tags": ["filter", "css", "hue-rotate", "cycle", "rainbow", "animated"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Filters change colour relationships — re-check text contrast after applying one, and never encode meaning in a filtered colour alone.",
    "customization": [
      { "name": "--dur", "description": "Cycle duration", "default": "8s" }
    ],
    "variations": ["Animate the filter value on hover", "Apply to a whole section with backdrop-filter"],
    "ai_usage": "Party and playful themes. Because hue-rotate is a matrix approximation, brand colours will drift — never use it where colour accuracy matters."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .demo { width: 260px; height: 170px; border-radius: 16px; overflow: hidden; position: relative;
      background: conic-gradient(from 200deg at 35% 30%, #7c5cff, #2dd4bf, #fbbf24, #f472b6, #7c5cff); }
    .label { margin-top: .8rem; text-align: center; color: #8b93a7; font-size: .82rem; }
    .fx { animation: hue 8s linear infinite; }
    @keyframes hue { to { filter: hue-rotate(360deg); } }
  </style>
</head>
<body>
  <div><div class="demo fx"></div><p class="label">Hue Cycle</p></div>
</body>
</html>
