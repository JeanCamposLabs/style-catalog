<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tritone</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "tritone-filter",
    "title": "Tritone",
    "summary": "Three-tone grading across shadows, mids, and highlights.",
    "description": "Three-tone grading across shadows, mids, and highlights. Applied with CSS filters or blend modes, so the underlying content stays live and selectable.",
    "theme": "blend-filters",
    "categories": ["filter", "color"],
    "tags": ["filter", "css", "tritone", "grading", "three-tone", "print"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Filters change colour relationships — re-check text contrast after applying one, and never encode meaning in a filtered colour alone.",
    "customization": [
      { "name": "--a", "description": "Shadow tone", "default": "#1d4ed8" },
      { "name": "--b", "description": "Mid tone", "default": "#f472b6" },
      { "name": "--c", "description": "Highlight", "default": "#fbbf24" }
    ],
    "variations": ["Animate the filter value on hover", "Apply to a whole section with backdrop-filter"],
    "ai_usage": "Poster and album-art aesthetics. Hard gradient stops (not smooth ones) keep the three tones distinct instead of blending into a duotone."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .demo { width: 260px; height: 170px; border-radius: 16px; overflow: hidden; position: relative;
      background: conic-gradient(from 200deg at 35% 30%, #7c5cff, #2dd4bf, #fbbf24, #f472b6, #7c5cff); }
    .label { margin-top: .8rem; text-align: center; color: #8b93a7; font-size: .82rem; }
    .fx { filter: grayscale(1); }
    .fx::after { content: ""; position: absolute; inset: 0; mix-blend-mode: color;
      background: linear-gradient(135deg, #1d4ed8 0 35%, #f472b6 35% 70%, #fbbf24 70%); }
  </style>
</head>
<body>
  <div><div class="demo fx"></div><p class="label">Tritone</p></div>
</body>
</html>
