<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cold Cinematic</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "cold-cinematic-filter",
    "title": "Cold Cinematic",
    "summary": "Teal shadows and desaturated mids.",
    "description": "Teal shadows and desaturated mids. Applied with CSS filters or blend modes, so the underlying content stays live and selectable.",
    "theme": "blend-filters",
    "categories": ["filter", "color"],
    "tags": ["filter", "css", "cinematic", "teal", "grading", "cold"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Filters change colour relationships — re-check text contrast after applying one, and never encode meaning in a filtered colour alone.",
    "customization": [
      { "name": "--cool", "description": "Overlay opacity", "default": "0.7" }
    ],
    "variations": ["Animate the filter value on hover", "Apply to a whole section with backdrop-filter"],
    "ai_usage": "Thriller and tech aesthetics. Soft-light blending a blue gradient cools the shadows without flattening the highlights."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .demo { width: 260px; height: 170px; border-radius: 16px; overflow: hidden; position: relative;
      background: conic-gradient(from 200deg at 35% 30%, #7c5cff, #2dd4bf, #fbbf24, #f472b6, #7c5cff); }
    .label { margin-top: .8rem; text-align: center; color: #8b93a7; font-size: .82rem; }
    .fx { filter: saturate(.75) contrast(1.2) hue-rotate(-8deg); }
    .fx::after { content: ""; position: absolute; inset: 0; background: linear-gradient(#0ea5e9, #0f172a); mix-blend-mode: soft-light; opacity: .7; }
  </style>
</head>
<body>
  <div><div class="demo fx"></div><p class="label">Cold Cinematic</p></div>
</body>
</html>
