<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Depth Blur</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "blur-depth-filter",
    "title": "Depth Blur",
    "summary": "A gradient of blur that increases toward the edges.",
    "description": "A gradient of blur that increases toward the edges. Applied with CSS filters or blend modes, so the underlying content stays live and selectable.",
    "theme": "blend-filters",
    "categories": ["filter", "color"],
    "tags": ["filter", "css", "blur", "depth-of-field", "mask", "focus"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Filters change colour relationships — re-check text contrast after applying one, and never encode meaning in a filtered colour alone.",
    "customization": [
      { "name": "--blur", "description": "Edge blur", "default": "8px" }
    ],
    "variations": ["Animate the filter value on hover", "Apply to a whole section with backdrop-filter"],
    "ai_usage": "Fake depth of field. Mask a backdrop-filter layer instead of blurring the element, so the sharp centre stays perfectly crisp."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .demo { width: 260px; height: 170px; border-radius: 16px; overflow: hidden; position: relative;
      background: conic-gradient(from 200deg at 35% 30%, #7c5cff, #2dd4bf, #fbbf24, #f472b6, #7c5cff); }
    .label { margin-top: .8rem; text-align: center; color: #8b93a7; font-size: .82rem; }
    .fx { filter: blur(0); }
    .fx::after { content: ""; position: absolute; inset: 0; backdrop-filter: blur(8px);
      -webkit-mask-image: radial-gradient(circle at 50% 45%, transparent 30%, #000 70%);
      mask-image: radial-gradient(circle at 50% 45%, transparent 30%, #000 70%); }
  </style>
</head>
<body>
  <div><div class="demo fx"></div><p class="label">Depth Blur</p></div>
</body>
</html>
