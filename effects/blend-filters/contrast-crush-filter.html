<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contrast Crush</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "contrast-crush-filter",
    "title": "Contrast Crush",
    "summary": "Extreme contrast reduces the image to bold shapes.",
    "description": "Extreme contrast reduces the image to bold shapes. Applied with CSS filters or blend modes, so the underlying content stays live and selectable.",
    "theme": "blend-filters",
    "categories": ["filter", "color"],
    "tags": ["filter", "css", "contrast", "crush", "graphic", "bold"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Filters change colour relationships — re-check text contrast after applying one, and never encode meaning in a filtered colour alone.",
    "customization": [
      { "name": "--con", "description": "Contrast", "default": "3.2" }
    ],
    "variations": ["Animate the filter value on hover", "Apply to a whole section with backdrop-filter"],
    "ai_usage": "Brutalist and print-inspired layouts. Very high contrast destroys midtones — use it only where the subject reads as a silhouette."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .demo { width: 260px; height: 170px; border-radius: 16px; overflow: hidden; position: relative;
      background: conic-gradient(from 200deg at 35% 30%, #7c5cff, #2dd4bf, #fbbf24, #f472b6, #7c5cff); }
    .label { margin-top: .8rem; text-align: center; color: #8b93a7; font-size: .82rem; }
    .fx { filter: contrast(3.2) grayscale(.4); }
  </style>
</head>
<body>
  <div><div class="demo fx"></div><p class="label">Contrast Crush</p></div>
</body>
</html>
