  {
    "id": "y2k-chrome-nav",
    "title": "Chrome Nav Bar",
    "summary": "A metallic navigation bar with bevelled tabs.",
    "description": "A metallic navigation bar with bevelled tabs.",
    "theme": "brutalism-y2k",
    "categories": ["brutalism", "y2k"],
    "tags": ["brutalism", "raw", "chrome", "nav", "bevel", "metal"],

    "dependencies": [],

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: flex; gap: 3px; padding: 5px; border-radius: 10px;
      background: linear-gradient(180deg, #f8fafc, #94a3b8); box-shadow: inset 0 1px 0 #fff, 0 6px 16px rgba(0,0,0,.4); }
    .fx a { padding: .5rem 1rem; border-radius: 7px; color: #1e293b; text-decoration: none; font-weight: 700; font-size: .85rem;
      background: linear-gradient(180deg, #fff, #cbd5e1); box-shadow: inset 0 1px 0 #fff, 0 1px 2px rgba(0,0,0,.3); }
    .fx a:hover { background: linear-gradient(180deg, #e0f2fe, #7dd3fc); }
  </style>
</head>
<body>
  <nav class="fx"><a href="#">Home</a><a href="#">Gallery</a><a href="#">Guestbook</a></nav>
</body>
