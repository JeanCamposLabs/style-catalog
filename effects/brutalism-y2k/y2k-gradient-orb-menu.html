  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .row { display: flex; gap: 14px; }
    .orb { width: 64px; height: 64px; border-radius: 50%; border: 0; cursor: pointer; position: relative; color: #fff;
      font-weight: 800; box-shadow: 0 8px 18px rgba(0,0,0,.45), inset 0 -6px 12px rgba(0,0,0,.3); }
    .orb::before { content: ""; position: absolute; top: 6px; left: 14%; right: 14%; height: 38%; border-radius: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,0)); }
  </style>
</head>
<body>
  <div class="row"><button class="orb" type="button" style="background:radial-gradient(circle at 40% 30%,#fbcfe8,#db2777)">1</button>
  <button class="orb" type="button" style="background:radial-gradient(circle at 40% 30%,#bae6fd,#0284c7)">2</button>
  <button class="orb" type="button" style="background:radial-gradient(circle at 40% 30%,#bbf7d0,#16a34a)">3</button></div>
</body>
