  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 240px; background: #fff; border: 4px solid #0b0d12; padding: .6rem; font-family: "Times New Roman", serif; }
    .fx a { display: block; padding: .4rem .5rem; color: #0000ee; font-size: 1.05rem; text-decoration: underline; }
    .fx a:hover { background: #ffe600; color: #0b0d12; }
    .fx a:visited { color: #551a8b; }
