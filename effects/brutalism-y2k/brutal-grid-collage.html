<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brutalist Collage</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "brutal-grid-collage",
    "title": "Brutalist Collage",
    "summary": "Overlapping blocks with visible offsets.",
    "description": "Overlapping blocks with visible offsets.",
    "theme": "brutalism-y2k",
    "categories": ["brutalism", "y2k"],
    "tags": ["brutalism", "raw", "collage", "overlap", "blocks", "layout"],
    "tech": ["css"],
    "era": "2000s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Deliberately raw does not mean inaccessible: keep contrast, focus states, and hit areas intact.",
    "customization": [
      { "name": "--border", "description": "Border width", "default": "3px" }
    ],
    "variations": ["Retune the palette via the custom properties", "Slow the motion for an ambient version"],
    "ai_usage": "Editorial anti-design. Deliberate overlap and misalignment is the composition; snapping the blocks to a grid removes the entire effect."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 280px; height: 190px; }
    .fx div { position: absolute; border: 3px solid #0b0d12; font-family: "Courier New", monospace; font-weight: 700;
      padding: .4rem .6rem; font-size: .8rem; }
    .a { top: 0; left: 0; width: 160px; height: 90px; background: #ffe600; color: #0b0d12; }
    .bx { top: 40px; left: 90px; width: 170px; height: 100px; background: #ff5f6d; color: #fff; }
    .c { top: 110px; left: 20px; width: 120px; height: 70px; background: #06b6d4; color: #04222b; }
  </style>
</head>
<body>
  <div class="fx"><div class="a">HEADLINE</div><div class="bx">SUBHEAD</div><div class="c">2026</div></div>
</body>
</html>
