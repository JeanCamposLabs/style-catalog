  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 300px; overflow: hidden; background: #ffe600; border-block: 4px solid #0b0d12; padding: .5rem 0; }
    .fx b { display: inline-block; white-space: nowrap; color: #0b0d12; font-family: "Courier New", monospace;
      font-weight: 700; letter-spacing: .1em; animation: slide 8s linear infinite; }
    @keyframes slide { to { transform: translateX(-50%); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
