<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inline Suggestion</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "input-search-suggest-inline",
    "title": "Inline Suggestion",
    "summary": "A field that completes the rest of the word.",
    "description": "A field that completes the rest of the word.",
    "theme": "forms-inputs",
    "categories": ["form", "input"],
    "tags": ["form", "input", "autocomplete", "inline", "ghost", "suggestion"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Every control keeps a real label, a visible focus ring, and error state conveyed by text as well as colour.",
    "customization": [
      { "name": "--ghost", "description": "Ghost colour", "default": "#3f4a63" }
    ],
    "variations": ["Retune through the custom properties", "Adapt for a light theme"],
    "ai_usage": "Command bars and search fields. Render the completion as ghost text behind the input, and only accept it on Tab or Right arrow — never silently on blur."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 280px; font-family: ui-monospace, monospace; }
    .fx .ghost { position: absolute; inset: 0; padding: .8rem .9rem; color: #3f4a63; pointer-events: none; font: inherit; }
    .fx input { width: 100%; padding: .8rem .9rem; border-radius: 12px; border: 1px solid #2b3450; background: #151b2a;
      color: #e7ebf3; font: inherit; position: relative; background-clip: padding-box; }
    .fx input:focus { outline: none; border-color: #7c5cff; }
  </style>
</head>
<body>
  <div class="fx"><span class="ghost" aria-hidden="true">grad<span style="color:transparent">ient-border</span></span>
  <label class="sr" for="ig" style="position:absolute;left:-9999px">Search</label><input id="ig" type="text" value="grad" /></div>
</body>
</html>
