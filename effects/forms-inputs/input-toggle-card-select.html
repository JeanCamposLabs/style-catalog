<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Selectable Cards</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "input-toggle-card-select",
    "title": "Selectable Cards",
    "summary": "Radio options styled as full cards.",
    "description": "Radio options styled as full cards.",
    "theme": "forms-inputs",
    "categories": ["form", "input"],
    "tags": ["form", "input", "cards", "radio", "select", "plans"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Every control keeps a real label, a visible focus ring, and error state conveyed by text as well as colour.",
    "customization": [
      { "name": "--c", "description": "Selected colour", "default": "#7c5cff" }
    ],
    "variations": ["Retune through the custom properties", "Adapt for a light theme"],
    "ai_usage": "Plan and option pickers. Keep the radio input in the DOM (visually hidden, not display:none) so keyboard navigation and form submission work unchanged."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: grid; gap: 8px; width: 280px; }
    .fx input { position: absolute; opacity: 0; }
    .fx label { display: block; padding: .8rem 1rem; border-radius: 12px; border: 1px solid #2b3450; background: #151b2a;
      cursor: pointer; transition: border-color .2s, background .2s; }
    .fx input:checked + label { border-color: #7c5cff; background: #191331; }
    .fx input:focus-visible + label { outline: 2px solid #7c5cff; outline-offset: 2px; }
    .fx b { display: block; font-size: .9rem; }
    .fx small { color: #8b93a7; font-size: .78rem; }
  </style>
</head>
<body>
  <div class="fx"><input type="radio" name="pl" id="p1" checked /><label for="p1"><b>Studio</b><small>10 seats · $24/mo</small></label>
  <input type="radio" name="pl" id="p2" /><label for="p2"><b>Scale</b><small>Unlimited seats · $99/mo</small></label></div>
</body>
</html>
