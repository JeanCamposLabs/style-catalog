<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Password Rules</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "input-password-strength-rules",
    "title": "Password Rules",
    "summary": "A live checklist of password requirements.",
    "description": "A live checklist of password requirements.",
    "theme": "forms-inputs",
    "categories": ["form", "input"],
    "tags": ["form", "input", "password", "rules", "checklist", "validation"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Every control keeps a real label, a visible focus ring, and error state conveyed by text as well as colour.",
    "customization": [
      { "name": "--ok", "description": "Met colour", "default": "#10a894" }
    ],
    "variations": ["Retune through the custom properties", "Adapt for a light theme"],
    "ai_usage": "Sign-up forms. A live rule checklist beats a strength meter: it tells users exactly what to change, and each rule flips with an icon as well as a colour."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 280px; }
    .fx input { width: 100%; padding: .8rem .9rem; border-radius: 12px; border: 1px solid #2b3450; background: #151b2a;
      color: #e7ebf3; font: inherit; margin-bottom: .6rem; }
    .fx input:focus { outline: none; border-color: #7c5cff; }
    .fx li { list-style: none; display: flex; gap: .5rem; align-items: center; font-size: .8rem; color: #64748b; padding: .15rem 0; }
    .fx li.ok { color: #7fd8cb; }
    .fx ul { margin: 0; padding: 0; }
  </style>
</head>
<body>
  <div class="fx"><label class="sr" for="pw2" style="position:absolute;left:-9999px">Password</label>
  <input id="pw2" type="password" value="catalog2026" />
  <ul aria-live="polite"><li class="ok"><span aria-hidden="true">✓</span>At least 10 characters</li>
  <li class="ok"><span aria-hidden="true">✓</span>Contains a number</li>
  <li><span aria-hidden="true">○</span>Contains a symbol</li></ul></div>
</body>
</html>
