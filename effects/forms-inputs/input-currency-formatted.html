<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Formatted Number</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "input-currency-formatted",
    "title": "Formatted Number",
    "summary": "A currency field with grouped digits.",
    "description": "A currency field with grouped digits.",
    "theme": "forms-inputs",
    "categories": ["form", "input"],
    "tags": ["form", "input", "currency", "number", "format", "tabular"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Every control keeps a real label, a visible focus ring, and error state conveyed by text as well as colour.",
    "customization": [
      { "name": "--c", "description": "Focus colour", "default": "#7c5cff" }
    ],
    "variations": ["Retune through the custom properties", "Adapt for a light theme"],
    "ai_usage": "Money and quantity fields. Format on blur, not on every keystroke — reformatting mid-typing moves the caret and is one of the most frustrating input bugs."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 260px; }
    .fx label { display: block; font-size: .8rem; color: #8b93a7; margin-bottom: .35rem; }
    .fx .row { display: flex; align-items: center; border-radius: 12px; border: 1px solid #2b3450; background: #151b2a; padding: 0 .9rem; }
    .fx .row:focus-within { border-color: #7c5cff; }
    .fx .cur { color: #8b93a7; font-size: 1rem; }
    .fx input { flex: 1; min-width: 0; padding: .8rem .4rem; border: 0; background: transparent; color: #e7ebf3;
      font: inherit; font-size: 1.1rem; font-variant-numeric: tabular-nums; text-align: right; }
    .fx input:focus { outline: none; }
  </style>
</head>
<body>
  <div class="fx"><label for="cu">Monthly budget</label><div class="row"><span class="cur">$</span>
  <input id="cu" type="text" inputmode="decimal" value="4,280.00" /></div></div>
</body>
</html>
