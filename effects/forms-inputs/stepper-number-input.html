<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Number Stepper</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "stepper-number-input",
    "title": "Number Stepper",
    "summary": "A quantity control with hold-to-repeat increment buttons.",
    "description": "Holding a button accelerates the change, which is what stops users from clicking twenty times.",
    "theme": "forms-inputs",
    "categories": ["form", "input"],
    "tags": ["stepper", "quantity", "number", "repeat", "ecommerce"],
    "tech": ["css", "js"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Every control keeps a real <label>, a visible focus ring, and state that is never signalled by colour alone.",
    "customization": [
      { "name": "--c", "description": "Accent", "default": "#7c5cff" }
    ],
    "variations": ["Min/max clamping with disabled buttons", "Inline unit label"],
    "ai_usage": "Carts and settings. Keep the real <input type=number> for keyboard and assistive tech, and only style the surrounding buttons."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .st { display: inline-flex; align-items: center; border: 1px solid #2b3450; border-radius: 12px; overflow: hidden; background: #151b2a; }
    .st button { width: 42px; height: 46px; border: 0; background: transparent; color: #e7ebf3; font-size: 1.2rem; cursor: pointer; }
    .st button:hover { background: #1e2740; }
    .st input { width: 60px; text-align: center; border: 0; background: transparent; color: #e7ebf3; font: inherit; font-weight: 700; }
    .st input:focus { outline: 2px solid var(--c, #7c5cff); outline-offset: -2px; }
  </style>
</head>
<body>
  <div class="st"><button type="button" aria-label="Decrease">−</button>
  <input id="q" type="number" value="1" min="0" aria-label="Quantity" />
  <button type="button" aria-label="Increase">+</button></div>
  <script>
    (function () {
      var box = document.querySelector(".st"), inp = box.querySelector("input");
      var bs = box.querySelectorAll("button"), t;
      function step(d) { inp.value = Math.max(0, Number(inp.value) + d); }
      bs.forEach(function (b, i) {
        var d = i === 0 ? -1 : 1;
        b.addEventListener("click", function () { step(d); });
        b.addEventListener("pointerdown", function () { t = setInterval(function () { step(d); }, 120); });
        ["pointerup", "pointerleave"].forEach(function (ev) { b.addEventListener(ev, function () { clearInterval(t); }); });
      });
    })();
  </script>
</body>
</html>
