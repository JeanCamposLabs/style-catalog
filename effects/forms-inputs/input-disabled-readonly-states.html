<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Field States</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "input-disabled-readonly-states",
    "title": "Field States",
    "summary": "Default, focus, disabled, read-only, and error.",
    "description": "Default, focus, disabled, read-only, and error.",
    "theme": "forms-inputs",
    "categories": ["form", "input"],
    "tags": ["form", "input", "states", "disabled", "readonly", "error"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Every control keeps a real label, a visible focus ring, and error state conveyed by text as well as colour.",
    "customization": [
      { "name": "--c", "description": "Focus colour", "default": "#7c5cff" }
    ],
    "variations": ["Retune through the custom properties", "Adapt for a light theme"],
    "ai_usage": "Design-system reference. Disabled and read-only look similar but differ: read-only fields still submit their value and remain focusable, which matters for review screens."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: grid; gap: .5rem; width: 280px; }
    .fx input { width: 100%; padding: .7rem .9rem; border-radius: 10px; border: 1px solid #2b3450; background: #151b2a;
      color: #e7ebf3; font: inherit; font-size: .88rem; }
    .fx .focused { border-color: #7c5cff; box-shadow: 0 0 0 3px rgba(124,92,255,.2); }
    .fx input:disabled { background: #10141f; color: #4a5568; cursor: not-allowed; }
    .fx input[readonly] { background: #10141f; color: #8b93a7; }
    .fx .bad { border-color: #d1478c; }
    .fx .msg { font-size: .76rem; color: #f0a3c6; }
  </style>
</head>
<body>
  <div class="fx"><input type="text" value="Default" aria-label="Default" />
  <input class="focused" type="text" value="Focused" aria-label="Focused" />
  <input type="text" value="Disabled" disabled aria-label="Disabled" />
  <input type="text" value="Read-only" readonly aria-label="Read only" />
  <input class="bad" type="text" value="Error" aria-invalid="true" aria-describedby="em" aria-label="Error" />
  <span class="msg" id="em">✕ This workspace name is taken</span></div>
</body>
</html>
