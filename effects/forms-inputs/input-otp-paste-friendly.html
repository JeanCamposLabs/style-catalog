<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paste-Friendly Code</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "input-otp-paste-friendly",
    "title": "Paste-Friendly Code",
    "summary": "A single field styled as separate boxes.",
    "description": "A single field styled as separate boxes.",
    "theme": "forms-inputs",
    "categories": ["form", "input"],
    "tags": ["form", "input", "otp", "code", "paste", "letter-spacing"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Every control keeps a real label, a visible focus ring, and error state conveyed by text as well as colour.",
    "customization": [
      { "name": "--c", "description": "Focus colour", "default": "#7c5cff" }
    ],
    "variations": ["Retune through the custom properties", "Adapt for a light theme"],
    "ai_usage": "Verification codes. One input with letter-spacing keeps paste and autofill working, which the six-separate-inputs pattern usually breaks."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 260px; }
    .fx input { width: 100%; padding: .9rem 0; border: 0; background: transparent; color: #e7ebf3;
      font-family: ui-monospace, monospace; font-size: 1.6rem; letter-spacing: 2.35ch; text-indent: 1.1ch; }
    .fx input:focus { outline: none; }
    .fx .boxes { position: absolute; inset: 0; display: flex; gap: 8px; pointer-events: none; }
    .fx .boxes i { flex: 1; border-radius: 10px; border: 1px solid #2b3450; background: #151b2a; }
    .fx input:focus + .boxes i:first-child { border-color: #7c5cff; }
  </style>
</head>
<body>
  <div class="fx"><label class="sr" for="otp" style="position:absolute;left:-9999px">Verification code</label>
  <input id="otp" type="text" inputmode="numeric" maxlength="4" value="42" autocomplete="one-time-code" />
  <span class="boxes" aria-hidden="true"><i></i><i></i><i></i><i></i></span></div>
</body>
</html>
