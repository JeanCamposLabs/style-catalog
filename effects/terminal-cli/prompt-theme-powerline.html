<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Powerline Prompt</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "prompt-theme-powerline",
    "title": "Powerline Prompt",
    "summary": "A segmented shell prompt with arrow separators.",
    "description": "A segmented shell prompt with arrow separators.",
    "theme": "terminal-cli",
    "categories": ["terminal", "code"],
    "tags": ["terminal", "monospace", "powerline", "prompt", "segments", "shell"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Terminal output should live in a real text element (not an image) so it can be selected, searched, and read aloud.",
    "customization": [
      { "name": "--a", "description": "First segment", "default": "#7c5cff" }
    ],
    "variations": ["Retheme through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Shell and status-bar pastiche. The arrow is a clipped copy of the segment's own background, so it always matches when you retheme."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: inline-flex; font-family: ui-monospace, monospace; font-size: .82rem; }
    .fx span { display: inline-flex; align-items: center; padding: .3rem .7rem; color: #fff; position: relative; }
    .fx span::after { content: ""; position: absolute; left: 100%; top: 0; bottom: 0; width: 12px;
      background: inherit; clip-path: polygon(0 0, 100% 50%, 0 100%); }
    .fx .a { background: #7c5cff; } .fx .b { background: #2563eb; } .fx .c { background: #0f766e; }
  </style>
</head>
<body>
  <div class="fx"><span class="a">~/catalog</span><span class="b">main</span><span class="c">✓ 1181</span></div>
</body>
</html>
