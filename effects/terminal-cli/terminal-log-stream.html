<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log Stream</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "terminal-log-stream",
    "title": "Log Stream",
    "summary": "Coloured log lines arriving in sequence.",
    "description": "Coloured log lines arriving in sequence.",
    "theme": "terminal-cli",
    "categories": ["terminal", "code"],
    "tags": ["terminal", "monospace", "logs", "stream", "stagger", "monitoring"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Terminal output should live in a real text element (not an image) so it can be selected, searched, and read aloud.",
    "customization": [
      { "name": "--step", "description": "Line interval", "default": "0.5s" }
    ],
    "variations": ["Retheme through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Build and deploy views. Colour the level and also prefix it with a word — colour-only severity is unreadable for many users and in plain-text copies."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 300px; height: 150px; overflow: hidden; padding: .8rem; border-radius: 8px; background: #0d1117;
      border: 1px solid #21262d; font-family: ui-monospace, monospace; font-size: .74rem; line-height: 1.8; }
    .fx div { opacity: 0; animation: in .3s ease-out forwards; animation-delay: calc(var(--i) * .5s); }
    .fx .ok { color: #3fb950; } .fx .warn { color: #d29922; } .fx .err { color: #f85149; } .fx .dim { color: #6e7681; }
    @keyframes in { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .fx div { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="fx" role="log">
    <div style="--i:0" class="dim">12:04:01 [info] starting build</div>
    <div style="--i:1" class="ok">12:04:02 [ok] scanned 1181 effects</div>
    <div style="--i:2" class="warn">12:04:03 [warn] 2 posters missing</div>
    <div style="--i:3" class="ok">12:04:05 [ok] wrote catalog.json</div>
    <div style="--i:4" class="err">12:04:06 [error] upload retry 1/3</div>
  </div>
</body>
</html>
