<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Boot Sequence</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "terminal-matrix-boot",
    "title": "Boot Sequence",
    "summary": "System boot lines appearing with status flags.",
    "description": "System boot lines appearing with status flags.",
    "theme": "terminal-cli",
    "categories": ["terminal", "code"],
    "tags": ["terminal", "monospace", "boot", "sequence", "status", "stagger"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Terminal output should live in a real text element (not an image) so it can be selected, searched, and read aloud.",
    "customization": [
      { "name": "--step", "description": "Line interval", "default": "0.35s" }
    ],
    "variations": ["Retheme through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Loading screens with personality. Stagger the lines but keep the total under ~2s; a boot sequence that outlasts the actual load is theatre at the user's expense."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 300px; padding: .9rem; border-radius: 8px; background: #05070d; border: 1px solid #14532d;
      font-family: ui-monospace, monospace; font-size: .72rem; line-height: 1.9; color: #86efac; }
    .fx div { display: flex; justify-content: space-between; opacity: 0; animation: in .25s forwards;
      animation-delay: calc(var(--i) * .35s); }
    .fx b { color: #4ade80; }
    @keyframes in { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .fx div { animation: none; opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="fx" role="log">
    <div style="--i:0">mounting filesystem<b>[ OK ]</b></div><div style="--i:1">loading catalog<b>[ OK ]</b></div>
    <div style="--i:2">indexing effects<b>[ OK ]</b></div><div style="--i:3">starting server<b>[ OK ]</b></div>
  </div>
</body>
</html>
