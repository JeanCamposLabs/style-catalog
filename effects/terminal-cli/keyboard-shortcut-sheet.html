<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shortcut Sheet</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "keyboard-shortcut-sheet",
    "title": "Shortcut Sheet",
    "summary": "A cheat sheet of keyboard shortcuts.",
    "description": "A cheat sheet of keyboard shortcuts.",
    "theme": "terminal-cli",
    "categories": ["terminal", "code"],
    "tags": ["terminal", "monospace", "shortcuts", "cheat-sheet", "kbd", "help"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Terminal output should live in a real text element (not an image) so it can be selected, searched, and read aloud.",
    "customization": [
      { "name": "--bg", "description": "Sheet background", "default": "#151b2a" }
    ],
    "variations": ["Retheme through the custom properties", "Scale for a compact variant"],
    "ai_usage": "Help overlays. Detect the platform and swap ⌘ for Ctrl — showing Mac keys to Windows users is the most common shortcut-sheet bug."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 280px; padding: 1rem; border-radius: 12px; background: #151b2a; border: 1px solid #263149; }
    .fx h4 { margin: 0 0 .7rem; font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: #8b93a7; }
    .fx dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: .5rem 1rem; align-items: center; }
    .fx dt { color: #cbd5e1; font-size: .85rem; }
    .fx dd { margin: 0; display: flex; gap: .2rem; }
    .fx kbd { padding: .12rem .4rem; border-radius: 5px; background: #1c2437; border: 1px solid #2b3450; border-bottom-width: 2px;
      font-family: ui-monospace, monospace; font-size: .72rem; color: #e7ebf3; }
  </style>
</head>
<body>
  <div class="fx"><h4>Shortcuts</h4><dl>
    <dt>Command palette</dt><dd><kbd>⌘</kbd><kbd>K</kbd></dd>
    <dt>Search</dt><dd><kbd>/</kbd></dd>
    <dt>Toggle theme</dt><dd><kbd>⇧</kbd><kbd>D</kbd></dd>
  </dl></div>
</body>
</html>
