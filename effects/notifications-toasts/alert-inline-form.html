<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Field Error Alert</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "alert-inline-form",
    "title": "Field Error Alert",
    "summary": "A form-level error summary linking to fields.",
    "description": "A form-level error summary linking to fields.",
    "theme": "notifications-toasts",
    "categories": ["notification", "feedback"],
    "tags": ["notification", "feedback", "error", "summary", "form", "validation"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Announce transient messages through an aria-live region; never convey severity by colour alone, and never auto-dismiss anything the user must act on.",
    "customization": [
      { "name": "--bad", "description": "Error colour", "default": "#d1478c" }
    ],
    "variations": ["Adapt to a light theme", "Add a compact variant"],
    "ai_usage": "Form submission errors. An error summary at the top with in-page links to each field is the pattern that actually gets forms completed; move focus to it on submit."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 300px; padding: .9rem 1rem; border-radius: 12px; background: #2a1116; border: 1px solid #d1478c; }
    .fx b { display: block; color: #ffc0d5; font-size: .88rem; margin-bottom: .4rem; }
    .fx ul { margin: 0; padding-left: 1.1rem; color: #f6b7cc; font-size: .82rem; line-height: 1.7; }
    .fx a { color: #ffd6e5; }
  </style>
</head>
<body>
  <div class="fx" role="alert" tabindex="-1"><b>2 problems prevented saving</b>
  <ul><li><a href="#f1">Email address is not valid</a></li><li><a href="#f2">Choose at least one theme</a></li></ul></div>
</body>
</html>
