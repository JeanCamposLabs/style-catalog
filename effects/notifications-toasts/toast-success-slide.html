<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Success Toast</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "toast-success-slide",
    "title": "Success Toast",
    "summary": "A toast that slides in with an icon and dismiss.",
    "description": "A toast that slides in with an icon and dismiss.",
    "theme": "notifications-toasts",
    "categories": ["notification", "feedback"],
    "tags": ["notification", "feedback", "toast", "success", "slide", "dismiss"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Announce transient messages through an aria-live region; never convey severity by colour alone, and never auto-dismiss anything the user must act on.",
    "customization": [
      { "name": "--ok", "description": "Success colour", "default": "#10a894" }
    ],
    "variations": ["Adapt to a light theme", "Add a compact variant"],
    "ai_usage": "Confirmations. Auto-dismiss after 4–6 seconds, pause the timer on hover and focus, and put the message in an aria-live=polite region."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: flex; align-items: center; gap: .8rem; width: 290px; padding: .8rem 1rem; border-radius: 12px;
      background: #101f1b; border: 1px solid #10a894; color: #e7ebf3; animation: slide .4s cubic-bezier(.2,.8,.3,1) both; }
    .fx .ic { width: 26px; height: 26px; border-radius: 50%; background: #10a894; color: #04241f; display: grid;
      place-items: center; font-weight: 900; flex: none; }
    .fx p { margin: 0; font-size: .86rem; flex: 1; }
    .fx button { border: 0; background: none; color: #8b93a7; font-size: 1.1rem; cursor: pointer; }
    @keyframes slide { from { opacity: 0; transform: translateY(14px); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="fx" role="status"><span class="ic" aria-hidden="true">✓</span><p>Catalogue published to Pages</p>
  <button type="button" aria-label="Dismiss">×</button></div>
</body>
</html>
