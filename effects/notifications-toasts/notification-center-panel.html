<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notification Centre</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "notification-center-panel",
    "title": "Notification Centre",
    "summary": "A grouped panel with a mark-all action.",
    "description": "A grouped panel with a mark-all action.",
    "theme": "notifications-toasts",
    "categories": ["notification", "feedback"],
    "tags": ["notification", "feedback", "center", "panel", "grouped", "inbox"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Announce transient messages through an aria-live region; never convey severity by colour alone, and never auto-dismiss anything the user must act on.",
    "customization": [
      { "name": "--c", "description": "Unread colour", "default": "#7c5cff" }
    ],
    "variations": ["Adapt to a light theme", "Add a compact variant"],
    "ai_usage": "Notification inboxes. Group by day, mark unread with a dot plus tint plus text, and always offer mark-all-read — an inbox users cannot clear becomes an inbox they stop opening."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 290px; border-radius: 14px; background: #151b2a; border: 1px solid #263149; overflow: hidden; }
    .fx .hd { display: flex; justify-content: space-between; align-items: center; padding: .7rem .9rem;
      border-bottom: 1px solid #1e2740; font-size: .88rem; }
    .fx .hd button { border: 0; background: none; color: #7c5cff; font: inherit; font-size: .76rem; cursor: pointer; }
    .fx .grp { padding: .5rem .9rem .2rem; font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; color: #64748b; }
    .fx .n { display: flex; gap: .6rem; padding: .5rem .9rem; font-size: .82rem; color: #cbd5e1; }
    .fx .n.unread { background: #171d33; }
    .fx .dot { width: 7px; height: 7px; border-radius: 50%; background: #7c5cff; margin-top: .4rem; flex: none; }
  </style>
</head>
<body>
  <div class="fx"><div class="hd"><span>Notifications</span><button type="button">Mark all read</button></div>
  <div class="grp">Today</div><div class="n unread"><span class="dot"></span>Build 0.24.7 deployed</div>
  <div class="n unread"><span class="dot"></span>Ada approved your PR</div>
  <div class="grp">Yesterday</div><div class="n">Weekly digest ready</div></div>
</body>
</html>
