<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Progress Notification</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "progress-notification",
    "title": "Progress Notification",
    "summary": "A toast that reports ongoing work.",
    "description": "A toast that reports ongoing work.",
    "theme": "notifications-toasts",
    "categories": ["notification", "feedback"],
    "tags": ["notification", "feedback", "progress", "toast", "background-task", "status"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Announce transient messages through an aria-live region; never convey severity by colour alone, and never auto-dismiss anything the user must act on.",
    "customization": [
      { "name": "--p", "description": "Percent complete", "default": "62" }
    ],
    "variations": ["Adapt to a light theme", "Add a compact variant"],
    "ai_usage": "Long background jobs. Keep the toast until the job resolves, then swap it to a success or error state in place rather than stacking a second toast."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { width: 290px; padding: .8rem 1rem; border-radius: 12px; background: #1a2130; border: 1px solid #2b3450; }
    .fx .top { display: flex; justify-content: space-between; align-items: center; font-size: .85rem; color: #e7ebf3; margin-bottom: .5rem; }
    .fx .pct { color: #8b93a7; font-size: .78rem; font-variant-numeric: tabular-nums; }
    .fx .bar { height: 5px; border-radius: 99px; background: #22304a; overflow: hidden; }
    .fx .bar i { display: block; height: 100%; width: calc(var(--p) * 1%); background: #7c5cff; }
  </style>
</head>
<body>
  <div class="fx" style="--p:62" role="status"><div class="top"><span>Generating posters…</span><span class="pct">62%</span></div>
  <div class="bar" role="progressbar" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100"><i></i></div></div>
</body>
</html>
