<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notification Count</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "badge-count-notification",
    "title": "Notification Count",
    "summary": "A count bubble anchored to an icon.",
    "description": "A count bubble anchored to an icon. Small self-contained component ready to drop into a list or card.",
    "theme": "badges-tags",
    "categories": ["badge", "label"],
    "tags": ["badge", "label", "count", "notification", "bubble", "icon"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Status must never be colour-only: pair every badge colour with a label, icon, or shape.",
    "customization": [
      { "name": "--c", "description": "Badge colour", "default": "#f87171" }
    ],
    "variations": ["Add a size variant", "Map colours to semantic tokens"],
    "ai_usage": "Bell and inbox icons. Cap the display at 99+ and expose the real number in an accessible label so the count is never truncated for screen readers."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .wrap { position: relative; display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 14px;
      background: #151b2a; border: 1px solid #263149; font-size: 1.2rem; }
    .wrap .n { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px;
      border-radius: 999px; background: #f87171; color: #2a0a0a; font-size: .72rem; font-weight: 800;
      display: grid; place-items: center; border: 2px solid #0b0d12; }
  </style>
</head>
<body>
  <span class="wrap" aria-label="Notifications, 12 unread"><span aria-hidden="true">🔔</span><span class="n" aria-hidden="true">12</span></span>
</body>
</html>
