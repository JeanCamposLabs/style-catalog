<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Corner Ribbon</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "badge-ribbon-corner",
    "title": "Corner Ribbon",
    "summary": "A diagonal ribbon across a card corner.",
    "description": "A diagonal ribbon across a card corner. Small self-contained component ready to drop into a list or card.",
    "theme": "badges-tags",
    "categories": ["badge", "label"],
    "tags": ["badge", "label", "ribbon", "corner", "sale", "flag"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Status must never be colour-only: pair every badge colour with a label, icon, or shape.",
    "customization": [
      { "name": "--c", "description": "Ribbon colour", "default": "#f472b6" }
    ],
    "variations": ["Add a size variant", "Map colours to semantic tokens"],
    "ai_usage": "Sale and 'new' flags. Rotate 45° and over-extend the width past the card so the ends are clipped cleanly by overflow:hidden."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .card { position: relative; width: 220px; height: 130px; border-radius: 14px; background: #151b2a;
      border: 1px solid #263149; overflow: hidden; }
    .rib { position: absolute; top: 14px; right: -34px; width: 130px; padding: .3rem 0; text-align: center;
      background: #f472b6; color: #2a0d1c; font-size: .72rem; font-weight: 800; transform: rotate(45deg); }
  </style>
</head>
<body>
  <div class="card"><span class="rib">SALE</span></div>
</body>
</html>
