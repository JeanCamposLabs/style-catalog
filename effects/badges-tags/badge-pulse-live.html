<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Badge</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "badge-pulse-live",
    "title": "Live Badge",
    "summary": "A pulsing dot marks a live stream.",
    "description": "A pulsing dot marks a live stream. Small self-contained component ready to drop into a list or card.",
    "theme": "badges-tags",
    "categories": ["badge", "label"],
    "tags": ["badge", "label", "live", "pulse", "stream", "status"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Status must never be colour-only: pair every badge colour with a label, icon, or shape.",
    "customization": [
      { "name": "--c", "description": "Live colour", "default": "#f87171" }
    ],
    "variations": ["Add a size variant", "Map colours to semantic tokens"],
    "ai_usage": "Live streams and active sessions. The pulse must stop under reduced motion; the LIVE text alone still conveys the state."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .b { display: inline-flex; align-items: center; gap: .45rem; padding: .3rem .8rem; border-radius: 999px;
      background: rgba(248,113,113,.14); color: #f87171; font-size: .78rem; font-weight: 800; letter-spacing: .06em; }
    .b i { position: relative; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .b i::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: currentColor;
      animation: ping 1.6s cubic-bezier(0,.2,.8,1) infinite; }
    @keyframes ping { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(3); opacity: 0; } }
  </style>
</head>
<body>
  <span class="b"><i aria-hidden="true"></i>LIVE</span>
</body>
</html>
