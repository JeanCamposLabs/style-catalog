<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Two-Image Blend Mask</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "mask-gradient-blend-two",
    "title": "Two-Image Blend Mask",
    "summary": "Two surfaces blended along a soft gradient edge.",
    "description": "Two surfaces blended along a soft gradient edge. Uses clip-path or mask-image, so the element's box and layout are unaffected by the shape.",
    "theme": "masks-clipping",
    "categories": ["mask", "shape"],
    "tags": ["clip-path", "mask", "blend", "gradient", "mask", "composite"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Clipping hides content visually but not from assistive tech — anything fully clipped away should also be removed or aria-hidden.",
    "customization": [
      { "name": "--angle", "description": "Seam angle", "default": "110deg" }
    ],
    "variations": ["Animate the shape on hover", "Combine with a gradient fill"],
    "ai_usage": "Compositing two images without an editor. A gradient mask on the top layer gives a soft seam that a hard clip-path cannot."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .art { width: 210px; height: 210px; background: conic-gradient(from 210deg at 40% 35%, #7c5cff, #2dd4bf, #fbbf24, #f472b6, #7c5cff); }
    .label { margin-top: .9rem; text-align: center; color: #8b93a7; font-size: .82rem; }
    .pair { position: relative; width: 250px; height: 170px; border-radius: 14px; overflow: hidden; }
    .pair div { position: absolute; inset: 0; }
    .pair .a { background: linear-gradient(135deg, #7c5cff, #1e1b4b); }
    .pair .b { background: linear-gradient(135deg, #2dd4bf, #052e2b);
      -webkit-mask-image: linear-gradient(110deg, #000 30%, transparent 62%); mask-image: linear-gradient(110deg, #000 30%, transparent 62%); }
  </style>
</head>
<body>
  <div><div class="pair"><div class="a"></div><div class="b"></div></div><p class="label">Gradient Seam</p></div>
</body>
</html>
