<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Diagonal Split</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "clip-diagonal-split",
    "title": "Diagonal Split",
    "summary": "Two panels meeting on a diagonal.",
    "description": "Two panels meeting on a diagonal. Uses clip-path or mask-image, so the element's box and layout are unaffected by the shape.",
    "theme": "masks-clipping",
    "categories": ["mask", "shape"],
    "tags": ["clip-path", "mask", "diagonal", "split", "two-panel", "hero"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Clipping hides content visually but not from assistive tech — anything fully clipped away should also be removed or aria-hidden.",
    "customization": [
      { "name": "--angle", "description": "Split direction", "default": "135deg" }
    ],
    "variations": ["Animate the shape on hover", "Combine with a gradient fill"],
    "ai_usage": "Split hero sections. Both halves must use complementary polygons that share the same diagonal, or a hairline gap appears between them."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .art { width: 210px; height: 210px; background: conic-gradient(from 210deg at 40% 35%, #7c5cff, #2dd4bf, #fbbf24, #f472b6, #7c5cff); }
    .label { margin-top: .9rem; text-align: center; color: #8b93a7; font-size: .82rem; }
    .pair { position: relative; width: 260px; height: 180px; }
    .pair div { position: absolute; inset: 0; }
    .pair .a { background: linear-gradient(135deg, #7c5cff, #4c1d95); clip-path: polygon(0 0, 100% 0, 0 100%); }
    .pair .b { background: linear-gradient(135deg, #2dd4bf, #0f766e); clip-path: polygon(100% 0, 100% 100%, 0 100%); }
  </style>
</head>
<body>
  <div><div class="pair"><div class="a"></div><div class="b"></div></div><p class="label">Diagonal Split</p></div>
</body>
</html>
