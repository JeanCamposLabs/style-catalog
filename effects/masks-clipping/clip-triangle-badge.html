<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Corner Triangle</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "clip-triangle-badge",
    "title": "Corner Triangle",
    "summary": "A triangular flash in the corner of a card.",
    "description": "A triangular flash in the corner of a card. Uses clip-path or mask-image, so the element's box and layout are unaffected by the shape.",
    "theme": "masks-clipping",
    "categories": ["mask", "shape"],
    "tags": ["clip-path", "mask", "corner", "triangle", "badge", "label"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Clipping hides content visually but not from assistive tech — anything fully clipped away should also be removed or aria-hidden.",
    "customization": [
      { "name": "--c", "description": "Flash colour", "default": "#f472b6" }
    ],
    "variations": ["Animate the shape on hover", "Combine with a gradient fill"],
    "ai_usage": "Status flashes on cards. A clip-path triangle keeps the label text upright, unlike a rotated ribbon which needs counter-rotation."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .art { width: 210px; height: 210px; background: conic-gradient(from 210deg at 40% 35%, #7c5cff, #2dd4bf, #fbbf24, #f472b6, #7c5cff); }
    .label { margin-top: .9rem; text-align: center; color: #8b93a7; font-size: .82rem; }
    .card { position: relative; width: 230px; height: 150px; border-radius: 14px; background: #151b2a; border: 1px solid #263149; overflow: hidden; }
    .card::before { content: "NEW"; position: absolute; top: 0; right: 0; width: 92px; height: 92px;
      background: #f472b6; color: #2a0d1c; font-size: .72rem; font-weight: 800; padding: .4rem .5rem; text-align: right;
      clip-path: polygon(100% 0, 100% 100%, 0 0); }
  </style>
</head>
<body>
  <div><div class="card"></div><p class="label">Corner Triangle</p></div>
</body>
</html>
