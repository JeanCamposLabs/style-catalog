<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scroll Fade Mask</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "mask-scroll-fade",
    "title": "Scroll Fade Mask",
    "summary": "A scrolling list that fades at the top and bottom.",
    "description": "A scrolling list that fades at the top and bottom. Uses clip-path or mask-image, so the element's box and layout are unaffected by the shape.",
    "theme": "masks-clipping",
    "categories": ["mask", "shape"],
    "tags": ["clip-path", "mask", "scroll", "fade", "list", "mask"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Clipping hides content visually but not from assistive tech — anything fully clipped away should also be removed or aria-hidden.",
    "customization": [
      { "name": "--fade", "description": "Fade height", "default": "12%" }
    ],
    "variations": ["Animate the shape on hover", "Combine with a gradient fill"],
    "ai_usage": "Any scrollable panel inside a card. Masking beats a gradient overlay because it works over any backdrop, including transparent or animated ones."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .art { width: 210px; height: 210px; background: conic-gradient(from 210deg at 40% 35%, #7c5cff, #2dd4bf, #fbbf24, #f472b6, #7c5cff); }
    .label { margin-top: .9rem; text-align: center; color: #8b93a7; font-size: .82rem; }
    .list { width: 240px; height: 180px; overflow: auto; padding: 0 .4rem;
      -webkit-mask-image: linear-gradient(transparent, #000 12%, #000 88%, transparent);
      mask-image: linear-gradient(transparent, #000 12%, #000 88%, transparent); }
    .list div { padding: .6rem .8rem; margin-bottom: 6px; background: #151b2a; border-radius: 10px; color: #cbd5e1; font-size: .9rem; }
  </style>
</head>
<body>
  <div><div class="list">
    <div>Aurora deployment</div><div>Beta channel</div><div>Cache invalidation</div><div>Design tokens</div>
    <div>Edge routing</div><div>Feature flags</div><div>Gateway limits</div>
  </div><p class="label">Scroll the list</p></div>
</body>
</html>
