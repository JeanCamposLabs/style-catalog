  <script type="application/json" id="effect-meta">
  {
    "id": "clip-ticket-stub",
    "title": "Ticket Stub",
    "summary": "A ticket with punched semicircles on both edges.",
    "description": "A ticket with punched semicircles on both edges. Uses clip-path or mask-image, so the element's box and layout are unaffected by the shape.",
    "theme": "masks-clipping",
    "categories": ["mask", "shape"],

    "customization": [

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }

    .shape { -webkit-mask-image: radial-gradient(circle 14px at 0 50%, transparent 14px, #000 15px), radial-gradient(circle 14px at 100% 50%, transparent 14px, #000 15px);
      mask-image: radial-gradient(circle 14px at 0 50%, transparent 14px, #000 15px), radial-gradient(circle 14px at 100% 50%, transparent 14px, #000 15px);
      -webkit-mask-composite: source-in; mask-composite: intersect; border-radius: 14px; }
  </style>
</head>
<body>
  <div><div class="art shape"></div><p class="label">Ticket Stub</p></div>
