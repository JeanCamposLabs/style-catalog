<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Striped Mask</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "mask-stripes-reveal",
    "title": "Striped Mask",
    "summary": "Content shows through moving stripes.",
    "description": "Content shows through moving stripes. Uses clip-path or mask-image, so the element's box and layout are unaffected by the shape.",
    "theme": "masks-clipping",
    "categories": ["mask", "shape"],
    "tags": ["clip-path", "mask", "stripes", "mask", "animated", "reveal"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Clipping hides content visually but not from assistive tech — anything fully clipped away should also be removed or aria-hidden.",
    "customization": [
      { "name": "--s", "description": "Stripe width", "default": "12px" }
    ],
    "variations": ["Animate the shape on hover", "Combine with a gradient fill"],
    "ai_usage": "Transitional reveals and loading states. Animate mask-position by exactly one gradient period so the loop is seamless."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .art { width: 210px; height: 210px; background: conic-gradient(from 210deg at 40% 35%, #7c5cff, #2dd4bf, #fbbf24, #f472b6, #7c5cff); }
    .label { margin-top: .9rem; text-align: center; color: #8b93a7; font-size: .82rem; }
    .shape { -webkit-mask-image: repeating-linear-gradient(45deg, #000 0 12px, transparent 12px 24px);
      mask-image: repeating-linear-gradient(45deg, #000 0 12px, transparent 12px 24px);
      animation: slide 2s linear infinite; }
    @keyframes slide { to { -webkit-mask-position: 34px 0; mask-position: 34px 0; } }
  </style>
</head>
<body>
  <div><div class="art shape"></div><p class="label">Striped Mask</p></div>
</body>
</html>
