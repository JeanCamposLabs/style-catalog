<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Morphing Polygon</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "clip-animated-morph",
    "title": "Morphing Polygon",
    "summary": "A polygon that animates between three shapes.",
    "description": "A polygon that animates between three shapes. Uses clip-path or mask-image, so the element's box and layout are unaffected by the shape.",
    "theme": "masks-clipping",
    "categories": ["mask", "shape"],
    "tags": ["clip-path", "mask", "morph", "animated", "polygon", "kinetic"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Clipping hides content visually but not from assistive tech — anything fully clipped away should also be removed or aria-hidden.",
    "customization": [
      { "name": "--dur", "description": "Morph cycle", "default": "6s" }
    ],
    "variations": ["Animate the shape on hover", "Combine with a gradient fill"],
    "ai_usage": "Kinetic decorative shapes. Every keyframe must list the same number of points in the same order or the browser falls back to a hard cut."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .art { width: 210px; height: 210px; background: conic-gradient(from 210deg at 40% 35%, #7c5cff, #2dd4bf, #fbbf24, #f472b6, #7c5cff); }
    .label { margin-top: .9rem; text-align: center; color: #8b93a7; font-size: .82rem; }
    .shape { animation: morph 6s ease-in-out infinite; }
    @keyframes morph {
      0%, 100% { clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
      33% { clip-path: polygon(50% 5%, 95% 30%, 80% 95%, 20% 95%, 5% 30%, 50% 5%); }
      66% { clip-path: polygon(20% 0, 80% 0, 100% 60%, 50% 100%, 0 60%, 20% 0); }
    }
  </style>
</head>
<body>
  <div><div class="art shape"></div><p class="label">Morphing Polygon</p></div>
</body>
</html>
