<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Command Overlay</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "modal-command-overlay",
    "title": "Command Overlay",
    "summary": "A centred search overlay with grouped results.",
    "description": "A centred search overlay with grouped results.",
    "theme": "modals-overlays",
    "categories": ["modal", "overlay"],
    "tags": ["modal", "dialog", "command-palette", "search", "overlay", "keyboard"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "A modal must trap focus, close on Escape, return focus to its trigger, and mark the page behind it inert. The <dialog> element gives most of this for free.",
    "customization": [
      { "name": "--bg", "description": "Overlay background", "default": "#141a28" }
    ],
    "variations": ["Recolour through the custom properties", "Scale it for a compact variant"],
    "ai_usage": "Keyboard-first apps. Keep the selected row scrolled into view and expose it with aria-activedescendant so screen readers follow the arrow keys."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .ov { width: 320px; border-radius: 16px; background: #141a28; border: 1px solid #2b3450; box-shadow: 0 30px 70px rgba(0,0,0,.6); overflow: hidden; }
    .ov input { width: 100%; padding: .95rem 1.1rem; border: 0; border-bottom: 1px solid #22304a; background: transparent; color: #e7ebf3; font: inherit; }
    .ov input:focus { outline: none; }
    .ov .grp { padding: .5rem .4rem; }
    .ov .lbl { padding: .2rem .7rem; font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: #64748b; }
    .ov .it { display: flex; justify-content: space-between; padding: .5rem .7rem; border-radius: 8px; color: #cbd5e1; font-size: .88rem; }
    .ov .it.on { background: #22304a; color: #fff; }
    .ov kbd { color: #64748b; font-size: .75rem; }
  </style>
</head>
<body>
  <div class="ov" role="dialog" aria-label="Command palette"><input type="text" placeholder="Type a command…" aria-label="Command" />
  <div class="grp"><div class="lbl">Actions</div>
  <div class="it on">New project <kbd>⌘N</kbd></div><div class="it">Invite teammate</div></div>
  <div class="grp"><div class="lbl">Navigate</div><div class="it">Go to settings <kbd>G S</kbd></div></div></div>
</body>
</html>
