<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Image Lightbox</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "modal-lightbox",
    "title": "Image Lightbox",
    "summary": "A thumbnail that expands into a full-size overlay.",
    "description": "A thumbnail that expands into a full-size overlay.",
    "theme": "modals-overlays",
    "categories": ["modal", "overlay"],
    "tags": ["modal", "dialog", "lightbox", "gallery", "zoom", "image"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "A modal must trap focus, close on Escape, return focus to its trigger, and mark the page behind it inert. The <dialog> element gives most of this for free.",
    "customization": [
      { "name": "--scrim", "description": "Scrim opacity", "default": "0.88" }
    ],
    "variations": ["Recolour through the custom properties", "Scale it for a compact variant"],
    "ai_usage": "Galleries. Move focus to the close button on open and back to the thumbnail on close; also support left/right arrows to move between images."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .thumbs { display: flex; gap: 10px; }
    .thumbs button { width: 84px; height: 84px; border: 0; border-radius: 12px; cursor: pointer; padding: 0; }
    .lb { position: fixed; inset: 0; display: none; place-items: center; background: rgba(4,7,14,.88); z-index: 5; }
    .lb.is-open { display: grid; }
    .lb .big { width: min(70vw, 300px); aspect-ratio: 1; border-radius: 16px; animation: zoom .3s cubic-bezier(.2,.8,.3,1); }
    .lb .close { position: absolute; top: 1rem; right: 1rem; width: 38px; height: 38px; border-radius: 50%; border: 0;
      background: rgba(255,255,255,.14); color: #fff; font-size: 1.2rem; cursor: pointer; }
    @keyframes zoom { from { transform: scale(.8); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="thumbs">
    <button type="button" data-bg="linear-gradient(135deg,#7c5cff,#2dd4bf)" style="background:linear-gradient(135deg,#7c5cff,#2dd4bf)" aria-label="Open image 1"></button>
    <button type="button" data-bg="linear-gradient(135deg,#f472b6,#fbbf24)" style="background:linear-gradient(135deg,#f472b6,#fbbf24)" aria-label="Open image 2"></button>
  </div>
  <div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Image viewer"><button class="close" id="lbx" type="button" aria-label="Close">×</button><div class="big" id="big"></div></div>
  <script>
    (function () {
      var lb = document.getElementById("lb"), big = document.getElementById("big");
      document.querySelectorAll(".thumbs button").forEach(function (b) {
        b.addEventListener("click", function () { big.style.background = b.dataset.bg; lb.classList.add("is-open"); document.getElementById("lbx").focus(); });
      });
      document.getElementById("lbx").addEventListener("click", function () { lb.classList.remove("is-open"); });
      addEventListener("keydown", function (e) { if (e.key === "Escape") lb.classList.remove("is-open"); });
    })();
  </script>
</body>
</html>
