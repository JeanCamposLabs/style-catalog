<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bottom Sheet</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "modal-bottom-sheet",
    "title": "Bottom Sheet",
    "summary": "A panel that slides up from the bottom edge with a drag handle.",
    "description": "A panel that slides up from the bottom edge with a drag handle.",
    "theme": "modals-overlays",
    "categories": ["modal", "overlay"],
    "tags": ["modal", "dialog", "sheet", "mobile", "drawer", "slide-up"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "intermediate",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "A modal must trap focus, close on Escape, return focus to its trigger, and mark the page behind it inert. The <dialog> element gives most of this for free.",
    "customization": [
      { "name": "--dur", "description": "Slide duration", "default": "0.35s" }
    ],
    "variations": ["Recolour through the custom properties", "Scale it for a compact variant"],
    "ai_usage": "Mobile actions and filters. The grip is a visual affordance only — the sheet must also close via a real button and Escape for keyboard users."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .stage { position: relative; width: 300px; height: 320px; border-radius: 22px; overflow: hidden; background: #10141f; border: 1px solid #263149; }
    .stage .content { padding: 1.2rem; color: #8b93a7; font-size: .9rem; }
    .scrim { position: absolute; inset: 0; background: rgba(4,7,14,.6); opacity: 0; transition: opacity .3s; pointer-events: none; }
    .sheet { position: absolute; left: 0; right: 0; bottom: 0; padding: .8rem 1.2rem 1.4rem; border-radius: 20px 20px 0 0;
      background: #1a2130; transform: translateY(100%); transition: transform .35s cubic-bezier(.7,0,.2,1); }
    .stage.is-open .sheet { transform: none; }
    .stage.is-open .scrim { opacity: 1; }
    .grip { width: 40px; height: 4px; border-radius: 99px; background: #3b465e; margin: 0 auto .9rem; }
    .sheet h3 { margin: 0 0 .4rem; font-size: 1rem; }
    .sheet p { margin: 0 0 1rem; color: #8b93a7; font-size: .85rem; }
    button { padding: .55rem 1.1rem; border-radius: 9px; border: 0; background: #7c5cff; color: #fff; font: inherit; cursor: pointer; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="stage is-open" id="st"><div class="content">Tap the button to toggle the sheet.<br><br><button type="button" id="tg">Toggle</button></div>
  <div class="scrim"></div><div class="sheet" role="dialog" aria-label="Options"><div class="grip" aria-hidden="true"></div>
  <h3>Sort by</h3><p>Choose how results are ordered.</p><button type="button">Apply</button></div></div>
  <script>
    (function () {
      var st = document.getElementById("st");
      document.getElementById("tg").addEventListener("click", function () { st.classList.toggle("is-open"); });
    })();
  </script>
</body>
</html>
