<html lang="en">
<head>

  <title>Torn Paper Edge</title>

  {
    "id": "divider-torn-paper",

    "summary": "An irregular ripped-paper edge.",
    "description": "An irregular ripped-paper edge. Purely decorative and self-contained, so it drops between any two sections.",
    "theme": "dividers-shapes",
    "categories": ["divider", "shape"],
    "tags": ["divider", "separator", "torn", "paper", "irregular", "craft"],

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .top { background: #151b2a; padding: 1.6rem; text-align: center; color: #8b93a7; font-size: .85rem; }
    .bottom { background: #7c5cff; padding: 1.6rem; text-align: center; color: #1a1030; font-size: .85rem; font-weight: 700; }
    .stage { width: min(92vw, 340px); }
    .divider { height: 26px; background: #7c5cff;
      clip-path: polygon(0 40%, 6% 20%, 13% 55%, 21% 25%, 29% 60%, 38% 30%, 47% 65%, 56% 28%, 65% 58%, 74% 22%, 83% 52%, 92% 26%, 100% 48%, 100% 100%, 0 100%); }
  </style>
</head>
<body>
  <div class="stage"><div class="top">Section one</div><div class="divider" aria-hidden="true"></div><div class="bottom">Section two</div></div>
</body>
