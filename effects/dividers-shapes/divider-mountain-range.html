  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    .stage { width: min(92vw, 340px); }
    .divider { height: 56px; background: #7c5cff;
      clip-path: polygon(0 100%, 8% 40%, 16% 72%, 26% 22%, 36% 62%, 46% 30%, 58% 68%, 68% 34%, 78% 60%, 88% 26%, 100% 58%, 100% 100%); }
  </style>

  <div class="stage"><div class="top">Section one</div><div class="divider" aria-hidden="true"></div><div class="bottom">Section two</div></div>
