<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ribbon Banner</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "shape-ribbon-banner",
    "title": "Ribbon Banner",
    "summary": "A folded ribbon with tucked ends.",
    "description": "A folded ribbon with tucked ends. Purely decorative and self-contained, so it drops between any two sections.",
    "theme": "dividers-shapes",
    "categories": ["divider", "shape"],
    "tags": ["divider", "separator", "ribbon", "banner", "fold", "award"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Dividers are decorative: mark them aria-hidden so they are not announced as content.",
    "customization": [
      { "name": "--c", "description": "Ribbon colour", "default": "#7c5cff" }
    ],
    "variations": ["Flip vertically for the opposite section", "Recolour to match the next section"],
    "ai_usage": "Headings, sale flashes, and awards. The darker fold triangles are what create the depth — same-colour tucks look flat."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .top { background: #151b2a; padding: 1.6rem; text-align: center; color: #8b93a7; font-size: .85rem; }
    .bottom { background: #7c5cff; padding: 1.6rem; text-align: center; color: #1a1030; font-size: .85rem; font-weight: 700; }
    .stage { width: min(92vw, 340px); }
    .stage { display: grid; place-items: center; padding: 2rem 0; }
    .rib { position: relative; padding: .7rem 1.6rem; background: #7c5cff; color: #fff; font-weight: 800; }
    .rib::before, .rib::after { content: ""; position: absolute; top: 100%; border: 10px solid #4c1d95; }
    .rib::before { left: 0; border-left-color: transparent; border-bottom-color: transparent; }
    .rib::after { right: 0; border-right-color: transparent; border-bottom-color: transparent; }
  </style>
</head>
<body>
  <div class="stage"><span class="rib">Featured</span></div>
</body>
</html>
