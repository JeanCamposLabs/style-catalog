<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scalloped Divider</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "divider-scallop",
    "title": "Scalloped Divider",
    "summary": "A row of half-circles along the edge.",
    "description": "A row of half-circles along the edge. Purely decorative and self-contained, so it drops between any two sections.",
    "theme": "dividers-shapes",
    "categories": ["divider", "shape"],
    "tags": ["divider", "separator", "scallop", "circles", "mask", "decorative"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Dividers are decorative: mark them aria-hidden so they are not announced as content.",
    "customization": [
      { "name": "--r", "description": "Scallop radius", "default": "14px" }
    ],
    "variations": ["Flip vertically for the opposite section", "Recolour to match the next section"],
    "ai_usage": "Tickets, coupons, and playful headers. The mask tile width must be twice the circle radius or the scallops overlap."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .top { background: #151b2a; padding: 1.6rem; text-align: center; color: #8b93a7; font-size: .85rem; }
    .bottom { background: #7c5cff; padding: 1.6rem; text-align: center; color: #1a1030; font-size: .85rem; font-weight: 700; }
    .stage { width: min(92vw, 340px); }
    .divider { height: 24px; background: #7c5cff;
      -webkit-mask-image: radial-gradient(circle 14px at 50% 0, transparent 14px, #000 15px);
      mask-image: radial-gradient(circle 14px at 50% 0, transparent 14px, #000 15px);
      -webkit-mask-size: 28px 100%; mask-size: 28px 100%; }
  </style>
</head>
<body>
  <div class="stage"><div class="top">Section one</div><div class="divider" aria-hidden="true"></div><div class="bottom">Section two</div></div>
</body>
</html>
