<!DOCTYPE html>
<html lang="en">
<head>

  <title>Wave Divider</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "divider-wave-svg",
    "title": "Wave Divider",
    "summary": "A repeating wave edge drawn in SVG.",
    "description": "A repeating wave edge drawn in SVG. Purely decorative and self-contained, so it drops between any two sections.",
    "theme": "dividers-shapes",
    "categories": ["divider", "shape"],
    "tags": ["divider", "separator", "wave", "svg", "organic"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .top { background: #151b2a; padding: 1.6rem; text-align: center; color: #8b93a7; font-size: .85rem; }
    .bottom { background: #7c5cff; padding: 1.6rem; text-align: center; color: #1a1030; font-size: .85rem; font-weight: 700; }
    .stage { width: min(92vw, 340px); }
    .divider { line-height: 0; }
    .divider svg { display: block; width: 100%; height: 54px; }
    .divider path { fill: #7c5cff; }
  </style>
</head>
<body>
  <div class="stage"><div class="top">Section one</div>
  <div class="divider" aria-hidden="true"><svg viewBox="0 0 340 54" preserveAspectRatio="none"><path d="M0 30 C 60 0 110 54 170 30 C 230 6 280 54 340 24 L340 54 L0 54 Z"/></svg></div>
  <div class="bottom">Section two</div></div>
</body>
</html>
