<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ornamental Rule</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "divider-ornament",
    "title": "Ornamental Rule",
    "summary": "A rule with a centred diamond ornament.",
    "description": "A rule with a centred diamond ornament. Purely decorative and self-contained, so it drops between any two sections.",
    "theme": "dividers-shapes",
    "categories": ["divider", "shape"],
    "tags": ["divider", "separator", "ornament", "editorial", "diamond", "classic"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "Dividers are decorative: mark them aria-hidden so they are not announced as content.",
    "customization": [
      { "name": "--c", "description": "Ornament colour", "default": "#fbbf24" }
    ],
    "variations": ["Flip vertically for the opposite section", "Recolour to match the next section"],
    "ai_usage": "Editorial and long-form articles. Fade the rules toward the page edges so the ornament reads as the focal point."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .top { background: #151b2a; padding: 1.6rem; text-align: center; color: #8b93a7; font-size: .85rem; }
    .bottom { background: #7c5cff; padding: 1.6rem; text-align: center; color: #1a1030; font-size: .85rem; font-weight: 700; }
    .stage { width: min(92vw, 340px); }
    .divider { height: 40px; display: flex; align-items: center; gap: .8rem; padding: 0 1.4rem; background: #151b2a; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, #3b465e, transparent); }
    .divider i { width: 9px; height: 9px; background: #fbbf24; transform: rotate(45deg); }
  </style>
</head>
<body>
  <div class="stage"><div class="top">Section one</div><div class="divider" aria-hidden="true"><i></i></div><div class="top">Section two</div></div>
</body>
</html>
