<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Avatar Upload</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "avatar-upload-hover",
    "title": "Avatar Upload",
    "summary": "An avatar with a change-photo overlay on hover.",
    "description": "An avatar with a change-photo overlay on hover.",
    "theme": "avatars-identity",
    "categories": ["avatar", "identity"],
    "tags": ["avatar", "identity", "upload", "change", "overlay", "profile"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "An avatar is decorative when the name is beside it (use empty alt); when it stands alone it must carry the person's name as its accessible label.",
    "customization": [
      { "name": "--ov", "description": "Overlay colour", "default": "rgba(4,7,14,.7)" }
    ],
    "variations": ["Adapt to a light theme", "Add a compact variant"],
    "ai_usage": "Profile settings. Keep a real file input covering the avatar so keyboard and screen-reader users get the same affordance the hover overlay implies."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { position: relative; width: 84px; height: 84px; border-radius: 50%; overflow: hidden; cursor: pointer; }
    .fx .a { position: absolute; inset: 0; background: linear-gradient(150deg, #7c5cff, #2dd4bf); display: grid;
      place-items: center; font-weight: 800; color: #0b0d12; font-size: 1.2rem; }
    .fx .ov { position: absolute; inset: 0; background: rgba(4,7,14,.7); color: #fff; display: grid; place-items: center;
      font-size: .72rem; opacity: 0; transition: opacity .2s; }
    .fx:hover .ov, .fx:focus-within .ov { opacity: 1; }
    .fx input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  </style>
</head>
<body>
  <label class="fx"><span class="a">JC</span><span class="ov">Change</span>
  <input type="file" accept="image/*" aria-label="Change profile photo" /></label>
</body>
</html>
