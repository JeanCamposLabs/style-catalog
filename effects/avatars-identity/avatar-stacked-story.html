<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Story Avatar</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "avatar-stacked-story",
    "title": "Story Avatar",
    "summary": "An avatar with a gradient unseen-story ring.",
    "description": "An avatar with a gradient unseen-story ring.",
    "theme": "avatars-identity",
    "categories": ["avatar", "identity"],
    "tags": ["avatar", "identity", "story", "ring", "unseen", "gradient"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "An avatar is decorative when the name is beside it (use empty alt); when it stands alone it must carry the person's name as its accessible label.",
    "customization": [
      { "name": "--ring", "description": "Unseen ring", "default": "conic-gradient(#d1478c,#c2891a,#7c5cff)" }
    ],
    "variations": ["Adapt to a light theme", "Add a compact variant"],
    "ai_usage": "Story rails. The gradient ring encodes unseen; make that explicit in the label rather than relying on the colour difference alone."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: flex; gap: 12px; }
    .s { width: 66px; height: 66px; border-radius: 50%; padding: 3px; background: conic-gradient(#d1478c, #c2891a, #7c5cff, #d1478c); }
    .s.seen { background: #2b3450; }
    .s .a { width: 100%; height: 100%; border-radius: 50%; border: 2px solid #0b0d12; display: grid; place-items: center;
      font-weight: 800; color: #0b0d12; }
  </style>
</head>
<body>
  <div class="fx"><div class="s"><span class="a" style="background:#7c5cff" role="img" aria-label="Ada, new story">AL</span></div>
  <div class="s seen"><span class="a" style="background:#10a894" role="img" aria-label="Jean, story seen">JC</span></div></div>
</body>
</html>
