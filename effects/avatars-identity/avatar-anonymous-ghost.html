<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Anonymous Avatar</title>
  <script type="application/json" id="effect-meta">
  {
    "id": "avatar-anonymous-ghost",
    "title": "Anonymous Avatar",
    "summary": "A neutral placeholder for unknown users.",
    "description": "A neutral placeholder for unknown users.",
    "theme": "avatars-identity",
    "categories": ["avatar", "identity"],
    "tags": ["avatar", "identity", "anonymous", "placeholder", "unknown", "guest"],
    "tech": ["css"],
    "era": "2020s",
    "difficulty": "beginner",
    "dependencies": [],
    "browser_support": "All modern browsers (Chromium, Firefox, Safari).",
    "performance_notes": "Lightweight — composited transform/opacity work only.",
    "accessibility_notes": "An avatar is decorative when the name is beside it (use empty alt); when it stands alone it must carry the person's name as its accessible label.",
    "customization": [
      { "name": "--bg", "description": "Placeholder colour", "default": "#1e2740" }
    ],
    "variations": ["Adapt to a light theme", "Add a compact variant"],
    "ai_usage": "Guests, deleted accounts, and unassigned items. Keep it visually quiet — a bright placeholder draws attention to the absence of a person."
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #0b0d12; color: #e7ebf3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    .fx { display: flex; gap: 12px; align-items: center; }
    .a { width: 48px; height: 48px; border-radius: 50%; background: #1e2740; color: #64748b; display: grid;
      place-items: center; font-size: 1.3rem; }
    .a.dash { border: 2px dashed #2b3450; background: transparent; }
    .lbl { color: #8b93a7; font-size: .84rem; }
  </style>
</head>
<body>
  <div class="fx"><span class="a" role="img" aria-label="Anonymous user">👤</span>
  <span class="a dash" role="img" aria-label="Unassigned">＋</span><span class="lbl">Unassigned</span></div>
</body>
</html>
